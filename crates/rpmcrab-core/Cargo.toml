[package]
name = "rpmcrab-core"
description = "Domain library for rpmcrab: RPM model, config, filters, report renderer, and checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["rpm", "rpmlint", "lint", "packaging", "opensuse"]
categories = ["parsing", "os"]
# The divergence ledger sources are generator input, never compiled in;
# the aggregate they assemble into lives outside the crate.
exclude = ["data/divergences/"]

[lints]
workspace = true

[dependencies]
# librpm FFI (the `rpm-software-management` binding). Covers the header, the
# file list (rpmfiles), the rpmdb (Db), and EVR comparison (version). Needs
# `rpm-devel` at build time (bindgen) and `librpm`/`librpmio` at runtime;
# `build` on for `Spec::parse` (`SpecCheck` `_check_invalid_url`, the same
# C parser the reference uses via `TransactionSet().parseSpec`). The `sign`
# feature stays off: it adds package *signing* via librpmsign, while
# signature *verification* (`SignatureCheck`) uses the base keyring and
# verified-read API and needs no feature. Safe API only — `unsafe` stays inside
# librpm/librpm-sys, so this crate keeps `unsafe_code = "forbid"`. Payload
# extraction does NOT use the binding (its PackageReader returns no entries for
# compressed payloads); the payload is extracted natively (see pkg/extract.rs).
librpm = { version = "0.6", default-features = false, features = ["build"] }
# Native payload extraction: RPM container parse + payload compression
# detection (pure Rust). The `payload` feature unlocks the builder API used by
# extraction tests to synthesize RPMs. Replaces the old rpm2archive-tar
# subprocess.
rpm = { version = "0.30", default-features = false, features = ["payload"] }
# xz payload decompression for native extraction. Pure Rust.
liblzma = "0.4"
# bzip2 payload decompression for native extraction. The default
# backend is libbz2-rs-sys, a pure-Rust translation of libbz2.
bzip2 = "0.6"
# mkfifo/mknod for native extraction of special files (safe wrappers;
# this crate keeps `unsafe_code = "forbid"`).
nix = { version = "0.31", features = ["fs"] }
# `preserve_order`: the reference reads configs into Python dicts (insertion
# order) and `lookup_check_for_file` is first-match-wins, so table order is
# observable. Without it `toml::Table` is a BTreeMap (sorted).
toml = { version = "1.1", features = ["preserve_order"] }
# Insertion-ordered maps for file-order iteration (systemd-socket digester,
# per-check-type findings), mirroring the reference's dicts.
indexmap = "2"
# Filter matching. rpmlint `Filters` are Python `re`, which supports lookahead,
# lookbehind and backreferences; the `regex` crate rejects those, so a pure-Rust
# backtracking engine is required to honour existing filters byte-for-byte.
# fancy-regex wraps `regex` for the fast path and stays unsafe-free.
fancy-regex = "0.19"
log = "0.4"
# Progress reporting (`tracing::info!` in `worker.rs`, upstream rpmlint#255).
# This crate only emits events; the subscriber is installed by the binary.
tracing = "0.1"
# Machine-readable `--format json` report (upstream rpmlint#1156).
serde_json = "1"
# Terminal width for the centered banners/footer: shutil.get_terminal_size
# honours $COLUMNS, then the tty winsize, then 80. terminal_size gives the
# winsize via a safe API (unsafe_code is forbidden in this crate).
terminal_size = "0.4"
# Extraction tempdir, mirroring rpmlint's TemporaryDirectory(prefix=
# 'rpmlint.<basename>.', dir=ExtractDir).
tempfile = "3"
# Typed errors on purpose in -core; anyhow stays in the binary crate.
thiserror = "2"
# Zip/jar archive inspection (`ZipCheck`): pure Rust, no subprocesses.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Spellchecking via the `spellbook` crate (pure Rust, Hunspell-compatible,
# no_std, unsafe-free). Reads standard `.aff`/`.dic` dictionaries. Used for
# the `spelling-error` check in TagsCheck; degrades gracefully when the
# dictionary is absent.
spellbook = "0.4.2"
# The spellbook dictionary's hasher is the FNV-1a implementation in
# spellcheck.rs: its hash values must be identical on 32- and 64-bit
# targets, which foldhash::fast's folded multiply does not guarantee.
# ELF parsing for BinariesCheck (replaces readelf/ldd). Pure Rust, MIT.
goblin = "0.10"
# Per-file parallelism for BinariesCheck ELF metadata parsing (rayon
# pre-pass in check_binary). Finding emission stays sequential in file
# order, so the output bytes are frozen.
rayon = "1"
# DWARF parsing for BinariesCheck DW_AT_producer extraction (the optflags
# check). Pure Rust; replaces the reference objdump --dwarf=info subprocess.
gimli = "0.34"
# Debug-section decompression for the gimli DWARF harness: gcc/binutils emit
# SHF_COMPRESSED (zlib/zstd) and legacy .zdebug_* (zlib) sections, which gimli
# cannot read (gimli-rs/gimli#195). flate2 is pure Rust (miniz_oxide); zstd
# links the C library.
flate2 = "1"
zstd = "0.14"
# XML parsing for DBusPolicyCheck (D-Bus policy files). Pure Rust, MIT.
# XML parsing for PolkitCheck (polkit policy files). Pure Rust, MIT.
quick-xml = "0.42"
# SHA-2 digests for FileDigestCheck (pure Rust).
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
# `BuildRootAndDateCheck` computes its run day in UTC (issue #1180); the
# reference formats "today" with `time.strftime('%b %e %Y')` in local time.
# `local-offset` stays for the check's timezone probe test, which uses
# `OffsetDateTime::now_local` to prove the configured zone resolved before
# asserting the run day ignores it. `local-offset` implies `std` and adds
# only num_threads over the already-present libc; time itself pulls in
# deranged, powerfmt, num-conv.
time = { version = "0.3", default-features = false, features = ["local-offset"] }

# OpenPGP signature packet parsing for SignatureCheck (sequoia-openpgp's
# low-level packet parser). The RustCrypto backend keeps the crate free of
# new system libraries; upstream gates that backend behind the
# `allow-experimental-crypto` and `allow-variable-time-crypto` opt-ins,
# recorded here as a deliberate choice: the crate verifies public
# signatures over public data, so there is no secret material for
# variable-time operations to leak.
sequoia-openpgp = { version = "2.4.2", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }

# Base64 decoding of the v6 signature entry (`RPMSIGTAG_OPENPGP`):
# its strings are base64-encoded signature packets. The crate is
# already in the tree as sequoia-openpgp's armor dependency.
base64 = "0.23"

[dev-dependencies]
criterion = "0.8"
# Tests build a header directly (e.g. `Pkg::installed`); the crate already uses
# librpm, this makes it nameable from integration tests too.
librpm = { version = "0.6", default-features = false }
[[bench]]
name = "regex_hot_path"
harness = false

[[bench]]
name = "dep_first_token"
harness = false
