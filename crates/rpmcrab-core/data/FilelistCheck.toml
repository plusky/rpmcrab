GoodPrefixes = [
    "/bin/",
    "/boot/",
    "/etc/",
    "/lib/",
    "/lib64/",
    "/media/",
    # SUSE policy handled in separate check
    "/opt/",
    "/sbin/",
    "/srv/",
    # SUSE policy handled in separate check
    "/usr/X11R6/",
    "/usr/bin/",
    "/usr/etc/",
    "/usr/games/",
    "/usr/include/",
    "/usr/lib/",
    "/usr/lib64/",
    "/usr/libexec/",
    "/usr/sbin/",
    "/usr/share/",
    # MinGW cross-toolchain sysroots: permitted by the MinGW packaging
    # guidelines (openSUSE ships rpmlint Filters for exactly these via
    # mingw32/64-filesystem); legitimate despite not being FHS dirs.
    "/usr/i686-w64-mingw32/",
    "/usr/x86_64-w64-mingw32/",
    # actually only linux is allowed by fhs
    "/usr/src/linux",
    "/usr/src/debug/",
    "/usr/src/packages/",
    # the tree kernel-module source packages install into
    "/usr/src/kernel-modules/",
    "/var/account/",
    "/var/cache/",
    "/var/crash/",
    "/var/games/",
    "/var/lib/",
    "/var/lock/",
    "/var/log/",
    "/var/mail/",
    "/var/opt/",
    "/var/run/",
    "/var/spool/",
    "/var/yp/",
    # those are not in FHS!
    "/var/adm/",
    "/var/nis/",
    "/emul/",
    "/run/"
]

[[Check]]
    Message = "filelist-forbidden"
    # Crab-only (Tom's ruling, 2026-10-27): `Cargo.toml.orig` is
    # cargo's own pre-normalization manifest, shipped verbatim in
    # vendored crate sources -- not patch litter. Exempt here and in
    # FilesCheck's backup-file-in-package via the shared
    # is_cargo_toml_orig basename predicate; the reference fires.
    IgnoreFileIf = "cargotomlorig"
    Bad = [
        "*/.xvpics",
        "*.orig",
        "*.orig.gz",
        "/usr/share/*/.libs*",
        "/usr/share/*/.deps*",
        "/var/adm/setup",
        "/etc/httpd/*",
        "/etc/init.d/*/*",
        "/usr/share/locale/LC_MESSAGES",
    ]
[[Check]]
    Message = "filelist-forbidden-sysconfig"
    Good = [
        "/etc/sysconfig/cbq",
        "/etc/sysconfig/scripts",
        "/etc/sysconfig/scripts/*",
        "/etc/sysconfig/network",
        "/etc/sysconfig/network/*",
        "/etc/sysconfig/hardware",
        "/etc/sysconfig/hardware/*",
        "/etc/sysconfig/isdn",
        "/etc/sysconfig/isdn/scripts",
        "/etc/sysconfig/isdn/scripts/*",
        "/etc/sysconfig/SuSEfirewall2.d",
        "/etc/sysconfig/SuSEfirewall2.d/*",
        "/etc/sysconfig/uml",
    ]
    Bad = [
        "/var/adm/fillup-templates/*",
        "/etc/sysconfig/*",
        "/etc/rc.config.d/*",
    ]
    # Deliberate rpmcrab divergence (ledgered in tests/parity/divergences.toml):
    # %ghost sysconfig files are generated by fillup at install time and carry
    # no payload, so the reference's finding is a false positive.
    IgnoreFileIf = "ghostfile"
[[Check]]
    Message = "filelist-forbidden-perl-dir"
    Bad = [
        "/usr/lib/perl5/site_perl/*",
    ]
[[Check]]
    Message = "filelist-forbidden-backup-file"
    Bad = [
        "*~",
        "*.bak",
        "*/.*.swp",
    ]
    IgnoreFileIf = "ghostfile"
[[Check]]
    Message = "filelist-forbidden-devel-in-lib"
    Bad = [
        "/lib/*.la",
        "/lib/*.a",
        "/lib64/*.la",
        "/lib64/*.a",
    ]
[[Check]]
    Message = "filelist-forbidden-devel-in-lib"
    Good = [
        "/lib/security/*.so",
        "/lib64/security/*.so",
    ]
    Bad = [
        "/lib/*.so",
        "/lib64/*.so",
    ]
    IgnoreFileIf = "notsymlink"
[[Check]]
    Message = "filelist-forbidden-fhs23"
    Bad = [
        "/etc/X11/app-defaults/*",
        "/usr/local/man/*/*",
        "/var/lib/games",
        "/var/lib/games/*",
        "/usr/sbin/*/*",
        "/sbin/init.d",
        "/sbin/init.d/*",
        "/bin/*/*",
    ]
[[Check]]
    Message = "filelist-forbidden-yast2"
    Bad = [
        "/usr/lib/YaST2/*.ycp",
        "/usr/lib/YaST2/*.y2cc",
        "/usr/lib/YaST2/*.*.scr",
    ]
[[Check]]
    Message = "filelist-forbidden-srv"
    Bad = [
        "/usr/local/ftp",
        "/usr/local/http",
    ]
[[Check]]
    Message = "filelist-forbidden-games"
    Bad = [
        "/usr/games/bin",
        "/usr/games/lib",
        "/usr/games/*/*",
    ]
[[Check]]
    Message = "filelist-forbidden-noarch"
    Bad = [
        "/lib64",
        "/lib64/*",
        "/usr/lib64",
        "/usr/lib64/*",
        "/usr/X11R6/lib64",
        "/usr/X11R6/lib64/*",
        "/opt/gnome/lib64",
        "/opt/gnome/lib64/*",
        "/opt/kde3/lib64",
        "/opt/kde3/lib64/*",
        "/usr/lib/pkgconfig/*",
        "/usr/lib/perl5/vendor_perl/5.*/*-linux-*/*",
    ]
    IgnorePkgIf = "notnoarch"
[[Check]]
    Message = "filelist-forbidden-debuginfo"
    Bad = [
        "/usr/lib/debug/*",
    ]
    IgnorePkgIf = "isdebuginfo"
[[Check]]
    Message = "filelist-forbidden-locale"
    Bad = [
        "/opt/gnome/share/locale/no",
        "/opt/gnome/share/locale/no/*",
        "/opt/kde3/share/locale/no",
        "/opt/kde3/share/locale/no/*",
        "/usr/share/locale/no",
        "/usr/share/locale/no/*",
        "/usr/share/vim/*/lang/no",
        "/usr/share/vim/*/lang/no/*",
    ]
[[Check]]
    Message = "filelist-forbidden-xorg"
    Bad = [
        "/usr/X11R6/*",
    ]
    IgnorePkgIf = "isfilesystem"
[[Check]]
    Message = "filelist-forbidden-suseconfig"
    Bad = [
        "/sbin/conf.d/*",
        "/var/adm/SuSEconfig/",
    ]
[[Check]]
    Message = "filelist-forbidden-opt"
[[Check]]
    Message = "filelist-forbidden-systemd-userdirs"
    Bad = [
        "/etc/systemd/*",
        "/etc/modules-load.d/*",
        "/etc/tmpfiles.d/*",
    ]
[[Check]]
    Message = "filelist-forbidden-bashcomp-userdirs"
    Bad = [
        "/etc/bash_completion.d/*",
    ]
[[Check]]
    Message = "filelist-forbidden-move-to-usr"
    Bad = [
        "/lib/systemd/system/*",
        "/lib/udev/rules.d/*",
	"/etc/pam.d/*",
    ]
    # Deliberate rpmcrab divergence (ledgered in tests/parity/divergences.toml):
    # %ghost files are generated at install time and carry no payload that
    # could be moved, so the reference's finding is a false positive.
    IgnoreFileIf = "ghostfile"
[[Check]]
    Message = "wrong-suse-capitalisation"
    Bad = [
        "*/README.SuSE",
    ]
    IgnoreFileIf = "ghostfile"
