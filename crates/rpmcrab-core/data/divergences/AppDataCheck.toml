# Divergence ledger entries owned by `AppDataCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "AppDataCheck"
kind = "behaviour"
reason = "Also scans /usr/share/metainfo/; the reference (AppDataCheck.py) only matches /usr/share/appdata/, but metainfo/ is the current AppStream location, so files there would otherwise never be validated."
since = "0.1.0"
upstream = "https://github.com/plusky/rpmcrab/issues/142"

[[divergence]]
case = "global"
check = "AppDataCheck"
kind = "behaviour"
reason = "The native fallback (no appstream-util) requires the mandatory AppStream tags; the reference fallback only checks XML well-formedness, so a well-formed but tagless file slipped through. The mandatory licence tag is `metadata_license` (AppStream section 2); `licence`/`project_license` are accepted as alternatives so legacy files are not flagged. The required set is type-aware but deliberately conservative: AppStream requires `<description>` for essentially every non-`generic` component type, whereas the port requires it only for `desktop-application`/`desktop`, since a wider fixed set false-positives on legitimate types like `generic`. When `appstream-util` is present the tool is deferred to entirely (reference parity); the native tag validation only strengthens the fallback."
since = "0.1.0"
upstream = "https://github.com/plusky/rpmcrab/issues/142"

[[divergence]]
case = "global"
check = "AppDataCheck"
kind = "behaviour"
reason = "When `appstream-util` is present, both rpmcrab and the reference defer to `appstream-util validate-relax --nonet` (reviewer-verified: tool present emits E: on both sides); when the tool is absent, both fall back to a bare well-formedness check and stay silent on well-formed-but-invalid files (reviewer-verified: tool absent is silent on both). Genuinely invalid but well-formed files under `/usr/share/appdata/` (e.g. frozen-bubble's deprecated `<application>` root instead of `<component>`, which fails `appstream-util validate-relax --nonet`) are therefore flagged by rpmcrab wherever the tool is present and missed wherever it is absent -- including the Factory reference environment in the 2026-10-10 audit, where the reference stayed silent on these files. The 61 `/usr/share/metainfo/` hits are the separate metainfo-scan divergence above."
since = "0.1.0"
upstream = "https://github.com/plusky/rpmcrab/issues/142"

[[divergence]]
case = "global"
check = "AppDataCheck"
kind = "behaviour"
reason = "For an appdata file declaring an unknown encoding (e.g. <?xml version=\"1.0\" encoding=\"x-bogus\"?>), the reference's ElementTree.parse raises LookupError, which AppDataCheck.py:35 does not catch, so the whole run aborts via lint.py:293 (sys.exit(3)). The port's native fallback reads the file as UTF-8 and emits nothing. Same reference-abort family as the polkit LookupError case."
since = "0.1.0"
