# Divergence ledger entries owned by `cli`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "cli"
kind = "behaviour"
reason = "A package that fails to open is a fatal result: one '(none): E: fatal error while reading ...' line on stderr, the run continues with the remaining packages, and the exit code is 3. The pinned reference exits 3 immediately on the first unreadable file; the -v re-raise (exit 1 with a cause chain) is gone."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/pull/1595"

[[divergence]]
case = "global"
check = "cli"
kind = "behaviour"
reason = "-T/--profile is removed entirely, and the --file/--info aliases for -r/-v are dropped; only -r/--rpmlintrc and -v/--verbose remain. All three are live in the pinned reference (cli.py:78,79,83): this is deliberate straightening of the option surface per the #1595 design, not something the reference dropped. A wrapper passing --info now gets exit 2."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/pull/1595"

[[divergence]]
case = "global"
check = "cli"
kind = "behaviour"
reason = "Expanded inputs are deduplicated: after expanding directories and sorting, rpmcrab checks each distinct path once (lib.rs sort + dedup). The reference sorts its expanded filelist without deduplicating it (lint.py:265-271), so a package reached twice - a file argument alongside its directory argument, or overlapping directory arguments - is checked twice there, with its findings duplicated and its footer count doubled. Deduplicating the CLI arguments themselves matches the reference (cli.py collects them into a set); only the post-expansion dedup differs, and different spellings of one path collapse under the canonical-path dedup (plusky/rpmcrab#1483). Pinned by expanded_inputs_are_deduplicated in binary_cli.rs."
since = "0.4.2"

[[divergence]]
case = "global"
check = "cli"
kind = "behaviour"
reason = "Expanded positional inputs are deduplicated by canonical path, not by spelling: the same package reached as dir/foo.rpm and as ./dir/foo.rpm (or through a symlink, or as an absolute versus a relative path) is checked once. A string-keyed dedup would check it once per spelling, duplicating its findings and inflating counts. Pinned by expand_filelist_canonicalizes_different_spellings_of_one_file in lib.rs."
since = "0.4.2"
