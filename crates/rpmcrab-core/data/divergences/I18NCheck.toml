[[divergence]]
case = "global"
check = "I18NCheck"
kind = "detail"
reason = "Port-only in-code `--explain` descriptions for the dynamic `incorrect-i18n-tag-*` and `incorrect-locale-*` findings (one per `INCORRECT_LOCALES` entry): the reference emits these findings but ships no descriptions. Registered in code at check time."
since = "0.1.0"

[[divergence]]
case = "global"
check = "file-not-in-%lang"
kind = "behaviour"
reason = "Deliberate fix (plusky/rpmcrab#480): the port fires `file-not-in-%lang` for an untagged `.mo` only under the standard locale tree, `/usr/share/locale` -- the tree the reference's own `lc_messages_regex` is anchored in and the only one `%find_lang` covers. The reference fires on every untagged `.mo` anywhere (I18NCheck.py: `(f.endswith('.mo') or subdir)` with no path condition). In the 2026-10-13 Factory sweep only 333 of 10,084 hits were under `/usr/share/locale`; the rest were app-private trees (LibreOffice, Python site-packages, kvirc, ruby gems) whose translations the applications load themselves, where `%lang` marks would let install-time language filtering strip product data. The LC_MESSAGES/man probe trigger is unchanged (its regexes are already tree-anchored) and `%lang`-tagged files stay quiet everywhere. Pinned by `mo_file_in_private_tree_is_quiet` and `mo_file_in_locale_tree_outside_lc_messages_still_warns`."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/480"

[[divergence]]
case = "global"
check = "incorrect-locale-subdir"
kind = "behaviour"
reason = "Fix-and-diverge (issue #865): the correct-subdir shape admits an ISO 15924 script component — the component after the language is a territory (de_DE) or a script (zh_Hans, zh_Hant) — because script locales are the names the modern gettext/GNOME/KDE stack ships, and the filesystem package itself defines /usr/share/locale/zh_Hans and /usr/share/locale/zh_Hant in the standard tree it owns. The reference’s correct-subdir shape admits only the territory component, so it charges every script locale. The script component is exactly a capital and three lowercase letters: shorter, longer and wrongly cased forms (zh_Han, zh_Hanss, zh_hans, zh_HANS) keep firing, and a script component followed by a territory stays charged — that form ships nowhere in the corpus. The reference’s own generated ISO data already carries the script codes in its country table, so its is_valid_lang accepts these names today; the subdir shape was the only verdict condemning them. Measured on the Factory corpus (sweep run-20261022-857d5ece population; the 26 affected source packages re-measured before and after with scan.py, the before side reproducing the sweep’s 42 exactly and no other finding changing in those packages): 42 E in 26 source packages before, 0 after. A header census of every shipped locale subdir (137 distinct names across 1,643 binary packages) shows zh_Hans and zh_Hant are the only script forms shipped and the only names the old shape condemned. Pinned by script_locale_subdirs_are_quiet and misshapen_script_locale_subdirs_still_fire in i18n.rs."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/865"
