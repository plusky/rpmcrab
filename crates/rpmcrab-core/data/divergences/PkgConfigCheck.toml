# Divergence ledger entries owned by `PkgConfigCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "invalid-pkgconfig-file"
kind = "behaviour"
reason = "The suspicious-dir regex widens the build-dir component from \\w+ to [\\w.-]+ so hyphenated/dotted directories like /usr/src/linux-6.1/BUILD match. The reference (PkgConfigCheck.py:11) uses \\w and misses these — the common case for kernel builds — so this is a deliberate fix for reference under-reporting, not a porting gap."
since = "0.1.0"
upstream = "https://github.com/plusky/rpmcrab/issues/44"

[[divergence]]
case = "global"
check = "pkgconfig-invalid-libs-dir"
kind = "behaviour"
reason = "The wrong-libdir direction follows the shared 64-bit arch predicate, which covers every 64-bit RPM arch (ppc64le, riscv64, loongarch64, ia64, mips64, mips64el, sparc64 as well as x86_64, ppc64, s390x, aarch64). The reference (PkgConfigCheck.py) lists only the latter four, so on riscv64 it flags -L/usr/lib64 and lets -L/usr/lib pass -- the opposite of that arch's native libdir."
since = "0.3.0"

[[divergence]]
case = "global"
check = "pkgconfig-invalid-libs-dir"
kind = "behaviour"
reason = "The finding is not reported when the `.pc` file itself is installed under the charged libdir tree (`/usr/lib/...` on a 64-bit target, `/usr/lib64/...` on a 32-bit one). Such a file describes that tree's ABI, not the host arch's: the baselibs `-32bit` packages on a 64-bit host install their `.pc` files under `/usr/lib/...` and correctly point `-L` at the directory their libraries live in (freetype2-devel-32bit: `libdir=/usr/lib`, ships `/usr/lib/libfreetype.so`). The reference (PkgConfigCheck.py) keys only on the RPM arch -- the host arch for a baselibs package -- and fires on exactly those files."
since = "0.4.1"

[[divergence]]
case = "global"
check = "pkgconfig-exception"
kind = "behaviour"
reason = "A `.pc` read failing with NotADirectory draws no `pkgconfig-exception`. That failure is the extractor's collision gap: it leaves entries whose path collides with an incompatible existing object out of the tree and reports each skip itself (grpc-source's file `usr/src/grpc/BUILD` against its directory `usr/src/grpc/build` on a case-insensitive filesystem), so the read runs through the object that won the collision. The reference (PkgConfigCheck.py) turns the same failed `open()` into the finding through its `except Exception`. Everything else matches the reference: %ghost entries are dropped from the dispatch before any read, as AbstractFilesCheck (AbstractCheck.py:45) drops `pkg.ghost_files`, and the remaining read failures -- a header-listed file missing from the tree -- plus decode failures on materialised files report as exceptions exactly as the reference charges them."
since = "0.4.0"

[[divergence]]
case = "global"
check = "PkgConfigCheck"
kind = "detail"
reason = "Staged `--explain` text for `pkgconfig-exception` was ungrammatical (`An exception during parsing of .pc file has occurred`). Reworded: an error occurred while reading or parsing the .pc file — the check fires on read failures as well as parse failures (verified in `checks/pkg_config.rs`)."
since = "0.4.1"

[[divergence]]
case = "global"
check = "pkgconfig-dangling-library"
kind = "behaviour"
reason = "New port-only Warning with no reference counterpart: pkgconfig-dangling-library (PkgConfigCheck, reported from after_checks) fires when a regular non-%ghost .pc file's Libs: carries an own-name -l token — the token whose lowercased form with one leading lib stripped equals the .pc file stem's — and no lib<name>.so, lib<name>.a or lib<name>.dll.a is among the non-%ghost entry basenames of the build. Libs.private is not read, and foreign tokens (-lm, -lz) are never judged: they resolve outside the source by design. Matching is by basename anywhere in the build, so a -L pointing at the wrong directory goes unseen. The verdict is run-scoped: a build is judged only when the run holds its source package (header name-version-release plus .src.rpm/.nosrc.rpm equal to the binaries' SOURCERPM); on partial or single-package input the check is silent, where the reference has no such reconciliation at any scope. The level is Warning: the firing population permanently includes by-design cases one run cannot decide (libraries a -32bit/-64bit sibling ships, .pc files naming a library another source's devel package provides), so the population is not the defect population an Error is reserved for."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/1031"
