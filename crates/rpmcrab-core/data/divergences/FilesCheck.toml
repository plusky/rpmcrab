[[divergence]]
case = "global"
check = "module-without-depmod-postin"
kind = "missing"
reason = "Deliberate: the port does not emit module-without-depmod-postin. The check polices manual depmod calls for .ko files shipped outside kernel packages -- a pattern that exists only in the SUSE KMP ecosystem: %kernel_module_package is a SUSE-only macro, Fedora has no KMP infrastructure and does not permit standalone kernel modules in its official repositories, so the only .ko files in Fedora proper are in kernel packages which the check exempts. Fedora's own config lists these four only as commented-out lines under '## SUSE kmp's don't need manual depmod (bnc#456048)' -- Fedora itself marks them SUSE-specific. The sole KMP consumer (openSUSE/SLFO) filters them because the KMP macro template calls depmod on install and removal. The staged `--explain` entry was removed with the finding."
since = "0.1.0"
upstream = "https://bugzilla.suse.com/show_bug.cgi?id=456048"

