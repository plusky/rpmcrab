[[divergence]]
case = "global"
check = "non-executable-script"
kind = "behaviour"
reason = "Fix-and-diverge: a non-executable shell script whose own text carries a `return` statement at top level -- at command position, outside every function definition -- does not emit non-executable-script when its interpreter line names a POSIX-family shell (sh, bash, dash, ash, ksh, ksh93, mksh or pdksh, resolved through /usr/bin/env). A top-level `return` marks a script written to be sourced by another script -- an executing POSIX shell refuses one (can only 'return' from a function or sourced script) -- so the missing exec bit is the fragment's correct state, not a defect. The mark is read from the file's own text, bounded at 1 MiB, by a shell lexer and a command-position pass rather than a text search, so the shapes that merely mention `return` do not count: comments, quoted strings, here-document bodies, substitutions, a `return` used as an argument, a loop variable or a `case` pattern, and a `return` inside a function definition. A `return` inside top-level control flow -- an `if`, loop, `case` item, brace group or subshell -- counts: the fragment's own early exits live there. zsh is excluded, because it runs a script in a function-like context where a top-level `return` is legal, and the script-directory guard of the #813/#845 shapes applies unchanged: a file installed directly in a script directory (/bin, /sbin, /usr/bin, /usr/sbin, /usr/local/bin, /usr/local/sbin) keeps firing whatever its text says. Measured over the full Factory corpus (51,589 RPMs, FilesCheck, isolated HOME/XDG, against pristine main): non-executable-script falls from 1,460 to 1,454 findings and the FilesCheck total from 116,049 to 116,043 -- exactly six findings silenced, none gained, no other finding changed. Five of the six are genuine sourced fragments, hand-verified: x11-tools' /usr/etc/X11/xim, sourced by xinitrc.common, whose returns sit on its success paths inside top-level ifs; lynis's include/tests_system_dbus; lvm2-testsuite's shell/name-mangling.sh and shell/vg-raid-takeover-1.sh; and warewulf4-dracut's 90wwinit/load-wwinit.sh, which dracut sources. The sixth is the predicate's disclosed limit: ceph-mgr-dashboard's run-backend-api-tests.sh is a dual-mode script whose own usage text documents both direct execution and sourcing; it detects sourcedness at runtime and keeps its top-level `return` behind that test, so an executing shell never reaches it and the script runs to completion standalone. The marker therefore does not prove a script cannot be executed; it proves the script was written to be sourced -- in ceph's case, among other supported modes -- and no decidable reading of the text separates the dual-mode shape from the genuine fragments (requiring an unguarded `return` would lose xim itself), so the dual-mode silence is deliberate and recorded here rather than tightened away. The reference has no comparable step and fires on all six files."
since = "0.4.1"

