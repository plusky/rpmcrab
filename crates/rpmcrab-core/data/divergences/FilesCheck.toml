# Divergence ledger entries owned by `FilesCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "postin-without-ldconfig"
kind = "behaviour"
reason = "The reference only searches the scriptlet body for ldconfig, ignoring the -p interpreter. rpmcrab honors -p ldconfig: %post -p /sbin/ldconfig satisfies the check. See rpmlint#1602 which fixes rpmlint#550."
since = "0.1.0"

[[divergence]]
case = "global"
check = "inaccessible-filename"
kind = "missing"
reason = "Intentional: Python os.access can raise UnicodeError on undecodable paths; Rust paths do not have this failure mode. The staged `--explain` entry was removed with the finding: no description for a finding that can never be emitted."
since = "0.1.0"

[[divergence]]
case = "global"
check = "lengthy-symlink"
kind = "missing"
