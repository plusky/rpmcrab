reason = "Declared accounts credited for `non-standard-uid` / `non-standard-gid` (issue #756): the reference emits both findings as warnings from distro-registry membership alone, while rpmcrab treats an account as standard when the registry lists it or the checked source package's set declares it. A set is the packages built from one source: the grouping key is the package's full SOURCERPM header value, and a package whose header carries no SOURCERPM groups by its own name. The decision runs at the end of the run, grouped by that key, the session shape the no-documentation finding uses. Two routes declare an account for the whole set: a shipped sysusers.d snippet whose `u` / `g` lines name the account (a `u` line declares its like-named primary group as well, while a `g` line declares the group alone, so a group-only declaration still leaves a like-named user owner firing; `m` membership lines, `r` range lines and lines whose name field is `-` or numeric credit nothing); the `user(<name>)` / `group(<name>)` entries of a set package's header Provides, hand-written or generated alike (rpm's sysusers generator emits the same entries for a package shipping a snippet), matched per dependency leaf so plain, versioned and rich-wrapped spellings all credit. A third route credits the file-owning package alone: its own Requires on those capabilities -- plain Requires and the scriptlet-context Requires alike (Requires(pre), Requires(post), Requires(preun) and Requires(postun): the entries the header split gathers as `prereq`, together with the legacy prereq bit) -- matched per dependency leaf the same way, so plain, versioned and rich-wrapped spellings all credit there too. The scriptlet-context entries that credit are the ones a packager wrote: an entry whose prereq sense bits are exactly the sense mask of rpm's user/group dependency generator (SCRIPT_PRE|SCRIPT_POSTUN) whose dependency leaves are all account capabilities is the generator's restatement of the package's own file ownership -- derived from the very files under decision -- and credits nothing; the header loader drops it before any check runs (issue #827). Requires crediting is per file-owning package: a sibling subpackage's Requires credits nothing, since installed standalone the owning package carries no declaration of the account through any route. Measured over the Factory corpus under the openSUSE data (51,589 RPMs), counting the reference's warning lines and classifying each at its source package: 1,492 lines (287 uid, 1,205 gid) across 99 source packages -- 1,414 lines whose account the line's own source package declares through the snippet or Provides routes, and 78 lines whose file-owning package carries the account capability in its Requires -- 38 of them credited by a packager-written Requires entry, and 40 whose only account Requires entry is the generator stamp, so no genuine route credits them. The port's own corpus run -- one invocation per source package, no per-package rpmlintrc filtering -- fires the 40 stamp-only lines across 5 source packages (grommunio-web, gromox, pagure, shadowsocks-libev, shadowsocks-rust), every one an account the line's own source package declares through no genuine route, each provided by a different source package (the system-user pattern); the remaining 1,452 lines stay silent through the genuine routes (corpus re-measured for issue #827). An account owned by files in a package set that declares it through no route remains an error: with no in-set declaration, the files land owned by an unresolvable name or a recycled numeric id."
