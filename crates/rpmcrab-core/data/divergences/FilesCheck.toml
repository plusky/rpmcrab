reason = "The port scans the whole file for the FSF license and wrong-address patterns; the reference (FilesCheck.py:1393-1395) searches only its 2048-byte peek chunk, so a stale FSF address past byte 2048 goes unreported. Deliberate fix-in-port of upstream rpmlint#40, open since 2013: the peek limit lets wrong addresses through in longer files."
