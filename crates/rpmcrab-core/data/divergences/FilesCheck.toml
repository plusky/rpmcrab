plate below any fillup-templates directory counts (in practice /usr/share/fillup-templates) -- plus the migration nudge itself: the staged description proposes the migration to daemon-native configuration or systemd drop-ins with EnvironmentFile at package-owned paths. Warning only: using sysconfig does not always imply damage, so this is a migration nudge. Measured on the Factory corpus: 316 binary RPMs in 260 source packages use the scheme in at least one category."
