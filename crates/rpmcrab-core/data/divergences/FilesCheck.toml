case = "global"
check = "FilesCheck"
kind = "behaviour"
reason = "New `symlink-loop` error with no reference counterpart (issue #723): a shipped symlink whose resolution chain, followed within its own package, revisits a path -- the link points at itself, or a set of links point at each other in a cycle -- fires at E, and so does a link whose chain runs into such a cycle. The reference has no finding for the shape: its chain walk (pkg.py readlink) loops forever on a cyclic package, and the port's dangling findings are presence-based, so a loop's target -- present in the file list, being the link itself or another link in the cycle -- never fires them. The cycle is fully decidable from the payload and is always damage at runtime (every open fails with ELOOP), so the finding is an error. Chains that resolve to a shipped non-link entry, and chains that leave the package (the dangling family's existing business), stay silent. Measured over the Factory corpus (51,589 RPMs; the 3 unreadable entries are .nosrc.rpm placeholders with no payload): 434,286 symlinks walked, 12,372 in-package link-to-link hops, longest chain 4, zero loops -- the finding guards a class the reference cannot scan for at all. The header walk used for the count was validated against the built binary on a synthetic package carrying an absolute self-loop and a 2-cycle (both report exactly the same three links) and on a 250-RPM paired slice. openSUSE's brp-25-symlink rejects a self-pointing link at build time; this is the RPM-level counterpart. Its staged `--explain` description lives in `crates/rpmcrab-core/data/descriptions/FilesCheck.toml`."
