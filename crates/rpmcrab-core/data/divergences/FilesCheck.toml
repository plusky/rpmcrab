[[divergence]]
case = "global"
check = "hidden-file-or-dir"
kind = "behaviour"
reason = "Deliberate config fix (plusky/rpmcrab#739): the vendored openSUSE/SLFO configs add a Filters line upstream does not ship, '^filesystem\\..*: hidden-file-or-dir /usr/etc/skel/.cache' (see ADD_FILTERS in scripts/generate-distro-configs.py). Upstream's config filters the sibling skeleton dotdirs .config/.local/.fonts (the vendored copies retarget them to /usr/etc/skel, #538) but carries no .cache line, so the one member of filesystem's deliberate 0700 XDG skeleton set that upstream's list predates fired while its siblings stayed quiet. Measured on the Factory filesystem package: the vendored flavours emitted exactly one hidden-file-or-dir line before this fix — the .cache warning — and none after."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/739"

[[divergence]]
case = "global"
check = "script-without-shebang"
kind = "behaviour"
reason = "The reference flags any executable file lacking a shebang, including non-scripts: data files with wrong permissions (moka-icon-theme index.theme, COPYING), shell fragment templates (kernel scripts/atomic/fallbacks/*), Python modules (idlelib/pyshell.py), and build templates (syclcc-launch.rule.in). rpmcrab only emits script-without-shebang for files in script paths (bin/, sbin/, init.d, cron.*) or otherwise identified as scripts; a non-script file with the executable bit fires spurious-executable-perm instead (extended to data files in #426). The extension is gated on the file being text: the reference early-returns on non-text in the same code path and stays silent there (verified with a 120-control-byte probe), so the port warns nowhere the reference is silent. One gap in that claim was libtool .la files in lib paths (1,821 Factory sweep hits): the reference is deliberately silent there -- its devel-file regex covers .a but not .la, and its script-without-shebang path exempts (lib path + .la) -- while the text gate fired spurious-executable-perm on them. #493 applies the same exemption in the text gate, restoring the claim. Level note: the reference's shipped scoring promotes its spurious-executable-perm to E (score 50), while the port prints its emitted W -- shipped rpmcrab configs carry no scoring table since #699 (the #594 config entry records the promotion drop). The reference findings on these 9 packages are false positives under the wrong check name. One more consequence of the rename: rpmlintrc filters written against script-without-shebang matched nothing once the population moved tags, so package opt-outs silently stopped working and the filters were reported back as unused-rpmlintrc-filter (grpc 50 hits, winboat 83 in the 2026-10-14 Factory sweep). #524 gives the renamed findings a filter alias: matching also renders them under script-without-shebang, and an alias match counts as filter usage. The alias covers only the renamed population -- files marked by the name-based setters or the doc/log paths, which the reference tags spurious-executable-perm itself, do not answer to it."
since = "0.1.0"

[[divergence]]
case = "global"
check = "devel-file-in-non-devel-package"
kind = "behaviour"
reason = "Deliberate divergence (issue #511): a package named mingw32-* or mingw64-* does not emit this finding for files under the MinGW sys-root (/usr/<triplet>-w64-mingw32/sys-root/). A cross toolchain's sys-root is headers and import libraries by definition -- the devel files are the product, with no -devel split to move them into. The reference emits the findings, but the Factory lint session suppresses them wholesale via addFilter lines in mingw32.toml, a config the mingw32/64-filesystem packages install into the lint environment; it is not part of rpmlint's config tree, so the mirrored config set never contains it and the port reported the family live: 1,586 of the finding's 2,212 Factory sweep hits on main 782ac1d5 (mingw32-gcc and mingw64-gcc 786 each, the pkgconf twins 7 each). The same unloaded config also filters files-duplicate wholesale and *.dll.a spurious-executable-perm for these packages; that wider gap is recorded in issue #511 and is not covered by this entry."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/511"

[[divergence]]
case = "global"
check = "no-dependency-on"
kind = "behaviour"
reason = "Deliberate removal (issue #534): the port does not emit `no-dependency-on` from I18NCheck. The reference's trailing-language rule (I18NCheck.py) demands a `locales-<lang>` dependency from every binary package whose name ends in an ISO 639 code; that encodes Mandriva's per-language locale packages. Replicated over the Factory repo metadata the rule fires on 7,551 binary packages and not one of the demanded names exists as a package -- there is no `locales-<lang>` package for any code in the table (openSUSE ships a monolithic `glibc-locale`, Fedora uses `glibc-langpack-*`) -- so the demanded dependency can never be satisfied; `doc` alone (Darai) accounts for 5,553, and both the openSUSE and Fedora configs filter the `locales` shape. This supersedes the `-doc` carve-out (plusky/rpmcrab#459). The finding itself stays live: FilesCheck still emits `no-dependency-on` for its dangling-symlink exceptions and the perl/python versioned-dependency rules, which are satisfiable and config-driven. Pinned by `killed_locales_dependency_finding_stays_absent`."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/534"

[[divergence]]
case = "global"
check = "no-documentation"
kind = "behaviour"
reason = "Deliberate fix (plusky/rpmcrab#539): the port decides `no-documentation` session-wide — a doc-less non-lib package stays quiet when any package built from the same source (the `SOURCERPM` header) in the same run ships documentation. The reference decides per package (`FilesCheck.py` `_check_nodoc`: `not lib_package and not pkg.doc_files`) with no cross-package awareness, so the standard SUSE layout (docs in the main package, none in its data/devel subpackages) fires on every subpackage and the vendored openSUSE/SLFO configs filter the finding outright (config-filters audit F1, tracked in plusky/rpmcrab#538). Measured on the proj 9.9.0 corpus (37 binary RPMs from one source, filter-free): 34 findings, all 34 sibling-covered by the `proj` main package, 0 genuinely doc-less. The decision is deferred to `after_checks` over state merged via `export_state`/`import_state`, the port's existing cross-package machinery; tag, level and message are unchanged, and a package with no documented sibling still fires. A header without `SOURCERPM` groups by its own name, preserving the per-package behaviour. Pinned by `no_documentation_suppressed_when_sibling_ships_docs`, `no_documentation_mixed_sources_decide_per_source` and `no_documentation_fires_for_lone_docless_package`."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/539"

[[divergence]]
case = "global"
check = "no-manual-page-for-binary"
kind = "severity"
reason = "Deliberate post-parity demotion (rpmcrab#484): the port reports I where the frozen 2.10.0 reference reports W. A missing manpage is upstream debt the packager usually cannot fix, so the finding is surfaced as info rather than firing as a warning. The reference's effective openSUSE config also filters the finding away entirely; the vendored config drops that filter so the info line actually prints (see DROP_LIVE_FILTERS in scripts/generate-distro-configs.py)."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/484"

[[divergence]]
case = "global"
check = "dangling-relative-symlink"
kind = "behaviour"
reason = "Deliberate fix (plusky/rpmcrab#547): the port decides `dangling-relative-symlink` session-wide — a relative link is dangling only when its normalised target is shipped by no package in the run. The reference decides per package (`FilesCheck.py` `_check_file_link_relative`: the target must be in the emitting package's own file list) with no cross-package awareness, so the standard sibling layouts fire wholesale: measured over a 118-srcpkg Factory sample (paired runs, vendored config vs `Filters = []`, every suppressed line hand-classified), the blanket filter the vendored openSUSE/SLFO configs inherit from upstream under the stale comment 'We check for that already' hides 12,622 lines, of which 6,818 are sibling-resolved and Requires-covered (the -lang pattern: gnome-user-docs-lang, mate-panel, gnome-recipes, mono, libreoffice, lazarus) and 5,654 are one genuinely broken package (gfxboot-devel, whose theme symlinks carry /home/abuild/rpmbuild/BUILD build-host targets). The decision is deferred to `after_checks` over state merged via `export_state`/`import_state`, the port's existing cross-package machinery; the per-package `req_names` escape and the `DanglingSymlinkExceptions` diversion are computed per package at record time and are unchanged, the absolute sibling tag `dangling-symlink` is untouched, and a single-package run behaves exactly as the reference (its session set is its own file list). The vendored configs drop the blanket filter (see DROP_LIVE_FILTERS in scripts/generate-distro-configs.py), so the finding surfaces for the distro flavours; the scoped sdb filter line stays and is live again. Root-level links keep the reference's parity quirk: POSIX normpath preserves the double leading slash, so a normalised `//usr/...` target never equals a header entry and filesystem's own root links still fire, as they do in the reference (directory targets shipped as header entries do resolve). Tracked in plusky/rpmcrab#538 (config-filters audit №165). Pinned by `dangling_relative_suppressed_when_sibling_ships_target`, `dangling_relative_fires_for_lang_package_alone`, `dangling_relative_unrelated_package_does_not_resolve`, `dangling_relative_fires_for_lone_dangling_package`, `dangling_relative_exception_diverts_to_no_dependency_on` and `dangling_relative_exception_required_stays_silent`."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/547"

[[divergence]]
case = "global"
check = "dangling-relative-symlink"
kind = "behaviour"
reason = "Deliberate fix: a relative link whose normalised target names a directory the emitting package itself populates is not dangling -- installing the package creates that directory as a leading directory of its own non-%ghost payload, so the link resolves even though no header entry names the target itself. The reference (and the port before this change) test only exact header-entry membership, so they fire on the whole shape. Measured over the 2026-10-26 Tumbleweed snapshot (52,984 x86_64+noarch packages, header census validated package-for-package against the pristine binary on a 24-package sample and against rpmlint 2.10.0 on the carriers): of 47,701 per-package candidates the credit silences exactly 16 -- the java-*-devel JDK-tree links x11 (the tree carries the devel package's own headers), gajim-lang's locale link (its own .mo files populate /usr/share/locale), ntp's ../.. chroot-mirror link, onednn-devel's and xorg-x11-essentials' `.` links, and one openQA-common tree link. A %ghost entry below the target earns no credit (it installs no payload, so it creates no directory), the trailing-slash prefix keeps string-prefix lookalikes firing, and the test runs on the verbatim normalised target, so a root-level link's //usr/... form earns no credit and filesystem's root links keep firing per the #547 parity pin. Kernel-style traversal through in-package symlinked intermediate directories was measured as a candidate class over the same census and is empty (0 of 47,701), as are own-scriptlet-created targets (0 update-alternatives creations) and own-%ghost targets (already header entries). Pinned by `dangling_relative_populated_dir_target_stays_silent`, `dangling_relative_ancestor_and_dot_targets_stay_silent`, `dangling_relative_ghost_only_population_fires`, `dangling_relative_string_prefix_lookalike_fires` and `dangling_relative_root_link_populated_target_still_fires`."
since = "0.4.1"

