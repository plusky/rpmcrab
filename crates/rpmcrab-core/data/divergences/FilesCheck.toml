[[divergence]]
case = "global"
check = "zero-length"
kind = "missing"
reason = "Deliberate removal (issue #479): the port does not emit zero-length. In the Factory sweep the finding fired at Error 3,315 times over 526 packages (run-20261014-782ac1d5), and every sampled bucket is empty by design -- mailman templates, test/fixture paths, .fallback markers, __init__/stamp marker files, GAPDoc and clang tablegen files that are empty by construction; no accidentally-truncated file was observed across 17,242 packages. The reference exempts via a regex whitelist (FilesCheck.py:180) that has been maintained for years and still produces this pile, so extending it is an endless exemption tail for a finding with no observed true positive. The staged `--explain` entry and the exempt-regex plumbing are removed with the finding. The port also emitted at Error where the reference uses Warning; that level divergence disappears with the removal."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/479"

[[divergence]]
case = "global"
check = "FilesCheck"
kind = "behaviour"
reason = "find_perm_in_tmpfiles normalizes the ghost path lexically (clean_path); the reference calls os.path.realpath, which additionally resolves symlinks against the build host's filesystem, so the match sets can differ when a tmpfiles.d path traverses a build-host symlink. Package paths from the RPM header are already canonical, and resolving them against the build host is meaningless for target-system paths. Separately, on a tmpfiles.d line with fewer than 5 whitespace-separated fields the reference's unpack raises ValueError (its except catches only IndexError), aborting the whole run via lint.py:293 (sys.exit(3)); the port skips the malformed line and continues with defaults."
since = "0.1.0"

