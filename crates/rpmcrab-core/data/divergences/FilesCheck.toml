[[divergence]]
case = "global"
check = "non-executable-script"
kind = "behaviour"
reason = "Fix-and-diverge (issues #813, #845): a non-executable file whose interpreter line marks content the owning program consumes by reading, importing, sourcing or rendering does not emit non-executable-script. The shapes are decidable from the path and the interpreter alone, and two guards bound them: a file installed directly in a script directory (/bin, /sbin, /usr/bin, /usr/sbin, /usr/local/bin, /usr/local/sbin) never counts as data, and the remaining directory-component shapes count only inside the data and library trees (/usr/src/, /usr/share/, /usr/lib/, /usr/lib64/, /usr/etc/, /etc/) -- the library trees count wherever they are rooted -- so the same components in an entry-point tree such as /usr/libexec/ keep firing. The shapes: library trees (a site-packages, dist-packages, node_modules or gems component; files under the Ruby library roots /usr/lib/ruby/ and /usr/lib64/ruby/ and the Perl library roots /usr/lib/perl5/ and /usr/lib64/perl5/), language directories (a python or python3[.x] component; a lib component past the first two path components holding a script-language file - .py, .rb, .pl, .lua, .php, .sh or .bash; a bash component holding a .sh or .bash file; a .py file in an extensions, plugins or auto-load component), source trees (a src component), test and example material (a test, tests, selftests, example, examples, sample or samples component), sourced fragments (files under /usr/share/bash-completion/; an exact profile or rc basename or a bashrc name segment (delimited by '.', '_' or '-') in a sourced location under /etc/, /usr/etc/, /usr/lib/, /usr/lib64/ or /usr/share/; an interpreter whose basename is exactly false) and templates (a final .in, .sample, .tmpl, .tpl, .template, .skel or .j2 suffix). The exempt files are modules, fragments, templates and source material the owning program reads, renders or streams elsewhere, so an interpreter line there does not mark a file executed in place and the missing exec bit is not a defect; in the salt battle test all 138 findings sit in Python library trees and every file is read, rendered or imported. The reference fires on these shapes; its only comparable step discards the interpreter of any file whose name ends in .pm, wherever the file sits - a step its own source marks as disputed - so such a file draws no interpreter-derived finding there. Measured on the Factory sweep run-20261022-857d5ece, recomputed with the final predicates by re-running the fixed binary over the same 280 packages and diffing the silenced set path by path: the class held 2,641 findings in 280 source packages and the fixed binary leaves 576 findings in 187 source packages, dominated by application-private module trees under /usr/share/<app>/ and /usr/lib/<app>/ whose paths carry no covered component; against the unguarded predicates the data-tree guard returns exactly two files to firing, glusterfs's Python daemon entry points under /usr/libexec/glusterfs/python/, and nothing else changes. The gate is confined to this one emission: executable files in the exempt shapes still draw the interpreter findings, and scripts the shapes do not cover still fire, in script directories and entry-point trees included."
since = "0.3.0"
