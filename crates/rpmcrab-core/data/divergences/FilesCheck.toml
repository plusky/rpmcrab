since = "0.1.0"

[[divergence]]
case = "global"
check = "spurious-executable-perm"
kind = "behaviour"
reason = "Deliberate divergence (issue #522): a package named mingw32-* or mingw64-* does not emit this finding for paths ending in .dll.a. GCC and libtool create the Windows import libraries with the executable bit set. The reference emits the findings, but the Factory lint session suppresses exactly this shape via the '^mingw(32|64)-.*spurious-executable-perm.*\\.dll\\.a$' filter in mingw32.toml, a config the mingw32/64-filesystem packages install into the lint environment and the mirrored config set never contains. The filter carries no path condition beyond the suffix -- all 14 hits on the Factory sweep of main 782ac1d5 sit in the cross-gcc packages under /usr/lib64/gcc/<triplet>/, the host libdir, not the sys-root -- so the suppression has none either. Plain .a files are not covered by the filter and still fire."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/522"

[[divergence]]
case = "global"
check = "python-bytecode-inconsistent-mtime"
kind = "behaviour"
reason = "python-bytecode-inconsistent-mtime only fires when the .pyc embedded timestamp is older than the .py mtime (stale bytecode). The reference (FilesCheck.py:1274) fires on any mismatch, but rpmlint#1331 (unmerged; closed 2025-04-24) proposes this fix: a newer .pyc is a local-build artifact, not an error. The port implements the proposed behaviour ahead of upstream."
since = "0.1.0"

[[divergence]]
case = "global"
check = "python-bytecode-inconsistent-mtime"
kind = "behaviour"
reason = "python-bytecode-inconsistent-mtime does not fire on a PEP 3147 cache file whose cache tag names a different CPython version than the pythonX.Y tree it ships in (for example a cpython-312 cache file under python3.13). That tree's interpreter never consults the file -- the cache filename is keyed to the other version -- so its embedded timestamp cannot make the shipped source's bytecode stale in this tree; a version mismatch is the wrong-magic check's jurisdiction, not this one's. The reference compares the timestamp regardless of the cache tag. On the 2026-10-26 corpus snapshot the class is exactly 2 files repo-wide (tree-sitter-objc's python313/python314 flavours), which were the tag's entire live population."
since = "0.4.1"

[[divergence]]
case = "global"
check = "FilesCheck.is-utf8-decompressor"
kind = "behaviour"
reason = "The reference decompresses IN-PROCESS for is_utf8 (pkg.py imports bz2, gzip, lzma and zstandard), so it never invokes a decompressor binary and always reaches the real bytes. rpmcrab shells out to gzip/bzip2/xz/zstd, which is a divergence of its own; when the binary is absent rpmcrab reads as UTF-8, matching the reference's `except OSError: return True`. Reading the still-compressed file instead would report file-not-utf8 for every .gz man page on a host without gzip, which the reference never does."
since = "0.1.0"

[[divergence]]
case = "global"
check = "non-conffile-in-etc"
kind = "behaviour"
reason = "Files under /etc/alternatives/ are exempt: they are managed by the alternatives system, not hand-edited config, and flagging them is wrong (rpmlint#1137, still open upstream). The /etc/ld.so.conf.d/ exemption is reference parity, not a divergence."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/issues/1137"

[[divergence]]
case = "global"
check = "read-error"
kind = "detail"
reason = "FilesCheck.peek's read-error detail: the reference emits Python's str(OSError) including the filename -- e.g. [Errno 13] Permission denied: '/p' (FilesCheck.py:430, from open(path,'rb')). The port passes std::io::Error's Display (Permission denied (os error 13)), dropping both the [Errno N] prefix and the filename."
since = "0.1.0"
upstream = "https://github.com/plusky/rpmcrab/issues/72"

[[divergence]]
