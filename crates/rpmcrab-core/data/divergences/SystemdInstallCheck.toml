[[divergence]]
case = "global"
check = "SystemdInstallCheck"
kind = "behaviour"
reason = "SystemdInstallCheck resolves a unit-named symlink within the package (Pkg::readlink) and evaluates the target unit instead of the alias: a D-Bus activation alias (wpa_supplicant ships dbus-fi.epitest.hostap.WPASupplicant.service and dbus-fi.w1.wpa_supplicant1.service as symlinks to wpa_supplicant.service) draws no systemd-service-without-service_* findings of its own, and several aliases to one target evaluate the target once. The reference treats every unit-named path as an independent unit and emits all four findings per alias (at E; the port has them at W). A symlink whose target is a shipped regular file that is not itself a unit is still evaluated under the link's own name, because systemd loads that content under it. A symlink resolving to no shipped regular file -- dangling, cyclic, or a mask link to /dev/null -- is not evaluated: scriptlets under the alias name could not make that name activatable, and the broken target is the dangling-symlink findings' defect. Pinned by unit tests in systemd_install.rs."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/720"

[[divergence]]
case = "global"
check = "systemd-service-without-service_add_pre"
kind = "behaviour"
reason = "Fix-and-diverge: a candidate that is not directly under the unit directory draws no systemd-service-without-service_add_pre finding. systemd loads unit definitions only from directly under the unit directory; a path below a subdirectory is an enablement link or a subdir entry, not a unit definition -- a .wants or .requires link (dracut ships each of its initrd units both as a direct unit-directory link and as an initrd.target.wants or sysinit.target.wants link, so the walk evaluates the same unit name twice) or a regular file below a .wants directory (blog ships systemd-vconsole-setup.service only below systemd-ask-password-blog.service.wants, as a %ghost entry with no payload). Suppression is judged on the candidate path after alias resolution, so a .wants link resolving to a shipped direct unit is still evaluated through that unit and still fires. The other three systemd-service-without-service_* findings are evaluated for such candidates unchanged. Measured on the Factory corpus (51,589 binary RPMs): 592 add_pre findings before, 583 after -- 8 duplicate dracut findings removed and 1 blog finding removed, with no movement on any other tag."
since = "0.4.1"

[[divergence]]
case = "global"
check = "systemd-service-without-service_del_postun"
kind = "behaviour"
reason = "Fix-and-diverge: a %postun mark-restart line naming a .service unit by its bare stem credits the unit. The helper passes each argument verbatim to systemctl set-property, and systemctl appends .service to a suffix-less name, so mark-restart-system-units foo marks foo.service exactly as the suffixed spelling does. The credit requires a genuine helper invocation: the helper name as a command word, the action as the following word, and the stem as its own later shell word, so echoes of the bare action and longer action spellings do not count, while a quoted stem credits (quotes are stripped by the tokenizer). Only a whole shell word from the shared tokenizer counts: quotes stripped, operators, redirections and comments honoured, commas kept since commas separate nothing in shell, an unterminated quote credits nothing, backslash is an ordinary character (escapes are not interpreted, and a backslash-newline continuation is never joined, since tokenization is per-line), and a directory-prefixed helper counts only as an absolute path. A longer name sharing the stem, a different suffix, or a template stem does not, and a dotted stem never counts since systemctl does not append .service to a name that already carries a dot, and no unit-type suffix list is consulted (bare means suffix-less). Other unit types get no such credit since a bare name never resolves to them. The reference matches only the suffixed basename, so it reports the finding for bare-stem spellings. Factory corpus: exactly 4 such findings, all in pcp (pmcd, pmlogger, pmproxy, pmie, whose postun marks pmcd pmlogger pmproxy pmie alongside fully suffixed timer names); every other del_postun finding is unchanged. Pinned by postun_bare_service_stem_is_accepted, postun_bare_instantiated_template_stem_is_accepted, postun_bare_stem_near_misses_still_fire, postun_bare_stem_helper_prefix_and_boundaries, postun_quoted_bare_stem_is_credited and sibling_tags_ignore_bare_stems in systemd_install.rs."
since = "0.4.1"

[[divergence]]
case = "global"
check = "systemd-service-without-service_add_post"
kind = "behaviour"
reason = "Fix-and-diverge: the add_post arm credits two shapes the reference does not, and no other arm changes. (1) A unit statically enabled by a shipped symlink under <unitdir>/*.wants/ resolving to the unit: systemd enables such a unit by the symlink itself, so no install call is owed (a regular file in a wants directory, a wants link outside the unit directory, a link nested below a wants directory, and a link resolving to no shipped file earn no credit). The credit is keyed by the link's basename: systemd enables the name the link carries, so a wants link for another unit never credits this one. (2) A %post line running systemctl preset or systemctl enable on the unit: install-system-units itself runs systemctl --no-reload preset on its units, so a literal preset line is the same operation and a literal enable is stronger. Variable or loop forms, %posttrans, and installing a paired socket or service for the unit earn no credit. The manual line is guarded: full-line comments never credit, a scope flag (--user, --global, or a remote-machine flag -H/--host/-M/--machine) moves the operation off the system unit, trailing comments are stripped quote-aware so a commented-out invocation never credits, and the unit name must match within word boundaries (lookarounds excluding word, dot, colon, @ and dash characters). Measured over the Factory corpus slice for this tag (561 findings over 95 packages): 162 findings are removed (150 with a resolving wants symlink and 12 with a literal systemctl preset/enable line in %post; 154 distinct, the 8 extra being duplicated dracut records the pristine binary itself emits twice), taking the tag from 561 to 399; the sibling systemd tags are unchanged in the same diff and no systemd-service-without-service_* finding is added; 11 packages clear entirely. Pinned by wants_symlink_credits_add_post_only, wants_symlink_for_other_unit_does_not_credit, wants_regular_file_does_not_credit, wants_symlink_outside_unit_dir_does_not_credit, wants_link_credits_link_name_not_target_name, wants_link_nested_below_wants_dir_does_not_credit, manual_preset_credits_add_post_only, manual_enable_with_flags_credits_add_post_only, manual_handling_of_other_unit_does_not_credit, manual_is_enabled_does_not_credit, manual_scope_flags_in_comments_and_quotes, manual_remote_machine_flags_do_not_credit and static_enable_credits_add_post_only in systemd_install.rs."
since = "0.4.1"

[[divergence]]
case = "global"
check = "systemd-service-without-service_del_preun"
kind = "behaviour"
reason = "Fix-and-diverge: the del_preun arm credits a %preun helper line naming a .service unit by its bare stem, which the reference's literal-substring predicate misses: the helper passes its arguments verbatim to systemctl disable --now, which resolves a bare name with the default .service suffix, so remove-system-units foo removes foo.service. Only .service units: a bare stem for a socket, target or path resolves to the .service of that name, a different unit. The stem must be a whole shell word of a genuine systemd-update-helper remove-system-units invocation (a bare verb substring, another command, or a comment never counts), with shell quoting, operators, redirections and comments honoured; a comma is a word character, an unterminated quote credits nothing, backslash is an ordinary character (escapes are not interpreted, and a backslash-newline continuation is never joined, since tokenization is per-line), a directory-prefixed helper counts only as an absolute path, and a wants symlink earns no del_preun credit (that credit is add_post-only); a stem carrying a dot is not bare at all (foo.timer names the timer, never foo.timer.service, and foo.bar names no .service unit either), and no unit-type suffix list is consulted. The no-[Install] credit from the original round was dropped in the fix round: remove-system-units is not disable-only -- the shipped systemd-update-helper runs systemctl disable --now for system units while the system is running (systemd 261.4, /usr/lib/systemd/systemd-update-helper, do_remove_units), so the helper also stops the unit, and a unit without [Install] can still be running at erase time (manual start, socket activation, dependency pull-in), where waiving the helper hides missing stop handling; the shipped-.wants exclusion covered only static enablement, not running state. Dropping the credit also removes the unit-content reads, so no content is read from absolute symlinks to the host filesystem anymore. The add_pre and add_post arms keep the literal predicate. Factory census 2026-10-29 over the shared corpus (51,589 binary RPMs): del_preun fires 544, up from 279 -- exactly the 265 no-[Install] findings return, and the bare-stem credit is unchanged at 4 (pcp pmcd, pmie, pmlogger, pmproxy); no other tag moves (add_pre 583, add_post 399, del_postun 186, all unchanged). The add_post sibling figure was previously written as 561 -- that is the pre-credit count the reference reports; the port count is 399, the 162 wants-symlink/preset findings being credited by the port (see the add_post entry). A full-corpus re-scan on 2026-10-30 of the batch tree and its baseline confirms all four tags unchanged (del_preun 544, add_pre 583, add_post 399, del_postun 186). Pinned by bare_stem_service_is_credited, bare_stem_socket_is_not_credited, bare_stem_target_is_not_credited, bare_stem_path_is_not_credited, longer_full_name_does_not_credit_shorter_unit, longer_stem_does_not_credit_shorter_unit, no_argument_helper_does_not_credit, quoted_bare_stem_is_credited, stem_only_in_comment_is_not_credited, backslash_continuation_is_not_joined, helper_prefix_is_required, shell_operators_and_commas_tokenize, quoted_stems_and_unterminated_quote, dotted_stem_with_known_suffix_is_not_bare, dotted_stem_with_known_suffix_is_not_bare_for_postun, all_four_fire_without_helpers, has_install_fixture_still_fires_del_preun, no_install_fixture_units_fire_del_preun_and_del_postun, wants_symlink_credits_add_post_only, tokenizer_edges, relative_path_helper_does_not_credit and no_install_fixture_without_extraction_still_fires_del_preun in systemd_install.rs."
since = "0.4.1"
