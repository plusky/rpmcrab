[[divergence]]
case = "global"
check = "SystemdUnitDir"
kind = "behaviour"
reason = "The unit directory comes from the SystemdUnitDir config key rather than rpm.expandMacro('%{_unitdir}') (SystemdInstallCheck.py). The shipped value matches this host's macro, so behaviour is identical today, but a host whose rpm sets a different _unitdir would not be followed."
since = "0.1.0"

