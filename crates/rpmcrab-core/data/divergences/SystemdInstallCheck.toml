# Divergence ledger entries owned by `SystemdInstallCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "SystemdUnitDir"
kind = "behaviour"
reason = "The unit directory comes from the SystemdUnitDir config key rather than rpm.expandMacro('%{_unitdir}') (SystemdInstallCheck.py). The shipped value matches this host's macro, so behaviour is identical today, but a host whose rpm sets a different _unitdir would not be followed."
since = "0.1.0"

[[divergence]]
case = "global"
check = "systemd-service-without-service_add_pre"
kind = "severity"
reason = "Deliberate severity recalibration (plusky/rpmcrab#593): the port reports W where the reference reports E, for the whole systemd-service-without-service_* family. The check cannot see manual scriptlet handling of a unit, so a missing macro call is not a certain defect: the pcp audit classified 60 E lines on services that work."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/593"

