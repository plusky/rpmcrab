case = "global"
check = "systemd-service-without-service_add_pre"
kind = "severity"
reason = "Deliberate severity recalibration (plusky/rpmcrab#593): the port reports W where the reference reports E, for the whole systemd-service-without-service_* family. The check cannot see manual scriptlet handling of a unit, so a missing macro call is not a certain defect: the pcp audit classified 60 E lines on services that work."
