# Divergence ledger entries owned by `TmpFilesCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "tmpfile-not-in-filelist"
kind = "behaviour"
reason = "The reference (TmpFilesCheck._check_tmpfile_in_filelist) emits one finding per matching tmpfiles.d line, preserving duplicates and file order; the port collects the missing paths, then sorts and dedups them, emitting one finding per path in sorted order. Duplicate lines for the same path produce one finding instead of several, and findings come out sorted rather than in file order."
since = "0.1.0"

[[divergence]]
case = "global"
check = "post-without-tmpfile-creation"
kind = "missing"
reason = "Deliberate omission: upstream removed TmpFilesCheck._check_post_tmpfile (commit 1c04a49d, fixing rpmlint#1374) because %tmpfiles_create/%tmpfiles_create_package are NOPs since systemd-rpm-macros rev 102 -- creation is handled by the systemd package's file triggers, so demanding a %post creation call only produced false positives. The port does not reintroduce the deleted finding."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/issues/1374"
