# Divergence ledger entries owned by `DBusPolicyCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "dbus-policy-allow-without-destination"
kind = "behaviour"
reason = "Fix-and-diverge (issue #866): an <allow> carrying send_interface without send_destination is quiet when it is the agent idiom -- the enclosing <policy> is subject-scoped (a user, group or at_console attribute), the interface is not one of the names the file itself pins via own, own_prefix or send_destination (an own_prefix pins every interface under the prefix, not only the prefix string itself), it carries no wildcard, and the rule's own <policy> block declares, via a concrete allow own or own_prefix (a non-empty, non-wildcard value on an <allow> element), the names its service owns, or the rule also carries a send_path naming a non-root object path, or the interface leaf is or ends in Agent with any version digits ignored. Agent interfaces are implemented by whichever process registers as the agent under a per-session unique bus name, so no static send_destination can name the recipient and the rule is complete as written; the reference carries no such credit and fires on all of these. Measured on the 17,241-source-package Factory sweep corpus (run-20261022-857d5ece), the finding drops from 46 E across 19 source packages to 9 E across 7: silenced are bluez 11, ofono 7, NetworkManager with its VPN plugins 7, connman 4, geoclue2 4, iwd 3 and polkit 1. The residue stays charged by shape: wpa_supplicant 1, tcmu-runner 1 and strongswan 1 name as send_interface the very name the same file pins as a destination, kauth and kf6-kauth (1 each) grant the interface from the default policy, the libteam 3 rules name the service's own name stem, and cups 1 sits in a file that pins nothing with no agent leaf and no send_path. Deny rules, member-only and path-only rules, and destination-carrying rules are unchanged. Pinned by agent_allows_in_service_policy_are_quiet, agent_allow_alone_still_counts_as_send_policy, agent_allow_in_pinless_file_is_quiet, service_interface_named_like_its_destination_still_fires, agent_allow_in_default_policy_still_fires, foreign_interface_in_pinless_file_still_fires, agent_manager_leaf_still_fires, member_only_allow_in_service_policy_still_fires, deny_with_agent_interface_still_fires, deny_own_wildcard_does_not_grant_agent_credit, deny_own_concrete_does_not_grant_agent_credit, concrete_allow_own_grants_agent_credit, wildcard_allow_own_does_not_grant_agent_credit, empty_allow_own_does_not_grant_agent_credit, own_prefix_pins_interfaces_under_it, own_prefix_does_not_pin_foreign_interfaces, own_in_another_policy_does_not_grant_agent_credit, root_send_path_does_not_grant_agent_credit, wildcard_interface_is_not_credited_by_own, wildcard_interface_is_not_credited_by_send_path and wildcard_interface_is_not_credited_by_agent_leaf in dbus_policy.rs."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/866"
