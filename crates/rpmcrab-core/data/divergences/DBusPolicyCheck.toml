[[divergence]]
case = "global"
check = "dbus-policy-allow-without-destination"
kind = "behaviour"
reason = "Fix-and-diverge: an <allow> confined to signal messages (send_type=\"signal\") inside a subject-scoped <policy> (a user, group or at_console attribute) is quiet. A signal is broadcast and carries no destination name, so no send_destination can be written for it -- a destination criterion can only match a message that has one; in the daemon's own subject-scoped block, message type, interface and subject are the full restriction the policy language can express for a broadcast. Default-policy signal allows and allows for any other message type stay charged; the reference carries no such credit and fires on all of these. Measured on the Mac public-snapshot route (current TW oss repodata, 52,984 packages; universe = the 122 packages shipping a system.d policy file, holding 46 destinationless send allows): the finding drops from 13 E across 11 packages to 12 E across 10 -- silenced is cups' root signal allow for com.redhat.PrinterSpooler, the only send_type-carrying element in the universe. The residue is the agent-idiom entry's charged residue, unchanged: the NM VPN plugins' interfaces sit under their blocks' pinned own_prefix stems, strongswan-nm / wpa_supplicant / tcmu-runner name the very destination their file pins, libteam names its pinned own name stem, and the two kauth files grant their interface from the default policy. Pinned by signal_allow_in_service_policy_is_quiet, signal_allow_in_default_policy_still_fires and method_call_allow_in_service_policy_still_fires in dbus_policy.rs."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/866"

[[divergence]]
case = "global"
check = "dbus-policy-missing-allow"
kind = "severity"
reason = "Tom's ruling (2026-10-27): a policy file carrying a concrete <allow> own or own_prefix (the block_has_own test: a non-empty value containing no wildcard, on an <allow> element) but no credited send rule is a name-ownership fragment and fires at W instead of E; a file with no concrete own at all keeps the E. Within the XML the own-only shape is indistinguishable from a forgotten send allow, so the finding stays visible rather than being silenced; the reference fires the shape at E. Measured on the 122-package / 148-file system.d universe (Factory corpus, pristine vs patched): the finding moves from 2 E to 2 W -- pulseaudio's pulseaudio-system.conf and transactional-update-notifier's org.opensuse.tukit.Updated.conf, both single-<allow own> fragments -- with nothing removed and the sibling dbus-policy findings unchanged (allow-without-destination 13 E, allow-receive 80 W). Pinned by own_only_fragment_warns_instead_of_erroring, own_prefix_only_fragment_warns_instead_of_erroring, own_in_any_block_warns_for_the_file, deny_only_file_stays_error, receive_only_file_stays_error, wildcard_own_only_stays_error, empty_own_only_stays_error and own_with_send_rule_is_silent in dbus_policy.rs."
since = "0.4.1"
