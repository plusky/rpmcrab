kind = "behaviour"
reason = "Port-only, no reference counterpart: the Version of the package's own dist-info (its METADATA `Name` PEP 503-matching the package key) is compared with the RPM Version under PEP 440 — release segments zero-padded, local segments ignored on both sides (a `+git` suffix on an equal base is quiet), RPM `~` and `^` mapped to pre- and post-release segments. The general arm is scoped to `python-*` source packages; the version-0 arm — an own-name dist-info at 0.0.0 in a non-0 RPM, the metadata never stamped with the release version — fires for any source. A dist-info that is not the package's own never fires (cockpit-bridge ships a `cockpit` dist-info at 0). Measured over the Tumbleweed snapshot 20261026 targeted set (8,149 python-carrying packages): 61 firings — 32 in the general arm over 16 sources (among them the issue's named gps3, pybluez and pyu2f, whose bases genuinely disagree, and rtslib-fb, whose METADATA carries 2.2.3.dev0 against RPM 2.2.2) and 29 in the version-0 arm over 16 sources. Every version-0 firing was classified from the payload: in all 16 sources the shipped METADATA literally reads 0 or 0.0.0 against the real RPM release — buildstream is NOT among them (its `python3.13dist(buildstream) = 0` provide is hand-written and it ships no dist-info) — chirp 20261016, molecule 26.9.0, python-caldav 1.4.0, python-cmd2 4.2.4, python-cytoolz 1.1.0, python-django-auth-ldap 5.3.0, python-humanreadable 0.4.3, python-keyrings.alt 5.0.2, python-openqa_review 1.40.0, python-pingparsing 1.4.2, python-podman 5.8.0, python-py-gitea-opensuse-org 1.22.4, python-pydrive2 1.18.1, python-pytest-plus 0.8.1, python-tcolorpy 0.1.7 and marisa 0.3.1: one genuine unstamped-metadata class, no checker artefacts."
