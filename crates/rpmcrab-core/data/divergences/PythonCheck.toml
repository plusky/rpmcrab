[[divergence]]
case = "global"
check = "python-require-upper-bound-contradicts-metadata"
kind = "behaviour"
reason = "Port-only, no reference counterpart: the upper-bound mirror of the floor comparison — for each declared requirement that survives marker filtering, the metadata specifier's upper end (the most restrictive of its explicit `<` / `<=` clauses, a bare `==` clause whose point is its own upper end, and the exclusive ceilings a `== v.*` wildcard or a `~= v` compatible-release clause implies under PEP 440: `== 1.2.*` ends below 1.3, `~= 1.4.5` below 1.5, `~= 1.4` below 2) is compared with the upper bounds carried by the RPM Requires that name it. The join mirrors the floor side with the senses inverted: within one rich branch the tightest matching leaf bound governs (a branch's leaves are conjunctive), branches join by their loosest bound (alternatives widen what the entry admits), an entry with an unversioned branch admits any version and its bounds are not credited, separate entries are conjunctive and join by their tightest bound, and an exact `=` pin counts as the inclusive bound it is. The finding fires at Info when the joined RPM bound cuts the declared range — below the metadata's ceiling, or anywhere when the metadata declares no ceiling at all — and names both ends. A requirement no RPM Require names at all stays `python-missing-require`'s finding, a bound on a distribution the metadata does not declare never fires, and floor-only Requires carry no upper bound to contradict with. The finding records a packaging-intent divergence, not a defect: an upper bound the metadata does not declare is often a deliberate packaging decision, and either side can be the one to align — drop or raise the RPM bound, or correct the metadata in the spec. Measured over the full Factory corpus (51,589 RPMs): 1,190 firings over 553 packages from 279 sources — 1,171 against metadata declaring no ceiling, 17 against an explicit ceiling, 2 against a `~=` ceiling — with the sampled firings hand-verified against both payloads (matrix-synapse: METADATA `canonicaljson>=2.0.0,<3.0.0` against the pin `python313-canonicaljson = 2.0.0`; python-virtualenv: METADATA `filelock<5,>=3.24.2` against the rich Require's `< 4`; aws-cli: METADATA `rsa>=3.1.2` against `python313-rsa < 5.0.0`)."
