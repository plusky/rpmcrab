[[divergence]]
case = "global"
check = "PythonCheck"
kind = "behaviour"
reason = "Deliberate fix (plusky/rpmcrab#481): `python-leftover-require` is computed once per package over the union of all its dist-infos and emits at most one finding per (package, RPM require); the reference evaluates the requires against each dist-info separately, so a package shipping N dist-infos re-emits the same leftover once per dist-info (gnuhealth: ~51 genuine deps x ~19 dist-infos = 966 findings in the Factory sweep run-20261013). The port also suppresses a leftover when the dependency is proven used -- a dotted module path imported by the package's shipped Python code (string literals, comments and /usr/share/doc examples do not count as imports) that either PEP 503-normalises to the dependency's name as a full path (azure.mgmt.network for azure-mgmt-network) or in its top-level component (starlette.routing for starlette — a submodule of the dependency's own module tree; a shared namespace top level never equals a namespaced dependency's name) or is exactly a module path provider metadata seen in the same run attributes to it (RECORD entries and site-packages file-list entries attest exact paths; top_level.txt attests only the top-level name it lists, so a shared namespace top level proves nothing — python313-opencv ships a bare cv2.*.so and no dist-info at all, so its file list is the only evidence). The proof was tightened after plusky's review of PR #489: top-level-only attribution let any azure-* provider silence any other, and docstring/doc-file imports counted as proof. The port never fires for a package that ships no Python code at all (metadata-only metapackages such as the python-azure-mgmt umbrella, whose Requires are their entire content; 378 sweep findings). Unprovable cases (dynamic imports, providers outside the run) keep firing, preserving the check's verify-it intent; sampled import ground truth showed 28 of 33 flagged deps (85%) are imported by the shipped code. Pinned by `leftover_union_across_dist_infos_emits_once_per_dep`, `after_checks_suppresses_only_proven_leftovers`, `leftover_namespace_import_is_not_proof_for_sibling_dist`, `scan_imports_ignores_strings_comments_and_doc_files` and `metadata_only_package_has_no_code`."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/481"

