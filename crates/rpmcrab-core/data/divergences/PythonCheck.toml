# Divergence ledger entries owned by `PythonCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "PythonCheck"
kind = "behaviour"
reason = "For a requires.txt requirement that already carries a marker inside a named extra section, the reference (`_convert_egg_info_reqs_to_simple_reqs` in CPython's importlib.metadata, still used by rpmlint 2.10.0's `Distribution.requires` for egg-info) appends the section condition as a second `;`-part verbatim: `w6extra; python_version > \"3.9\"; (sys_platform == \"linux\") and extra == \"extra\"` (verified against CPython 3.13.14). The port stores the post-first-`;` marker text verbatim instead of merging everything into one `and`ed marker. Parity, not a logical divergence: both forms carry the `extra ==` condition, which the leftover evaluator treats as not holding (`extra` is never provided), and the reference itself drops the double-semicolon string as InvalidRequirement, so findings are unaffected either way. Pinned by emission-path tests."
since = "0.1.0"

[[divergence]]
case = "global"
check = "PythonCheck"
kind = "behaviour"
reason = "Environment markers for PEP 508 `default_environment()` keys the port does not evaluate (`implementation_version`, `platform_release`, `platform_version`, `python_full_version`) fail closed: the requirement is treated as not wanted, which can emit `python-leftover-require` where the reference - evaluating the real environment - stays quiet. `python_version`, `sys_platform`, `os_name` ('posix'), `platform_system` ('Linux') and `extra` (evaluated against \"\") match the reference exactly (`PythonCheck.py:139-143`). `platform_machine` ('x86_64'), `platform_python_implementation` ('CPython') and `implementation_name` ('cpython', the PEP 508 value of `sys.implementation.name` on CPython) are pinned as a build-environment approximation - the reference reads them from `packaging`'s live `default_environment()`, not from `PythonCheck.py:139-143` - consistent with the existing `sys_platform` \"we only ever run on Linux\" assumption. Pinned by `marker_pinned_linux_environment`, `marker_pinned_machine_and_implementation` and `marker_pinned_implementation_name`."
since = "0.1.0"

[[divergence]]
case = "global"
check = "PythonCheck"
kind = "behaviour"
reason = "The `python_version` marker default is config-driven where the reference is interpreter-driven. The reference (`PythonCheck.py:139-143`) evaluates markers with `platform.python_version_tuple()[:2]` -- the interpreter actually running rpmlint -- and never reads `PythonDefaultVersion` (its only reference consumer is `FilesCheck.py:377`, for pyc magic, already wired in the port). The port reads `PythonDefaultVersion` from the config instead: the shipped `configdefaults.toml` leaves it `\"\"`, which the port maps to the hardcoded `3.12` fallback, so out of the box markers evaluate at 3.12 (at capture time the reference venv was 3.13, so the effective versions already differ). This is a deliberate divergence, not a parity gap: a distro -- e.g. an SLE release -- can pin the marker-evaluation Python version via config without rebuilding the binary. A non-default `PythonDefaultVersion` value has no reference counterpart; rpmlint keeps using its interpreter."
since = "0.1.0"

