[[divergence]]
case = "global"
check = "python-require-floor-below-metadata"
kind = "behaviour"
reason = "Port-only, no reference counterpart: for each declared requirement that survives marker filtering, the strongest lower bound of its specifier (the largest of its `>=`, `>`, `~=` and `==` clauses) is compared with the floors carried by the RPM Requires that name it. The verdict is computed per require entry first: each `or` branch of a rich entry is judged on its own leaves (a plain entry is a single branch), a branch holding both floored and unversioned matching leaves counts as floored, and an entry with an unversioned branch is an unversioned entry whose own floors are not credited. Separate entries are conjunctive, so the surviving entry floors join by maximum — within an entry, `(python3.13dist(dulwich) >= 0.21 or python3.13dist(dulwich) >= 0.30)` carries floor 0.30; across entries, an unversioned `python3.13dist(dulwich)` beside `python3.13dist(dulwich) >= 0.21` joins to 0.21 — and the finding fires when the joined floor sits below the metadata's, naming the joined floor. A requirement no RPM Require names at all stays `python-missing-require`'s finding — including one met only by the package's own Provides, which has no RPM floor to compare — and `!=`-only requirements declare no bound; the generator spelling `>= 2.9^post0` parses as the 2.9.post0 floor it is. The finding is a disagreement between the package's dependency graph and its metadata — either side can be the wrong one, and the fix aligns the two: raise the Requires to the metadata floor, or correct the metadata floor in the spec when it is wrong for the package. Hand-verified against payloads (ansible-core: METADATA `resolvelib>=0.8.0` against the rich Require `(python3-resolvelib >= 0.5.3 with python3-resolvelib < 2.0.0)`). Measured over the full Factory corpus (51,589 RPMs) under the per-entry-then-conjunctive join: 776 firings over 527 packages from 281 sources (sources are distinct source packages): 775 unique (package, declared requirement) pairs, one pair firing twice. The corpus carries python in 9,549 RPMs, whose binary names are all distinct, so the RPM count and the distinct-name count coincide; a python-carrying RPM is one shipping a .py file or a dist-info/egg-info path. The superseded targeted-set counts (833 firings over 562 packages from the 8,149-package Tumbleweed snapshot 20261026 targeted set of python-carrying packages) are not comparable: different population and pre-join verdict semantics. Against the prior old-base full-corpus measurement (the earlier main baseline), the below-floor set is identical."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/1024"

