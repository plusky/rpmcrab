[[divergence]]
case = "global"
check = "python-missing-require"
kind = "behaviour"
reason = "A declared requirement is also satisfied when the package itself ships a dist-info whose `Name` PEP 503-matches the requirement in the same Python tree — the path prefix ending at the first `pythonX.Y` or `site-packages` component of the dist-info directory; when a dist-info path carries neither component, the directory itself is the tree key. The reference tests declared requirements only against the package's RPM Requires, and vendored or bundled distributions generate no `python3.Xdist()` Provides for the own-Provides credit to see: the setuptools packages vendor a self-contained distribution set under `setuptools/_vendor/`, and rpmlint-mini bundles a Python tree under `opt/testing/`, so every requirement the outer metadata declares on them reported missing although the named distribution ships in the same tree. A same-named dist-info in a different interpreter's tree does not credit. Measured on the Factory corpus (51,589 RPMs): 61 `python-missing-require` findings removed (45 over the four setuptools flavour packages, 16 in rpmlint-mini), none added to `python-missing-require` (one further row of the class is already silent on current main, satisfied by the own-Provides reconstruction). The shipped distribution set is collected from dist-info directories and from `egg-info/requires.txt`. Pinned by `missing_require_coshipped_dist_in_same_tree_satisfies`, `missing_require_coshipped_dist_in_other_tree_still_fires`, `missing_require_coshipped_other_dist_still_fires`, `python_tree_key_scopes` and `coshipped_vendored_dist_satisfies_through_check_binary`, and `coshipped_egg_info_dist_satisfies_through_check_binary`."
since = "0.4.1"

