# Divergence ledger entries owned by `AlternativesCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "alternatives-regex-from-package-path"
kind = "behaviour"
reason = "AlternativesCheck.py:216 interpolates the package-chosen symlink basename into a regex with no escaping, so a basename carrying an unbalanced bracket makes re.compile raise. rpmcrab skips the empty-libalternatives-directory finding for such a path instead of aborting the run, because a package must not be able to panic the linter. A path whose basename is valid regex -- every path the reference actually exercises -- behaves identically."
since = "0.1.0"

[[divergence]]
case = "global"
check = "libalternatives-conf-not-found"
kind = "behaviour"
reason = "Deliberate false-positive fix (issue #406): when the parent directory of the conf path is also absent from disk, the whole subtree failed to extract (e.g. ENOSPC), so the missing conf is an extraction artifact, not a packaging error, and the finding is skipped. AlternativesCheck.py has no parent check and fires whenever the conf is absent."
since = "0.1.0"

[[divergence]]
case = "global"
check = "AlternativesCheck"
kind = "detail"
reason = "Staged `--explain` text for `update-alternatives-postun-call-missing` said the `--install` being undone was done in postun; the check undoes installs collected from the `%post` phase (verified in `checks/alternatives.rs`), so the text claimed the wrong phase. Fixed to `post`."
since = "0.1.0"

[[divergence]]
case = "global"
check = "AlternativesCheck"
kind = "detail"
reason = "Staged `--explain` text for `libalternatives-conf-not-found` was ungrammatical. Reworded: the libalternatives configuration file defined in the package file section was not found."
since = "0.1.0"

[[divergence]]
case = "global"
check = "AlternativesCheck"
kind = "detail"
reason = "Port-only `--explain` descriptions for `double-entries`, `package-supports-libalternatives`, `package-supports-update-alternatives`: the reference emits these findings but ships no descriptions."
since = "0.1.0"

[[divergence]]
case = "global"
check = "AlternativesCheck"
kind = "behaviour"
reason = "Fix-and-diverge (issue #811): a libalternatives `binary=` entry is also satisfied by a package file at exactly the entry's path, wherever it lives. The reference only accepts a package path that contains `bin/` and ends with the value, so a package whose alternatives targets sit in /usr/libexec draws both `binary-entry-value-not-found` and `wrong-or-missed-binary-entry` for every config even though it ships every target: salt ships 12 such groups per python flavour with targets in /usr/libexec/salt/ (24 configs, 48 warnings in the Factory battle test, all false). libalternatives resolves any absolute target and /usr/libexec is a standard FHS location for internal binaries. Entries whose target the package does not ship keep firing both findings, pinned by `binary_entry_missing_at_libexec_path_still_fires`."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/811"

[[divergence]]
case = "global"
check = "AlternativesCheck"
kind = "behaviour"
reason = "Fix-and-diverge (issue #931): a libalternatives conf that declares no `binary=` entry draws no binary findings. The reference tracks binary-entry satisfaction in a single flag, so a conf registering only a man page (a man-only group) is reported with `wrong-or-missed-binary-entry` as if it had declared a binary entry and missed it. rpmcrab tracks presence separately from satisfaction: `wrong-or-missed-binary-entry` fires only for a declared-but-unsatisfied entry, which `binary-entry-value-not-found` already reports at the line site. Man validation on such a conf is unchanged. Pinned by man_only_conf_draws_no_binary_findings and man_only_conf_with_missing_man_still_warns_for_the_man in alternatives.rs."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/931"

[[divergence]]
case = "global"
check = "AlternativesCheck"
kind = "behaviour"
reason = "Fix-and-diverge (issue #932): a libalternatives `binary=` entry is credited when its path resolves through the package's own symlinks to a shipped regular file. The reference credits an entry only by its bin/ suffix rule -- the literal-path credit is rpmcrab's own divergence, ledgered under issue #811 -- so an entry whose path resolves through a symlink shipped by the same package -- the JDK layout, /usr/lib64/jvm/java-11-openjdk -> java-11-openjdk-11 -- draws both `binary-entry-value-not-found` and `wrong-or-missed-binary-entry` on every conf even though the package ships the target. rpmcrab resolves the entry path through the package's own file set, following symlinks at every component, directory and file alike, component-wise with the kernel's hop bound, and credits it when the walk lands on a shipped regular file; a walk that exhausts the hop bound is a cycle (the kernel's ELOOP) and earns no credit; the walk canonicalises the value the way the kernel resolves it, so a doubled leading slash (binary=//usr/bin/..., emitted by the SUSE python packaging macros) names the shipped file too. Resolutions leaving the package's file set (sibling-package or genuinely absent targets) and symlink cycles keep firing. Pinned by binary_entry_through_shipped_dir_symlink_is_credited, binary_entry_through_absolute_dir_symlink_is_credited, binary_entry_through_symlink_chain_is_credited, binary_entry_through_dir_symlink_to_unshipped_file_still_fires, binary_entry_through_symlink_loop_still_fires, binary_entry_resolving_to_directory_still_fires, binary_entry_through_cycle_landing_on_shipped_name_still_fires and binary_entry_with_doubled_leading_slash_is_credited in alternatives.rs."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/932"

[[divergence]]
case = "global"
check = "AlternativesCheck"
kind = "detail"
reason = "Staged `--explain` texts for `update-alternatives-post-call-missing` and `update-alternatives-postun-call-missing` were garbled (`install all the configuration`, `remove all the configuration for each individual --install binary`). Reworded: the package does not call update-alternatives --install in the %post phase to register its alternatives / --remove in the %postun phase for each --install that was done in %post."
since = "0.4.1"

[[divergence]]
case = "global"
check = "update-alternatives-postun-call-missing"
kind = "behaviour"
reason = "Fix-and-diverge: the %postun phase runs only when the %post phase collected at least one --install. The reference calls its postun check unconditionally for every package passing the presence gate and reports the bare package-level finding whenever %postun carries no update-alternatives line, even when %post installed nothing — there is then no --remove the package could owe. The vacuous arm covers packages whose %post only cleans up legacy registrations (the JDK and Node.js families' existence-guarded cleanup lines, kept after their move to libalternatives) and packages present only through shipped /etc/alternatives files. Measured over a 1,961-package Tumbleweed candidate universe (every /etc/alternatives or libalternatives shipper plus the name families): the tag goes from 57 findings to 5, the five remaining being genuine un-removed installs (fakeroot, makewhat, python3-openqa_review, python313-mutagen, python314-mutagen), and every other AlternativesCheck tag is unchanged on the same scan (update-alternatives-requirement-missing 81, update-alternatives-post-call-missing 50). Pinned by postun_phase_silent_when_post_installed_nothing and postun_phase_reports_when_install_is_never_removed in alternatives.rs."
since = "0.4.1"

[[divergence]]
case = "global"
check = "update-alternatives-postun-call-missing"
kind = "behaviour"
reason = "Fix-and-diverge: a %postun --remove line is credited when the installed name ends the token (followed by whitespace, a command separator, or end of line), not on the reference's trailing word-boundary. A name ending in a non-word character has no word boundary before the whitespace that follows it, so the reference never credits the toluapp packages' --remove tolua++ line and reports all four (5.1, 5.3, 5.4, 5.5) for a removal they perform. The token-end form also refuses the reference's false credit for an installed name that is a proper prefix of the removed one. Pinned by postun_remove_of_plus_suffixed_name_is_credited, postun_remove_of_longer_name_does_not_credit_prefix and postun_remove_of_suffixed_word_name_does_not_credit in alternatives.rs."
since = "0.4.1"
