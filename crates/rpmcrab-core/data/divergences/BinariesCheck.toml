kind = "behaviour"
reason = "Fix-and-diverge: in a linked object, `missing-call-to-setgroups-before-setuid` stays quiet when the setuid/setgid match comes only from defined symbols (no undefined setuid/setgid reference exists, in either the FUNC reference set or the NOTYPE import set) and the object references dlsym (undefined, from either set, with any @VERSION suffix stripped before matching). Such an object provides its own setuid/setgid wrapper and forwards through dlsym -- an LD_PRELOAD-style interposer that makes no privilege decision itself -- and a tracing wrapper must not drop the caller's groups, so there is no package-side fix. The credit is conservative: an object that both defines and calls (an undefined setuid/setgid reference exists) still fires, a defined pair with no dlsym reference still fires, and archives are unchanged (they already charge references only). Pinned by setgroups_interposer_credit and setgroups_interposer_credit_edges in binaries.rs."
