[[divergence]]
case = "global"
check = "shared-library-without-dependency-information"
kind = "behaviour"
reason = "Extension of the plusky/rpmcrab#359 plugin-like scope (the own-name arm, #1018): a shared object whose DT_SONAME is exactly its own file name's basename, at any location, with no version component (`certmgr_script.so`, `VMMR0.r0`) is a module built to be loaded by path -- application plugins, interpreter extension modules, hypervisor payloads -- whose build stamps the module's own name as its SONAME; it resolves its undefined symbols against the host process, so an empty DT_NEEDED states nothing. A version component is a `.so.` followed by a digit anywhere in the name, or one of the validso tail forms (a digit immediately before the final `.so`: the dash and stem versions `libdb-4.8.so`, `libtcl8.6.so`, `libfoo-1.so`); `libfoo.so0` carries none. Measured over the Factory corpus (51,589 binary RPMs, the restored check's corpus sweep for #1018, 2026-10-26; findings counted per file, 53 in 23 packages): 50 are this shape and no package in the corpus records a DT_NEEDED on any of those names. The 3 survivors are all versioned shapes -- no foreign unversioned SONAME survives (count 0): /usr/lib64/libfrrfpm_pb.so.0.0.0 -> libfrrfpm_pb.so.0 and /usr/lib64/libmlag_pb.so.0.0.0 -> libmlag_pb.so.0, the only firing SONAMEs with corpus DT_NEEDED consumers (the frr package's binaries link both, yet the files declare no DT_NEEDED of their own), and openwsman's libwsman_identify_plugin.so.1.0.0 (a plugins directory) -> libwsman_identify_plugin.so.1, a versioned plugin SONAME with no corpus consumer and no decidable separator. Corpus 53 -> 3."
