[[divergence]]
case = "global"
check = "binaries-dependency-scope"
kind = "behaviour"
reason = "The reference runs its ldd-based dependency analysis only for installed packages; rpmcrab runs the DT_NEEDED-based analysis for extracted files too. unused-direct-shlib-dependency is produced by set difference over the same parsed symbol sets: a direct dependency is unused when no undefined symbol of the consumer, weak or strong, names a symbol the located provider defines, and a dependency providing a symbol the consumer copies out of it through a COPY relocation counts as used; a dependency whose provider cannot be located stays silent, never reported. Installed packages resolve emission-time against their own providers plus the system; extracted packages resolve in after_checks against the invocation's provider index under the same mode switch as undefined-symbol resolution. A dependency referenced only by weak undefined symbols counts as used, matching ldd -u, which binds weak references when the provider defines the symbol (a Haskell library's weak __cxa_finalize reference to libc was the observed instance). Within that analysis, undefined-non-weak-symbol fires for shared libraries only: an executable's UND entries resolve at load time (the reference's `ldd -r` stays silent there), and scanning them raw produced hundreds of bogus hits. Undefined symbols are taken from .dynsym and resolved the way the reference's `ldd -r` resolves them (plusky/rpmcrab#467): against the DT_NEEDED closure formed by the libraries shipped in the invocation's packages first (each package's providers kept separate, one identity per package file: the consumer's own package file's copy of a SONAME is its provider -- two versions of one package in one invocation are distinct packages for resolution -- then other same-base-architecture packages' copies in check order, plusky/rpmcrab#735), then -- for installed packages and for invocations in which a single package contributes, which share one model -- against the system libraries of the environment rpmcrab runs in (ldconfig cache, then the standard library directories); a multi-contributor invocation resolves against its own package set plus the directories its objects' DT_RPATH/DT_RUNPATH entries name on the filesystem rpmcrab runs on (plusky/rpmcrab#701). The mode switch counts contributing packages across the whole invocation (a package contributes when it ships a captured consumer or a provider library), never the packages in the run. In the jailed container / build root rpmcrab normally runs in, that system environment is the checked packages' own install target, so the two models agree there; on an unjailed host the system fallback reflects the host's libraries, so installed and single-contributor verdicts can differ from the multi-contributor model. Providers are located the way the loader locates them (plusky/rpmcrab#504): the needing object's DT_RPATH (transitive, and ignored when the object also carries DT_RUNPATH) and DT_RUNPATH (direct dependencies only) are searched with $ORIGIN expansion after the package providers in every mode; where the system fallback applies, the search then continues into the cache and the standard directories. One gap remains: matching is by symbol name only, where the loader also binds symbol versions."
since = "0.1.0"

