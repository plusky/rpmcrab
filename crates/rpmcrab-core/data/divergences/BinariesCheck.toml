[[divergence]]
case = "global"
check = "ar-failed"
kind = "behaviour"
reason = "The reference charges ar-failed on any archive GNU `ar` cannot list. Archives in the gplib dialect (the MPLIB-compatible format gputils' gplib writes for SDCC's pic14/pic16 targets) are valid libraries for their toolchain but unreadable by GNU binutils: all 406 corpus findings are sdcc libraries of that shape, and every one passes a strict structural parse (256-byte '/'-terminated member names, fixed-width numeric fields, member sizes chaining exactly to EOF, PIC COFF object members). rpmcrab treats a structurally valid gplib archive as a non-standard archive instead of charging ar-failed; archives that parse neither way are still charged."
since = "0.4.1"

