work-supplied name. One measured boundary: the CVE's own call site does not fire - in the corpus samba build the system() reference sits in libsmbconf.so (package samba-client-libs, which ships no units and no privilege) while the exposed daemon nmbd ships in package samba; the per-package gates cannot see across the split. The reference match is anchored to the entry points themselves: symbols that merely contain the names (udev_device_get_subsystem and friends, present in gated files alongside genuine references) never match, and a definition-only file does not fire the call form."
