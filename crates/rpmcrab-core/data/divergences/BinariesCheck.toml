[[divergence]]
case = "global"
check = "linked-against-usr-library"
kind = "behaviour"
reason = "Merged-/usr model, at two sites: the emission site tests raw ldd dependency strings (a consumer listed under /bin, /sbin, /lib or /lib64 linking a string starting with /usr/), and the deferred site tests resolved provider paths (a consumer DT_NEEDED resolved through the provider index, RPATH/RUNPATH, then the system). In both, the consumer path runs through the merged-/usr map before the prefix test, and the provider path is mapped the same way before its /usr/ test, so a /lib64 provider counts as a /usr path. Here 'map' means the first-component path translation only (/bin to /usr/bin, /sbin to /usr/sbin, /lib to /usr/lib, /lib64 to /usr/lib64); 'resolve' means the DT_NEEDED-to-provider lookup. The gate is component-aware, so /libfoo is a different directory from /lib and never matches: a consumer the map moves under /usr/ is a /usr consumer at install time and its /usr linkage is moot. The reference tests the raw ldd-line prefix, not resolved linkage -- an ordinary 'libc.so.6 => /usr/lib64/libc.so.6' line does not start with /usr/ -- so the port's resolved-path arm is wider than the reference's, but its gate admits no merged-/usr Factory consumer: measured over the full Factory corpus (Factory-only measurement), the only reference-shape firings are four /lib64 consumers resolving to glibc under /usr (libgcc_s1-gcc7, libpasswdqc0, nss-pam-ldapd twice), all moot under the model, so the arm fires zero times on Factory. Pinned by the linked_against_usr_library, linked_against_findings_resolves_index_paths, merged_usr_path_maps_root_dirs, root_dir_consumer_gate_is_component_aware and provider_prefix_uses_mapped_path tests."
since = "0.4.1"

