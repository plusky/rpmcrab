reason = "Fix-and-diverge: position-independent-executable-suggested also stays quiet for a fixed-address statically linked executable -- ET_EXEC with no dynamic section (ReadelfInfo.has_dynamic). The suggestion prescribes the distro's PIE flags, but a -static link has no dynamic link for them to reach: the -pie half of the remedy does not apply to a fixed-address executable, whose load address is the link's own arrangement (static Go tools, the Free Pascal tools, the qemu-linux-user images, deliberate static init/pause binaries). The gate is scoped to ET_EXEC: an ET_DYN image with no dynamic section -- the static-PIE shape -- is not covered and keeps the suggestion. The reference applies no linkage test. The PieExecutables error is not gated. Measured over the full Factory corpus (51,589 RPMs): 238 findings removed, the removed set exactly the statically linked executables not already gated on another ground, zero added. Attribution across this tag's quiet arms is exclusive and complete: debug-name 568, foreign-machine 12, GHC-stamp 44, Haskell libHS 8 and static 238 partition the 870 findings the gates remove from the tag's 2,842 pre-gate corpus findings. is_debug is subsumed by debug-name by construction (the `.debug` suffix is a subset of the debug-name shapes), so is_debug contributes no partition member. Attribution follows evaluation order (debug-name, foreign, GHC-stamp, libHS, is_debug, static): the 11 files matching both foreign-machine and static resolve to foreign; GHC-stamp and libHS are disjoint as measured, GHC-stamp and static do not overlap as measured, and libHS and static do not overlap as measured, so the 44 GHC files count in the GHC arm alone and the 8 libHS files in the libHS arm alone. Pinned by pie_suggested_quiet_for_static_exec and non_pie_error_not_quieted_by_the_suggestion_gates in binaries.rs."
since = "0.4.1"

[[divergence]]
case = "global"
check = "no-soname"
kind = "behaviour"
reason = "The reference reports every shared object whose name matches the library pattern and that carries no SONAME, wherever the file sits. rpmcrab reports the finding only when the file's directory is one of the configured SystemLibPaths, or a directory the package itself adds to the linker search path with an /etc/ld.so.conf or /etc/ld.so.conf.d snippet. A shared object in any other directory -- a database server's per-version module tree, an application's plugin folder, an interpreter's private library directory -- is loaded by path (dlopen, an rpath, a runtime's own module search); the linker's SONAME machinery never resolves it, so the missing SONAME has no consumer there. Factory corpus (51,589 RPMs, current main): 757 findings in 152 packages before, 101 in 58 after; the 656 removed are exactly the private-directory files in packages shipping no ld.so.conf snippet for the directory, and PostgreSQL's module trees alone account for 488 of the 757. R-core-libs ships a snippet for /usr/lib64/R/lib, so its three findings stay. Scope note: the system paths are the configured SystemLibPaths, taken from the reference-default config, not ldconfig's compiled-in STANDARD_LIBDIRS (files.rs, issue #569), which FilesCheck's ldconfig-scriptlet scope uses instead -- SystemLibPaths include /usr/X11R6/lib and /usr/X11R6/lib64 and exclude /usr/local/lib and /usr/local/lib64, STANDARD_LIBDIRS the reverse -- so a library in /usr/local/lib stays out of no-soname scope unless a snippet adds its directory. The split is documented, not reconciled by widening the firing set on an unmeasured guess. Snippet selection matches the loader glob (top-level *.conf only), snippets parse lossily with comments stripped, and both sides of the scope comparison are normalised."
since = "0.4.1"

