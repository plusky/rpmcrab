reason = "Deliberate fix (issue #848): a binary-class file in a noarch package is foreign-target payload and does not emit arch-independent-package-contains-binary-or-object when it is an ar archive with no ELF members, at any location (the glibc placeholder archives have no members at all; every member an archive does have is in another object format -- COFF, wasm, LLVM bitcode -- or is plain data), or when it is an ELF, or an archive whose ELF members are all for foreign machines, whose machine is outside the host family (EM_386 and EM_X86_64, the machines an x86-64 host executes natively) and it sits in a target-payload location: a cross sys-root (/usr/<triplet>/sys-root/, any target triplet) or a firmware directory (/usr/lib/firmware/, /lib/firmware/). The machine evidence is the payload's ELF header, with the magic string's machine as fallback for an ELF payload that cannot be opened; an archive's evidence is its parsed members alone, with no magic fallback. A host-machine ELF fires in every location, a foreign ELF outside the target locations fires, and a file whose machine cannot be determined fires (a header naming no machine (EM_NONE), a magic naming no machine, OCaml native code, Lua bytecode); an archive that cannot be read or parsed fires outright. A %ghost file never reaches the gate: it sits in the header with no payload on disk, so it feeds the package-level binary accounting without being classified. The reference fires for every binary-class file in a noarch package. Measured on the Factory corpus (sweep run-20261022-857d5ece, main 857d5ece): the finding's 765 hits, counted per file, classify by payload as 756 cross sys-root files of the glibc-cross-*-src family (ELFs and archive members for the RISC-V, PA-RISC, AArch64, S/390, LoongArch and PowerPC targets), 1 PowerPC DSP firmware image under /usr/lib/firmware (alsa-firmware), 2 ar archives whose members are wasm objects (the rust wit-bindgen runtime), and a 6-file residue that keeps firing: 4 host