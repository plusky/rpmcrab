reason = "Deliberate severity recalibration (decided 2026-10-25): the port reports W where the reference reports E. The finding charges the undefined non-weak symbols a shared library's DT_NEEDED closure leaves unresolved, and the population is host-provided binding: libraries the host executable loads, sibling application libraries, the C/C++/OpenMP runtimes, and above all the Python C-API, which extension modules by design never link because the interpreter provides the symbols at load. Measured over the Factory corpus (17,242 srcpkgs, 2026-10-24 sweep at 38459d25, Linux/noisynator venue): 958,536 E over 2,045 srcpkgs -- the overwhelming mass of the corpus's 1,003,696 errors, against 45,160 E for every other finding combined. The 2026-10-25 re-verification of the #828 disposition classified 24,159 flagged symbols on the top packages' files (paraview, qgis, vtk, FreeCAD) by their actual definition site and found every one defined by a runtime provider, the providers declared at package level; the measured residue with no provider is zero. The binding is satisfied at load time, so a packager has no package change that sorts the class: as an error it blocks builds over a population nobody can act on. As a warning it stays visible per file, where a genuinely under-linked file stands out against the host-provided mass."
since = "0.4.0"

