reason = "Fix-and-diverge: the call pattern is anchored at the start, so the charged symbol must BE mktemp (optionally @GLIBC-versioned), not merely end with it. The reference builds the pattern with create_regexp_call('mktemp') and searches it over symbol names (BinariesCheck.py at the pinned reference commit), so every symbol ending in mktemp matches: project-private wrappers are charged as calls to the libc mktemp they are not. Measured A/B over the net-snmp binary family plus apr, gretl, gnunet, radare2, ksh and glibc corpus RPMs (11 RPMs, isolated config): call-to-mktemp 16 -> 2, zero findings added, all other findings identical; every removed row's trigger symbol was readelf-verified as a wrapper name -- netsnmp_mktemp (libsnmp45, 4 files), apr_file_mktemp, gretl_mktemp (4 files), GNUNET_DISK_mktemp, r_syscmd_mktemp (2 files), b_mktemp (ksh libcmd/libshell). The survivors are genuine: glibc's libc.so.6 defining mktemp@@GLIBC_2.2.5 and ksh's libast carrying mktemp. The wrapper population is the one the #852 entry counted inside its remaining 74 (23 undefined-reference files naming a wrapper, plus defined-match wrapper files among the 28 linked objects); those no longer fire."

