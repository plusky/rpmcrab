[[divergence]]
case = "global"
check = "missing-PT_GNU_STACK-section"
kind = "behaviour"
reason = "Deliberate divergence: missing-PT_GNU_STACK-section is not charged on a linked image whose e_machine belongs to a different ISA family than the package architecture. Word-size variants of one instruction set share a family (EM_386 with EM_X86_64, EM_PPC with EM_PPC64, EM_SPARC with EM_SPARCV9); an unclassified machine or an unmapped package arch is never foreign, so the charge stands there. The reference charges every linked image whose programme headers carry no GNU_STACK entry, whatever machine the image was built for; for guest firmware and cross payloads -- an OpenBIOS image for SPARC guests, a U-Boot ROM for a PPC guest, an ARM helper image -- the package arch's dynamic linker never loads the file, so the missing header states nothing about how it was linked. Measured on the live Factory snapshot (download.opensuse.org, 52,984 packages; the corpus audit's population restated exactly with a pristine build): 15 E over 9 packages / 8 sources -> 11. The four silenced are qemu-extra's openbios-sparc32 (EM_SPARC) and openbios-sparc64 (EM_SPARCV9), qemu-ppc's u-boot.e500 (EM_PPC) and picotool's xip_ram_perms.elf (EM_ARM). The eleven that keep firing are host-family linked images: e3's /usr/bin/e3, afl's small_exec.elf testcase and hibiscus' libtowitoko-2.0.7.so (EM_386), the hare toolchain's hare and haredoc, rr's librrpage.so and librrpage_32.so, hibiscus' FreeBSD-OSABI libhbci4java-card-freebsd-64.so and xen's three hypervisor images (EM_X86_64). Pinned by the foreign-machine tests in binaries.rs."
since = "0.4.1"

