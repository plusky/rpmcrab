reason = "New port-only Warning: an x86_64 ET_EXEC/ET_DYN binary whose .note.gnu.property GNU_PROPERTY_X86_FEATURE_1_AND does not carry both the IBT and SHSTK bits and whose .text contains no ENDBR64 instruction emits W missing-cf-protection. The reference has no such finding; the port's hardening coverage is the four findings ledgered under rpmcrab#17, plus this one. openSUSE %{optflags} carry -fcf-protection on x86_64, so both records are present on C/C++ code built with the distribution flags. Scope follows the sibling C hardening findings under rpmcrab#17: archives, Go and Zig binaries and debuginfo files are skipped by the same gates as missing-fortify, and Rust, Haskell and OCaml binaries stay quiet because those toolchains emit neither the property nor ENDBR64 for their own code. The rpmcrab#447 applicability narrowing is not applied in its import-threshold form: a count of fortifiable libc imports says nothing about whether this flag reached the code, so the applicability evidence here is the ENDBR64 record itself. Noise audit over the Factory corpus (51,589 RPMs; 69,894 x86_64 ET_EXEC/ET_DYN ELFs): 59,022 (84.4%) carry both bits, 10,845 (15.5%) carry no FEATURE_1_AND at all, 27 carry exactly one bit and none carries a present-but-zero value. FEATURE_1_AND is the bitwise AND over all link inputs, so one input carrying no property (hand-written assembly, a prebuilt object) clears it for the whole binary; the merged note is what ld -z cet-report reports on. Of the 9,664 no-property ELFs outside the Go and debuginfo gates, 9,551 (98.8%) carry an ENDBR64 record in .text — the record is applicability evidence, not attribution: it shows the flag reached some of the code, not which link input contributed it (flag-built CRT glue lands in .text too) — as do all 27 one-bit ELFs (the asm-heavy FFmpeg family, whose assembly inputs carry SHSTK-only properties); 3 carry a compiler .comment but no ENDBR64 and 110 show no compiled-code evidence at all, the identified members of both residue classes being prebuilt upstream objects and legacy-toolchain (gcc7) libraries. Run over the corpus, a property-only predicate fired on 7,012 files in 715 source packages; with ENDBR64 absence also required, 98 files in 13 source packages remain (Free Pascal and gcc7 toolchain binaries, prebuilt objects), each a binary whose property lacks at least one feature and whose .text holds no ENDBR64 record. The residue classes above sum to 113 files; the 15-file difference is the gates the audit scanner did not model: six Go binaries it recognised only by the buildid note (the checker also accepts .gopclntab), one Rust and one Zig binary (the language gates), four files in noarch packages (ELF checks do not run there) and three vDSO images in bzip2-compressed kernel packages the checker could not open at audit time (bzip2 payloads are decoded since the bzip2 extraction work). A FEATURE_1_AND entry that is present but truncated or undersized counts as unreadable, not absent. Warning only: the gap is a hardening gap, not a demonstrated defect. Pinned by unit tests in binaries.rs."
