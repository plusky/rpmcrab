[[divergence]]
case = "global"
check = "arch-dependent-file-in-usr-share"
kind = "behaviour"
reason = "The reference charges arch-dependent-file-in-usr-share on every binary-class file under /usr/share in an archful package, without asking what the file's bytes are for. rpmcrab takes positive evidence of foreign-target payload instead, judged against the package's own architecture (the ISA-family helpers shared with executable-stack: word-size variants of one instruction set share a family; an unclassified machine or an unmapped package arch is never foreign, so the charge stands there): an ar archive with no ELF members whose payload members are all text, an archive whose ELF members are all for foreign machines, or a bare foreign-machine ELF is not charged, because such a file is byte-identical in every architecture build of the package, so the arch-independence /usr/share exists to provide is not broken by it. A binary non-ELF archive member is not evidence (its target cannot be classified) and keeps firing. For the MPLIB dialect (the gplib archives SDCC ships for its pic14/pic16 targets) the archive cannot be walked as GNU ar, so the evidence is the gplib structural validator ledgered under ar-failed: strict member framing chaining exactly to EOF with PIC COFF object members, which proves the archive carries no ELF members. Host-family ELFs (for the package's arch), host-member archives, archives that parse neither way and files whose machine cannot be determined keep firing. Measured on the x86_64 Factory corpus (51,589 RPMs, BinariesCheck, isolated config; the pristine build restates the baseline exactly; the sweep builds are x86_64, so the counts are x86_64 counts): 532 E -> 41 E. The 491 silenced are exactly the foreign-target population: 482 sdcc archives (GNU-ar text-object and MPLIB dialects) and the afl testcase archive (a text member), plus 8 foreign-machine ELFs (qemu-extra and qemu-ppc guest firmware, picotool's ARM device payload). The 41 that keep firing are host-family code in /usr/share (39), ImHex-devel's host-member archive and afl's EM_386 testcase. No finding was added and no other BinariesCheck finding changed on the whole corpus. Pinned by the usr_share_* tests in binaries.rs, including the non-x86 host pins (an AArch64 ELF in an aarch64 package, and an archive carrying one, keep firing)."
since = "0.4.1"
