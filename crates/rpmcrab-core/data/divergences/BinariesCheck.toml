[[divergence]]
case = "global"
check = "call-to-gets"
kind = "behaviour"
reason = "New `call-to-gets` error with no reference counterpart (rpmcrab#972): an undefined reference to gets charges the defining call of CWE-242 \u2014 gets reads a line into a caller buffer with no length bound, was removed from C11 and POSIX.1-2024, and survives in glibc only as a binary-compatibility symbol. The predicate charges undefined references only, in archives and linked objects alike, and never definitions: glibc's libc defines gets and stays silent, because the provider is not a caller \u2014 the definition-is-not-a-call line of the #852 mktemp scoping, applied to every object kind. The anchored pattern keeps the bounded neighbours silent (fgets, gets_s, getline), and the fortified __gets_chk, whose bound is checked at the call, is a different symbol and does not match. Measured over the full Factory corpus (51,586 binary RPMs): zero findings, and an independent readelf census (8,776 ELF files across a stratified sample of 3,969 RPMs plus every libc-bearing package) found no undefined gets reference anywhere, and gets definitions only in glibc's own libc.so.6, host and cross sys-roots alike; the population is empty today and the finder ships as a tripwire at the family's no-safe-use error, since no safe use of gets exists. Its staged description lives in crates/rpmcrab-core/data/descriptions/BinariesCheck.toml."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/972"

[[divergence]]
case = "global"
check = "call-to-tmpnam"
kind = "behaviour"
reason = "New `call-to-tmpnam` error with no reference counterpart (rpmcrab#972): an undefined reference to tmpnam, tmpnam_r or tempnam charges the CWE-377 name-to-open race the sibling call-to-mktemp charges for mktemp — the names hand back a path a later open follows, so the file a caller ends up with is never provably the file the name was minted for, and glibc's linker warns the family is dangerous whenever a link unit references it. The predicate charges references only, in archives and linked objects alike, and never definitions: the library implementing the family is the provider, not a caller (glibc's libc.so.6 defines all three names and stays silent) — the definition-is-not-a-call line of the #852 mktemp scoping, applied to every object kind, so family completion does not import the defined-match charge the mktemp tightening removes. Measured over the full Factory corpus (51,586 binary RPMs): 38 findings in 33 binary packages from 28 source packages, every firing file independently classified with readelf — each carries an undefined reference to a family name with a call relocation (36 PLT jump slots; clisp's two files bind the names by address for their foreign-function interface), no definition site fires, and the family has no safe-use shape (the functions return a name, never a descriptor). Error, ungated, like mktemp. Its staged description lives in crates/rpmcrab-core/data/descriptions/BinariesCheck.toml."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/972"

