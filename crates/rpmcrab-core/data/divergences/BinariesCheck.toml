[[divergence]]
case = "global"
check = "BinariesCheck"
kind = "behaviour"
reason = "rpmcrab#17: checksec-style binary-level hardening verification via ELF inspection, which the frozen reference lacks. Four new Warning findings: `missing-fortify` (at least three distinct fortifiable libc imports but no `__*_chk` symbols), `missing-stack-protector` (no `__stack_chk_fail` on a binary that is not a pure dynamic-loader shim), `missing-relro` (no GNU_RELRO segment) and `partial-relro` (GNU_RELRO without BIND_NOW). They verify the effective artifact state instead of the compile flags, so silent downgrades (e.g. `-fstack-protector` appended after `%{optflags}` downgrading strong to basic SSP) are caught. The SSP check is presence-only: basic and strong SSP both emit `__stack_chk_fail`, and telling them apart needs per-function canary-coverage analysis. PIE needs no new finding: `non-position-independent-executable` / `position-independent-executable-suggested` already cover it for executables. Deliberate emission-direction divergence on captured cases (the reference emits none of these): `liblto21` gains exactly one port-only line `W: missing-fortify /usr/lib64/libLTO.so.21.1` (warnings 0->1), pinned by `hardening_captured_cases_pin_new_lines`; `llvm21-gold` gains none, because `LLVMgold.so` imports only two distinct fortifiable functions (`memcpy`, `snprintf`), below the rpmcrab#529 threshold. Gate scope: the check skips ar archives and Go binaries entirely (the Go toolchain emits none of these C-hardening artifacts, so every finding would be noise; Go detection covers both `.note.go.buildid` and the universal `.gopclntab`, since some builds lack the former); static binaries (no PT_DYNAMIC) skip the RELRO checks, as BIND_NOW is meaningless without a dynamic linker; AMDGPU code objects (e_machine EM_AMDGPU) skip both RELRO checks as well (rpmcrab#509): the GPU runtime loads them into GPU memory, the host dynamic linker never processes them, and the amdgcn link emits no FLAGS for BIND_NOW to attach to; they reach the block only through a vestigial PT_DYNAMIC whose GNU_RELRO covers exactly the dynamic section; Since 0.3.0 (rpmcrab#447) the two compile-time findings fire only when the binary has something to protect: `missing-fortify` requires at least three distinct fortifiable libc imports, and `missing-stack-protector` stays quiet for pure dynamic-loader shims (undefined imports limited to dlopen/dlsym/dlclose/dlerror/dladdr plus CRT boilerplate). Since rpmcrab#452 `missing-stack-protector` additionally requires at least one SSP-relevant import (the string/memory calls a stack canary exists to guard, formatted output into caller buffers, unformatted input, `alloca`, and the raw buffer fills: the read/recv families in their plain, positioned and vectored/message forms and the caller-buffer path functions `readlink`/`readlinkat`/`getcwd`/`getwd`/`realpath`; fortified `__*_chk` spellings count as their plain call); stdio buffered readers (`fread`, `fgets`) are deliberately not SSP-relevant. `missing-fortify` and `missing-stack-protector` additionally skip Rust, Zig, Haskell and OCaml binaries (rustc implements neither `_FORTIFY_SOURCE` nor default stack-protector instrumentation; detection combines `.rustc` section, Rust runtime symbols, `.debug_gdb_scripts` content and `.rodata` panic strings, conservative by design; Zig likewise emits neither, and `-fstack-protector` requires libc which the default static Zig build does not link; detection via `.comment` ziglang marker and `.rodata`/`.data.rel.ro` unreachable string; GHC and ocamlopt likewise emit neither for Haskell and OCaml code, rpmcrab#525; Haskell detection via `libHS*` DT_NEEDED/DT_SONAME, OCaml via defined (not merely imported) `caml_startup` / module-qualified `caml` symbols of generated code; OCaml detection is conservative by design, while Haskell detection is conservative only in the miss direction: a C host embedding Haskell links `libHSrts` too and is skipped as a known limitation (see the rpmcrab#525 entry)), while the linker-level RELRO checks still apply to Rust, Haskell and OCaml (Zig is fully skipped: its linker emits no GNU_RELRO either, verified on bun, opencode and waylock). Separate debuginfo files are skipped entirely (never executed or loaded by the dynamic linker; `.debug` name suffix or `/usr/lib/debug/` path). Only runs on ET_EXEC/ET_DYN ELFs. Provenance: `crates/rpmcrab-core/data/descriptions/BinariesCheck.toml`."
since = "0.1.0"
upstream = "https://github.com/plusky/rpmcrab/issues/17"

