reason = "Fix-and-diverge: macro-in-comment errors on every unescaped macro mention in a comment - plain references (%name, %{name}, %{?name} and the bare conditional forms %?name / %!name, whose sigil is consumed before the name is judged) alongside the effectful expansions (shell %( ... ), Lua %{lua:...}, macro-file %{load:...} forms and the executing directives bare (%define, %global, %undefine, %lua, %load) and braced (%{define:...}, %{global:...}, %{undefine:...}, %{error:...}), including forms an enclosing %{expand:...} makes live by re-expanding escaped %% runs - because rpm expands macros on a comment line before treating it as a comment, and an expansion that runs to several lines leaves only its first line commented while the tail becomes live spec text or shell (plusky/rpmcrab#1026). Spec-syntax keywords (section headers, %files directives, conditional keywords) are not macro mentions, the conditional-with-text form %{?name:text} and plain mentions in its text stay quiet, while effectful expansions nested in its text are reported (rpm expands a taken branch's text: on rpm 4.20.1 the %{error:...}, %{lua:...} and %(...) forms nested in %{?name:...} execute when the guard macro is defined and never when it is not, and taken-ness is not decidable from the comment line), %% escapes stay quiet, and comment detection is quote-aware. The frozen 2.10.0 reference warns on any macro occurrence in a comment."
since = "0.4.1"

