check = "SpecCheck"
kind = "behaviour"
reason = "Fix-and-diverge (issues #751, #762): `deprecated-grep` fires only where `egrep`/`fgrep` stands in command position — at line start, or behind whitespace, a path slash, a quote, `(`, a backtick, a backslash, or one of `;`, `|`, `&` — and the name ends the token, so no word character, `.` or `-` follows it. The reference (`SpecCheck.py::_checkline_deprecated_grep`) matches the bare token `\\b[ef]grep\\b`, so it also fires on text that invokes no grep command at all: the findutils regex dialect name in `find -regextype posix-egrep` (util-linux %install, the case that surfaced this), a dotted data file like `foo.egrep`, a hyphenated helper like `my-egrep-helper`, a longer name like `egrep-helper` or `egrep.foo` at command position, and an assignment value like `FOO=egrep` or `--with-grep=fgrep`. The check's description targets direct use of grep as egrep or fgrep; genuine invocations — including the backslash-escaped alias-bypass spelling `\\egrep` — fire at the same W level with the identical detail rendering."
