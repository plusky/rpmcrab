check = "hardcoded-prefix-tag"
kind = "missing"
reason = "Deliberate removal per triage: Prefix: is the singular alias of the Prefixes: tag, RPM's relocation prefixes (rpm --relocate); rpm-spec(5) documents it with a literal-path example, and the reference flags any literal path in it at W (SpecCheck.py). openSUSE's shipped rpmlint config filters the finding, and Fedora's carries the line commented out, so Fedora emits it. Relocatable-prefix packages are not a Factory form, so the port does not emit it. The reference still emits it."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/blob/main/rpmlint/checks/SpecCheck.py"

