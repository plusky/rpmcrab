[[divergence]]
case = "global"
check = "SpecCheck"
kind = "behaviour"
reason = "`invalid-spec-name` judges a source RPM's payload spec file against two names: the source RPM's header name, and the names the spec's own preamble can produce — its `Name:` declarations expanded against the macro definitions in effect at each declaration. OBS names multibuild flavour source RPMs after the build job — util-linux-systemd, python-libmount and ImageMagick-config_open all carry the base package's spec file, a name the declarations produce — so the reference's header-name comparison alone (SpecCheck.py:176; its `pkg.name` is likewise the header tag) fires an Error on a self-consistent spec and fails the flavour build, where rpmcrab stays quiet. A file named after the header stays quiet, as under the reference; the finding fires only when the file matches neither name. A source carrying several spec files fires only when none of them is consistent on either ground, and the spec checks then run on the first readable file the header names, else the first readable one a declaration names, else the last readable one; a payload file that cannot be opened is judged on the header ground alone. The expansion reads the preamble the way rpm evaluates it: rpm itself evaluates the branch conditions when it builds, so a built package carries exactly one branch's name, while the lint evaluates no condition, so the declarations and definitions of every conditional branch count and the accepted set is the union over all branches. Within that reading a definition takes effect from its own line on and a definition below the `Name:` line is not in effect at it; a `%undefine` removes a macro's earlier definitions, and one inside a conditional branch removes them for that branch's reading only, so the defined and undefined readings both count; a definition after a branch `%undefine` re-establishes the macro and ends the undefined reading only when it sits outside the branch, at a strictly shallower depth — one at the branch's own depth may sit in a sibling or `%else` branch whose readings never met the undefine, and one deeper inside a nested branch may not run where the undefine's did, so both leave the undefined reading in place. A macro counts as defined when a `%define` or `%global` before the declaration gives it a body — a parametric definition defines a function, not a value, and a body that opens with a parenthesis is the literal text it spells — and `%{nil}` expands to nothing; a `%{...}` group with an empty name is not expanded and counts as literal text. A macro with no such definition contributes an unconstrained segment. Only a wholly unconstrained pattern constrains nothing and is set aside: a declaration that still pins literal text constrains the name to that text, so `Name: foo%{undefined}` accepts `foo` and every name it anchors. The header-name comparison decides when no declaration constrains the name — a preamble declaring no `Name:` at all, every pattern set aside, an expansion past the pattern cap of 64 alternatives or the expansion depth cap of 8 — as it does for the declarations the scan cannot reach: the scan reads the main preamble and stops at the first section header — a header word matches on a word boundary, so a longer directive token such as `%files-foo` is preamble content, not a section — so `Name:` declarations in subpackage preambles behind a section header are outside the accepted set and the header ground judges those files."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/750"

[[divergence]]
case = "global"
check = "SpecCheck"
kind = "behaviour"
reason = "Port-only licence-marking findings (#821): license-file-as-doc (W) fires per %files section whose unqualified %doc line carries a licence token while no %license line in the section carries an entry, and no-license-file-in-spec (E) fires when no %files section carries a licence file under %license, under %doc, or as a plain entry and none is installed by a literal install/cp copy in %install into a documentation directory a %files section ships (#833), and the shipped set is textually decidable. The E stays silent on the shapes a text scan cannot judge: sections served by -f list files or generator macros, braced or unbraced; %doc directory arguments and %doc globs whose literal prefix reaches no licence stem, whose contents %install fixes rather than the spec text (#831, #832); build-metadata (dist-info/egg-info) entries and gem/wheel sources, whose installers assemble the installed tree; public-domain-only License tags; specs with no archive source; and documentation-only packages. Presence accepts the licence names in use beyond the conversion predicate: suffixed, abbreviated, prefix-joined, brace-grouped and globbed names, and the Debian copyright file. The reference grades the License: tag string (TagsCheck) and the shipped files (FilesCheck); licence marking in the spec is outside its surface -- its flags module defines RPMFILE_LICENSE and nothing reads it, and its SpecCheck has no %files licence test. The %doc predicate is spec-cleaner's conversion predicate (re_doclicense with the re_file_qualifier exemption), so the warning names exactly the shape spec-cleaner rewrites automatically. Pinned by tests in spec.rs."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/821"

[[divergence]]
case = "global"
check = "rpm-buildroot-usage"
kind = "behaviour"
reason = "Fix-and-diverge (issue #867): in %build and %prep, rpm-buildroot-usage is not charged on a line whose buildroot references all lead the value of an assignment -- a name= pair (DESTDIR=, destdir=, any variable or macro-definition payload name) or a configure-style --name option in its = or space-separated form. In those sections the buildroot is the install destination, and a reference in that position hands it to the build system as a path parameter the build consumes: the make DESTDIR staging idiom, Module::Build's destdir, configure's --prefix/--temproot/--buildroot and directory options, and variable assignments naming staged paths. Scriptlet sections keep the charge in every form -- a scriptlet runs on the installed system, where the buildroot does not exist -- and %install sits outside the finding's sections, as before. The reference charges every reference in scriptlets, %prep and %build alike, with no assignment scoping. The credit is judged per reference, so a line mixing a credited reference with an uncredited one still fires. Measured on the Factory corpus (sweep run-20261022-857d5ece population; the 22 affected source packages re-measured before and after with scan.py, the before side reproducing the sweep's 46 E exactly, all 1,244 findings in those packages compared, none added and no other finding changed): 46 E in 22 source packages before, 25 E in 9 after. Silenced (21): the DESTDIR lines of git, git-cola, latex2rtf (2) and sgmltool's make install line; frozen-bubble's destdir; rabbitmq-server's %global argument line (DESTDIR and DOC_INSTALL_DIR both lead values there); paexec's %prep %define (DESTDIR); the configure-option lines of chezscheme (--temproot), dvdisaster (--buildroot), fastjet-contrib and sgmltool (--prefix) and liblockfile (--prefix, --bindir, --mandir, --libdir, --includedir; 5); the Build.PL --prefix lines of perl-DateTime-Format-DateParse and perl-Encode-Detect (the $RPM_BUILD_ROOT spelling); and tetrinet-server's INCLUDE_DIR/LIB_DIR environment assignments prefixing its configure invocation ($RPM_BUILD_ROOT). The residue (25) keeps firing: the scriptlet arm in full (ibus %postun 9, rsyslog %post 2 -- buildroot references in shipped scriptlets are genuine defects) and 14 %build references that lead no assignment value: fipscheck running its just-installed tools from the buildroot (3), yast2-theme performing its install inside %build with mkdir and make-symlinks over buildroot paths (6), civetweb's CMAKE_INSTALL_DATADIR define inside CFLAGS (the reference sits behind a -D name inside a flags value and leads no assignment), jboss-logging-tools running %fdupes over the buildroot tree, orthanc-dicomweb's dir command on the buildroot, sgmltool's PATH suffix (the %buildroot spelling appended after $PATH:, so the reference does not lead the assignment's value) and bsd-games echoing the buildroot as an answer to its interactive configure (the destination semantics are real but the form is an echo, so it stays charged rather than growing an echo heuristic). The spellings the population uses are %{buildroot}, $RPM_BUILD_ROOT and %buildroot, and the fix scopes the check's existing spelling set without widening or narrowing it. Pinned by rpm_buildroot_usage_install_assignment_idiom_is_quiet, rpm_buildroot_usage_non_assignment_forms_still_fire and rpm_buildroot_usage_install_section_is_quiet in spec.rs."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/867"

