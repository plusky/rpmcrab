kind = "detail"
reason = "When the spec parser fails in _check_invalid_url and the rpm child query has not already reported that fatal failure (a non-zero child exit or its 'can't parse' summary) with a specfile-error finding that survived the filter, rpmcrab reports 'specfile-error' with only the spec path as detail; a surviving non-fatal child finding does not suppress the fallback (the specfile-error behaviour entry states the full condition). The reference also includes librpm's error text, which librpm 0.6's Spec::parse does not surface (it returns Option)."
since = "0.1.0"

[[divergence]]
case = "global"
check = "specfile-error"
kind = "behaviour"
reason = "A spec parse failure is reported once: when the rpm child query in _check_specfile_error has already reported that fatal failure (a non-zero child exit or its 'can't parse' summary) with a specfile-error finding that survived the filter, the parse failure in _check_invalid_url does not add its fallback finding, whose detail is only the bare spec path. One exception: an undecodable child stderr is an encoding failure of the child's output, not a report of the parse failure: _check_specfile_error reports it as its own specfile-error finding (the decode error as detail) and returns as unreported, so the fallback fires alongside it. The reference reports both. In the #702 census of the 20261018 Factory sweep, this path produced 13,839 specfile-error findings: 6,920 bare-path fallbacks against 6,919 child summaries. The fallback fires at most once per spec parse, and the counts reconcile per spec: the fallbacks sit on 6,920 distinct specs. The 6,919 in the parseable outputs span 6,815 source packages, 13 of which carry more than one failing spec (gcc14, gcc15 and gcc16 with 27-28 each, kernel-source with 16, nine more with 2-3; 104 fallbacks beyond the first per package), and the remaining fallback is bash's, counted from one of the sweep's two JSON-polluted outputs, whose package sits outside the 6,815. All but one fallback pair with a child summary for the same spec, so 13,838 findings are one failure reported twice; the exception is antlr, whose child reported warnings only, so its fallback stands alone."
since = "0.3.0"

