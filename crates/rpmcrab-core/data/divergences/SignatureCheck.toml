# Divergence ledger entries owned by `SignatureCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "SignatureCheck"
kind = "behaviour"
reason = "Signature verification runs in-process through librpm (a verified `PackageHeader::from_file` read against the rpmdb keyring, with the verification flags masking the digest checks \u2014 a deliberate flag difference from `rpm -Kv`, whose default flag set verifies the digests as well) where the reference shells out to `rpm -Kv` and scrapes its output (SignatureCheck.py; pkg.py). Verdicts come from the structured result; the `unknown-key` key ID is read from the signature packet's issuer subpacket, falling back to the issuer-fingerprint subpacket when the packet carries no issuer subpacket (the key ID is that fingerprint's low 64 bits), and is formatted as the low 32 bits, as `rpm -Kv` prints it; a verification failure is reported as `invalid-signature` only when a signature packet is itself unparsable \u2014 a parseable signature that fails verification, and digest failures, stay silent, matching the reference's text patterns. The library and keyring configuration are the same ones `rpm -Kv` uses, so findings agree; parity is pinned by the fixture pin matrix (the unsigned, signed, corrupt-packet, bad-math, broken-payload and bad-digest fixture RPMs, each generation-checked against empty and key-holding rpmdb states, together with the v6 OPENPGP-container fixtures (container-only, classic-tag control, mixed classic+container and dual-signature forms, generation-checked the same way against an rpm 6 `rpm -Kv`) and a Factory-corpus before/after diff (plusky/rpmcrab#704))."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/704"

[[divergence]]
case = "global"
check = "SignatureCheck"
kind = "behaviour"
reason = "Signature packets are parsed with sequoia-openpgp's packet parser, whose reading of three non-conformant encodings is stricter than the in-crate parser it replaced: a signature packet relabeled to version 5, an old-format packet carrying the indeterminate length form, and an MPI whose declared bit length exceeds the value's actual bit length all classify as unparsable, and so does an issuer-fingerprint subpacket whose fingerprint is shortened below the full fingerprint \u2014 the fingerprint fallback reads the key ID from the fingerprint's low 64 bits, so a shortened fingerprint carries no complete key ID to fall back to. A package whose verified read reports NoKey or Fail and whose signature packet uses one of these encodings therefore reports invalid-signature, where the replaced parser extracted the issuer and reported unknown-key (NoKey) or stayed silent (Fail). No signer emits these encodings; the stricter parse is the correct reading, adopted as a deliberate tightening (plusky/rpmcrab#779, finding D5)."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/779"

[[divergence]]
case = "global"
check = "no-signature"
kind = "missing"
reason = "Deliberate removal: the port does not emit this finding -- it is suppressed by both the openSUSE and Fedora distro configs. Koji signs after the build, so every build-pipeline RPM is unsigned at lint time and the finding can never be actionable there. The supported flavors are SUSE (openSUSE/SLFO, P1) and Fedora (P2); the generic/no-overlay flavor is not a supported use case, so its continued emission there is not a reason to keep the finding. The emission, its staged `--explain` entry, and the dedicated tests are removed; a negative pin in the SignatureCheck tests keeps the absence pinned under `cargo test`. The reference still emits it."
since = "0.1.0"
