reason = "Staged `--explain` text for `kmp-missing-supplements` prescribed the `packageand(kernel-%1:%name)` form. The check accepts both spellings (verified in `checks/kmp_policy.rs`), and `packageand()` is the obsolete zypp syntax the `suse-zypp-packageand` finding flags everywhere else, so the text now prescribes the rich boolean form: `Supplements: (kernel-%1 and %name)`."
