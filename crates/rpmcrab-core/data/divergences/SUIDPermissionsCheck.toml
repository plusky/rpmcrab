[[divergence]]
case = "global"
check = "SUIDPermissionsCheck"
kind = "detail"
reason = "Staged `--explain` text for `permissions-missing-requires` prescribed 'PreReq: permissions', contradicting the `prereq-use` text, which deprecates PreReq and steers to phase-qualified Requires. The text now prescribes 'Requires(post): permissions' -- the phase whose scriptlet runs permctl (%post, via %set_permissions) -- and records that 'Requires(pre): permissions' satisfies the requirement the same way; the finding's detail line follows, reading \"missing 'permissions' in Requires(post)\" in place of the reference's \"missing 'permissions' in PreReq\" (the changed line is visible in the w6-filelist parity case). The predicate is unchanged: the header loader (`gather_requires`) splits the phase-flagged Requires -- Requires(pre), Requires(post), Requires(preun), Requires(postun) -- and every legacy PreReq into the `prereq` set the check reads, so both spellings already satisfied it; entries carrying no PREREQ_FLAG bit stay in `requires`, so Requires(verify), the pretrans/posttrans phases and trigger dependencies do not satisfy it, and a bare Requires names no phase and still fires (the split is pinned at the loader by `split_requires_moves_only_prereq_flagged_entries`; the check-side verdict by `missing_requires_only_when_absent`, which sets `prereq` directly). Factory spec corpus at the time of the change, occurrences/files naming the permissions package: Requires(post) 50/43, Requires(pre) 42/38, Requires(verify) 15/12 (counted for scale; they stay in `requires` and do not count toward the predicate), PreReq 23/20, bare Requires 3/2."
since = "0.4.1"


[[divergence]]
case = "global"
check = "permissions-incorrect"
kind = "severity"
reason = "Tom's ruling (2026-10-27): the reference judges the packaged mode against the secure permissions profile alone and reports every mismatch at error level. rpmcrab verifies against the secure composition the same way — for level secure, the `permissions` files from /usr/share/permissions and /etc replaced per path by the `permissions.secure` files from both bases — as extended and overridden by the package's own per-package drop-ins (`permissions.d/`, `packages.d/`): the drop-in-extended secure baseline. It also composes the other shipped profiles file-for-file the same way — for each level L in {easy, paranoid}, both `permissions` bases replaced per path by the `permissions.L` files from both bases — but WITHOUT the drop-ins, which are the package's own registration statement, not a shipped profile. A malformed easy/paranoid file is skipped instead of aborting the run: the reference never reads those profiles, so their parse failures cannot fail a run the secure data would have carried. The demotion has a secure-mismatch precondition: it is consulted only for a finding that fires against the secure baseline entry — packaged values matching the secure entry exactly fire nothing, at any level. When it fires and the packaged mode AND owner — the owner compared as the single user:group string — exactly match another profile's entry for the path (honouring :package: scoping; easy is consulted before paranoid and wins when both match), the finding reports at warning level instead of error, its detail gaining the verbatim suffix ` (matches the easy profile)` or ` (matches the paranoid profile)` naming the matched profile (the companion behaviour entry attributes that detail change). A mismatch with every shipped profile stays an error, the verdict itself is unchanged, and the demotion is scoped to the two exact-verification findings only — permissions-incorrect and permissions-incorrect-owner; every other finding of the family (permissions-fscaps, the setuid-bit verdicts, the missing-* demands) keeps its level. Measured pristine vs patched, SUIDPermissionsCheck only, over the full Factory corpus (51,589 RPMs) with the corpus's own permissions package build 1699_20260917 installed at the host paths: 22 findings before and after, the only movement permissions-incorrect from 5 E to 2 E + 3 W — the demoted three are in the binary packages physlock and policycoreutils-newrole (matching easy) and selinux-sandbox (matching paranoid); the binary packages 389-ds and cockpit-ws match no profile and stay E — and no other finding of the check family moves. Pinned by the secure_exact_match_stays_silent, easy_exact_match_demotes_both_tags_to_warning, paranoid_exact_match_demotes_both_tags_to_warning, mode_only_demotion_when_owner_matches_secure, owner_only_demotion_when_mode_matches_secure, easy_wins_when_both_other_profiles_match, no_profile_match_stays_error, near_miss_mode_match_only_stays_error, near_miss_owner_match_only_stays_error, other_profile_match_honours_package_scoping and malformed_non_secure_profiles_are_skipped tests in suid_permissions.rs (mutation-verified: match disabled fails the demotion tests; match relaxed to mode-only or owner-only fails the corresponding near-miss test)."
since = "0.4.1"

[[divergence]]
case = "global"
check = "permissions-incorrect"
kind = "behaviour"
reason = "Companion to the permissions-incorrect severity entry: exactly when that rule demotes the finding, rpmcrab also changes its detail — the reference's detail (`<path> has mode 0<mode> but should be 0<mode>`) gains the verbatim suffix ` (matches the easy profile)` or ` (matches the paranoid profile)`, naming the matched profile. The suffix is part of the demotion, not a separate verdict: it appears exactly when the level drops to warning and never on an error-level finding. Because the parity runner pairs a severity difference only when subject, name AND detail are identical, a demoted finding cannot pair as a pure severity difference; this entry attributes the detail difference (and the demoted shape's only-in-reference / only-in-rpmcrab halves). Pinned by the demotion tests in suid_permissions.rs, which assert the rendered line ends with the verbatim suffix."
since = "0.4.1"

