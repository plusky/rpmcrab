# Divergence ledger entries owned by `SUIDPermissionsCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "SUIDPermissionsCheck"
kind = "detail"
reason = "Drop-in `permissions-parse-error` message texts are paraphrased rather than byte-identical to the reference's wordings; central-profile parse errors abort the run like the reference constructor, emitting no finding."
since = "0.1.0"

[[divergence]]
case = "global"
check = "SUIDPermissionsCheck"
kind = "behaviour"
reason = "Deliberate improvement over the reference: drop-in profile application order follows package file order (insertion-ordered set) instead of the reference's nondeterministic Python `set` iteration (measured 7/12 vs 5/12 across 12 runs on a two-drop-in fixture), so `permissions-incorrect` no longer depends on hash seed. No upstream issue covers the ordering."
since = "0.1.0"

[[divergence]]
case = "global"
check = "permissions-file-setuid-bit"
kind = "behaviour"
reason = "Fix-and-diverge (issue #868): the setuid/setgid verdicts (permissions-file-setuid-bit and permissions-directory-setuid-bit, one predicate over the mode bits 0o4000 and 0o2000) are emitted only when at least one central permissions profile was read at construction — the profiles this check's registration set is built from (/usr/share/permissions/permissions{,.secure}, /etc/permissions{,.secure}). The reference's SUIDPermissionsCheck reads the same host paths and reports every setuid/setgid file the loaded data does not name, so on a host without the profiles installed it reports the distro's canonical registered set exactly as the unmodified port did; 'unregistered' is a claim about that data and is undecidable without it. A profile that reads as empty still establishes the set, so an unlisted setuid file fires whenever data was read, exactly as before. Per-package drop-ins extend the set — a file a drop-in registers is verified against it in every data state — but they do not establish it: the registrations that acquit the canonical set live in the central data (exim is the corpus shape: a package shipping its own drop-in plus /usr/sbin/exim, which the central profiles register). Packaged capabilities keep reporting in every data state, that verdict being decidable from the package alone, and registered files keep their exact verification: a packaged mode differing from the registered one reports permissions-incorrect, so a mode exceeding the registration fires as before. Measured on the Factory corpus (sweep run-20261022-857d5ece population; the 38 affected source packages re-measured before and after): in the sweep environment (no profiles installed) permissions-file-setuid-bit 51 E in 35 source packages and permissions-directory-setuid-bit 3 E before, 0 of either after, the consequent permissions-missing-verifyscript (2, ceph and dbus-1) and permissions-missing-postin (1, ceph) demands falling with them and no other finding changed (9,695 to 9,638 findings over the 38 packages). With the corpus's own Factory profiles installed (permissions 1699_20260917, the build the corpus carries) the fixed build's findings are identical to the pristine build's across the same 38 packages (8,300 findings, zero deltas): no setuid-bit finding fires in either, and the family's residue is the verification path working as intended — physlock packaged 04750 root:trusted against a registered 0755 root:root (permissions-incorrect, permissions-incorrect-owner), policycoreutils-newrole packaged 04755 against a registered 0755 (permissions-incorrect), and dbus-1-daemon missing %verify_permissions for its registered launch helper (permissions-missing-verifyscript). Pinned by the no_data_loaded_setuid_bits_are_silent, no_data_loaded_capabilities_still_reported, read_but_empty_profile_still_reports_unlisted, dropin_read_alone_keeps_no_data_state, new_with_no_profiles_reads_no_data and unlisted_setuid_bits_reported tests in suid_permissions.rs; mutation-verified in both directions (gate removed: the no-data pins fail; mode comparison made vacuous: incorrect_mode_and_owner_reported fails)."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/868"

