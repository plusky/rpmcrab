# Divergence ledger entries owned by `config-scoring`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "config-scoring"
kind = "behaviour"
reason = "A `[Scoring]` value Python `int()` would reject (a garbage string, an array, a table) crashes the reference with ValueError when the scored finding is emitted; the port's panic-to-match surfaced as a bogus 'librpm could not decode the package' fatal. The port coerces and validates every Scoring value at Filter construction and rejects the configuration with a clean error naming the check and the value (rpmcrab#494). Validation is eager: an entry for a finding that never fires is rejected too, where the reference would only crash on emission."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/494"
