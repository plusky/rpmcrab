kind = "behaviour"
reason = "Config-only (issue #883): the vendored configs drop upstream's family filter ' dangerous-command.*' (DROP_LIVE_FILTERS in scripts/generate-distro-configs.py), so the findings surface under the distro flavours where the reference's shipped openSUSE config hides them; no reason for the suppression is recorded upstream. The check is a verbatim port and unchanged (W in both implementations), emitting dangerous-command-in-%<section> per scriptlet section. Measured with the filter lifted over the 300-RPM audit sample of the Factory corpus: the filter hides 14 W lines in 12 packages \u2014 rm and mv invocations in the packagers' own scriptlet text (%posttrans 9, %post 2, %pre 1, %preun 1, %postun 1)."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/883"

[[divergence]]
case = "global"
check = "scriptlet-useradd-in"
kind = "behaviour"
reason = "New crab-only Warning with no reference counterpart (issue #640): a scriptlet run by sh, bash or perl \u2014 or by the default shell when the scriptlet carries no -p flag \u2014 invoking useradd or groupadd at command position emits W scriptlet-useradd-in-<scriptlet> / scriptlet-groupadd-in-<scriptlet> with the offending line as detail, one finding per line occurrence and tool. PostCheck scans %pre, %post, %preun, %postun, %pretrans, %posttrans and %verifyscript plus the trigger, filetrigger and transfiletrigger scriptlets, and this finding runs in every one of those kinds under the prog gate above. The normative source is the openSUSE packaging guidelines (Users and Groups: users and groups are created declaratively with sysusers.d), confirmed for all packages, old and new, by the assignee and the security team in boo#1285892: useradd is not part of container images and cannot create accounts on image-based installations, where scriptlets run on the build host without access to the target /etc/passwd, and the sanctioned scriptlet form is the sysusers RPM macros, whose expansion invokes systemd-sysusers. The predicate reuses the lexical tokenisation pinned for scriptlet-service-restart (shared helpers in atomic_update.rs): heredoc-blanked, quote-blanked text, command position only (segment start after case-arm patterns, shell keywords and environment assignments), basename useradd/groupadd invoked bare or by path from any directory, so systemd-sysusers invocations (including the sysusers-macro expansion shape), the lifecycle tools (usermod, userdel, groupmod, groupdel), comments, quoted text, heredoc bodies, shell function definitions (useradd() { ...; } names the tool without invoking it: the definition's header segment stays silent as a whole, so an invocation inside a one-line body (useradd() { useradd -r foo; }) stays silent with it; only an invocation after a separator or on a later line of the body is a segment of its own and fires) and operand positions (echo useradd, test -x /usr/sbin/useradd) stay silent. Scope disclosures: the tokenisation is shell-shaped, so the perl prog in the gate \u2014 shared with PostCheck's sibling lexical scans \u2014 covers shell-shaped lines in perl bodies, and perl-native invocation forms (system(), qx()) are outside this predicate; an invocation that reaches execution only through an interpreter reading text (eval, sh -c, a heredoc fed to a shell) is outside this predicate; and only a command substitution's opener ($(...) or backticks) starts no segment in this tokenisation: the splitter tracks no substitution depth, so an interior command after a separator is a segment of its own and is judged by this predicate (echo $(echo hi; useradd -r foo) fires), while an interior without a separator stays inside the outer segment and outside it; the Debian adduser tool is outside the ruling, which names useradd/groupadd. Corpus gate (Factory corpus: 51,589 binary RPMs, all 17,242 source packages, PostCheck-only pass with the shipped code): 187 findings \u2014 94 scriptlet-useradd-in-%pre and 93 scriptlet-groupadd-in-%pre \u2014 in 110 binary RPMs across 99 source packages, every finding in %pre. 26 firers hand-read across the population (3proxy, amanda, ceph, corosync-qdevice, freeradius-server, gitolite, icinga2, openSUSE-release-tools, pcp among them) are all genuine direct creations of daemon or service accounts, in the getent-guarded fallback form or bare, with zero false positives. Warning, not Error: the invocation is the superseded pattern rather than a broken package \u2014 useradd still creates the account on classic installations and cannot work on image-based ones, and the move to sysusers.d is a per-package packaging change, so an Error would fail 99 source packages' Factory builds for a policy migration the distribution rolls out package by package. Pinned by unit tests in atomic_update.rs and post.rs; the -v descriptions are registered in PostCheck's register_error_details."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/640"

[[divergence]]
case = "global"
check = "scriptlet-rc-link-invocation-in"
kind = "behaviour"
reason = "New crab-only Warning with no reference counterpart (issue #731): a scriptlet run by sh, bash or perl — or by the default shell when the scriptlet carries no -p flag — invoking an rc<service> link at command position emits W scriptlet-rc-link-invocation-in-<scriptlet> with the offending line as detail, one finding per offending line occurrence. PostCheck scans %pre, %post, %preun, %postun, %pretrans, %posttrans and %verifyscript plus the trigger, filetrigger and transfiletrigger scriptlets, and this finding runs in every one of those kinds under the prog gate above. The /usr/sbin/rc<name> symlinks to the service command are the pre-systemd service-control form; SLE 16 removed them in the general legacy cleanup, so a scriptlet still invoking one relies on a mechanism current SLE, Leap 16 and Tumbleweed no longer provide. The finding is verb-independent — the invocation itself is the obsolete part — where AtomicUpdateCheck's scriptlet-service-restart matches the same rc form only with a restart-class verb and only outside %verifyscript and bodies carrying a TRANSACTIONAL_UPDATE guard; an rcfoo restart line in a prog-gated scriptlet other than %verifyscript, in a body without that guard, fires both, deliberately, because the restart and the dead mechanism are separate facts reported by separate checks. The predicate reuses the tokenisation pinned for scriptlet-service-restart (shared helpers in atomic_update.rs, one line walker for both scans): heredoc-blanked, quote-blanked text, command position only (segment start after case-arm patterns, shell keywords and environment assignments), basename rc<name> with a path-qualified form counting only when its immediate parent directory is a sbin directory, so /usr/bin/rcfoo, /usr/sbin/myrc, the bare word rc and rc names in comments, quoted text, heredoc bodies and non-command positions stay silent. The basenames rclone, rcs and rcp are denylisted in every form, bare included: they name real binaries (the file-sync tool, the RCS command, the remote-copy command) that resolve through PATH, and a bare rclone sync fired under the sbin gate alone because that gate only judges path-qualified forms (review on PR #732). A shell function definition (rcfoo() { ...; }) names a command rather than invoking one: the definition's header segment stays silent in both scans as a whole, so an invocation inside a one-line body (rcfoo() { rcbar status; }) stays silent with it; only an invocation after a separator or on a later line of the body is a segment of its own and fires. Scope disclosures: the tokenisation is shell-shaped, so the perl prog in the gate — shared with PostCheck's sibling lexical scans — covers shell-shaped lines in perl bodies, and perl-native invocation forms (system(), qx()) are outside this predicate; quoted and heredoc text is treated as data, so an invocation that reaches execution only through an interpreter reading that text (eval, sh -c, a heredoc fed to a shell) is outside this predicate; and only a command substitution's opener ($(...) or backticks) starts no segment in this tokenisation: the splitter tracks no substitution depth, so an interior command after a separator is a segment of its own, judged by both this predicate and scriptlet-service-restart (echo $(echo hi; rcfoo restart) fires in both, and the backtick form echo `echo hi; rcfoo restart` identically \u2014 the closing backtick is trimmed off the interior's last word exactly as the closing parenthesis is, so both scans judge the same words in both forms (issue #783)), while an interior without a separator stays inside the outer segment and outside both. There is no TRANSACTIONAL_UPDATE exemption for this finding: the removal is distribution-wide, not transactional-specific. Corpus gate (Factory corpus: 51,589 binary RPMs; 361,685 non-empty scriptlets across all scriptlet tags; rc-shaped tokens occur in exactly 3 packages): exactly one package fires — uisp %post runs /usr/sbin/rcresmgr restart at command position — and the only other rc-shaped tokens in scriptlet bodies are near misses that stay silent: mariadb's rcmysql inside a heredoc update message, w3c-markup-validator's rcapache2 inside a quoted echo string and uisp's own test -x operand on the firing line; zero false positives. The PR #732 denylist and function-definition fixes remove classes that occur nowhere in that corpus split, so the corpus result stands. Warning, not Error: the invocation is obsolete rather than unconditionally broken — the same scriptlet still works wherever the links exist. Pinned by unit tests in post.rs and atomic_update.rs; the -v description is registered in PostCheck's register_error_details."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/731"

[[divergence]]
case = "global"
check = "postin-without-ghost-file-creation"
kind = "missing"
reason = "Deliberate removal (issue #562): the port does not emit this finding -- it flags each declared %ghost whose path never appears as a literal substring in the %prein/%postin scriptlet text, a detection model that predates systemd-tmpfiles and update-alternatives, the mechanisms that create ghosts today. Measured over the Factory corpus (17,242 srcpkgs / 51,586 binary RPMs; predicate-exact scan validated against both implementations on anchors, pcp 6,668 lines alike) the finding fires on 10,125 lines in 782 srcpkgs -- 97.9% of all %ghost declarations corpus-wide -- and hand-checked classification found no genuine defect among them: tmpfiles creation (~6,700, pcp stash-relocate architecture), update-alternatives (2,269; --install creates /etc/alternatives/<name> internally and never spells it), kernel delegated postin, admin placeholders, tool-generated caches and payload that materialises post-install by design. Both upstream distro configs (openSUSE and Fedora) filter it, so the finding is dead in every shipped configuration while still carrying parity and maintenance surface. The emission and its registered error detail are removed; the sibling ghost-files-without-postin stays, and the exact-vector fixture pins in the PostCheck tests keep the absence pinned under cargo test. The reference still emits it."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/562"
