reason = "New crab-only Warning with no reference counterpart (issue #640): a scriptlet run by sh, bash or perl \u2014 or by the default shell when the scriptlet carries no -p flag \u2014 invoking useradd or groupadd at command position emits W scriptlet-useradd-in-<scriptlet> / scriptlet-groupadd-in-<scriptlet> with the offending line as detail, one finding per line occurrence and tool. PostCheck scans %pre, %post, %preun, %postun, %pretrans, %posttrans and %verifyscript plus the trigger, filetrigger and transfiletrigger scriptlets, and this finding runs in every one of those kinds under the prog gate above. The normative source is the openSUSE packaging guidelines (Users and Groups: users and groups are created declaratively with sysusers.d), confirmed for all packages, old and new, by the assignee and the security team in boo#1285892: useradd is not part of container images and cannot create accounts on image-based installations, where scriptlets run on the build host without access to the target /etc/passwd, and the sanctioned scriptlet form is the sysusers RPM macros, whose expansion invokes systemd-sysusers. The predicate reuses the lexical tokenisation pinned for scriptlet-service-restart (shared helpers in atomic_update.rs): heredoc-blanked, quote-blanked text, command position only (segment start after case-arm patterns, shell keywords and environment assignments), basename useradd/groupadd invoked bare or by path from any directory, so systemd-sysusers invocations (including the sysusers-macro expansion shape), the lifecycle tools (usermod, userdel, groupmod, groupdel), comments, quoted text, heredoc bodies, shell function definitions (useradd() { ...; } names the tool without invoking it: the definition's header segment stays silent as a whole, so an invocation inside a one-line body (useradd() { useradd -r foo; }) stays silent with it; only an invocation after a separator or on a later line of the body is a segment of its own and fires) and operand positions (echo useradd, test -x /usr/sbin/useradd) stay silent. Scope disclosures: the tokenisation is shell-shaped, so the perl prog in the gate \u2014 shared with PostCheck's sibling lexical scans \u2014 covers shell-shaped lines in perl bodies, and perl-native invocation forms (system(), qx()) are outside this predicate; an invocation that reaches execution only through an interpreter reading text (eval, sh -c, a heredoc fed to a shell) is outside this predicate; and only a command substitution's opener ($(...) or backticks) starts no segment in this tokenisation: the splitter tracks no substitution depth, so an interior command after a separator is a segment of its own and is judged by this predicate (echo $(echo hi; useradd -r foo) fires), while an interior without a separator stays inside the outer segment and outside it; the Debian adduser tool is not in scope; the check names useradd/groupadd. Corpus gate (Factory corpus: 51,589 binary RPMs, all 17,242 source packages, PostCheck-only pass with the shipped code): 187 findings \u2014 94 scriptlet-useradd-in-%pre and 93 scriptlet-groupadd-in-%pre \u2014 in 110 binary RPMs across 99 source packages, every finding in %pre. 26 firers hand-read across the population (3proxy, amanda, ceph, corosync-qdevice, freeradius-server, gitolite, icinga2, openSUSE-release-tools, pcp among them) are all genuine direct creations of daemon or service accounts, in the getent-guarded fallback form or bare, with zero false positives. Warning, not Error: the invocation is the superseded pattern rather than a broken package \u2014 useradd still creates the account on classic installations and cannot work on image-based ones, and the move to sysusers.d is a per-package packaging change, so an Error would fail 99 source packages' Factory builds for a policy migration the distribution rolls out package by package. Pinned by unit tests in atomic_update.rs and post.rs; the -v descriptions are registered in PostCheck's register_error_details."
