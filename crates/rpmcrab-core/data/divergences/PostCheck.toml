# Divergence ledger entries owned by `PostCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "PostCheck"
kind = "behaviour"
reason = "When the scriptlet interpreter is absent the reference (PostCheck.check_syntax_script) lets subprocess.run raise FileNotFoundError and the whole run dies; the port's syntax_ok returns None and the sh -n / perl -wc probe is skipped. A missing optional interpreter must not abort the lint. No upstream issue covers this: the reference merely carries a TODO ('test that prog is available/executable', PostCheck.py:60), so the crash is unhandled rather than specified behavior."
since = "0.1.0"

[[divergence]]
case = "global"
check = "pretrans-not-lua"
kind = "behaviour"
reason = "Emits E: pretrans-not-lua when a %pretrans scriptlet is not written in Lua (upstream rpmlint#396, rationale rpm#714): %pretrans runs before any payload is installed, so only the internal Lua interpreter is guaranteed to exist. The reference 2.10.0 has no such check — #396 is still open upstream — so this is a deliberate fix-in-port, not a parity gap."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/issues/396"

[[divergence]]
case = "global"
check = "deprecated-cache-updater-in"
kind = "behaviour"
reason = "New port-only Warning: a non-trigger scriptlet run by sh, bash or perl — or by the default shell when the scriptlet carries no -p flag — invoking update-desktop-database, gtk-update-icon-cache, update-mime-database, glib-compile-schemas or install-info at command position emits W deprecated-cache-updater-in-<scriptlet> with the command as detail. The reference has no such finding. Deliberate: since RPM 4.13 file triggers run these updaters when the files they index change (the openSUSE packaging news of 2020-11-23 deprecated the macros expanding to these calls), a hand-rolled invocation duplicates the trigger in every covered scriptlet kind: in %pre the payload is not installed yet, so the call cannot index the package's own files at all, and in %verifyscript it would mutate the system during verification. Trigger scriptlets themselves are exempt because an updater there is the trigger mechanism doing its work (desktop-file-utils, shared-mime-info). Warning, not Error: the caches still get built, so the call is redundant rather than damaging. Warning rather than the Info of SpecCheck's obsolete-tmpfiles-macro: that finding is a spec-text style nudge about a macro that expands to nothing — the file triggers do that work — while this one is a shipped scriptlet still executing a redundant command on the target system, at the level of the other PostCheck content findings. Scoped to invocations aimed at the directories the triggers own (/usr/share, /usr/local/share, or the tool default when no directory is given): a literal private target such as /opt/<app>/schemas is indexed by no file trigger, so the manual call is the only thing building that cache and stays silent; a target that is not a literal absolute path (a variable, a glob, a relative name) cannot be shown private and counts as trigger-owned; over the Factory spec corpus every direct scriptlet invocation (86 in 31 source packages) targets the system directories or none, so the scoping costs no recall there. Matching is command-position only — line start, after a command separator (a bare backgrounding & included), after then/do/else, inside command substitution, after a subshell or group opener, in a case arm, or after env and environment assignments; a sudo prefix is not recognised, so a sudo-wrapped invocation stays silent — over comment-stripped, quote-blanked, heredoc-blanked text, so comments, quoted or echoed text and heredoc bodies stay silent; a repeated command is reported once. Pinned by unit tests in post.rs."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/638"

[[divergence]]
case = "global"
check = "PostCheck"
kind = "behaviour"
reason = "New port-only Error: a scriptlet whose interpreter is /bin/sh, /bin/bash or /usr/bin/perl -- or which has no interpreter, a missing -p defaulting to /bin/sh -- invoking insserv (other than the -r/--remove removal form), chkconfig in an enable form (chkconfig <name> on, chkconfig --add <name>, chkconfig --level <levels> <name> on; off/--del/--remove/--delete stay quiet), or systemctl with the enable, start, restart, reload-or-restart or reenable verb at command position emits E daemon-activation-in-<scriptlet> with the invoked command as detail. A systemctl invocation whose named units are all .timer units is not an activation and stays quiet: enabling or starting a timer schedules the oneshot it drives and starts no daemon, which is the deliberate pattern core packages use to retry a one-off job across boots (openSUSE-build-key's guarded enable and start of its key-import timer beside %service_add_post is the motivating case); an invocation naming any other unit, or no unit, counts as before, so an invocation mixing timer and service targets still fires for the service. Scriptlets for other interpreters (e.g. /sbin/sash, /usr/bin/python3) are not scanned. The systemctl try-forms (try-restart, condrestart, reload-or-try-restart) no-op on inactive units and stay quiet. The reference has no such finding. Deliberate: the openSUSE package security guidelines forbid activating a daemon at installation time; enablement is governed by systemd presets, and the preset-based systemd-update-helper expansions of the %service_* macros never invoke systemctl enable/start, so they stay silent, as do comments, echoed text and heredoc bodies: comments are stripped and quoted-string contents are blanked quote-aware before matching (a command substitution inside quotes still fires, as it executes), and heredoc bodies are blanked under their full delimiter, hyphenated, dotted and colon forms included. Corpus gate (Factory corpus: 51,589 binary RPMs, all 17,242 source packages, PostCheck-only pass over the pristine tree): 78 daemon-activation findings in 61 binary packages -- 12 timer-only invocations in 7 packages (ipmiutil, munin, openSUSE-build-key, snapper, suse-build-key, suseconnect-ng, yast2-ntp-client), 61 systemctl invocations naming .service or other-unit targets and 5 insserv/chkconfig findings; with the timer narrowing, exactly the 12 timer-only findings vanish and no other finding changes. Case delta: the parity case's %post runs chkconfig --add parity, so over its frozen expected/stdout the port emits one additional E daemon-activation-in-%post (chkconfig --add) with no score attached; the reference frozen badness for the case stays 10000. Pinned by unit tests in post.rs."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/635"

