[[divergence]]
case = "global"
check = "PostCheck"
kind = "behaviour"
reason = "`use-tmp-in-*` fires only when the /tmp (or /var/tmp) path as written is a literal: a token that is a creation template (a run of `X` characters, the mktemp/mkstemp convention — the name is generated at runtime) or a shell glob pattern (it matches existing files rather than naming a creation target) does not fire. The reference (PostCheck.py tmp_regex, unchanged in current upstream main) fires on any whitespace-preceded /tmp token, so it cannot tell a predictable path from either shape. Measured over the Factory corpus (51,586 binary RPMs, real-binary A/B against current main): the vendored configs' bare `use-tmp-in-` filter suppressed exactly 5 findings in 5 packages, all false fires of the template/glob shapes (conman, munge; google-extension-manager, google-guest-agent) plus one permissions-only case, and no genuine predictable-path use — so the check was tightened and the filter dropped via DROP_LIVE_FILTERS (issues #538, #558). The permissions-only case (flake-pilot, `chmod 1777 /tmp/flakes` on a pre-existing sticky-bit directory) still fires: distinguishing it needs command semantics this check does not have. Lines inside a heredoc fed to `systemd-tmpfiles` do not fire either: they are declarative tmpfiles.d entries, the shape `%tmpfiles_create_package` inlines into the scriptlet, not scriptlet scratch use, whatever path they declare. The exemption is narrow: it covers only the body of the last heredoc of a command segment that invokes the tool with a standalone `-` as the stdin argument, with backslash-continued lines joined before segment attribution \u2014 not any heredoc that merely appears in a scriptlet naming the tool; a heredoc fed to any other command and scratch use outside the block still fire (Fedora bug 2334068)."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/558"

[[divergence]]
case = "global"
check = "dangerous-command-in"
kind = "behaviour"
reason = "Config-only (issue #883): the vendored configs drop upstream's family filter ' dangerous-command.*' (DROP_LIVE_FILTERS in scripts/generate-distro-configs.py), so the findings surface under the distro flavours where the reference's shipped openSUSE config hides them; no reason for the suppression is recorded upstream. The check is a verbatim port and unchanged (W in both implementations) as of this entry -- the 0.4.1 behaviour entries ledgered alongside supersede it for the heredoc-blanking, /var-state, save-rotation and backup-direction credits, which silence findings the reference still emits -- emitting dangerous-command-in-%<section> per scriptlet section. Measured with the filter lifted over the 300-RPM audit sample of the Factory corpus: the filter hides 14 W lines in 12 packages \u2014 rm and mv invocations in the packagers' own scriptlet text (%posttrans 9, %post 2, %pre 1, %preun 1, %postun 1)."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/883"
[[divergence]]
case = "global"
check = "dangerous-command-in"
kind = "behaviour"
reason = "Fix-and-diverge: `dangerous-command-in-<scriptlet>` no longer fires on a command named inside a heredoc body. In the measured case the body is written out, not executed (`cat > ... << 'EOF'`), so the named command is not an invocation in the scriptlet. Scope disclosures: a body fed directly to a shell (`sh <<'EOF'`) is executed, so directly shell-fed heredocs are no longer blanked and their invocations fire; piped-to-a-shell and wrapped shapes stay blanked, so blanking can still silence a genuine invocation there; and an opener without a later terminator blanks nothing, but opener recognition excludes only quoted, comment and arithmetic `<<`, so a misread opener still blanks through its terminator. Measured over all 1,980 dangerous-command findings on the Factory corpus (pre-fix total; 1,974 after): exactly 6 go quiet, all %post texlive scriptlets writing a script file via `cat > ... << 'EOF'`; 0 added, no other phase changes. Pinned by dangerous_command_in_heredoc_body_is_silent, dangerous_command_in_dash_heredoc_body_is_silent, dangerous_command_in_plain_heredoc_body_is_silent, dangerous_command_after_heredoc_still_fires and dangerous_command_in_shell_fed_heredoc_still_fires in post.rs."
since = "0.4.1"

[[divergence]]
case = "global"
check = "dangerous-command-in"
kind = "behaviour"
reason = "Fix-and-diverge: `dangerous-command-in-<scriptlet>` no longer fires when every dangerous-command match in a %post, %postun, %pre, %preun or %trigger scriptlet is an `rm` removing only paths under /var/lib, /var/adm, /var/log, /var/cache or /var/yp: those are package state, not payload, and removing them on install or erase is the package cleaning up its own runtime data. The credit is operand-exact: flags are skipped, quoted operands count by their inner path, parsing stops at the first operator or redirect, a continued line is never credited, a `..` component keeps firing, a glob operand keeps firing, and any operand outside the five prefixes keeps the finding firing. /run and /var/run deliberately stay firing, and the credit does not extend to %posttrans, %pretrans, %verifyscript or the filetrigger scriptlets. Measured over all 1,579 dangerous-firing packages from the preserved PostCheck census (PostCheck-only old-vs-new binary run, isolated config; the credit only suppresses, so non-firing packages cannot change): exactly 61 go quiet — the 60 classified findings plus one same-shape quoted-operand row the classifier bucketed elsewhere; 0 added; %posttrans/%pretrans unchanged; /var/run rows unchanged. Pinned by unit tests in post.rs."
since = "0.4.1"

[[divergence]]
case = "global"
check = "dangerous-command-in"
kind = "behaviour"
reason = "Fix-and-diverge: `dangerous-command-in-<scriptlet>` no longer fires on a backup-direction operation: `cp`/`mv` writing to a `.rpmsave` or `.rpmtmp` destination, or `rm` only when every operand is a backup name (a mixed `rm` still fires). The destination is the `-t` / `--target-directory` argument (separate, `--target-directory=` attached, or `-tDIR` attached) for `cp`/`mv` only; `rm` has no target-directory option, so its `-t` argument stays positional. A copy/move also needs a real destination: at least two operands without `-t`, at least one with it. The credit covers `cp`, `mv` and `rm` only: the other ten dangerous verbs (`ln`, `tar`, `rpm`, `chmod`, `chown`, `cpio`, `install`, `perl`, `userdel`, `groupdel`) still fire on backup operands. A restore (a backup name as the source, live path as the destination) keeps firing, while a rotation (a backup name moved to a `.old` name) is credited separately by the rotation entry below; a backup operation followed by a genuine command in the same scriptlet still fires on the genuine command. Measured over the Factory corpus (51,589 binary RPMs): the Oct-26 shard run fires 1,984 dangerous-command findings in 1,579 packages, and re-running the pre-#1344 binary against the #1344 binary over exactly that 1,579-package firing set gives 1,959 dangerous findings under the old binary (25 fewer than the shards, snapshot drift between the Oct-26 sweep binary and the pre-#1344 binary; the firing set itself is unchanged). Of those, exactly 12 backup-direction matches go quiet: 9 findings drop, all dangerous-command-in-%post (cp 3, mv 5, rm 1: dapl, dapl-debug, fonts-config, openSUSE-repos-Leap, openSUSE-repos-MicroOS, openSUSE-repos-Slowroll, openSUSE-repos-Tumbleweed, smartmontools, ypbind), and 3 matches are masked by a same-verb genuine command in the same section so those findings persist (conman mv, raspberrypi-firmware-config cp, raspberrypi-firmware-config-camera cp); smartmontools drops its %post rm while its %pre rm persists. This supersedes the prior 8-dropped figure: smartmontools counts as dropped here, not keep-firing. 0 added, 0 verb changes, no other check moved (full-finding multiset diff over the firing set: 12,399 to 12,390, the 9 drops the only difference). Pinned by unit tests in post.rs."
since = "0.4.1"

[[divergence]]
case = "global"
check = "dangerous-command-in"
kind = "behaviour"
reason = "Fix-and-diverge: `dangerous-command-in-<scriptlet>` no longer fires on a `.rpmsave` rotation aside-step: `mv`/`cp` of a `.rpmsave` path to the same path with `.old` appended, so rpm's own leftover saved config is set aside for a fresh `.rpmsave` to be created. The credit reads each dangerous-command match's operands (option flags skipped — a target-directory flag fails closed instead — backslash continuations joined, quotes stripped, an unescaped newline ending the command, and operators (`; | & ( )`), redirects and `#`-comments ending it), so variable-carrying paths match their rotated form literally, and it applies to the `mv` form and the `cp` form alike; a restore to the live path, a backup to `.rpmsave`, a multi-operand move, or any other verb still fires. The credit carries no scriptlet-phase gate (unlike the /var-state rm credit, gated to %post|%postun|%pre|%preun|%trigger): the 1 %posttrans row in the census is a rotation credit. The `cp` form sets the leftover aside the same way: `cp` leaves the original `.rpmsave` in place, but the aside-step still clears the path for a fresh `.rpmsave` to be created (the strongswan %preun shape). The still-fires list is rotation-rule-only: a restore-shaped command can still go silent via a stacked credit (rm state credit, heredoc blanking), and the list's guards are the rotation rule's own (rotation-alone vs stacked, wrong-dest `dest == source + \".old\"`, operand-count rules). Glob operands keep firing: a `*`, `?`, or `[` in either operand is not operand-exact, so a glob rotation moves a set of files, not one rpm leftover; none of the 105 measured rows is a glob shape, so the count stands. Measured over all 1,976 dangerous-command findings on the Factory corpus: exactly 105 go quiet (103 `mv` in %pre, 1 `cp` in %preun, 1 `mv` in %posttrans with the same rotation template); 0 added, no other check moved. The three census numbers are not one arithmetic chain: 1,976 counts findings in the rotation census run, the backup entry's 1,579 counts firing packages (a different universe), and the heredoc entry's 1,980 is the pre-heredoc-fix finding total, an earlier measurement point (the heredoc fix itself moved 1,980 → 1,974). Stacking order at the call site: an rm state credit first, then a backup-direction credit, then the rotation credit, with heredoc blanking before all of them. The rotation tokenizer stays separate from `logical_line_after`+`split_operands`: the two are close but not provably identical (a trailing token before an operator is kept by the rotation tokenizer and dropped by `split_operands`), so no sharing. Pinned by dangerous_command_save_rotation_mv_is_silent, dangerous_command_save_rotation_cp_is_silent, dangerous_command_restore_and_rotation_still_fire, dangerous_command_save_rotation_other_shapes_still_fire, dangerous_command_save_rotation_glob_still_fires, dangerous_command_after_backup_still_fires, dangerous_command_rotation_then_dangerous_still_fires, dangerous_command_rotation_target_directory_still_fires, dangerous_command_rotation_verb_gate_still_fires, dangerous_command_rotation_posttrans_is_silent and rotation_operand_count_and_terminator_shapes in post.rs."
