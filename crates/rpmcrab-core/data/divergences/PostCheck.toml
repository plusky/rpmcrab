reason = "New crab-only Warning with no reference counterpart (issue #731): a scriptlet run by sh, bash or perl — or by the default shell when the scriptlet carries no -p flag — invoking an rc<service> link at command position emits W scriptlet-rc-link-invocation-in-<scriptlet> with the offending line as detail, one finding per offending line occurrence. PostCheck scans %pre, %post, %preun, %postun, %pretrans, %posttrans and %verifyscript plus the trigger, filetrigger and transfiletrigger scriptlets, and this finding runs in every one of those kinds under the prog gate above. The /usr/sbin/rc<name> symlinks to the service command are the pre-systemd service-control form; SLE 16 removed them in the general legacy cleanup, so a scriptlet still invoking one relies on a mechanism current SLE, Leap 16 and Tumbleweed no longer provide. The finding is verb-independent — the invocation itself is the obsolete part — where AtomicUpdateCheck's scriptlet-service-restart matches the same rc form only with a restart-class verb and only outside %verifyscript and bodies carrying a TRANSACTIONAL_UPDATE guard; an rcfoo restart line in a prog-gated scriptlet other than %verifyscript, in a body without that guard, fires both, deliberately, because the restart and the dead mechanism are separate facts reported by separate checks. The predicate reuses the tokenisation pinned for scriptlet-service-restart (shared helpers in atomic_update.rs, one line walker for both scans): heredoc-blanked, quote-blanked text, command position only (segment start after case-arm patterns, shell keywords and environment assignments), basename rc<name> with a path-qualified form counting only when its immediate parent directory is a sbin directory, so /usr/bin/rcfoo, /usr/sbin/myrc, the bare word rc and rc names in comments, quoted text, heredoc bodies and non-command positions stay silent. The basenames rclone, rcs and rcp are denylisted in every form, bare included: they name real binaries (the file-sync tool, the RCS command, the remote-copy command) that resolve through PATH, and a bare rclone sync fired under the sbin gate alone because that gate only judges path-qualified forms (review on PR #732). A shell function definition (rcfoo() { ...; }) names a command rather than invoking one: the definition's header segment stays silent in both scans as a whole, so an invocation inside a one-line body (rcfoo() { rcbar status; }) stays silent with it; only an invocation after a separator or on a later line of the body is a segment of its own and fires. Scope disclosures: the tokenisation is shell-shaped, so the perl prog in the gate — shared with PostCheck's sibling lexical scans — covers shell-shaped lines in perl bodies, and perl-native invocation forms (system(), qx()) are outside this predicate; quoted and heredoc text is treated as data, so an invocation that reaches execution only through an interpreter reading that text (eval, sh -c, a heredoc fed to a shell) is outside this predicate; and only a command substitution's opener ($(...) or backticks) starts no segment in this tokenisation: the splitter tracks no substitution depth, so an interior command after a separator is a segment of its own, judged by both this predicate and scriptlet-service-restart (echo $(echo hi; rcfoo restart) fires in both, and the backtick form echo `echo hi; rcfoo restart` identically \u2014 the closing backtick is trimmed off the interior's last word exactly as the closing parenthesis is, so both scans judge the same words in both forms (issue #783)), while an interior without a separator stays inside the outer segment and outside both. There is no TRANSACTIONAL_UPDATE exemption for this finding: the removal is distribution-wide, not transactional-specific. Corpus gate (Factory corpus: 51,589 binary RPMs; 361,685 non-empty scriptlets across all scriptlet tags; rc-shaped tokens occur in exactly 3 packages): exactly one package fires — uisp %post runs /usr/sbin/rcresmgr restart at command