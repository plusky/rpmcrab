[[divergence]]
case = "global"
check = "files-duplicate"
kind = "behaviour"
reason = "Fix-and-diverge: a duplicate group whose members are all %config files is not reported. Each copy is meant to be edited independently after install (per-version copies, a live file beside its example or default template), so hardlinking any two would couple edits that must stay separate; the duplication is not reclaimable space. Measured on the Factory corpus: 20,933 rows fall to 20,878 (-55/+0)."
since = "0.4.1"

