# Divergence ledger entries owned by `DuplicatesCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "hardlink-across-partition"
kind = "behaviour"
reason = "Adopted ahead of upstream (proposed in unmerged rpmlint#1603, fixes rpmlint#349): hardlink findings are reported per (rdev, inode) group inside each md5 group. The frozen 2.10.0 reference uses global per-md5 bookkeeping and misattributes hardlinks in mixed hardlink/duplicate groups, reporting the wrong file pair. Additionally the trigger is narrowed per upstream #771: the reference warns whenever the first two path directories differ, false-positiving on e.g. /usr/bin vs /usr/lib64 (inseparable post-usr-merge). A device-based trigger is impossible — rpmbuild deliberately flattens device metadata (FILERDEVS is st_rdev, 0 for regular files; FILEINODES are remapped preserving only hardlink identity; FILEDEVICES is flattened to 1 for every file (rpm's build/files.c stores fl_dev ? 1 : 0, verified as 1 1 1 on a real package)) — so the port keeps a path heuristic narrowed to the top-level directory: only hardlinks spanning genuinely separable trees (/usr vs /var) are reported. The same narrowed definition feeds the files-duplicate suppression and the files-duplicated-waste total (ledgered under those checks)."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/pull/1603"

[[divergence]]
case = "global"
check = "files-duplicate"
kind = "behaviour"
reason = "The frozen 2.10.0 reference suppresses duplicates from the waste accounting whenever the first two path directories differ ('can't be linked anyway'). Per upstream #771 the same narrowed top-level-directory definition as hardlink-across-partition is used instead: duplicates under one top-level tree (e.g. /usr/bin vs /usr/lib) can be hardlinked in practice, so they count as actionable waste; only duplicates spanning genuinely separable trees (/usr vs /etc) stay suppressed. The suppressed diff also accumulates into the files-duplicated-waste total, so that finding's emitted total shifts with the same narrowing (ledgered under files-duplicated-waste)."
since = "0.1.0"

[[divergence]]
case = "global"
check = "files-duplicated-waste"
kind = "behaviour"
reason = "The accumulated waste total follows the #771 narrowing: duplicates under one top-level tree now count toward the total, so the port reports W: files-duplicated-waste with a larger total where the frozen 2.10.0 reference's two-level prefix suppression keeps the package under the 100000-byte threshold. Where the reference stays silent (package under the 100000-byte threshold under its two-level suppression) the port emits the finding -- an emission difference, not a wording one; see the files-duplicate entry for the underlying reason. Keeping the reference's two-level prefix for the waste total alone was rejected: the total accumulates the same suppressed diff that drives files-duplicate, and under the #771 worldview (one top-level tree is linkable) the narrowed total is the more faithful estimate of reclaimable bytes."
since = "0.1.0"

[[divergence]]
case = "global"
check = "files-duplicate"
kind = "behaviour"
reason = "A duplicate group whose members are all bytecode variants of one module (same directory and stem, differing only in interpreter cache tag, .opt-N level or .pyc/.pyo extension) is not reported. The frozen 2.10.0 reference fires on these groups -- 8,722 groups over 161 source packages in the 2026-10-14 Factory sweep -- but the duplication is generated by the distro's own bytecompile macros at hardcoded optimize levels [0, 1], the dedicated brp-python-hardlink for exactly these files is not wired into the build, and %fdupes does not reach them either (0 of 8,722 pairs hardlinked in the shipped RPMs), so no packager action reclaims the space; the fix belongs to the distro build configuration, not the spec. Mixed groups -- variants plus a real file, or bytecode of different modules or directories -- still report. The suppressed groups also contribute nothing to the files-duplicated-waste total (ledgered under files-duplicated-waste)."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/518"

[[divergence]]
case = "global"
check = "files-duplicate"
kind = "behaviour"
reason = "Deliberate divergence (issue #522): a package named mingw32-* or mingw64-* does not emit this finding. The reference emits the findings, but the Factory lint session suppresses them wholesale via the '^mingw(32|64)-.*files-duplicate' filter in mingw32.toml, a config the mingw32/64-filesystem packages install into the lint environment; it is not part of rpmlint's config tree, so the mirrored config set never contains it and the port reported the family live: 68 groups in 24 binary packages on the Factory sweep of main 782ac1d5. The filter is package-scoped with no path condition, so the suppression is package-scoped too -- 18 of the 68 groups sit in the cross-gcc packages under /usr/lib64/gcc/<triplet>/, outside any sys-root. The hardlink findings from the same check are not filtered upstream and still fire. Follows the devel-file-in-non-devel-package handling for the same config (issue #511)."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/522"

[[divergence]]
case = "global"
check = "files-duplicated-waste"
kind = "behaviour"
reason = "The accumulated waste total excludes duplicate groups whose members are all bytecode variants of one module (see the files-duplicate entry, issue #518): the frozen 2.10.0 reference counts them, and in the 2026-10-14 Factory sweep they alone carry 117 of the port's 259 files-duplicated-waste emissions past the 100000-byte threshold. The variants are unwired-brp bytecompile output no packager action reclaims, so counting them would keep the finding firing on a total the package cannot act on."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/518"

[[divergence]]
case = "global"
check = "files-duplicated-waste"
kind = "behaviour"
reason = "Deliberate divergence (issue #522): the mingw32.toml filter line '^mingw(32|64)-.*files-duplicate' also matches this finding's name, so the Factory lint session suppresses files-duplicated-waste for mingw32-*/mingw64-* packages along with the duplicate groups, and the port drops it for the family too -- the waste total accumulates the same groups. 6 lines totalling ~109 MB on the Factory sweep of main 782ac1d5 (the mingw32/64-binutils-debug pair alone ~103 MB). See the files-duplicate entry for the underlying reason."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/522"

[[divergence]]
case = "global"
check = "files-duplicate"
kind = "behaviour"
reason = "Duplicates forming a DuplicatesWhitelistPairs pair do not count (issue #510): the bundled defaults pair the *.dist-info licence embed the Python stack requires -- under *.dist-info/licenses (PEP 639), or as a licence file at the *.dist-info root in the pre-PEP 639 layout, which alone carried 30 residual groups on the 2026-10-26 Factory sweep -- with the %license copy SUSE policy requires in /usr/share/licenses, or the %docdir copy under /usr/share/doc/packages. Both copies are toolchain-mandated and no tooling hardlinks them, so the duplication is not actionable. The frozen 2.10.0 reference reaches silence on this family through its two-level prefix suppression; the rest of the #771 narrowing above is unchanged."
since = "0.3.0"

[[divergence]]
case = "global"
check = "files-duplicated-waste"
kind = "behaviour"
reason = "Whitelisted DuplicatesWhitelistPairs pairs (see the files-duplicate entry, issue #510) do not accumulate into the waste total either: the total accumulates the same suppressed diff that drives files-duplicate, and a tooling-mandated pair is not reclaimable space."
since = "0.3.0"

