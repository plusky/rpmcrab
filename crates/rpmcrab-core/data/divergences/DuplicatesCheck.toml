reason = "Fix-and-diverge: the waste total excludes duplicate groups whose members are all %config files (see the files-duplicate entry): the copies are meant to be edited independently after install, so the space is not reclaimable. Measured on the Factory corpus: 227 findings fall to 226 (-1/+0); the one silenced package is mono-web, whose entire waste total rests on such groups."
