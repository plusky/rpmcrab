# Divergence ledger entries owned by `config-severity-overrides`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "config-severity-overrides"
kind = "behaviour"
reason = "New `[SeverityOverrides]` config table (finding name → E/W/I, upstream rpmlint#1335): the override is the final word on a finding's level, applied after Scoring and strict promotion; the frozen 2.10.0 reference has no such key. The override rewrites the level in either direction and remains the final word after the promotion-only Scoring of #699 (no badness number survives for an override to keep, and exits 65/66 no longer exist); Filters regexes and JSON `level` see the overridden level; names that never match a finding warn on stderr."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/issues/1335"
