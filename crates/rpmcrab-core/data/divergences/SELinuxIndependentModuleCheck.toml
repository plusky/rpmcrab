[[divergence]]
case = "global"
check = "selinux-incorrect-if-file-location"
kind = "behaviour"
reason = "The reference credits only /usr/share/selinux/devel/include/distributed/, but the devel Makefile shipped in selinux-policy-devel collects interfaces from every layer directory of the include tree: header_interfaces is $(layer)/*.if for each direct subdirectory other than support, fed into tmp/all_interfaces.conf for every module build. A .if placed directly in a layer directory is therefore found by consuming policy builds, measured on the corpus packages: container-selinux (include/services/container.if), fapolicyd-selinux, k3s-selinux and rke2-selinux (include/contrib/*.if) all land in all_interfaces.conf, and a consumer module calling container_read_share_files and fapolicyd_read_lib_files compiles against them; the reference fires on all four. rpmcrab credits a .if directly in any layer directory of the include tree (the distributed/ prefix credit, at any depth, is unchanged); files directly in the include directory, nested below a layer, in support/, or outside the include tree keep firing, as in the reference (a .if directly in the include directory and one under /usr/share/selinux/packages/ were measured absent from all_interfaces.conf). The staged description is reworded to state the credited grammar. Pinned by if_file_in_layer_dir_is_quiet, if_file_not_collected_by_devel_makefile_is_reported and layer_placed_if_file_is_quiet in selinux_independent_module.rs."
since = "0.4.1"

[[divergence]]
case = "global"
check = "SELinuxIndependentModuleCheck"
kind = "detail"
reason = "Staged `--explain` text for `selinux-incorrect-if-file-location` reworded to state the grammar the check credits: the reference text names only /usr/share/selinux/devel/include/distributed/, while the port also credits a .if placed directly in any layer directory of the devel include tree (see the behaviour entry for this finding). Provenance: crates/rpmcrab-core/data/descriptions/README.md."
since = "0.4.1"
