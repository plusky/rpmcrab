[[divergence]]
case = "global"
check = "LibraryDependencyCheck"
kind = "behaviour"
reason = "Fix-and-diverge: no-library-dependency-on judges the linked file against every package of the run that ships it, not only the single owner a last-wins file map attributes it to. Several packages in a run can ship the same library path (a full build beside its mini flavour, libecpg6 beside postgresql18-devel-mini), and which of them such a map names is lint order, not fact; the reference attributes the file to one package and credits only a direct requirement on it. The dependency is credited when it lands on any shipper: a direct requirement naming any shipper (a devel-classified shipper counts — dapl-debug-devel on the dapl-debug build that ships its link target); a requirement naming an owner (the provides and anchor arms are owners-only: a devel-classified shipper's provides name nothing) through one of the owner's own provides, the naming chain_credits already accepts for the library (the stem provides of the klatexformula, gtkdatabox, linebreak, oping and qalculate libraries, the qscintilla dash-spellings, esql, wt-dbo, and the soname and base-name virtuals of the gsoap, rocjpeg and rocm-runtime libraries); the anchor chain aimed at any owner; or the devel package shipping the resolved file itself (glib2-stage1-devel's combined build). A finding that still fires names the last non-devel shipper, the owner the single-value map would have held, so a fired finding is unchanged for the same link; one devel package (dapl-debug-devel) now names a later, genuinely uncredited link instead of the credited one — this change's own unmasking, its credited link being the outside-the-owner-map shipper link above. Measured on the check's Factory corpus population (75 E, FP-trim campaign audit 2026-10-26, every finding classified in the campaign report): 27 findings are credited — 12 multi-owner direct, 13 owner-provides (the 10 classified plus gsoap-devel, rocjpeg-devel and rocm-runtime-devel from the corpus re-check, each requiring a name only the owner provides corpus-wide), 1 required shipper outside the owner map, 1 self-shipped; the re-aimed anchor arm credits no corpus finding on its own (every corpus chain also lands on a direct or provides arm) and is pinned by test. Per-shape arch semantics: the direct arm matches a shipper's name or its spelling under the running host's %{_isa}; the provides arm reads the provides of the (name, arch) build that ships the linked file (the rocjpeg and rocm-runtime credits ride on the isa-qualified provides rocjpeg(x86-64) and rocm-runtime(x86-64), matched exactly); the anchor arm keeps the #863 entry's (name, arch) sibling resolution. The residue is the 48 real findings of this population — a different measurement set from the #863 entry's 111 (that entry re-measured the 181 affected source packages of sweep run-20261022-857d5ece), so no subset relation between the two residues is claimed. The firing-set before/after (the 158 involved packages in one run, isolated HOME/XDG, pristine e9ffbc5 against the fixed binary) moves the check 53 E to 28 E — of the 27 credits, 25 silence a finding in this set: wt-devel's credit is not observable here (its first link is ownerless in the set) and dapl-debug-devel's is offset by the later uncredited link it now names — with zero change on a 300-package control sample (1,446 findings identical). Pinned by requirement_on_second_owner_credits, requirement_naming_owner_through_its_provide_credits, requirement_naming_second_owner_through_its_provide_credits, requirement_on_devel_classified_shipper_credits, self_shipped_target_credits, anchor_chain_credits_via_second_owner, multi_owner_credit_survives_export_import, unrequired_owners_still_fire_and_name_the_last_owner and unrelated_provide_still_fires in library_dependency.rs."
since = "0.4.1"

[[divergence]]
case = "global"
check = "no-library-dependency-for"
kind = "behaviour"
reason = "Fix-and-diverge: the ownerless branch applies the verdict's shipper-side arms. The reference fires no-library-dependency-for for every link absent from its non-devel-only file map (LibraryDependencyCheck.py: _process_nondevel_package records only non-devel packages, after_checks fires for on a missing map entry) — so a link the devel ships itself, or requires a shipper of by name, still fires there. The port stays silent for those two shapes, because installing the devel then guarantees the file: the devel among the link's shippers (the self-ship arm the no-library-dependency-on verdict already carries), or a direct requirement naming any shipper of the link (the direct arm, devel-classified shippers included; the requirement name matches with any version constraint ignored). Only the shipper-side arms can credit here — the provides and anchor arms are owners-only and owners are empty by construction. Measured on the FP-trim campaign's targeted audit of its 34-row shard enumeration (no corpus-wide delta was measured: the audit ran targeted per-package verification only, no corpus run): 16 rows are self-shipped (debug and sys-root payloads living in the devel package itself: efl, the six cross-glibc devel packages, ipmiutil, libomp18, mono, pcapplusplus, pcp, the four libpmem devel packages) and 8 rows require their devel-only shipper (libmono-2_0-devel on libmonosgen-2_0-devel, the libpng-compat pair on their libpng-devel shippers, the five mumps flavour devel packages on mumps-devel or mumps-scotch-devel); 10 rows are shard artefacts (a non-devel owner exists corpus-wide, so they take the -on branch, not -for), and no audited row is left firing. A 341-package targeted set (the 34 devel packages plus their found shippers plus their source dirs) run before and after the fix moves no-library-dependency-for 26 to 2 with nothing else changed: the 24 credited rows above, and 2 additionally surfaced mumps-devel/mumps-scotch-devel versioned links (libcmumps_seq.so.5.3.5, libcmumps_scotch.so.5.3.5) that no package ships and that keep firing. Pinned by self_shipped_target_credits_for_no_library_dependency_for, required_devel_shipper_credits_for_no_library_dependency_for, unrequired_devel_shipper_still_fires_for, ownerless_link_still_fires_for and credited_first_link_names_later_ownerless_link in library_dependency.rs."
since = "0.4.1"
