# Divergence ledger entries owned by `DocCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "DocCheck"
kind = "behaviour"
reason = "package-with-huge-docs is skipped for package names ending in a configured ExemptDocSuffixes entry (default -javadoc). The reference has no such exemption (rpm-software-management/rpmlint#555 is still open) and flags 100%-docs javadoc packages."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/issues/555"

[[divergence]]
case = "global"
check = "DocCheck"
kind = "detail"
reason = "package-with-huge-docs detail appends \"(documentation should be in a -doc subpackage)\" to the percentage. The reference emits only the percentage (DocCheck.py:117); its long description already carries the -doc advice, so the port surfaces it inline."
since = "0.1.0"

[[divergence]]
case = "global"
check = "install-file-in-docs"
kind = "severity"
reason = "Deliberate severity recalibration (plusky/rpmcrab#781): the port reports I where the reference reports W. The class is cosmetic by its own detail text: a file whose name suggests it contains installation instructions is shipped in the documentation, and the stated harm is only that such instructions are often not relevant for already installed packages — nothing is broken, misbuilt or non-functional, and the file is one a packager may optionally drop. Comparable tidiness classes already sit at Info (no-manual-page-for-binary, no-%check-section, dangling-relative-symlink), and at W the class only adds to the background warning mass. Measured on the Factory corpus (main 547fa55, both flavours): 108 findings in 42 binary packages out of 51,586 checked, the firing set identical under opensuse and slfo."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/781"

[[divergence]]
case = "global"
check = "install-file-in-docs"
kind = "behaviour"
reason = "An INSTALL file inside an embedded example/demo/sample tree (a component named example/examples/demo/demos/sample/samples that is not the file's immediate parent directory, e.g. examples/hello-c/INSTALL) is not charged: the file belongs to a self-contained tree the package itself ships below that component, and its instructions describe building or installing that tree (the gettext hello-* examples carry their own autogen.sh/configure.ac alongside), not the already-installed package. The reference charges every %doc INSTALL. Measured on the public Tumbleweed snapshot (repomd 1792894150): 70 of the 109 raw findings are this class (gettext examples 68, gmp demo 1, mgetty sample 1); the remaining 39 keep firing."
since = "0.4.1"

[[divergence]]
case = "global"
check = "DocCheck"
kind = "behaviour"
reason = "package-with-huge-docs does not count man pages (/usr/share/man/, /usr/man/) or info pages (/usr/share/info/, /usr/info/) toward the documentation share. Man and info pages ship with the binaries they document and are never split into a -doc subpackage, so counting them produces findings whose stated remedy does not apply. The exclusion applies to the documentation numerator only; total size is unchanged, so mixed packages still fire on their remaining docs. Measured on the Factory corpus: excluding man/info pages removes 97 of the 554 package-with-huge-docs findings. The three class counts are standalone memberships (97 man/info, 113 translations, 15 help, summing to 225); po4a-lang and skladnik-lang sit in both the man/info and translations classes, so distinct removals are 223 and 554 - 223 = 331."
since = "0.4.1"

[[divergence]]
case = "global"
check = "DocCheck"
kind = "behaviour"
reason = "package-with-huge-docs does not count help trees (GNOME help under /usr/share/help/, KDE help under /usr/share/doc/HTML/) toward the documentation share. Help books are read by the help viewer from the main package; moving them into an optional -doc subpackage would remove in-app help. The exclusion applies to the documentation numerator only; total size is unchanged. Measured on the Factory corpus: excluding help trees removes 15 findings from the set remaining after the man/info exclusion and the translations exemption."
since = "0.4.1"

[[divergence]]
case = "global"
check = "DocCheck"
kind = "behaviour"
reason = "package-with-huge-docs is skipped for translations packages: packages whose every non-doc regular file is a locale file under /usr/share/locale/ or a man/info/help path. Translated help, man pages and manuals belong in the language split, not in a -doc subpackage, so translated man/info/help payload no longer vetoes the exemption. A package with no non-doc regular files is not a translations package. Measured on the Factory corpus: 113 findings sit in translations packages."
since = "0.4.1"

[[divergence]]
case = "global"
check = "DocCheck"
kind = "behaviour"
reason = "package-with-huge-docs is skipped for pure-documentation name families: packages whose name contains -manual, -examples, -demo, -testresults, -html or -apidoc. The -doc remedy is circular for these packages: they are the documentation carrier by construction (manuals, example collections, demos, test-result logs, HTML documentation sets, API documentation). Measured on the Factory corpus: extending the ignore_pkg family quiets 60 of the 331 remaining findings, 0 added; 53 of the 67 pure-documentation packages go quiet and 14 remain (names without a family marker). Findings count RPMs and packages count distinct names: the 60 findings span 60 distinct names, the 53 held pure-doc packages plus 7 names outside the held set that carry non-doc files (dpdk-examples, gsl-examples, id3lib-examples, junit-manual, libqt5-qtdoc-html, msv-manual, scala-apidoc) - the known blast radius of the name-based exemption. Substring matching stands; the dash-less forms and the singular -example gap are pinned as negatives by tests."
since = "0.4.1"

[[divergence]]
case = "global"
check = "DocCheck"
kind = "behaviour"
reason = "package-with-huge-docs is skipped for fourteen individual pure-documentation packages: books, c-intro-and-ref-pdf, docbook-tdg, fhs, grub2, gtk2-engines, myspell-de, myspell-en, openmpi4-testsuite, php8-test, release-notes-openSUSE, tuxpaint-stamps, xemacs-info, xemacs-packages-info. Each package's RPM header shows zero non-doc regular files: books carries twelve %doc PDFs; c-intro-and-ref-pdf a single PDF; docbook-tdg the guide HTML tree and PDFs; fhs the specification document; grub2 and gtk2-engines only changelog and readme docs with their functional payload in subpackages; myspell-de and myspell-en only licence and readme docs with dictionaries in per-locale subpackages; openmpi4-testsuite and php8-test only test logs; release-notes-openSUSE the release-notes tree; tuxpaint-stamps only changelog and licence docs with stamps in per-category subpackages; xemacs-info and xemacs-packages-info only GNU info files. A -doc split would move the package's entire payload, so the remedy does not apply. The exemption applies only when the package carries no non-doc regular file: a functional package sharing an exact name keeps firing. Measured on the Factory corpus: exempting the fourteen removes 14 of the 271 remaining findings, 0 added."
since = "0.4.1"
