# Divergence ledger entries owned by `DocCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "DocCheck"
kind = "behaviour"
reason = "package-with-huge-docs is skipped for package names ending in a configured ExemptDocSuffixes entry (default -javadoc). The reference has no such exemption (rpm-software-management/rpmlint#555 is still open) and flags 100%-docs javadoc packages."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/issues/555"

[[divergence]]
case = "global"
check = "DocCheck"
kind = "detail"
reason = "package-with-huge-docs detail appends \"(documentation should be in a -doc subpackage)\" to the percentage. The reference emits only the percentage (DocCheck.py:117); its long description already carries the -doc advice, so the port surfaces it inline."
since = "0.1.0"

[[divergence]]
case = "global"
check = "install-file-in-docs"
kind = "severity"
reason = "Deliberate severity recalibration (plusky/rpmcrab#781): the port reports I where the reference reports W. The class is cosmetic by its own detail text: a file whose name suggests it contains installation instructions is shipped in the documentation, and the stated harm is only that such instructions are often not relevant for already installed packages — nothing is broken, misbuilt or non-functional, and the file is one a packager may optionally drop. Comparable tidiness classes already sit at Info (no-manual-page-for-binary, no-%check-section, dangling-relative-symlink), and at W the class only adds to the background warning mass. Measured on the Factory corpus (main 547fa55, both flavours): 108 findings in 42 binary packages out of 51,586 checked, the firing set identical under opensuse and slfo."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/781"

[[divergence]]
case = "global"
check = "install-file-in-docs"
kind = "behaviour"
reason = "An INSTALL file inside an embedded example/demo/sample tree (a component named example/examples/demo/demos/sample/samples that is not the file's immediate parent directory, e.g. examples/hello-c/INSTALL) is not charged: the file belongs to a self-contained tree the package itself ships below that component, and its instructions describe building or installing that tree (the gettext hello-* examples carry their own autogen.sh/configure.ac alongside), not the already-installed package. The reference charges every %doc INSTALL. Measured on the public Tumbleweed snapshot (repomd 1792894150): 70 of the 109 raw findings are this class (gettext examples 68, gmp demo 1, mgetty sample 1); the remaining 39 keep firing."
since = "0.4.1"
