# Divergence ledger entries owned by `ZipCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "unable-to-read-zip"
kind = "severity"
reason = "The reference reports E on BadZipFile and W on RuntimeError (a password-protected archive). The pure-Rust zip crate surfaces a single error type, so rpmcrab reports E for every archive that fails to open; the entries that stay W and abort the file instead of naming an entry are the RuntimeError-shaped ones: password-protected entries (zip::ZipError::PASSWORD_REQUIRED, the reference's RuntimeError case) and, since 0.4.1, entries whose compression method the reader cannot inflate (zip::ZipError::CompressionMethodNotSupported, the reference's NotImplementedError case — see the ZipCheck behaviour entry for the unsupported-method mapping)."
since = "0.1.0"

[[divergence]]
case = "global"
check = "ZipCheck"
kind = "detail"
reason = "Port-only `--explain` description for `unable-to-read-zip`: the reference emits the finding but ships no description."
since = "0.1.0"

[[divergence]]
case = "global"
check = "uncompressed-zip"
kind = "missing"
reason = "Mothballed on measurement (issue #940): over the full Factory tree, 3,781 zip-shaped archives (.zip/.jar/.ear/.war) in 1,317 packages were examined with the reference rule; 121 archives in 40 packages are stored uncompressed, and every firing class is a deliberate upstream form: Go's zoneinfo.zip ships stored by design (7 Go packages), JARs built stored (including the openj9 jvm-exports farm repeating the same jars under many names), test fixtures whose stored form is the test subject (the python testsuite namespace and zipdata zips, pooch data, fs-uae zipfile tests), SecLists traversal payloads, and game and document content archives (0ad, scummvm, ogre, Kivy examples, LibreOffice help images). Stored is a legitimate zip mode, and no decidable predicate separates a mistaken stored archive from these deliberate forms. rpmcrab does not emit it; the reference still emits it."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/blob/main/rpmlint/checks/ZipCheck.py"

[[divergence]]
case = "global"
check = "ZipCheck"
kind = "behaviour"
reason = "Entry inflation is capped at 64 MiB per entry (issue #771): an entry inflating past the cap is reported (bad-crc-in-zip from the CRC pass, unable-to-read-zip from the manifest read) instead of being inflated in full, where the reference reads every entry completely. A package must not be able to exhaust the linter's memory: a highly-compressible entry otherwise forces unbounded heap growth up to OOM. Entries at or under the cap are read and CRC-verified exactly as before."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/771"

[[divergence]]
case = "global"
check = "jar-not-indexed"
kind = "missing"
reason = "Deliberate removal per triage: niche Java index check with negligible value at distro scale. The port does not emit it. The reference still emits it."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/blob/main/rpmlint/checks/ZipCheck.py"

[[divergence]]
case = "global"
check = "ZipCheck"
kind = "behaviour"
reason = "An entry whose compression method the reader cannot inflate (the reader supports stored and deflate only; e.g. zstd, method 93) is reported unable-to-read-zip (W), aborting the file, where the pre-change port charged it bad-crc-in-zip (E): no CRC verdict exists in this reader for an entry it cannot inflate, corrupt or not, so a corrupt unsupported-method entry is W here regardless of its stored CRC. Against the reference the split is codec-dependent: on a Python without the codec, testzip() raises NotImplementedError (a RuntimeError subclass) and ZipCheck's outer handler reports the same W; on a Python with the codec (zstd ships with Python 3.14+) the reference verifies the entry and stays silent or reports bad-crc-in-zip (E). Measured on Factory: taisei-data 1.4.6-1.1 ships two archives carrying zstd-method entries — /usr/share/taisei/00-taisei.zip (239 of 1,090 entries) and /usr/share/taisei/10-l10n.zip (3 of 10 entries) — and 7z t verifies both archives intact (Everything is Ok); both fired bad-crc-in-zip before this change."
since = "0.4.1"
upstream = "https://github.com/rpm-software-management/rpmlint/blob/main/rpmlint/checks/ZipCheck.py"

[[divergence]]
case = "global"
check = "ZipCheck"
kind = "behaviour"
reason = "Fix-and-diverge (issue #1224): a new `corrupt-class-file` warning fires when a `.class` entry of a zip-family archive (zip, jar, war, ear) has a corrupt or truncated 8-byte header: bad magic (first four bytes not `CAFEBABE`) or fewer than 8 bytes actually read. Entries that fail to read are skipped: the CRC pass above already reported them. The major version is not floored: no openSUSE policy floor exists for it, so a well-formed header at any major stays quiet. The frozen 2.10.0 reference has no such check."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/1224"
