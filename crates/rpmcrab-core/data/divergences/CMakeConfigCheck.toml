# Divergence ledger entries owned by `CMakeConfigCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "CMakeConfigCheck"
kind = "behaviour"
reason = "Deliberate config divergence: rpmcrab enables CMakeConfigCheck in its bundled default config (crates/rpmcrab-core/data/configdefaults.toml) and in the vendored openSUSE flavour config (crates/rpmcrab-core/data/distro/opensuse/opensuse.toml, appended by EXTRA_CHECKS in scripts/generate-distro-configs.py). The reference has no CMakeConfigCheck at all -- no shipped config lists one and no reference check reads CMake payload files -- so nothing runs there. The check is run-scoped (see the cmake-dangling-imported-location entry), so enabling it by default changes nothing on the partial and single-package inputs the reference is used on."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/1031"

[[divergence]]
case = "global"
check = "cmake-dangling-imported-location"
kind = "behaviour"
reason = "New port-only Warning with no reference counterpart: cmake-dangling-imported-location (CMakeConfigCheck, reported from after_checks) fires once per CMake export file whose IMPORTED_LOCATION values (its own and its <stem>-*.cmake satellites', with ${_IMPORT_PREFIX} substituted) do not all name non-%ghost entries of the build. An export file is judged only when it is itself a *Config.cmake/*-config.cmake file or is reachable from one in the same package (named by stem in the same directory, by absolute path, or matched by a file(GLOB ...) pattern, transitively); values carrying a ${...} variable or a $<...> generator expression are skipped as undecidable. The verdict is run-scoped: a build is judged only when the run holds its source package (header name-version-release plus .src.rpm/.nosrc.rpm equal to the binaries' SOURCERPM); on partial or single-package input the check is silent. The level is Warning: the firing population permanently includes cross-build cases one run cannot decide (flavour builds importing the base build's libraries), so the population is not the defect population an Error is reserved for."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/1031"
