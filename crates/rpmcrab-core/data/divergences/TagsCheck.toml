[[divergence]]
case = "global"
check = "explicit-lib-dependency"
kind = "behaviour"
reason = "The reference lib-package regex's unanchored `libs?[\\d-]*` alternative matches any dependency name ending in \"lib\" (e.g. `appstream-glib`), which is not a library at all. Per openSUSE naming policy library packages are named `lib*`, which is what this check targets here; rpmcrab anchors both alternatives to the start of the name, so genuine `libfoo` findings still fire while suffix false positives stay silent. This knowingly silences non-`lib*` true positives like `Requires: zlib`, where the reference is right. Concrete case: rpmcrab's own package requires `appstream-glib` for its `appstream-util` binary (a runtime subprocess invocation rpm's autodeps can never see); the reference flags it, rpmcrab does not."
since = "0.1.0"

[[divergence]]
case = "global"
check = "explicit-lib-dependency"
kind = "behaviour"
reason = "Capability names are not library package names (#753): symbol capabilities in the SUSE lib<name>__<symbol> namespace — provided by a library package so individual symbol ABIs can be pinned; libuuid1 provides libuuid__uuid_generate_time_cont, which uuidd requires to restart against the new libuuid after an update — and qualified capabilities such as libzypp(econf) or libclc(llvm23) stay silent. The separators are decidable: plain library package names contain neither \"__\" nor \"(\". The reference's lib-package regex matches the lib prefix and fires E on both forms. Measured over the full Factory corpus (17,242 source packages, 2026-10-19): 625 findings before — 1 symbol capability, 5 qualified capabilities, 619 plain unversioned lib package names; after the fix the 6 capability findings are gone and the 619 plain-name findings are unchanged."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/753"

[[divergence]]
case = "global"
check = "explicit-lib-dependency"
kind = "behaviour"
reason = "Rich `(libfoo if bar)` / `(libfoo unless bar)` dependencies yield `libfoo` as a leaf (the condition is a predicate, not a requirement, but the then-branch is real), so explicit-lib-dependency fires. The reference applies its anchored `^lib` regex to the whole `\"(libfoo if bar)\"` string, which does not match, so it stays silent. A conditional requirement is still a requirement — the divergence is intentional. Same for devel-dependency with `(foo-devel if bar)`."
since = "0.1.0"

