[[divergence]]
case = "global"
check = "spelling-error"
kind = "behaviour"
reason = "Backend is the pure-Rust spellbook crate, not pyenchant; findings may differ from the reference on the same input even with a dictionary present. The port adds a bundled supplementary vocabulary (crates/rpmcrab-core/data/spelling-wordlist.txt) to the dictionary — entries carry hunspell affix flags where derivations are regular — so established technical vocabulary the reference's en_US-only backend flags is not a finding here; British spellings stay findings, as package descriptions are en_US text. URLs and email addresses are skipped whole, as the reference's URL and email filters skip them; the reference's tokenizer still checks some bare-host labels the port's host rule skips (docs and qwargl in docs.qwargl.io)."
since = "0.1.0"

[[divergence]]
case = "global"
check = "TagsCheck"
kind = "behaviour"
reason = "License: this is a deliberate asymmetry, not parity. Expressions are split into pieces before validation, and each piece gets its own WITH-exception match plus validity check, which on the WITH dimension reports strictly more than the reference -- the safer direction. The reference matches the exception regex against the whole string and then validates only the pre-WITH part, so sibling pieces (an invalid license in another paren group, a trailing tail after a WITH expression) are silently dropped from validation. An empty group `()` is kept as a literal piece (the reference reports invalid-license for it). The split is iterative and linear, so adversarial nesting terminates; its cut points are the nesting-aware ones of the invalid-license entry for issue #864."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/issues/676"

[[divergence]]
case = "global"
check = "TagsCheck"
kind = "behaviour"
reason = "Rich `(a or b)` expressions (RPM >= 4.13) are parsed into their leaves and the name/version analyses run against each leaf, so `Requires: (any or goodpkg)` emits `E: invalid-dependency any` where the reference emits nothing: its `parse_deps` (pkg.py:294, `re.split(r'[\\s,]+')`) shreds the expression into `(any`, `or`, `goodpkg)` and the `^any$` invalid-requires pattern never matches a fragment. Flagging the real leaf is the intended analysis, not shredded-string noise; treating the expression as one opaque token would hide genuinely invalid dependencies. Pinned by emission-path tests in tags.rs."
since = "0.1.0"

