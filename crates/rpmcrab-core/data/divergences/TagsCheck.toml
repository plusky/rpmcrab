[[divergence]]
case = "global"
check = "explicit-lib-dependency"
kind = "behaviour"
reason = "Fix-and-diverge (plusky/rpmcrab#851): explicit-lib-dependency fires only where the explicit requirement duplicates a dependency the package's own binaries already generate. The generated dependencies sit in the same header marked RPMSENSE_FIND_REQUIRES, and the library package they belong to follows the shared-library naming convention, so the duplication is decidable from the header alone: the explicit name must be the conventional package name of a generated soname dependency under the full-version SLPP mapping BinariesCheck uses (stem and version dots fold to underscores: lib<stem><version> or lib<stem>-<version>, so libfoo.so.10.0.0 maps to libfoo10_0_0 and libdb-4.8.so to libdb-4_8). Explicit requirements with no matching generated soname are the only expression of a real dependency and stay silent: ctypes-loaded libraries (python-libnacl on libsodium26), runtime-invoked tool packages (clevis-luks on libpwquality-tools), data companions (libthai-data, libgarcon-data), NSS module packages (libnss_usrfiles2) and flavour pins (libopenblas_pthreads0). The bare lib<stem> name is not a candidate: it names a different package than the library package (the libnbd tools package vs libnbd0, which provides libnbd.so.0). The reference fires on every unversioned lib* name. Measured on the Factory sweep run-20261022-857d5ece, re-run with the #851 narrowing over the same 284 source packages: 548 E in 284 source packages before, 26 E in 23 source packages after; the residue is the libyui sibling packages on libyui16 (7), the Lua database bindings on libmariadb3 (4), Qt6 requirers on libQt6Core6/libQt6Svg6 (4), the python-seccomp and python-systemd bindings (2 each), onedrive on libdbus-1-3 and libnotify4, and cyrus-sasl-bdb, jack, kunifiedpush, libiptcdata and xwayland."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/851"

[[divergence]]
case = "global"
check = "devel-dependency"
kind = "behaviour"
reason = "Fix-and-diverge (issue #861): devel-dependency credits a same-family cross pair \u2014 a requirer in a cross toolchain family (a cross-<target>-gcc... compiler, or any mingw32-*/mingw64-* package) whose devel-matching requirement is that family's own target sys-root devel package. The credit is narrow, a genuine sys-root leaf only, and decidable from the names alone. Cross names: the requirer is a compiler package, cross-<target>-gcc... (the tool component is the first gcc/gcc<version> component and may carry further components, as in gcc13-bootstrap; the target is what precedes it), and the leaf is that target's sys-root package, cross-<target>-<libc>-devel with libc glibc or newlib. For -elf requirers the libc is part of the pair: the target carries a trailing -elf component the sys-root packages drop (cross-riscv64-elf-gcc13 pairs with cross-riscv64-newlib-devel; riscv64-elf is the only -elf target in the measured population), and that spelling is the newlib toolchain, so the stripped form credits only a newlib leaf \u2014 cross-riscv64-elf-gcc13 on cross-riscv64-glibc-devel fires. The strip mirrors the leaf-side spelling: the sys-root packages drop the -elf component (cross-riscv64-newlib-devel, not cross-riscv64-elf-newlib-devel), while -none is part of the target the sys-root packages keep (cross-arm-none-newlib-devel), so no strip applies to it and an arm leaf never pairs with an arm-none requirer. A requirer name without the -elf spelling carries no libc component, so its matching is on the target alone and either libc leaf on that target credits \u2014 cross-riscv64-gcc13 on cross-riscv64-newlib-devel stays silent alongside its measured glibc pair. Both libc spellings occur among the measured families whose names carry no -elf suffix (glibc for the Linux targets, newlib for amdgcn, arm-none, nvptx and rx), so the target alone is the decidable predicate there, and the collision is pinned explicitly. MinGW names: a mingw32-* or mingw64-* requirer pairs only with the same bitness family's sys-root leaves \u2014 mingw32-headers and mingw32-winpthreads-devel for a mingw32 requirer, mingw64-headers and mingw64-winpthreads-devel for a mingw64 requirer. Within one family the sys-root devel package is the compiler's runtime data \u2014 the target headers and libraries the toolchain consumes as a whole \u2014 so the harm model (a runtime package dragging host development files onto end systems) runs in reverse. The credit is per leaf, so a credited leaf does not consume the finding's once-per-package latch: a later host devel requirement in the same package still fires. The reference charges these pairs unchanged. Measured on the Factory corpus (sweep run-20261022-857d5ece population; the 129 source packages carrying the class re-measured before and after with scan.py, the before side reproducing the sweep's 146 exactly, all 60,430 findings in those packages compared, none added and no other finding changed): 146 E in 129 source packages before, 97 E in 80 after. Silenced (49): the cross gcc families on their own sys-root devel (43 \u2014 aarch64, hppa, loongarch64, ppc64le, riscv64 and s390x on glibc-devel, 22; amdgcn, arm-none, nvptx, riscv64-elf and rx on newlib-devel, 21) and the MinGW families (6: the mingw32 and mingw64 cross-gcc, cross-gcc-bootstrap and runtime packages on their own headers). No winpthreads pair occurs in the measured population \u2014 its MinGW packages require headers only \u2014 so the winpthreads half of the credit is unmeasured: it stands on the leaf set's construction (headers and winpthreads-devel are the bitness family's two sys-root devel packages) and is pinned in tags.rs. Every silenced pair is a gcc requirer on its own target's glibc/newlib sys-root leaf or a MinGW package on its own bitness headers, so the narrowed sys-root-leaf credit covers the measured population exactly and the measurement stands. The residue (97) is host packages requiring host devel packages and keeps firing: the Java family (13 \u2014 jmods packages, ant, bazel and tools on java devel), python binding packages (12), kernel-family leaves (9), the guile family (7), qwt designers and examples (5), lazarus (5) and 46 further host-on-host pairs (compilers on glibc-devel, examples, designers and plugins on their own libraries' devel packages, busybox-static requirers). The boundary is pinned both ways: a different target's sys-root devel package fires, a same-target devel match that is not a sys-root leaf fires (cross-aarch64-gcc13 on cross-aarch64-foo-static, cross-aarch64-binutils-devel and its own cross-aarch64-gcc13-devel), a target runtime package on its own sys-root leaf fires because the requirer is not a compiler (cross-aarch64-glibc on cross-aarch64-glibc-devel), the wrong libc's sys-root package fires for an -elf toolchain, a requirer without the -elf spelling credits either libc leaf on its target (cross-riscv64-gcc13 on cross-riscv64-newlib-devel stays silent), a MinGW library devel package fires (mingw64-foo-devel), prefix-only targets fire in both directions (the leaf's target a prefix of the requirer's: cross-arm-none-gcc14 on cross-arm-glibc-devel; the requirer's target a prefix of the leaf's: cross-arm-gcc13 on cross-arm-none-newlib-devel), host-to-cross and cross-to-host fire, a cross requirer on a MinGW leaf and a MinGW requirer on a cross leaf fire (cross-aarch64-gcc13 on mingw64-headers; mingw64-cross-gcc on cross-aarch64-glibc-devel), and the other MinGW bitness fires. Pinned by devel_dependency_cross_family_pairs_are_silent, cross_family_spelling_rules_900, devel_dependency_cross_family_non_elf_libc_collision_is_silent, devel_dependency_cross_family_rich_leaf_is_silent, devel_dependency_cross_family_near_misses_still_fire and devel_dependency_credited_leaf_does_not_consume_the_latch in tags.rs."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/861"

[[divergence]]
case = "global"
check = "invalid-license"
kind = "behaviour"
reason = "Fix-and-diverge (issue #864): the licence split cuts at parentheses of any depth (and at the whitespace-surrounded boolean operators, as before), so the pieces the group structure yields are the bare leaves inside it. Three pieces are not bare leaves: the literal `()` a bare empty group survives as, a piece still carrying its WITH exception (the exception is matched per piece, as the TagsCheck entry above records), and the whole-expression fallback piece below. The reference's license_regex group alternative stops at the first closing paren, so where its validation reaches a nested group it validates parenthesis fragments instead of the leaves inside: `(LGPL-3.0-only OR (GPL-2.0-only OR GPL-3.0-or-later))` yields reference findings for `(GPL-2.0-only` and a bare `)` (verified by running the pinned 2.10.0 algorithm verbatim; the libQt5Help5 expression itself is dropped whole by the reference's whole-string WITH pre-match, the asymmetry of the TagsCheck entry above). Measured on the Factory corpus (sweep run-20261022-857d5ece population; the 10 affected source packages re-measured before and after, the before side reproducing the sweep's 43 exactly): 43 E in 10 source packages before, 11 E in 5 after, and no other E or W finding changing in those packages. Each of the 32 removed errors carried its own invalid-license-spellcheck I suggestion, so the I count falls by the same 32: 39 I in the 10 packages before, 7 I after. The 32 removed findings are all parenthesis fragments over valid leaves: `(GPL-2.0-only` (14) and a bare `)` (10) across the libqt5-qttools/libqt5-qtxmlpatterns/pyside6/shiboken6 families, `(Apache-2.0` (3, lapce and sccache), and `Unicode-DFS-2016)`, `Unicode-DFS-2016 )`, `MIT)`, `BSD-3-Clause)` and `(MIT` (1 each). The residue is bare text that fires under any split, per source package: dssim's AOMPL-1.0, Apache2 and VP8 (1 each); sheldon's BSD-4-clause (3); ima-evm-utils' LicenseRef-GPL-2.0-with-openssl-exception (3); lapce's MPL-2.0-or-later (1); and helvum's `MIT AND` (1) — helvum's licence value ends in a dangling operator, and the operator cuts need whitespace on both sides, so the trailing operator is never a cut point and the tail piece is the malformed text itself, reported rather than silently accepted. Unbalanced parens are structural too: the leaf inside is validated, never a fragment. When no piece survives the split at all — an expression of only parentheses and operators — the expression is reported whole rather than silently accepted, unless it is empty or a whitespace-only group, which vanishes as in the reference. Pinned by license_split_yields_bare_leaves, license_nested_parens_report_the_bare_leaf and license_deeply_nested_parens_terminates in tags.rs."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/864"

