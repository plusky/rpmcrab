kind = "behaviour"
reason = "Same requirer-side class as the devel-dependency entry: biarch/flavored devel packages (`-devel-32bit`, `-devel-doc`, `-debug-libs`, ...) are recognized as devel packages, so their lib requirements do not trip explicit-lib-dependency. The reference only matches the devel-name suffix form and treats these requirers as runtime packages."
