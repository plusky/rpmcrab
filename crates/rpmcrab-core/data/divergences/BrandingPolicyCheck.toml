# Divergence ledger entries owned by `BrandingPolicyCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "branding-requires-unversioned"
kind = "behaviour"
reason = "Fix-and-diverge (issue #857): branding-requires-unversioned is charged only when the require name is the generic branding name in full — <base>-branding or <base>-theme, with nothing before it or after it — and the name is not an icon-theme name (<base>-icon-theme; the reference defines re_icon_theme for the same distinction and leaves it unused). The reference matches the generic pattern as a prefix, so it charges concrete data packages whose names merely contain the pattern: the icon themes the desktop packages integrate with, plural and suffixed theme packages (gnome-themes, kalpa-themes-sddm, ocean-sound-theme6) and non-name require forms (a soname, a config() name). A version on a require of a concrete data package pins no flavour, so the finding's rationale — the version pins the flavour of a branding virtual — reaches only the generic name itself, on the theme arm as on the branding arm. Measured on the Factory corpus (sweep run-20261022-857d5ece population; the 108 affected source packages re-measured before and after the fix): 133 E in 108 source packages before, 21 E in 19 after, and no other finding changed in those packages. The residue is 15 findings on branding virtuals (wallpaper-branding 2; compiz-branding, distrobox-branding, gcin-branding, libpurple-branding, lxde-common-branding, mate-menus-branding, plymouth-branding, pw3270-branding, systemd-default-settings-branding, systemd-presets-branding, xfce4-notifyd-branding, xfce4-session-branding and yast2-qt-branding 1 each) and 6 on concrete data packages whose names are exactly generic-shaped and so are indistinguishable from a theme virtual by name: yast2-theme 4 and python313/python314-pydata-sphinx-theme 1 each. Pinned by unversioned_requires_scoped_to_generic_branding_names in branding_policy.rs."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/857"

[[divergence]]
case = "global"
check = "branding-requires-unversioned"
kind = "severity"
reason = "Deliberate severity recalibration (plusky/rpmcrab#953, decided 2026-10-25): the port reports W where the reference reports E. This supersedes the residue acceptance in the #857 entry above, which kept the scoped residue at E. The residue audit over the Factory corpus (51,589 binary RPMs, pristine main daf458a2) finds 25 E findings; in 19 of the 25 the versioned require the finding prescribes (= the requirer version) is unsatisfiable by the branding flavour the distribution ships by default, because branding flavours carry their own version train: plymouth 22.02.122+94.4bd41a3 against plymouth-branding-openSUSE providing plymouth-branding = 84.87.20240405, NetworkManager 1.58.1 against 42.1, systemd 261.3 against systemd-presets-branding = 12.2 and systemd-default-settings-branding = 0.10-1.5, both wallpaper-branding requirers against 84.87.20240405, and pw3270, whose only provider carries the virtual unversioned. In the remaining 6 (compiz, distrobox, libpurple, mate-menus, xfce4-notifyd, xfce4-session) the default flavour happens to track the requirer version. An error charges a packager with a require the shipped flavour cannot satisfy; as a warning the unversioned require stays visible for the cases where a version pin is attainable. The description text carries the same guidance: where the branding version does not track the package version, a versioned requirement cannot be satisfied and the package should suppress the warning in its rpmlintrc. Pinned by requires_specific_flavor_is_error in branding_policy.rs."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/953"

[[divergence]]
case = "global"
check = "BrandingPolicyCheck"
kind = "behaviour"
reason = "Fix-and-diverge (issue #954): branding-conflicts-missing, branding-supplements-missing and branding-provides-missing are charged only on the branding arm \u2014 a package named <base>-branding-<flavor>. The reference charges all three on the theme arm as well. Themes are additive content packs: they co-install and are selected by name, and a generic <base>-theme virtual for them to provide exists only where an ecosystem creates one. Corpus tabulation (Factory binary corpus, 221 flavour-shaped packages): of 126 branding-type packages, 109 provide the generic virtual (64 of them versioned with conflicts) \u2014 the flavour mechanism is live on that arm; of 95 theme-type packages, 80 carry no flavour marker at all (no generic provide, no generic conflict, no supplement) and 0 carry the prescribed supplement, and only enlightenment-theme-upstream and terminology-theme-upstream provide the virtual versioned (both still charged supplements-missing by the reference). Factory plymouth's 7 theme packages draw 21 E on the trio. A theme package that provides the generic name is still charged branding-provides-unversioned for an unversioned provide, and the requirer-side and excessive-dependency findings apply on both arms. Pinned by theme_package_without_obligations_is_silent_on_the_trio, branding_package_missing_all_obligations_reports_the_trio, participating_theme_package_is_silent_on_the_trio and branding_package_missing_one_obligation_reports_exactly_that_one in branding_policy.rs."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/954"

[[divergence]]
case = "global"
check = "branding-supplements-missing"
kind = "behaviour"
reason = "Fix-and-diverge: the reference (and this port before the fix) credits only a Supplements entry string-equal to the prescribed `(base and branding-<flavor>)` form. A supplement whose rich-boolean tree carries `branding-<flavor>` — unversioned, unqualified — as a conjunct of a plain conjunction gates on the flavour in exactly the same way, whatever the base conjuncts are, so the check credits it. The base atom is not separately verified: it never has been (the prescribed literal with a nonexistent base, e.g. wallpaper-branding-openSUSE's `(wallpaper and branding-openSUSE)`, never triggers either), so crediting the flavour conjunct matches the check's decidable content without inventing a base-existence test. Corpus sizing (Factory sweep, 79 branding-supplements-missing findings): 8 packages carry such a conjunction and stop firing — grub2-branding-openSUSE `((grub2 or grub2-common) and branding-openSUSE)` (compound base mirroring its own Requires), yast2-qt-branding-openSUSE `(libyui-qt and branding-openSUSE)`, gio-branding-upstream, gtk4-branding-upstream, plasma6-branding-openSUSE, sddm-branding-openSUSE and systemd-presets-branding-{MicroOS,openSUSE} (renamed bases, supplements live against the real packages). The other 71 keep firing: 15 carry no Supplements at all (wallpaper-branding-openSUSE among them), 53 carry the zypp `packageand(base:branding-<flavor>)` spelling (deliberately not credited — the settled #853/#854 doctrine), 2 carry a conjunction on a different flavour's atom (libreoffice-branding-upstream supplements branding-openSUSE; systemd-presets-branding-Aeon supplements branding-MicroOS), 1 carries a rich supplement with no branding atom (sddm-qt6-branding-openSUSE), and none carries the flavour atom under `or`, `if`, `without` or in versioned form. A flavour atom under `or`, `if`, `unless`, `with` or `without`, a versioned flavour atom, and a bare flavour atom (not a conjunction) all still fire. Pinned by rich_supplement_with_compound_base_credits, rich_supplement_with_renamed_base_credits, rich_supplement_with_nested_and_credits, packageand_supplement_still_fires, flavour_atom_under_or_still_fires, flavour_atom_under_if_still_fires, flavour_atom_under_without_still_fires, versioned_flavour_atom_still_fires, wrong_flavour_conjunct_still_fires and bare_flavour_atom_still_fires in branding_policy.rs."
since = "0.4.1"

[[divergence]]
case = "global"
check = "branding-requires-specific-flavor"
kind = "behaviour"
reason = "Ruled-and-diverge: the finding is not charged on branding-type pins required by packages in the reserved patterns-* namespace. The reference charges every requirer, patterns packages included (parity proven on the Factory corpus by driving the reference check class on the real packages). Patterns packages are the distribution composition layer, the place where a product flavour selection is made, not a consumer of it: their pins mix own-flavour selections (Aeon patterns pinning branding-Aeon) and borrowed-flavour selections where no own flavour exists (Aeon patterns pinning branding-openSUSE), including rich conditional pins that engage only when the flavour marker is present. A generic require cannot express the composition, since any installed flavour would satisfy it. The exemption keys on the namespace prefix, a role marker, not on package identities; names merely containing pattern are not exempt. Theme-type pins stayed charged on every requirer under this change, patterns packages included; they were exempted wholesale (the theme-type entry at the end of this file). Measured on the Factory corpus (51,589 binary RPMs, header census confirmed by the pristine binary): 60 findings in 27 packages before, 25 in 18 after; the removed set is exactly the 35 patterns branding pins, and a 197-package scan set (the 27 firing packages, their same-source siblings and a fixed random sample) moves 632 to 597 findings with no other finding movement. Pinned by patterns_branding_pins_are_composition_not_consumption and near_miss_names_are_not_patterns_packages in branding_policy.rs."
since = "0.4.1"
upstream = "https://github.com/rpm-software-management/rpmlint/blob/main/rpmlint/checks/BrandingPolicyCheck.py"

[[divergence]]
case = "global"
check = "branding-requires-specific-flavor"
kind = "behaviour"
reason = "Fix-and-diverge: on the requirer side the finding is charged on package names — require names that parse as a branding or theme flavour pin, unless the name is an ELF shared-library capability name. The reference matches its branding pattern as a prefix against every require name, including ELF shared-library capability names, so a branding-shaped soname (audacity requiring lib-theme-resources.so()(64bit), the theme-resources library of the Audacity theme engine) is charged as a flavour pin. A capability name names a library, not a package, and pins no flavour; the #857 entry above already records the same scoping principle for this check's unversioned finding (non-name require forms - a soname, a config() name - are out of scope there). Measured on the Factory corpus (51,589 binary RPMs, header census confirmed by the pristine binary): 60 findings in 27 packages before, 59 in 26 after; the removed finding is exactly the soname, and a 197-package scan set (the 27 firing packages, their same-source siblings and a fixed random sample) shows no other finding movement. Package-name near-misses without a .so component keep firing. The capability test reads the whole tail after the first .so: version groups of . plus digits and parenthesised symbol sets only — a dotted name that continues past its decoration (a flavour spelled after a soname version) is a package name and stays charged. Pinned by soname_requires_are_not_flavor_pins in branding_policy.rs."
since = "0.4.1"
upstream = "https://github.com/rpm-software-management/rpmlint/blob/main/rpmlint/checks/BrandingPolicyCheck.py"

[[divergence]]
case = "global"
check = "branding-requires-specific-flavor"
kind = "behaviour"
reason = "Ruled-and-diverge: the finding is not charged on theme-type pins on any requirer. The reference charges theme pins exactly as branding pins (parity proven on the Factory corpus by driving the reference check class on the real packages). The specific-flavor doctrine redirects a pin to the sanctioned generic virtual the pin bypasses; on the theme arm that premise fails - of the 15 theme-type findings on the corpus, 13 require a generic <base>-theme name with zero providers corpus-wide (gtk2-theme, dmz-icon-theme, pagure-theme, icewm-theme, texlive-beamer-theme, plasma6-sddm-theme), so the prescribed generic require is unsatisfiable, and the remaining 2 (enlightenment-theme-dft, terminology-theme-dft) sit in ecosystems that maintain flavour-specific theme names as the norm. Themes are additive content packs selected by name (the #954 doctrine), not flavour selections; this extends that doctrine from the obligations arm to the requirer side. The exemption keys on the require name's parsed type component, not on package identities or provider lookups; branding-type pins keep firing on every non-patterns requirer, and a name merely containing theme outside the type position (libtheme-branding-openSUSE) keeps firing. A theme pin is skipped before either requirer arm: it is not a generic-name require either, so the unversioned arm does not re-read a pin whose flavour is branding (the corpus shape icewm-theme-branding) as a generic branding require. Measured on the Factory corpus (51,589 binary RPMs, pristine binary): the tag moves 24 findings in 17 packages before, 9 in 7 after; the removed set is exactly the 15 theme-type pins, and a 197-package scan set (the 27 original firing packages, their same-source siblings and a fixed random sample) moves 609 to 594 findings with no other finding movement. Pinned by specific_flavor_charge_matrix, patterns_branding_pins_are_composition_not_consumption and theme_pin_with_branding_flavour_is_fully_silent in branding_policy.rs."
since = "0.4.1"
upstream = "https://github.com/rpm-software-management/rpmlint/blob/main/rpmlint/checks/BrandingPolicyCheck.py"
