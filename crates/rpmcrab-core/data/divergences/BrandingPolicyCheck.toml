# Divergence ledger entries owned by `BrandingPolicyCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "branding-requires-unversioned"
kind = "behaviour"
reason = "Fix-and-diverge (issue #857): branding-requires-unversioned is charged only when the require name is the generic branding name in full — <base>-branding or <base>-theme, with nothing before it or after it — and the name is not an icon-theme name (<base>-icon-theme; the reference defines re_icon_theme for the same distinction and leaves it unused). The reference matches the generic pattern as a prefix, so it charges concrete data packages whose names merely contain the pattern: the icon themes the desktop packages integrate with, plural and suffixed theme packages (gnome-themes, kalpa-themes-sddm, ocean-sound-theme6) and non-name require forms (a soname, a config() name). A version on a require of a concrete data package pins no flavour, so the finding's rationale — the version pins the flavour of a branding virtual — reaches only the generic name itself, on the theme arm as on the branding arm. Measured on the Factory corpus (sweep run-20261022-857d5ece population; the 108 affected source packages re-measured before and after the fix): 133 E in 108 source packages before, 21 E in 19 after, and no other finding changed in those packages. The residue is 15 findings on branding virtuals (wallpaper-branding 2; compiz-branding, distrobox-branding, gcin-branding, libpurple-branding, lxde-common-branding, mate-menus-branding, plymouth-branding, pw3270-branding, systemd-default-settings-branding, systemd-presets-branding, xfce4-notifyd-branding, xfce4-session-branding and yast2-qt-branding 1 each) and 6 on concrete data packages whose names are exactly generic-shaped and so are indistinguishable from a theme virtual by name: yast2-theme 4 and python313/python314-pydata-sphinx-theme 1 each. Pinned by unversioned_requires_scoped_to_generic_branding_names in branding_policy.rs."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/857"

[[divergence]]
case = "global"
check = "branding-requires-unversioned"
kind = "severity"
reason = "Deliberate severity recalibration (plusky/rpmcrab#953, decided 2026-10-25): the port reports W where the reference reports E. This supersedes the residue acceptance in the #857 entry above, which kept the scoped residue at E. The residue audit over the Factory corpus (51,589 binary RPMs, pristine main daf458a2) finds 25 E findings; in 19 of the 25 the versioned require the finding prescribes (= the requirer version) is unsatisfiable by the branding flavour the distribution ships by default, because branding flavours carry their own version train: plymouth 22.02.122+94.4bd41a3 against plymouth-branding-openSUSE providing plymouth-branding = 84.87.20240405, NetworkManager 1.58.1 against 42.1, systemd 261.3 against systemd-presets-branding = 12.2 and systemd-default-settings-branding = 0.10-1.5, both wallpaper-branding requirers against 84.87.20240405, and pw3270, whose only provider carries the virtual unversioned. In the remaining 6 (compiz, distrobox, libpurple, mate-menus, xfce4-notifyd, xfce4-session) the default flavour happens to track the requirer version. An error charges a packager with a require the shipped flavour cannot satisfy; as a warning the unversioned require stays visible for the cases where a version pin is attainable. The description text carries the same guidance: where the branding version does not track the package version, a versioned requirement cannot be satisfied and the package should suppress the warning in its rpmlintrc. Pinned by requires_specific_flavor_is_error in branding_policy.rs."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/953"

[[divergence]]
case = "global"
check = "BrandingPolicyCheck"
kind = "behaviour"
reason = "Fix-and-diverge (issue #954): branding-conflicts-missing, branding-supplements-missing and branding-provides-missing are charged only on the branding arm \u2014 a package named <base>-branding-<flavor>. The reference charges all three on the theme arm as well. Themes are additive content packs: they co-install and are selected by name, and a generic <base>-theme virtual for them to provide exists only where an ecosystem creates one. Corpus tabulation (Factory binary corpus, 221 flavour-shaped packages): of 126 branding-type packages, 109 provide the generic virtual (64 of them versioned with conflicts) \u2014 the flavour mechanism is live on that arm; of 95 theme-type packages, 80 carry no flavour marker at all (no generic provide, no generic conflict, no supplement) and 0 carry the prescribed supplement, and only enlightenment-theme-upstream and terminology-theme-upstream provide the virtual versioned (both still charged supplements-missing by the reference). Factory plymouth's 7 theme packages draw 21 E on the trio. A theme package that provides the generic name is still charged branding-provides-unversioned for an unversioned provide, and the requirer-side and excessive-dependency findings apply on both arms. Pinned by theme_package_without_obligations_is_silent_on_the_trio, branding_package_missing_all_obligations_reports_the_trio, participating_theme_package_is_silent_on_the_trio and branding_package_missing_one_obligation_reports_exactly_that_one in branding_policy.rs."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/954"
