# Divergence ledger entries owned by `build-env-severity-cap`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "build-env-severity-cap"
kind = "behaviour"
reason = "A binary package whose own header requires the name `this-is-only-for-build-envs` -- the SUSE marker for packages that exist only inside OBS build environments (the -mini flavours, bootstrap/stage1 helpers, rpmlint-mini) -- emits all its findings capped at W instead of E. Nothing provides the marker name, so a marked package cannot be installed on a real system and acquiring the marker is self-penalising: the cap and the install block are the same fact. The reference has no marker semantics and reports the same findings at E. The cap is applied in `Filter::add_info` after [Scoring], strict promotion and [SeverityOverrides], so no promotion raises a marked package back to E; W and I findings are byte-identical and nothing is suppressed: the package fires everything, but it can never error, so the packager can still see every finding. Source/spec-level and cross-package findings are not tied to a binary header and are unchanged. Measured on the 2026-10-26 Factory corpus: 23 carrier packages, 132 E demote to W, 0 silenced, 0 added."
since = "0.4.1"
