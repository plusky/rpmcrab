# Divergence ledger entries owned by `BuildRootAndDateCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "BuildRootAndDateCheck"
kind = "behaviour"
reason = "The run day derives from UTC (OffsetDateTime::now_utc(), rendered by format_date()), while the reference's time.strftime('%b %e %Y') uses local time. Near midnight the two disagree on the civil date, which moves which files trigger file-contains-current-date and file-contains-date-and-time. The port takes UTC so the findings do not depend on the lint host's timezone."
since = "0.4.1"

[[divergence]]
case = "global"
check = "BuildRootAndDateCheck"
kind = "behaviour"
reason = "format_date() hardcodes English month abbreviations, while the reference inherits the ambient locale for %b (BuildRootAndDateCheck.__init__ is one of the few places the reference does not apply ENGLISH_ENVIRONMENT). On non-English locales the reference matches e.g. 'Okt' where the port matches 'Oct'."
since = "0.1.0"

[[divergence]]
case = "global"
check = "BuildRootAndDateCheck"
kind = "detail"
reason = "`BuildRootAndDateCheck.toml` is the mechanical union of the reference's `descriptions/BuildDateCheck.toml` and `descriptions/BuildRootCheck.toml` (entries byte-identical); the port merged the two reference checks into one, so a single file named after the port check keeps the check-name to TOML mapping total. Provenance: `crates/rpmcrab-core/data/descriptions/README.md`."
since = "0.1.0"

[[divergence]]
case = "global"
check = "BuildRootAndDateCheck"
kind = "detail"
reason = "Staged `--explain` texts for `file-contains-current-date` and `file-contains-date-and-time` were garbled (`may cause the package to rebuild in excess`, `causes the package to rebuild when not needed`). Reworded to name the actual harm: the file content changes with the build date (and time), so rebuilding the same sources does not produce the same package (the date-only entry hedges this to `may not`, since a rebuild on the same date is unchanged). The texts now name the build's wall-clock date (and time) and give the fix as stamping from SOURCE_DATE_EPOCH instead of the current date or time; the date-and-time text no longer claims the file uses __DATE__ and __TIME__, which the check's read path never sees in an ELF."
since = "0.4.1"

[[divergence]]
case = "global"
check = "BuildRootAndDateCheck"
kind = "behaviour"
reason = "A stamp that is the package's own SOURCE_DATE_EPOCH is not reported; the reference has no such exemption. SDE is taken from BUILDTIME when BUILDHOST is reproducible, else from $SOURCE_DATE_EPOCH (shared sourcing: checks::shared::source_date_epoch). For file-contains-date-and-time, occurrences of SDE's exact stamp (its date in %b %e %Y shape, whitespace, its HH:MM:SS in UTC) are removed before the reference's rule judges the rest of the file. For file-contains-current-date the finding stays silent whenever SDE's UTC day is the run day, which also silences a wall-clock date-only stamp from a build that ran that day."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/1180"
