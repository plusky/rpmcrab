# Divergence ledger entries owned by `SourceCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "SourceCheck"
kind = "detail"
reason = "parse_octal mirrors the reference's int(value, 8) (sign, 0o prefix, PEP 515 underscores, Unicode decimal digits), but magnitudes beyond u128 saturate at u128::MAX where the reference keeps arbitrary precision. The saturated value only feeds equality against file mode bits, which neither a saturated nor an arbitrary-precision huge value can equal. Digits past saturation are still validated: trailing garbage makes parse_octal return None and SourceCheck::new panic, where the reference's int(value, 8) raises ValueError — both die on the bad entry rather than silently accepting it."
since = "0.1.0"

[[divergence]]
case = "global"
check = "SourceCheck"
kind = "behaviour"
reason = "Upstream rpmlint#4: a new `prebuilt-binary-in-sources` warning fires when a source archive (tar, gzip/xz/zstd/bzip2-compressed tar, zip — nested up to 5 deep) contains prebuilt binaries, detected by magic bytes: ELF, Java class, Python bytecode (.pyc/.pyo, magic plus name), and Java archives (.jar files are reported as a unit, their classes not listed separately). The frozen 2.10.0 reference has no such check (the issue is still open upstream)."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/issues/4"

[[divergence]]
case = "global"
check = "SourceCheck"
kind = "behaviour"
reason = "unicode_decimal_value (the Py_UNICODE_TODECIMAL mirror feeding parse_octal) tracks CPython 3.14.8's unicodedata (Unicode 16.0.0), regenerated from that interpreter (issue #553). The table is a strict superset of the previous one, which fingerprinted to CPython 3.7 / Unicode 11.0 data and missed Lepcha and Hanifi Rohingya even against that pin: 17 blocks join -- the nine the fingerprint found missing, plus Unicode 16.0's Garay, Myanmar Pao, Myanmar Eastern Pwo Karen, Sunuwar, Gurung Khema, Kirat Rai, Outlined and Ol Onal. Against a reference running an older CPython, an octal config value written in one of the added blocks parses here where the reference's int(value, 8) raises ValueError. The pin is stated at the table; when it moves, the table is re-derived from the new interpreter the same way."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/553"

[[divergence]]
case = "global"
check = "multiple-specfiles"
kind = "missing"
reason = "Deliberate removal (issue #883): a source package carrying several spec files is valid; OBS builds the spec the package defines. rpmcrab does not emit it."
since = "0.4.0"
upstream = "https://github.com/rpm-software-management/rpmlint/blob/main/rpmlint/checks/SourceCheck.py"

[[divergence]]
case = "global"
check = "SourceCheck"
kind = "behaviour"
reason = "Fix-and-diverge (issue #1022): a new `source-archive-contains-vcs-metadata` warning fires when a direct member of a source archive belongs to a version-control metadata tree: a `.(bzr|git|hg|svn)` directory, or a file directly inside a `CVS` directory. One finding per metadata root, with the entry count and total bytes. It is scoped to sources the spec declares without an upstream URL (librpm's parsed source list), so metadata inside an upstream tarball stays quiet; the `,v` and `RCS/` shapes are not charged, since a CVS repository fixture's `,v` files are content. Nested archives are not opened. The frozen 2.10.0 reference has no such check."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/1022"

[[divergence]]
case = "global"
check = "SourceCheck"
kind = "behaviour"
reason = "Fix-and-diverge (issue #1022): a new `source-archive-contains-lfs-pointer` warning fires when a direct member of a source archive is a git-lfs pointer stub: a regular member of 1-1023 bytes -- judged on the bytes actually read, not the archive's declared size -- that starts with the pointer version line (`version https://git-lfs.github.com/spec/v1`, or the legacy hawser URL, LF- or CRLF-terminated) and carries an `oid sha256:` line. A document quoting the version line after offset 0 is not a pointer and stays quiet. Nested archives are not opened. The frozen 2.10.0 reference has no such check."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/1022"

[[divergence]]
case = "global"
check = "SourceCheck"
kind = "behaviour"
reason = "Fix-and-diverge (issue #1220): a new `source-archive-contains-bidi-control` warning fires when a text member of a source archive (tar, compressed tar, zip, nested archives, or a compressed single file) contains one of the nine Unicode bidirectional control characters (U+202A-U+202E, U+2066-U+2069), one finding per member naming the first control and its line and column. Members decode as UTF-8 (with an optional byte-order mark) or as UTF-16 behind a byte-order mark; undecodable members are treated as binary and stay quiet. The surveyed exclusions stay quiet: a `.git` path component, `.desktop` and `.txt` suffixes, `Changelog` and `NEWS` basenames, case-folded, and the `.po`, `.tex`, `.html`, `.htm` and `.roff` suffixes. Plain payload files, including the spec, are not scanned here: the `bidi-control-character` payload scan already covers them. Archive nesting is capped at 5 levels, and a compressed single file is scanned as itself when decompression yields text; a decompressed payload that itself forms an archive is walked as archive members instead, and compression suffixes are stripped case-insensitively. The frozen 2.10.0 reference has no such check."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/1220"
