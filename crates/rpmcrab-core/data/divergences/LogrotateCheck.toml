[[divergence]]
case = "global"
check = "logrotate-log-dir-not-packaged"
kind = "behaviour"
reason = "The reference charges the raw parent directory of the config's path pattern, but that string can name a directory that cannot exist: a quoted log path keeps its opening quote (`\"/var/log/i2pd`) and the parent of a multi-level glob pattern keeps a glob component (`/var/log/pacemaker/bundles/*`). rpmcrab reduces the derived directory to its literal form and judges, and if needed charges, that directory. The reduction is exact: one leading and/or trailing double-quote is stripped, then one leading and/or trailing single-quote (a lone leading quote -- the usual shape, since a quoted path's closing quote sits in the dropped file part -- is stripped on its own); then the longest literal component prefix is kept, where a component containing any of `*`, `?` or `[` ends the prefix. The judged directory is satisfied by the since-0.1.0 `/var/log` exemption (applied to the judged directory), by any file-list entry of that exact name, or by the tmpfiles credit in the companion entry; the components below the prefix are per-client/per-bundle directories the daemon creates itself. Distinct raw directories that reduce to the same judged directory draw the charge once, since the charge names the judged directory."
since = "0.4.1"

[[divergence]]
case = "global"
check = "logrotate-log-dir-not-packaged"
kind = "behaviour"
reason = "A log directory the package creates itself through a tmpfiles.d snippet shipped in the same package is not reported. Scope, exactly: only `*.conf` snippets shipped under /usr/lib/tmpfiles.d/, /etc/tmpfiles.d/ or /run/tmpfiles.d/ count (%ghost snippets are skipped; systemd-tmpfiles reads only `*.conf` files from those directories), and only a line whose type field starts with `d` or `D` (modifier suffixes such as `d-` included) and whose path field, reduced to the same judged (literal) form as the directory under judgement, equals it. Only the type letter and the path are read -- the line's mode, user and group columns are not, so the credit certifies existence only, not the declared mode or owner; it is not the provision the file-list test certifies. A tmpfiles-satisfied directory also never reaches the `logrotate-user-writable-log-dir` test, which runs only for a directory present in the file list under its raw name, so unlike a packaged directory it is not mode/owner judged at all. The reference credits only file-list membership, so it also charges packages whose log directories exist solely as tmpfiles.d lines. Measured over the 133 corpus RPMs shipping logrotate.d files, this credit and the literal reduction (companion entry) together take the tag from 15 findings to 8; the tmpfiles-credit packages are krb5-mini, usbguard, pacemaker-cli and i2pd (the last two overlap the reduction: their judged directories are also glob/quote artefacts)."
since = "0.4.1"
