# Divergence ledger entries owned by `LogrotateCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "logrotate-log-dir-not-packaged"
kind = "behaviour"
reason = "Deliberate improvement over the reference (open rpmlint#551): /var/log itself is never reported by logrotate-log-dir-not-packaged. It is owned by the filesystem package, not by the package shipping the logrotate config, so flagging it is a false positive."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/issues/551"

[[divergence]]
case = "global"
check = "LogrotateCheck"
kind = "detail"
reason = "Typo fix in staged `--explain` text for `logrotate-duplicate`: the misspelling of `duplicated` fixed. Meaning unchanged."
since = "0.1.0"

[[divergence]]
case = "global"
check = "LogrotateCheck"
kind = "detail"
reason = "Port-only `--explain` description for `logrotate-exception`: the reference emits the finding but ships no description."
since = "0.1.0"

[[divergence]]
case = "global"
check = "logrotate-log-dir-not-packaged"
kind = "behaviour"
reason = "The reference charges the raw parent directory of the config's path pattern, but that string can name a directory that cannot exist: a quoted log path keeps its opening quote (`\"/var/log/i2pd`) and the parent of a multi-level glob pattern keeps a glob component (`/var/log/pacemaker/bundles/*`). rpmcrab reduces the derived directory to its literal form (one quote pair stripped, longest literal component prefix) and judges, and if needed charges, that directory; the glob components below it are per-client/per-bundle directories the daemon creates itself."
since = "0.4.1"

[[divergence]]
case = "global"
check = "logrotate-log-dir-not-packaged"
kind = "behaviour"
reason = "A log directory the package creates itself through a tmpfiles.d snippet shipped in the same package (a `d`/`D` line naming the directory exactly) is not reported: systemd-tmpfiles guarantees the directory with its declared mode and owner, the same provision the file-list test certifies. The reference credits only file-list membership, so it also charges packages whose log directories exist solely as tmpfiles.d lines (krb5-mini, usbguard, pacemaker-cli, i2pd)."
since = "0.4.1"
