[[divergence]]
case = "global"
check = "AtomicUpdateCheck"
kind = "behaviour"
reason = "A present-but-wrong-type AtomicCheckGhosts (e.g. the string \"false\") panics at construction; the reference treats any truthy value as enabled and runs. The port deliberately fails fast on a misconfigured type instead of reproducing the reference's permissiveness."
since = "0.1.0"

[[divergence]]
case = "global"
check = "AtomicUpdateCheck"
kind = "behaviour"
reason = "Config-scoped (issue #698, superseding issue #478): transactional updates are mandatory, so the check runs everywhere -- it is listed in the bundled default config and in both vendored flavor configs; the reference lists it only in its opensuse config, not in its configdefaults, so an unflavoured reference run never runs it. The generator's opensuse exclusion (EXCLUDED_OPENSUSE_CHECKS in scripts/generate-distro-configs.py) is empty, and the opensuse flavor keeps the filesystem exemption for the finding, as the slfo flavor does. Measured over the Factory corpus (17,242 srcpkgs, 2026-10-18): dir-or-file-outside-snapshot fires 58,713 times over 347 srcpkgs -- 94% of the lines under /srv/www, the FHS web root the distro mandates for web applications (nextcloud alone accounts for 30,148), and most of the rest /var state directories -- and ghost-outside-snapshot fires 7,289 times over 223 srcpkgs with AtomicCheckGhosts enabled (the shipped default is false). The port emits both findings exactly as the reference does, except the directory exemption ledgered under #711 and the per-folder aggregation of dir-or-file-outside-snapshot ledgered under #835 (the 58,713 count is the pre-exemption, pre-aggregation/reference-equivalent population)."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/698"

