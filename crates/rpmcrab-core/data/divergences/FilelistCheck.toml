[[divergence]]
case = "global"
check = "filelist-forbidden-opt"
kind = "behaviour"
reason = "Deliberate false-positive fix (issue #605): the port requires the /opt/ prefix, i.e. a component boundary, and skips empty providers. The reference matches the bare '/opt' prefix (FilelistCheck.py:132), so a payload under a longer sibling such as /optical/foo/... yields a bogus /opt/foo finding there, and a bare /opt directory entry yields a malformed /opt/ finding with an empty provider; the port reports neither. Genuine /opt/<provider> payloads fire exactly as in the reference."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/605"

