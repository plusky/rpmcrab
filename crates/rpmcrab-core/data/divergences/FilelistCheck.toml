# Divergence ledger entries owned by `FilelistCheck`.
# Assembled into tests/parity/divergences.toml by
# scripts/generate-divergences-ledger.py.

[[divergence]]
case = "global"
check = "filelist-forbidden-fhs23"
kind = "behaviour"
reason = "The reference emits filelist-forbidden-fhs23 once per matching Bad pattern, iterating a Python set (FilelistCheck.py:105); the port collects matches into a BTreeSet and emits one finding per FHS directory in sorted order, so one finding per pattern becomes one per directory and the order is sorted rather than set order."
since = "0.1.0"

[[divergence]]
case = "global"
check = "filelist-forbidden-fhs23"
kind = "behaviour"
reason = "The bundled GoodPrefixes additionally whitelist the MinGW cross-toolchain sysroots /usr/i686-w64-mingw32/ and /usr/x86_64-w64-mingw32/, which the MinGW packaging guidelines permit. The reference only stays silent via Filters shipped by the mingw32/64-filesystem packages; without those configs it emits the finding, so silencing it unconditionally is a deliberate false-positive fix (issue #386)."
since = "0.1.0"

