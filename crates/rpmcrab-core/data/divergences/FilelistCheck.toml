reason = "The reference fires filelist-forbidden-sysconfig on %ghost files under /etc/sysconfig: its sysconfig rule has no ghost exemption. Those files are generated by fillup at install time and carry no payload, so the port exempts %ghost files from the rule. Real files under /etc/sysconfig, in /var/adm/fillup-templates and in /etc/rc.config.d still fire. Provenance: bsc#1173167."
since = "0.3.0"
