[[divergence]]
case = "global"
check = "filelist-forbidden-fhs23"
kind = "behaviour"
reason = "Fix-and-diverge (issue #859): filelist-forbidden-fhs23 treats two further prefix families as good. The cross-toolchain target sysroots: the first component under /usr is one of the measured set FHSCheck sanctions (the *-suse-linux triples and the bare-metal targets, issue #582), consulted through that same set rather than a second copy - the sanction is the measured population, not the triplet shape, so a novel component of that shape (frobnicate-suse-linux) and a measured name extended by a suffix still fire, and a sysroot name below another component sanctions nothing. And the /usr/src tree: a package whose name ends in -source ships its payload there, so /usr/src is good for such a package, and /usr/src/kernel-modules joins /usr/src/debug and /usr/src/packages in the bundled GoodPrefixes as the tree kernel-module source packages install into; the same /usr/src payload in a package not named as a source package still fires. The reference's GoodPrefixes sanction none of these, so it emits the finding for all of them. Measured on the Factory corpus (sweep run-20261022-857d5ece population; the 134 affected source packages re-measured before and after the fix, the before side reproducing the sweep's 179 exactly and no other finding changing in those packages): 179 E in 134 source packages before, 32 E in 9 after. Silenced (147): 110 on cross-toolchain sysroots - every one a member of the sanctioned set, across the cross binutils/gcc/newlib and glibc-cross families (riscv64-suse-linux 11; avr and amdgcn-amdhsa 8 each; aarch64-suse-linux, arm-suse-linux-gnueabi, powerpc64le-suse-linux, rx-elf and s390x-suse-linux 7 each; the other 21 set members the remaining 48) - and 37 under /usr/src: 29 in packages named -source (the bazel family, nginx-source, googleapis-source, xorg-x11-server-source and their kin) and 8 /usr/src/kernel-modules findings in the nvidia signed-driver -devel packages, the tree virtualbox's -source packages also ship. The residue (32) is no sanctioned shape: /usr/local in reproducible-faketools (19, its deliberate PATH-shadowing wrappers), kernel-obs-build's five /.build.*.kvm root markers, /var/mail in exim and postfix-bdb, the installation-images-MicroOS /CD1 and /SuSE media roots, guix's /gnu and nix's /nix store roots, samba-client's /var/samba and xkeyboard-config's /var/. Pinned by cross_toolchain_sysroots_are_good_fhs_prefixes, every_measured_cross_sysroot_is_quiet_for_fhs23, unmeasured_usr_dirs_still_fire_fhs23, cross_sysroot_name_below_another_component_still_fires, source_package_usr_src_payload_is_quiet, usr_src_payload_of_other_packages_still_fires and kernel_modules_tree_is_quiet in filelist.rs, and cross_sysroot_matches_needs_the_leading_component in fhs.rs."
since = "0.4.0"
upstream = "https://github.com/plusky/rpmcrab/issues/859"

[[divergence]]
case = "global"
check = "FilelistCheck"
kind = "behaviour"
reason = "The reference fires filelist-forbidden-move-to-usr on %ghost files: its move-to-usr rule has no ghost exemption. Those files are generated at install time and carry no payload that could be moved (pam-config's /etc/pam.d/common-*-pc ghosts; the static vendor copies already live under /usr/lib/pam.d), so the port exempts %ghost files from the rule, as it already does for filelist-forbidden-sysconfig. Real files under /etc/pam.d, /lib/systemd/system and /lib/udev/rules.d still fire."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/947"

[[divergence]]
case = "global"
check = "filelist-forbidden-fhs23"
kind = "behaviour"
reason = "The FHS walk reports the path itself when its parent is a restricted dir (a top-level path's parent is empty and lands in the same fallback); when that path is one of the locations the check's own tables sanction - a restricted FHS root (/var, /usr, ...) or a GoodPrefix with its trailing slash dropped (/var/mail, /var/log, ...) - and the entry is in a suppressible form, the port does not report it: the finding would name a sanctioned FHS location as forbidden. Suppressible is a directory or a symlink by mode, or a %ghost by flag - RPMFILE_GHOST is orthogonal to the mode's file type, so a %ghost is covered whether it carries a regular mode or mode 0, while a bare mode-0 entry with no ghost flag is not. The reference reports all of them (its walk has the same fallback, FilelistCheck.py). Measured on the Factory corpus (full-corpus single-check sweep on pristine 8cd9ba0e1c10e095e62667b6da53abb4f19c63e5 over all 51,589 RPMs, FilelistCheck only; a 3,035-package control sample is identical before and after): 37 E in 32 binary packages before, 33 E in 28 after; silenced are exim's /var/mail symlink, postfix's and postfix-bdb's /var/mail %ghost entries and xkeyboard-config's bare /var directory entry. The 37 reconciles with the residue the issue #859 entry catalogues (32 E in 9 source packages, measured on the sweep run-20261022-857d5ece population over its 134 affected source packages): this sweep's population and unit differ, and its set is that residue plus five grown since - postfix's /var/mail %ghost (the #859 entry names only exim and postfix-bdb for /var/mail), dicts-devel's, hare's and hare-libnotify's /usr/src trees and flake-pilot's /overlayroot. The residue after this fix (33) is 30 deliberate-parity findings (reproducible-faketools /usr/local x19, kernel-obs-build's five /.build.*.kvm root markers, guix's /gnu and nix's /nix store roots, the installation-images-MicroOS /CD1 and /SuSE media roots, flake-pilot's /overlayroot, samba-client's /var/samba) and the 3 /usr/src policy items (dicts-devel, hare, hare-libnotify). A regular file at such a path still fires, as do unsanctioned siblings (/var/samba) and payload under unsanctioned roots (/gnu, /usr/local). Pinned by sanctioned_locations_in_non_regular_form_are_quiet, regular_file_at_sanctioned_location_still_fires, mode_zero_without_ghost_flag_still_fires and unsanctioned_sibling_paths_still_fire in filelist.rs."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/859"
