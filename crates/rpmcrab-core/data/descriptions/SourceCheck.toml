strange-permission="""
A file that you listed to include in your package has strange
permissions. Usually, a file should have 0644 permissions.
"""
inconsistent-file-extension="""
The file name extension indicates a different compression format than
what is actually used (as checked by file(1)).
"""
rpmlintrc-uses-setbadness="""
An rpmlintrc checked with this package contains a setBadness line.
setBadness does not adjust finding levels in rpmcrab, and Factory
submissions cannot use it: suppress the finding it names with
addFilter instead.
"""

source-archive-contains-lfs-pointer="""
A source archive contains a git-lfs pointer stub instead of the
file's real content: a small text file starting with the git-lfs
version line and an oid sha256: line. Whatever reads the file during
the build gets the pointer text, not the content, and fails. Report
the stubs upstream and remove them (and the tests that need them), or
ship the real files. Pointer names are cut to 1024 bytes, keeping head and tail around one ellipsis. Findings are capped at 25,000 per tag per source package; the stop
log keeps 10 lines per kind per Source.
"""
source-archive-contains-vcs-metadata="""
A source archive contains a version-control metadata tree (a .git,
.svn, .hg or .bzr directory, or files directly inside a CVS
directory). The metadata is dead weight in the archive -- it can be
most of it -- and can leak the project's history. Remove the metadata
before packaging the archive; when the archive is produced by the
service, drop the package-meta opt-in that keeps it. The finding only
fires for sources the spec declares without an upstream URL, so
metadata inside an upstream tarball stays quiet.
"""

source-archive-contains-bidi-control="""
A text file inside a source archive contains a Unicode bidirectional
control character (U+202A-U+202E, U+2066-U+2069). Such characters can
make source code render differently from how it executes
(trojan-source, CVE-2021-42574). Remove the control unless it is
intentional (e.g. a test demonstrating the attack). The finding names
the first control in the member and its line and column; one finding
per member. Plain payload files, including the spec, are covered by
the bidi-control-character scan instead. Archive nesting is capped at 5 levels; a decompression budget of 16 GiB applies per Source, and a plain zip Source over 256 MiB on disk is skipped; a compressed single file is scanned as itself when decompression yields text, up to 64 MiB decompressed, while a decompressed payload that itself forms an archive is walked as archive members; a compressed zip over 64 MiB decompressed is not walked; compression suffixes are stripped case-insensitively. Findings are capped at 25,000 per tag per source package; the stop log keeps 10 lines per kind per Source. Finding paths are cut to 1024 bytes, keeping head and tail around one ellipsis.
"""

prebuilt-binary-in-sources="""
A source archive contains a prebuilt binary (ELF, Java class, Python
bytecode, Java archive, indexed ar archive, PE image, WebAssembly module or FAT Mach-O
binary) instead of the source it was built from. Ship the source and
build the binary during the package build. Binaries under a top-level
test/ or tests/ fixture directory stay quiet: they are test inputs
consumed by %check, not shipped code. Archive nesting is capped
at 5 levels; a decompression budget of 16 GiB applies per Source, and
a plain zip Source over 256 MiB on disk is skipped; a compressed single
file or a compressed zip over 64 MiB decompressed is not walked.
Findings are capped at 25,000 per tag per source package; the stop
log keeps 10 lines per kind per Source. Finding paths are cut to
1024 bytes, keeping head and tail around one ellipsis; ar, PE and WebAssembly findings
group per archive chain, directory and kind.
"""

prebuilt-binary-shipped="""
This file is byte-identical to a prebuilt binary, or to an archive
holding one, in this package's own sources, so the shipped bytes were
not built in this build. Build it in %build or unbundle it, and delete
the prebuilt copy in %prep. If the file is a toolchain bootstrap or
binary firmware (the guideline's exceptions), filter the finding in
the package's rpmlintrc.
"""
