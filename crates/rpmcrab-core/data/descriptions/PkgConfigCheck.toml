invalid-pkgconfig-file="""
Your .pc file appears to be invalid. Possible causes are:
- it contains traces of $RPM_BUILD_ROOT or $RPM_BUILD_DIR.
- it contains unreplaced macros (@have_foo@)
- it references invalid paths (e.g. /home or /tmp)
"""
pkgconfig-invalid-libs-dir="""
Your .pc file contains -L/usr/lib or -L/lib and is
built on a lib64 target, or contains references to -L/usr/lib64 or
-L/lib64 and is built for a lib target.
"""
double-slash-in-pkgconfig-path="""
This pkg-config file contains a path with a double slash ('//') in it. This
will break debugedit when stripping debug symbols during package building if
these paths have been passed to gcc, and fail with the following error:
canonicalization unexpectedly shrank by one character.
"""
pkgconfig-exception="""
An error occurred while reading or parsing the .pc file.
"""
pkgconfig-dangling-library="""
This pkg-config file's Libs: line names the package's own library
with -l, but no package built from the same source ships that
library as a .so, .a or .dll.a file, so a consumer linking with
this .pc file fails. Ship the library in one of the build's
packages, or drop the -l flag from the .pc file when the package
deliberately provides no linkable library under that name.

This check is run-scoped: it judges a build only when the lint run
also contains the build's source package, as a lint run over a
finished build does, and stays silent on partial or single-package
input, where the library is expected to sit in a package that was
not linted.
"""
