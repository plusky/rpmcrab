no-spec-file="""
No spec file was specified in your RPM metadata. Please specify a valid
SPEC file to build a valid RPM package.
"""
invalid-spec-name="""
The spec file name (without the .spec suffix) must match the package name
('Name:' tag).
"""
non-utf8-spec-file="""
The character encoding of the spec file is not UTF-8.
"""
patch-not-applied="""
A patch is included in your package but was not applied.
"""
patch-macro-old-format="""
The usage of %patchN is not supported by RPM >= 4.20. The preferred way to
apply patches are, in order:
 * %autosetup -p1
 * %autosetup -N / %autopatch -p1
 * %setup / %patch -P <N> -p 1 (upper case P denotes patch number,
   lower case is the usual patch -p<num> strip level)
"""
obsolete-tag="""
The following tags are obsolete: Copyright and Serial. They must
be replaced by License and Epoch respectively.
"""
deprecated-grep="""
Direct use of grep as egrep or fgrep is deprecated in GNU grep and
historical in POSIX, use grep -E and grep -F instead.
"""
hardcoded-packager-tag="""
The Packager tag is hardcoded in your spec file. It should be removed, so
as to use rebuilder's own defaults.
"""
buildarch-instead-of-exclusivearch-tag="""
Use ExclusiveArch instead of BuildArch (or BuildArchitectures)
to restrict build on some specific architectures.
Only use BuildArch with noarch
"""
"no-%prep-section"="""
The spec file does not contain a %prep section.  Even if some packages don't
directly need it, section markers may be overridden in rpm's configuration
to provide additional 'under the hood' functionality.  Add the section, even
if empty.
"""
"no-%build-section"="""
The spec file does not contain a %build section.  Even if some packages
don't directly need it, section markers may be overridden in rpm's
configuration to provide additional 'under the hood' functionality, such as
injection of automatic -debuginfo subpackages.  Add the section, even if
empty.
"""
"no-%install-section"="""
The spec file does not contain an %install section.  Even if some packages
don't directly need it, section markers may be overridden in rpm's
configuration to provide additional 'under the hood' functionality.  Add the
section, even if empty.
"""
"no-%check-section"="""
The spec file does not contain a %check section.
Please check if the package has a testsuite and what it takes to enable the
testsuite as part of the package build. If it is not possible to run it in the
build environment (OBS/koji) or no testsuite exists, then please ignore this
warning. You should not insert an empty %check section.
"""
"more-than-one-%changelog-section"="""
The spec file unnecessarily contains more than one %changelog section.
"""
"superfluous-%clean-section"="""
The spec section %clean should not be used any longer.
RPM provides its own clean logic.
"""
prereq-use="""
The use of PreReq is deprecated. In the majority of cases, a plain Requires
is enough and the right thing to do. Sometimes Requires(pre), Requires(post),
Requires(preun) and/or Requires(postun) can also be used instead of PreReq.
"""
buildprereq-use="""
The use of BuildPreReq is deprecated, build dependencies are always required
before a package can be built.  Use plain BuildRequires instead.
"""
setup-not-in-prep="""
The %setup macro should only be used within the %prep section because it may
not expand to anything outside of it and can break the build in unpredictable
ways.
"""
rpm-buildroot-usage="""
$RPM_BUILD_ROOT or %{buildroot} must not be touched during %build or %prep
stage, as it will break short circuit builds and will not persist to %install
stage in a normal build, leading to unexpected package build behavior.
"""
make-check-outside-check-section="""
Make check or other automated regression test should be run in %check, as
they can be disabled with a rpm macro for short circuiting purposes.
"""
"macro-in-%changelog"="""
Macros are expanded in %changelog too, which can in unfortunate cases lead
to the package not building at all, or other subtle unexpected conditions that
affect the build.  Even when that doesn't happen, the expansion results in
possibly 'rewriting history' on subsequent package revisions and generally
odd entries eg. in source rpms, which is rarely wanted. Avoid use of macros
in %changelog altogether, or use two '%'s to escape them, like '%%foo'.
"""
depscript-without-disabling-depgen="""
In some common rpm configurations/versions, defining __find_provides and/or
__find_requires has no effect if rpm's internal dependency generator has not
been disabled for the build.  %define _use_internal_dependency_generator to 0
to disable it in the specfile, or don't define __find_provides/requires.
"""
libdir-macro-in-noarch-package="""
The %{_libdir} or %{_lib} macro was found in a noarch package in a section
that gets included in binary packages.  This is most likely an error because
these macros are expanded on the build host and their values vary between
architectures, probably resulting in a package that does not work properly
on all architectures at runtime. Investigate whether the package is really
architecture independent or if some other dir/macro should be instead.
"""
non-break-space="""
The spec file contains a non-break space, which looks like a regular space
in some editors but can lead to obscure errors. It should be replaced by a
regular space.
"""
specfile-error="""
This error occurred when the spec file was queried with rpm. The
message is output by rpm and should contain more information.
"""
specfile-warning="""
This warning occurred when the spec file was queried with rpm. The
message is output by rpm and should contain more information.
"""
comparison-operator-in-deptoken="""
This dependency token contains a comparison operator (<, > or =).  This is
usually not intended and may be caused by missing whitespace between the
token's name, the comparison operator and the version string.
"""
macro-in-comment="""
There is an unescaped macro mention after a shell style comment in the
specfile. rpm expands macros on a comment line before treating the line
as a comment, so the mention is expanded even though it looks inert:
when the expansion runs to several lines, only the first line stays
commented and the rest becomes live spec text or shell — a commented
%python_subpackages can move following tags into a phantom package,
and a commented-out build macro such as %configure or %pytest actually
runs. The effectful forms — shell (%(...)), Lua (%{lua:...}), macro
file (%{load:...}) and the executing directives (%define, %global,
%undefine, %lua, %load and the braced %{define:...}, %{global:...},
%{undefine:...} and %{error:...} forms) — are performed by rpm while
the specfile is parsed, even inside comments. Escape the macro with
another leading % (%%) if the mention is only prose, or reword the
comment so it does not name the macro.
"""
patch-fuzz-is-changed="""
The internal patch fuzz value was changed, and could hide patch's issues, or
could lead to applying a patch at the wrong location. Usually, this is often
the sign that someone didn't check if a patch is still needed and does not want
to rediff it. It is usually better to rediff the patch and try to send it
upstream.
"""
python-setup-test="""
The python setup.py test subcommand is deprecated and should be replaced with a
modern testing tool like %pytest or %pyunittest discover -v.
"""
python-setup-install="""
The python setup.py install subcommand is deprecated and should be replaced with
macros %pyproject_wheel, %pyproject_install or with "pip"
"""
python-module-def="""
The spec file contains a conditional definition of python_module macro, this
macro is present in recent versions of python-rpm-macros.
The following conditional python_module macro definition can be removed:
%{?!python_module:%define python_module() python-%{**} python3-%{**}}
"""
python-sitelib-glob-in-files="""
The %files section contains "%{python_sitelib}/*" or "%{python_sitearch}/*"
that can get something not wanted in the package. Please use a more specific
file path like:
%{python_sitelib}/packagename
%{python_sitelib}/packagename-%{version}*-info
"""
obsolete-suse-version-check="""
The specfile contains a comparison of %suse_version against a suse release
that is no longer in maintenance. Consider removing obsolete parts of your
spec file to make it more readable.
"""
invalid-suse-version-check="""
The specfile contains a comparison of %suse_version against a suse release
that does not exist. Please double check.
"""
shared-dir-glob-in-files="""
The %files section contains "%{_bindir}/*", "%{_datadir}/*", "%{_docdir}/*",
"%{_includedir}/*" or "%{_mandir}/*".  These can lead to packagers not noticing
when upstream adds new and possibly conflicting files in these directories.
Therefore, files in these directories should be explicitly listed like
"%{_bindir}/foobar" or "%{_includedir}/foobar.h".
"""
suse-update-desktop-file-deprecated="""
The usage of %suse_update_desktop_file is deprecated and changes
should be migrated to the upstream.
Please check the build log for details.
"""
translated-description="""
The spec file contains a %description section translated into another
language. Some distributions do not want to ship translated descriptions;
remove the %description -l sections if yours is one of them.
"""

"%autopatch-not-in-prep"="""
The spec file uses %autopatch but it is not in the %prep section. Move it to %prep.
"""
"%autosetup-not-in-prep"="""
The spec file uses %autosetup but it is not in the %prep section. Move it to %prep.
"""

license-file-as-doc="""
The %files section lists a licence file under %doc. Marking the file
with %license installs it into the package's licence directory and
records it as a licence file in the package metadata. spec-cleaner
converts this shape automatically, moving the licence token from the
%doc line to a %license line in the same section.
"""
no-license-file-in-spec="""
No %files section in the spec file marks a licence file with %license,
lists one under %doc, or ships one as a plain entry. Shipping the
licence text with the package and marking it with %license installs
it into the package's licence directory and records it as a licence
file in the package metadata.
"""
check-exit-status-masked="""
A test command in %check cannot fail the build: its exit status is
absorbed by a '||' fallback that itself cannot fail, or by an
'&& exit 0' (or '&& echo', '&& :' or '&& true') away from the end
of the section. rpm runs the build sections with bash -e and a
section's status is the status of its last command, so the masked
failure is discarded and the build goes green even when the
testsuite fails or never starts. Remove the mask so the testsuite
gates the build; deselect the failing tests, or move an unreliable
suite to its own flavour. A deliberate mask belongs in an
rpmlintrc filter with the reason, not in a comment.
"""
check-pipeline-status-masked="""
A test command in %check is piped into a pass-through command
(such as tee, cat, head, tail, sed or sort). A pipeline's exit
status is the status of its last element, so without a preceding
'set -o pipefail' or a read of PIPESTATUS after the pipeline, the
test command's failure is lost and the build goes green even when
the testsuite crashes before reporting any result. Add
'set -o pipefail' before the pipeline or check PIPESTATUS
after it.
"""
negated-command-not-last="""
A '!'-negated command in %prep, %build, %install or %check is not
the last command that runs in its section, so its inverted status
is discarded: under bash -e a negated command never stops the
build, and the section's status comes from a later command. The
assertion is dead - the build passes whether it holds or not.
Capture the status with 'rc=$?' directly after the command, or
turn it into a condition ('if ! cmd; then ... exit 1; fi').
"""
with-macro-expands-empty="""
The spec uses one of the conditional forms %{?with name},
%{!?with name}, %{?without name} or %{!?without name}. In the
%{?name args} form rpm drops the argument, so these expansions
are always empty: the value never depends on the name being
tested, and a condition such as %if 0%{?with test} is always
false, silently disabling whatever it guards. Use %{with name}
or %{without name} instead.
"""
ctest-with-testing-disabled="""
The spec runs ctest in %check, but %cmake_kf5 or %cmake_kf6 passes
-DBUILD_TESTING:BOOL=FALSE and nothing in the spec sets
BUILD_TESTING to a true value. Projects that only add their tests
when BUILD_TESTING is on then register no tests at all: ctest
reports that no tests were found and the build still succeeds, so
the %check run proves nothing. Pass -DBUILD_TESTING:BOOL=ON to the
cmake macro to actually run the tests.
"""

subpackage-without-files="""
The spec file declares a subpackage in a %package section, but no
%files section names it, so the subpackage is never built and no
package is published for it. Add a %files section for the subpackage,
or remove the %package declaration.
"""

comment-in-continued-command="""
A comment line directly follows a line that ends in a backslash
continuation. The comment ends the continued command: the lines after
the comment are not part of it, so later lines run as their own
command or lose the assignments and options the earlier lines set up.
Move the comment out of the continued command.
"""

spec-tag-as-shell-variable="""
A shell variable named $name, $version or $release is used in a build
section or a scriptlet. rpm does not set shell variables with those
names, so the expansion is empty and paths built from it lose the
package name, version or release component. Use the rpm macro
%{name}, %{version} or %{release} instead; in build sections rpm
also exports $RPM_PACKAGE_NAME, $RPM_PACKAGE_VERSION and
$RPM_PACKAGE_RELEASE.
"""
