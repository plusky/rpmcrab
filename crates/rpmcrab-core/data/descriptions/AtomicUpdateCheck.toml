dir-or-file-outside-snapshot="""
The package contains files outside the snapshot, e.g. outside /etc and /usr
or inside /usr/local.
"""
ghost-outside-snapshot="""
The package contains ghosts outside the snapshot, e.g. outside /etc and /usr
or inside /usr/local. This might become an issue upon removal of this
package, but not during installation.
"""
scriptlet-service-restart="""
A scriptlet invokes a service (re)start directly (systemctl restart or
start, service, or a legacy rc script) instead of using the
distribution's service macros. During a transactional update the
scriptlet runs inside the new snapshot with systemd offline, so the
(re)start silently does nothing and the daemon keeps running its old
code until the next reboot. Use the service macros, which defer the
restart via systemd-update-helper, or gate the scriptlet on
$TRANSACTIONAL_UPDATE and defer the restart to the next boot.
"""

scriptlet-writes-outside-snapshot="""
The package's install scriptlets write to a path outside the snapshot,
e.g. under /var or /srv. On a transactional-update system that write is
not part of the snapshot being installed: it takes effect immediately,
outside the update, and is lost or inconsistent if the update is rolled
back. Defer the change to the first boot of the new snapshot instead,
e.g. with a tmpfiles.d entry or a first-boot service.
"""
