file-parent-ownership-mismatch="""
A file or directory is stored in a directory owned by another unprivileged user.
This is a security issue since the owner of the parent directory can replace this
file/directory with a different one. When the stored file or directory is owned by root (or uid 0), the
finding is a warning rather than an error: root-owned payload inside service-user
directories is a widespread deliberate layout, while a mismatch between two
unprivileged owners stays an error.
"""
