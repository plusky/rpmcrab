non-etc-or-var-file-marked-as-conffile="""
A file not in /etc or /var is marked as being a configuration file (%config).
Put your configuration files in /etc or /var, or remove the %config attribute
from the corresponding line in the %files section.
"""
conffile-without-noreplace-flag="""
A configuration file is stored in your package without the noreplace flag.
Both %config and %config(noreplace) are valid; neither is wrong as such.
The choice matters on upgrade: with plain %config a locally modified file
is preserved as .rpmsave and the newly shipped file takes its place, so
the local modifications stop being in effect; with %config(noreplace) the
local modifications stay in effect and the newly shipped file arrives as
.rpmnew instead. Consider per file which behaviour fits the file.
"""
usr-etc-file-marked-as-conffile="""
A file in /usr/etc is marked as a configuration file (%config).
Files in /usr/etc are vendor defaults; administrator configuration
belongs in /etc, which takes precedence over them. The %config mark
makes rpm preserve local edits to the vendor default across updates
(.rpmsave/.rpmnew), which fights the /usr/etc split. Remove the
%config attribute from the corresponding line in the %files section.
"""
