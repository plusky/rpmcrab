arch-independent-package-contains-binary-or-object = """
The package is marked as noarch and contains a binary or object file.
"""
arch-dependent-file-in-usr-share="""
This package installs an ELF binary in the /usr/share hierarchy, which is
reserved for architecture-independent files only. Payload for a foreign
target -- a machine outside the package architecture's own family
(emulator firmware, cross-toolchain data) -- whose bytes are the same
in every architecture build of the package is not reported.
"""
binary-in-etc="""
This package installs an ELF binary in /etc.
"""
noarch-with-lib64="""
This package is marked as noarch but installs files into lib64.
Not all architectures have this in path, so the package can't be noarch.
"""
no-soname="""
The library has no soname. Only libraries in the dynamic linker's
search directories are reported; shared objects in private
directories are loaded by path.
"""
no-ldconfig-symlink="""
The package should not only include the shared library itself, but
also the symbolic link which ldconfig would produce. (This is
necessary, so that the link gets removed by rpm automatically when
the package gets removed).
"""
shlib-with-non-pic-code="""
The listed shared libraries contain object code that was compiled
without -fPIC. All object code in shared libraries should be
recompiled separately from the static libraries with the -fPIC option.
Use the ``eu-findtextrel'' command on a library with debugging symbols
to list code compiled without -fPIC.

Another common mistake that causes this problem is linking with
``gcc -Wl,-shared'' instead of ``gcc -shared''.
"""
libtool-wrapper-in-package="""
The package contains a libtool wrapper shell script. Instead of installing
the libtool wrapper file run
``libtool --mode=install install -m perm <file> <dest>'' in order
to install the relinked file.
"""
binary-or-shlib-defines-rpath="""
The binary or shared library defines `RPATH' (or `RUNPATH') that points
to a non-system library path.
"""
statically-linked-binary="""
The package installs a statically linked binary or object file.

Relocatable objects, payload for a different processor family than
the package's own (firmware and cross data), and the fully static
binaries the Go and Zig toolchains produce as their normal output
are not reported.
"""
shlib-policy-name-error="""
The package contains shared library but is not named after its SONAME.
"""
invalid-la-file="""
This .la file contains a reference to /tmp or /home.
"""
no-binary="""
The package should be of the noarch architecture because it doesn't contain
any binaries.
"""
undefined-non-weak-symbol="""
The binary contains undefined non-weak symbols.
"""
unused-direct-shlib-dependency="""
The binary contains unused direct shared library dependencies.  This may
indicate gratuitously bloated linkage; check that the binary has been linked
with the intended shared libraries only.
"""
readelf-failed="""
Executing readelf on this file failed, all checks could not be run.
"""
ldd-failed="""
Executing ldd on this file failed, all checks could not be run.
"""
strings-failed="""
Executing strings on this file failed, all checks could not be run.
"""
objdump-failed="""
Executing objdump on this file failed, all checks could not be run.
"""
executable-stack="""
The binary declares the stack as executable. Executable stack is usually an
error as it is only needed if the code contains GCC trampolines or similar
constructs which uses code on the stack. One common source for needlessly
executable stack cases are object files built from assembler files which
don't define a proper .note.GNU-stack section. Binaries built for a
different instruction set than the package architecture are not reported:
they are payload for another machine, which this package's dynamic linker
never loads.
"""
missing-PT_GNU_STACK-section="""
The binary lacks a PT_GNU_STACK section.  This forces the dynamic linker to
make the stack executable.  Binaries built for a different instruction set
than the package architecture are not reported: they are payload for
another machine, which this package's dynamic linker never loads.
"""
non-position-independent-executable="""
This executable must be position independent. Check that it is built with
-fPIE/-fpie in compiler flags and -pie in linker flags.
"""
position-independent-executable-suggested="""
This executable should be position independent (all binaries should).  Check
that it is built with -fPIE/-fpie in compiler flags and -pie in linker flags.
"""
missing-fortify="""
The binary or shared library was not built with _FORTIFY_SOURCE, so
compile-time-known buffer overflows in libc calls (strcpy, memcpy,
sprintf, ...) are not replaced with their checked `__*_chk` variants at
runtime. Rebuild with `%{optflags}` unmodified: the distro flags define
`_FORTIFY_SOURCE` and require optimization (`-O1` or higher) for the
fortification to take effect. Verify with `readelf --dyn-syms` that
`__*_chk` symbols are present.
"""
missing-stack-protector="""
The binary or shared library has no stack protector (`__stack_chk_fail`
is absent), so stack-based buffer overflows are not detected at runtime.
Rebuild with `%{optflags}` unmodified, which carries
`-fstack-protector-strong`; do not append `-fstack-protector` after it,
as the last directive wins and silently downgrades strong protection
to basic. This check only verifies presence: basic and strong SSP both
emit `__stack_chk_fail`, so it cannot tell the two apart.
"""
missing-relro="""
The binary or shared library has no GNU_RELRO segment, so parts of the
GOT that could be made read-only after relocation stay writable for the
whole lifetime of the process. Link with `-Wl,-z,relro` (normally already
in `%{optflags}`); do not pass `-Wl,-z,norelro`.
"""
partial-relro="""
The binary or shared library has a GNU_RELRO segment but was linked
without BIND_NOW, so relocations resolve lazily and the GOT stays
writable until first use. Link with `-Wl,-z,relro,-z,now` (both are
normally already in `%{optflags}`) for full RELRO.
"""
missing-cf-protection="""
The binary or shared library was built without x86 control-flow
protection: its `.note.gnu.property` does not record both the IBT
(indirect branch tracking) and SHSTK (shadow stack) features, and
its `.text` contains no `ENDBR64` instructions, so at least one
of the two features cannot be enforced at runtime. Rebuild with `%{optflags}`
unmodified, which carries `-fcf-protection` on x86_64. This check
only verifies absence: the property is merged over all link inputs,
so code compiled with the flag whose property was cleared by an
input carrying none (hand-written assembly, a prebuilt object) does
not fire — rebuilding cannot restore the property there, the input
itself must carry one (`ld -z cet-report` names such inputs).
Verify with `readelf -n` that the GNU property list includes `IBT`
and `SHSTK`.
"""
optflags-not-applied="""
The package's build flags (the `OPTFLAGS` header tag, `%{optflags}`
as expanded at packaging time) request the stack protector and
`_FORTIFY_SOURCE`, but no judged ELF file in the package carries a
stack-protector or fortify symbol: the distribution flags never
reached the compiler for any judged file in the package. The judged
population is the package's C-judged EXEC/DYN ELF files: archives,
Go and Zig binaries, debuginfo files and other ELF types are
outside it, and noarch packages are exempt. Each arm is counted
over its own applicable population -- the files applicable for
the stack-protector arm, the fortify arm and the cf-protection
arm do not in general coincide -- and the detail names each
arm's count over its own population. One build defect
strips both mitigations from every binary at once -- a spec that
overrides `CFLAGS`/`CXXFLAGS` without `%{optflags}`, or a build
system that drops them (for example a `%install` step that rebuilds
without the flags `%build` used). Rebuild so `%{optflags}` reaches
every compilation; where a package deliberately builds with its own
flags, filter this finding in its rpmlintrc with the reason
recorded there, and filter the per-file `missing-stack-protector`
and `missing-fortify` findings together with it: they name the
same files for the same cause. When the flags also request
`-fcf-protection` and no judged file records it, the finding names
`cf-protection` as well.
"""
missing-call-to-setgroups-before-setuid="""
This executable is calling setuid and setgid without setgroups or initgroups.
This means it didn't relinquish all groups, and this would be a potential
security issue.
"""
call-to-mktemp="""
This executable calls mktemp. As advised by the manpage (mktemp(3)), this
function should be avoided.
"""
call-to-gets="""
This file references gets. gets reads a line into a caller-supplied
buffer with no length bound, so any input longer than the buffer
overwrites memory; it was removed from the C standard and from
POSIX because no call to it can be made safe. The code should read
input with fgets(3) or getline(3) instead; the fix belongs in the
upstream project that ships the code.
"""
call-to-tmpnam="""
This file references tmpnam, tmpnam_r or tempnam. These functions
return a file name rather than an open file, so between the name
being chosen and the caller opening it, an attacker can plant a
symlink at that name and redirect the caller's write. The code
should use mkstemp(3), which creates and opens the file atomically;
the fix belongs in the upstream project that ships the code.
"""
unstripped-binary-or-object="""
This executable still carries its symbol table. Without a
.gnu_debuglink section, rpm's debuginfo extraction did not process
the file: enable debuginfo or give the file DWARF, and do not strip
by hand. With a .gnu_debuglink section, the symbol table was kept
on purpose (STRIP_KEEP_SYMTAB) and the debuginfo sits in the
-debuginfo package as usual -- the finding fires for that shape
too, as the prompt to confirm the keep is deliberate.
"""
lto-bytecode="""
This executable contains a LTO section.  LTO bytecode is not portable
and should not be distributed in static libraries or e.g. Python modules.
"""
lto-no-text-in-archive="""
This archive does not contain a non-empty .text section.  The archive
was not created with -ffat-lto-objects option.
"""
linked-against-opt-library="""
This executable is linked against a shared library in /opt folder.
"""
linked-against-usr-library="""
Libraries and executables under /bin, /sbin, /lib and /lib64 may not link
against a shared library in /usr folder.
"""
static-library-without-symtab="""
The static library doesn't contain any symbols and therefore can't be linked
against. This may indicate a stripped archive.
"""
binary-or-shlib-calls-gethostbyname="""
The binary calls gethostbyname. Please port the code to use getaddrinfo.
The finding is an error when the calling file is setuid/setgid or carries
file capabilities, or when its package ships systemd service or socket
units.
"""
binary-or-shlib-calls-legacy-network="""
The binary calls a legacy network API: one of the BSD inet_*
address-conversion functions (inet_addr, inet_aton, inet_ntoa,
inet_nsap_addr, inet_nsap_ntoa, inet_makeaddr, inet_netof,
inet_network, inet_neta, inet_net_ntop, inet_net_pton) or the
rsh-family remote-execution entry points (rcmd, rexec, rresvport).
The inet_* family predates getaddrinfo and getnameinfo, and the
r-commands authenticate by trusted-host lists; replace them in the
upstream source.
"""
binary-or-shlib-calls-md5="""
The binary calls the low-level MD5 functions (MD5, MD5_Init,
MD5_Update, MD5_Final, MD5_Transform). MD5 is broken as a cryptographic hash --
collisions are cheap -- so it must not protect integrity,
authenticity or credentials. A checksum over public, non-adversarial
data is a legitimate use that the binary alone cannot rule out,
which is why this finding is a warning: symbol presence is not
proof of misuse. Where MD5 carries a security decision, replace it
in the upstream source (SHA-256, or a keyed construction where the
use requires one).
"""
binary-or-shlib-calls-des="""
The binary calls the low-level DES functions (the DES_* entry
points, including the triple-DES DES_ede forms). Single DES has a
56-bit key and is brute-forced routinely, and triple-DES is
disallowed for new protection (NIST SP 800-131A); both survive
legitimately as compatibility relics, in legacy protocols and file
formats. Where DES protects anything current, replace it in the
upstream source; where it is a compatibility surface, the finding
records that the surface exists.
"""
binary-or-shlib-calls-rc4="""
The binary calls RC4 (RC4, RC4_set_key, RC4_options). RC4's keystream biases
make it unsuitable for confidentiality or integrity -- it is
prohibited in TLS by RFC 7465 -- and it survives legitimately only
as a compatibility relic. Where RC4 protects anything current,
replace it in the upstream source.
"""
go-toolchain-outdated="""
The binary was built with the Go toolchain named in the detail, which
is below the minimum release of its own release line carrying fixes
for known standard-library defects (CVE-2025-22871: fixed in go1.23.8
on the 1.23 line and go1.24.2 on the 1.24 line; the floor is a
per-line minimum). A Go binary keeps the standard library it was
built with, so the defects stay in the shipped binary until the
package is rebuilt. Please rebuild the package with a Go toolchain
at or above its release line's minimum.
"""
bundled-library-without-provides="""
The named binary links a vendored C library (the named -sys crate's
library) into itself, but the package declares no bundled() provide
for that library under its source package name. The package's
only marker, where it has one at all, is the crate-level
bundled(rust-crate:...) one that cargo-packaging generates from
the binary's .dep-v0 -- a package built without cargo-packaging
carries no marker at all -- and the
maintenance query defined by the bundled software policy --
whatprovides 'bundled(<source package>)' -- does not match it, so
the package stays invisible when the library needs a security
update. Where the library has a system shared form, link that
instead of the vendored copy; the vendored copy can always be
declared instead: add Provides: bundled(<source package>), with
`= <version>` naming the version of the library that is actually
linked where the binary names one. The finding fires only when the library's own
byte pattern is present in the binary's read-only sections; a
crate that was resolved but not linked stays silent. A binary that links the system
library and carries the vendored code as well fires: the linked
copy does not replace the vendored one, which is declared (or
patched out) like any other.
"""
binary-or-shlib-calls-weak-prng="""
The binary calls the predictable libc random functions (rand,
random, srand, srandom, initstate, setstate and the *48 family,
each also in its reentrant *_r form) and runs in a privileged
or exposed context: the file is setuid, setgid or carries file
capabilities, or the package ships a systemd service or socket.
Values from these generators are predictable to anyone who can
guess the seed -- typically the current time or the process id --
so they must not become session identifiers, tokens, password
salts, challenges or key material. The same calls are unremarkable
for jitter, retry backoff and identifier uniqueness, which is
why this finding is a warning scoped to privileged and
daemon-shipped binaries.
Where a generated value is security-relevant, take it from
getrandom(2), arc4random(3) or /dev/urandom in the upstream source
instead.
"""
binary-or-shlib-calls-unbounded-copy="""
The binary calls strcpy, strcat, sprintf or vsprintf. None of these
functions knows the size of the destination, so an input longer than
the destination buffer overflows it (CWE-120). Whether a given call
can actually overflow depends on the call site, which the binary
alone cannot decide. Treat the finding as a prompt to audit the call
sites and switch to a bounded form (strlcpy for strcpy, strlcat
for strcat, snprintf for sprintf, vsnprintf for vsprintf, or the
fortified __*_chk variants the compiler selects under
_FORTIFY_SOURCE); the fix belongs in the upstream source, not in
the package.
"""
binary-or-shlib-calls-shell="""
The binary calls system() or popen(), handing a command string to a
shell. The finding fires when the calling file is setuid/setgid or
carries file capabilities, or when its package ships systemd service
or socket units. In that context a command string built from data the
caller does not fully control (network input, message or event data,
values substituted into a configured command) is a command-injection
defect (CVE-2025-10230). Audit what reaches the command: data from
outside the caller's control must never be interpolated unsanitised;
where no shell features are needed, run the program directly with an
argv array instead.
"""
binary-or-shlib-without-debuginfo="""
This binary or shared library carries no symbol table and no
.gnu_debuglink section, so no -debuginfo exists for it: either it
was stripped before rpm's debuginfo extraction could process it,
or it was built without DWARF (compiled without -g), so there was
no debuginfo for the extraction to split. The usual strip routes
are a manual strip in %install, -s or -Wl,--strip-all in the link
flags, Cargo or maturin strip = true, CMake --strip, or Go
-ldflags=-s. Remove the strip (and build with -g) and let rpm
strip the file itself: rpm splits the debuginfo into the
-debuginfo package and leaves a .gnu_debuglink section behind.
Deliberately stripped distro build tools and prebuilt blobs are
the exceptions; a build with debug_package %{nil} also needs
debuginfo turned on.
"""
static-library-without-debuginfo="""
The static library doesn't contain any debuginfo. Binaries linking against
this static library can't be properly debugged.
"""
program-not-linked-against-libc="""
The binary is not dynamically linked against libc.
"""
shared-library-without-dependency-information="""
The listed shared library doesn't include information about which other
libraries the library was linked against.
"""
forbidden-optflags="""
This executable was compiled with an unexpected flag.
"""
missing-hash-section="""
SystemV requires each shared library must provide .hash section that
is used for efficient symbol resolution.
"""
missing-gnu-hash-section="""
The .gnu.hash section is missing and leads to a slower symbol resolution
during dynamic linking.
"""
patchable-function-entry-in-archive="""
This archive contains a __patchable_function_entries section and can
accidentally make a shared library or an executable live-patchable.
"""

ar-failed="""
The `ar` archive could not be parsed. The archive may be corrupted.
"""
