Executing objdump on this file failed, all checks could not be run.
"""
executable-stack="""
The binary declares the stack as executable. Executable stack is usually an
error as it is only needed if the code contains GCC trampolines or similar
constructs which uses code on the stack. One common source for needlessly
executable stack cases are object files built from assembler files which
don't define a proper .note.GNU-stack section.
"""
missing-PT_GNU_STACK-section="""
The binary lacks a PT_GNU_STACK section.  This forces the dynamic linker to
make the stack executable.
"""
non-position-independent-executable="""
This executable must be position independent. Check that it is built with
-fPIE/-fpie in compiler flags and -pie in linker flags.
"""
position-independent-executable-suggested="""
This executable should be position independent (all binaries should).  Check
that it is built with -fPIE/-fpie in compiler flags and -pie in linker flags.
"""
missing-fortify="""
The binary or shared library was not built with _FORTIFY_SOURCE, so
compile-time-known buffer overflows in libc calls (strcpy, memcpy,
sprintf, ...) are not replaced with their checked `__*_chk` variants at
runtime. Rebuild with `%{optflags}` unmodified: the distro flags define
`_FORTIFY_SOURCE` and require optimization (`-O1` or higher) for the
fortification to take effect. Verify with `readelf --dyn-syms` that
`__*_chk` symbols are present.
"""
missing-stack-protector="""
The binary or shared library has no stack protector (`__stack_chk_fail`
is absent), so stack-based buffer overflows are not detected at runtime.
Rebuild with `%{optflags}` unmodified, which carries
`-fstack-protector-strong`; do not append `-fstack-protector` after it,
as the last directive wins and silently downgrades strong protection
to basic. This check only verifies presence: basic and strong SSP both
emit `__stack_chk_fail`, so it cannot tell the two apart.
"""
missing-relro="""
The binary or shared library has no GNU_RELRO segment, so parts of the
GOT that could be made read-only after relocation stay writable for the
whole lifetime of the process. Link with `-Wl,-z,relro` (normally already
in `%{optflags}`); do not pass `-Wl,-z,norelro`.
"""
partial-relro="""
The binary or shared library has a GNU_RELRO segment but was linked
without BIND_NOW, so relocations resolve lazily and the GOT stays
writable until first use. Link with `-Wl,-z,relro,-z,now` (both are
normally already in `%{optflags}`) for full RELRO.
"""
missing-cf-protection="""
The binary or shared library was built without x86 control-flow
protection: its `.note.gnu.property` does not record both the IBT
(indirect branch tracking) and SHSTK (shadow stack) features, and
its `.text` contains no `ENDBR64` instructions, so at least one
of the two features cannot be enforced at runtime. Rebuild with `%{optflags}`
unmodified, which carries `-fcf-protection` on x86_64. This check
only verifies absence: the property is merged over all link inputs,
so code compiled with the flag whose property was cleared by an
input carrying none (hand-written assembly, a prebuilt object) does
not fire — rebuilding cannot restore the property there, the input
itself must carry one (`ld -z cet-report` names such inputs).
Verify with `readelf -n` that the GNU property list includes `IBT`
and `SHSTK`.
"""
missing-call-to-setgroups-before-setuid="""
This executable is calling setuid and setgid without setgroups or initgroups.
This means it didn't relinquish all groups, and this would be a potential
security issue.
"""
call-to-mktemp="""
This executable calls mktemp. As advised by the manpage (mktemp(3)), this
function should be avoided.
"""
call-to-gets="""
This file references gets. gets reads a line into a caller-supplied
buffer with no length bound, so any input longer than the buffer
overwrites memory; it was removed from the C standard and from
POSIX because no call to it can be made safe. The code should read
input with fgets(3) or getline(3) instead; the fix belongs in the
upstream project that ships the code.
"""
call-to-tmpnam="""
This file references tmpnam, tmpnam_r or tempnam. These functions
return a file name rather than an open file, so between the name
being chosen and the caller opening it, an attacker can plant a
symlink at that name and redirect the caller's write. The code
should use mkstemp(3), which creates and opens the file atomically;
the fix belongs in the upstream project that ships the code.
"""
unstripped-binary-or-object="""
This executable should be stripped of debugging symbols, in order to take
less space and be loaded faster. This is usually done automatically at
buildtime by rpm.
"""
lto-bytecode="""
This executable contains a LTO section.  LTO bytecode is not portable
and should not be distributed in static libraries or e.g. Python modules.
"""
lto-no-text-in-archive="""
This archive does not contain a non-empty .text section.  The archive
was not created with -ffat-lto-objects option.
"""
linked-against-opt-library="""
This executable is linked against a shared library in /opt folder.
"""
linked-against-usr-library="""
Libraries and executables under /bin, /sbin, /lib and /lib64 may not link
against a shared library in /usr folder.
"""
static-library-without-symtab="""
The static library doesn't contain any symbols and therefore can't be linked
against. This may indicate a stripped archive.
"""
binary-or-shlib-calls-gethostbyname="""
The binary calls gethostbyname. Please port the code to use getaddrinfo.
"""
binary-or-shlib-calls-md5="""
The binary calls the low-level MD5 functions (MD5, MD5_Init,
MD5_Update, MD5_Final). MD5 is broken as a cryptographic hash --
collisions are cheap -- so it must not protect integrity,
authenticity or credentials. A checksum over public, non-adversarial
data is a legitimate use that the binary alone cannot rule out,
which is why this finding is a warning: symbol presence is not
proof of misuse. Where MD5 carries a security decision, replace it
in the upstream source (SHA-256, or a keyed construction where the
use requires one).
"""
binary-or-shlib-calls-des="""
The binary calls the low-level DES functions (the DES_* entry
points, including the triple-DES DES_ede forms). Single DES has a
56-bit key and is brute-forced routinely, and triple-DES is
disallowed for new protection (NIST SP 800-131A); both survive
legitimately as compatibility relics, in legacy protocols and file
formats. Where DES protects anything current, replace it in the
upstream source; where it is a compatibility surface, the finding
records that the surface exists.
"""
binary-or-shlib-calls-rc4="""
The binary calls RC4 (RC4, RC4_set_key). RC4's keystream biases
make it unsuitable for confidentiality or integrity -- it is
prohibited in TLS by RFC 7465 -- and it survives legitimately only
as a compatibility relic. Where RC4 protects anything current,
replace it in the upstream source.
"""
go-toolchain-outdated="""
The binary was built with the Go toolchain named in the detail, which
predates the oldest release carrying fixes for known standard-library
defects (CVE-2025-22871, fixed in go1.23.8 and go1.24.2). A Go binary
keeps the standard library it was built with, so the defects stay in
the shipped binary until the package is rebuilt. Please rebuild the
package with a Go toolchain at or above the recorded floor.
"""
binary-or-shlib-calls-weak-prng="""
The binary calls the predictable libc random functions (rand,
random, srand, srandom, initstate, setstate, the *48 family or
their reentrant *_r forms) and runs in a privileged
or exposed context: the file is setuid, setgid or carries file
capabilities, or the package ships a systemd service or socket.
Values from these generators are predictable to anyone who can
guess the seed -- typically the current time or the process id --
so they must not become session identifiers, tokens, password
salts, challenges or key material. The same calls are unremarkable
for jitter, sampling and load spreading, which is why this finding
is a warning scoped to privileged and daemon-shipped binaries.
Where a generated value is security-relevant, take it from
getrandom(2), arc4random(3) or /dev/urandom in the upstream source
instead.
"""
static-library-without-debuginfo="""
The static library doesn't contain any debuginfo. Binaries linking against
this static library can't be properly debugged.
"""
program-not-linked-against-libc="""
The binary is not dynamically linked against libc.
"""
shared-library-without-dependency-information="""
The listed shared library doesn't include information about which other
libraries the library was linked against.
"""
forbidden-optflags="""
This executable was compiled with an unexpected flag.
"""
missing-hash-section="""
SystemV requires each shared library must provide .hash section that
is used for efficient symbol resolution.
"""
missing-gnu-hash-section="""
The .gnu.hash section is missing and leads to a slower symbol resolution
during dynamic linking.
"""
patchable-function-entry-in-archive="""
This archive contains a __patchable_function_entries section and can
accidentally make a shared library or an executable live-patchable.
"""

