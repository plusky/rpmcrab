python-doc-in-package="""
doc/ or docs/ directory in Python package directory. Documentation should go into %{docdir}, not %{python_sitelib}/<pkgname>"""
python-egg-info-distutils-style="""
The Python package's egg-info is a distutils style file.
Please update to dist-info standardized core metadata.
"""
python-tests-in-site-packages="""
test/ or tests/ directory in %{python_sitelib}. This should never happen since
this is a global name space not owned by any particular package.
"""
python-doc-in-site-packages="""
doc/ or docs directory installed to %{python_sitelib}. This should never happen
since this is a global name space not owned by any particular package.
"""
python-src-in-site-packages="""
src/ directory installed to %{python_sitelib}. This should never happen
since this is a global name space not owned by any particular package.
"""

python-missing-require="""
The python package declares some requirement that's not detected in the
rpm package. Please, verify that all dependencies are added as
Requires.
"""

python-leftover-require="""
Some python module Requires are missing from the python package's
requirements declaration. Please verify that all dependencies are
really needed.
"""

python-unflavoured-require="""
A requirement declared by the package's Python metadata is satisfied
only by a bare "python-<name>" Require. That name is not tied to any
Python flavour, so it does not by itself guarantee the module is
installed for the interpreter this package targets. Require the
flavour-specific name instead (for example
"python3.13-<name>" or "python3.13dist(<name>)").
"""

python-dist-info-version-mismatch="""
The Version in the package's own dist-info METADATA does not match
the RPM package version. Python tooling (pip, importlib.metadata)
reports the metadata version, so the disagreement breaks
version-based dependency resolution and confuses debugging. Make
them agree: stamp the real version into the metadata at build time
(a dist-info left at 0.0.0 was never stamped at all), or correct the
RPM version.
"""

python-require-floor-below-metadata="""
The package's Python metadata declares a minimum version for this
requirement, but the matching RPM Require carries a lower floor, so
the RPM dependency can be satisfied by a version the metadata
itself rejects. The dependency graph and the metadata disagree,
and either side can be the wrong one: raise the RPM Require floor
to at least the version the metadata declares (regenerating the
Requires with the current Python macros usually does this), or,
when the metadata floor itself is wrong for this package, correct
the metadata in the spec.
"""

python-require-unversioned-despite-metadata-floor="""
The package's Python metadata declares a minimum version for this
requirement, but the matching RPM Require carries no version at
all, so the RPM dependency can be satisfied by any version,
including ones the metadata itself rejects. The dependency graph
and the metadata disagree, and either side can be the wrong one:
give the RPM Require at least the floor the metadata declares
(regenerating the Requires with the current Python macros usually
does this), or, when the metadata floor itself is wrong for this
package, correct the metadata in the spec.
"""

python-pyc-multiple-versions="""
There are .pyc files in the rpm that are from different Python
interpreters. Please, verify that all files are needed for this package.
"""

python-sphinx-doctrees-leftover="""
A cached Sphinx build folder (".doctrees") was found in the package.
Please make sure not to include any build files in the final package.
"""
