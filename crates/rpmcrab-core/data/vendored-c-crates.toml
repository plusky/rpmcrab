# Vendored C libraries behind Rust -sys crates, for BinariesCheck's
# bundled-library-without-provides finding.
#
# Each entry names one crate whose C library the openSUSE bundled
# software policy wants declared as bundled(<srpm>): a -sys crate,
# or openssl-src, the crate whose OpenSSL build openssl-sys's
# `vendored` feature uses (always build kind in .dep-v0). The crate
# itself only ever earns a crate-level bundled(rust-crate:...) marker from
# cargo-packaging, which the maintenance query for bundled(<srpm>)
# misses. A library joins this map one at a time, with a measured
# witness: a byte string the library's code typically leaves in a
# binary that actually links it. The witness is what separates "the
# crate was resolved" (.dep-v0 lists the whole crate graph) from "the
# C code is in this binary" -- and it is a one-sided test: the suite
# pins shapes where a linked library leaves no witness (an
# unreachable error string, a remapped __FILE__ path), so absence
# never proves the library is not linked.
#
# The detail's remedies follow the fields below: it prescribes
# linking the system library only where a system_soname_prefix is
# recorded (the library has a system form the crate can link) and the
# binary does not already link it, and a version only where a
# c_version_source is recorded.
#
# Fields:
#   name                  the crate name in .dep-v0
#   srpm                  the source RPM name the detail prescribes
#   accepted_names        bundled() names that satisfy the finding
#   system_soname_prefix  DT_NEEDED prefix of the system library: a
#                         binary carrying it still fires while the
#                         witness is present; the prefix only drops
#                         the link remedy from the detail (absent: the
#                         library has no system form the crate can link)
#   link_soname           the soname the detail names for that remedy
#   witness               byte string proving the C code is linked
#   c_version_source      where the C version comes from:
#                         "embedded-version-string" (a dotted
#                         version string standing alone in the
#                         binary's data) or
#                         "crate-build-metadata" (the trailing
#                         all-numeric dotted run of the crate
#                         version's +build metadata, +<lib>.X.Y.Z,
#                         or a bare X.Y.Z as libgit2-sys records it);
#                         absent: no version source, and the detail
#                         prescribes no version
#   embedded_version_major  for "embedded-version-string": the major
#                         component the embedded string must carry.
#                         A binary holds many components' version
#                         strings; the library's own major narrows
#                         them, and the version is named only when
#                         the strings of that major agree on one
#                         value.
#
# The sqlite witness is the database header string every SQLite
# database starts with, `SQLite format 3`: in the census behind the
# ledger entry, 26 of its 29 findings were confirmed against the
# vendored library's DWARF compile units; the other three sit in
# debuginfo carrying no DWARF for the library, so the witness is the
# only evidence there. The witness cannot tell SQLite from its
# SQLCipher fork (see the libsqlite3-sys entry below).
#
# The libgit2 witness is the index-lock error string from
# libgit2/src/libgit2/index.c: in the draw behind the ledger entry
# it fires in 10 of the 11 runtime libgit2-sys ELFs, against 6 of
# 11 for the `libgit2 X.Y.Z` banner, which is library-internal and
# is not a witness. The crate version's build metadata names the
# C version (+1.9.7 carries libgit2 1.9.7), and the crate's
# LIBGIT2_NO_VENDOR switch links the system library instead, so
# the detail prescribes that link or bundled(libgit2).

# The onig_sys witness is the error string `too big wide-char value`
# from Oniguruma's regerror.c, which the crate vendors whole: in the
# census behind the ledger entry, rioterm-0.5.28's /usr/bin/rio
# (onig_sys 69.9.3, vendoring Oniguruma 6.9.10, the version TW's
# libonig5 ships) carries the witness and NEEDs no libonig. The
# crate links the system library only when RUSTONIG_SYSTEM_LIBONIG
# is set, so the system form stays the prescribed remedy.

as_of = "2026-10-31"

# libsqlite3-sys's `sqlcipher` feature builds the SQLCipher fork
# from the same crate: .dep-v0 still names libsqlite3-sys and the
# witness cannot distinguish the fork from SQLite itself, so
# bundled(sqlcipher) is an accepted name here and satisfies a
# finding whose detail prescribes bundled(sqlite3).
[[crate]]
name = "libsqlite3-sys"
srpm = "sqlite3"
accepted_names = ["sqlite3", "libsqlite3", "sqlcipher"]
system_soname_prefix = "libsqlite3.so."
link_soname = "libsqlite3.so.0"
witness = "SQLite format 3"
c_version_source = "embedded-version-string"
embedded_version_major = "3"

[[crate]]
name = "aws-lc-sys"
srpm = "aws-lc"
accepted_names = ["aws-lc"]
witness = "/aws-lc/crypto/fipsmodule/"

[[crate]]
name = "zstd-sys"
srpm = "zstd"
accepted_names = ["zstd", "libzstd"]
system_soname_prefix = "libzstd.so."
link_soname = "libzstd.so.1"
witness = "Unknown frame descriptor"
c_version_source = "crate-build-metadata"

[[crate]]
name = "onig_sys"
srpm = "oniguruma"
accepted_names = ["oniguruma", "libonig"]
system_soname_prefix = "libonig.so."
link_soname = "libonig.so.5"
witness = "too big wide-char value"

# openssl-src's `vendored` build compiles OpenSSL from the crate's
# tarball: the default provider's name string is the witness (its site
# is openssl/providers/defltprov.c:60 in openssl-src-300.6.1+3.6.3).
# The public `OpenSSL X.Y.Z` version text is rejected as a witness: it
# lands in dynamic libcrypto consumers too. The C version is the crate
# version's build metadata (300.6.1+3.6.3 carries OpenSSL 3.6.3). In
# the draws behind #1396, 15 of the 18 TW OSS binary packages carrying
# bundled(rust-crate:openssl-src) have no Requires on the system
# soname; the entry's own draw holds 8 listing ELFs, all build kind,
# 4 witnessed without a system link.
[[crate]]
name = "openssl-src"
srpm = "openssl-3"
accepted_names = ["openssl-3", "openssl"]
system_soname_prefix = "libcrypto.so."
link_soname = "libcrypto.so.3"
witness = "OpenSSL Default Provider"
c_version_source = "crate-build-metadata"
[[crate]]
name = "libgit2-sys"
srpm = "libgit2"
accepted_names = ["libgit2"]
system_soname_prefix = "libgit2.so."
link_soname = "libgit2.so.1.9"
witness = "the index is locked; this might be due to a concurrent or crashed process"
c_version_source = "crate-build-metadata"
# lmdb-master-sys vendors the LMDB mdb.master branch (0.9.70) while
# Tumbleweed ships the 0.9.35 release (liblmdb-0.9.35.so); the crate
# has no environment switch or pkg-config path to link the system
# library (its build.rs links only advapi32 on Windows), so the
# entry carries no system soname pair and no version source. The
# witness is the MDB_KEYEXIST error string from
# lmdb/libraries/liblmdb/mdb.c:1746 in lmdb-master-sys-0.2.6,
# measured in nushell's /usr/bin/nu: the frame is 3 of 3 packages
# carrying bundled(rust-crate:lmdb-master-sys) with no system link,
# one of which already declares bundled(lmdb).
[[crate]]
name = "lmdb-master-sys"
srpm = "lmdb"
accepted_names = ["lmdb", "liblmdb"]
witness = "MDB_KEYEXIST: Key/data pair already exists"
