# Disallowed Runtime dependencies
InvalidRequires = [
    '^is$',
    '^not$',
    '^owned$',
    '^by$',
    '^any$',
    '^package$',
    '^libsafe\.so\.',
]
# List of directory prefixes that are not allowed in packages
# In addition rpmlint will warn about non-ghost files in "/run/"
DisallowedDirs = [
    "/home",
    "/mnt",
    "/opt",
    "/proc",
    "/tmp",
    "/usr/local",
    "/usr/tmp",
    "/var/local",
    "/var/lock",
    "/var/run",
    "/var/tmp",
]

# Only these directories may be used by packages compatible with
# atomic updates
AtomicAllowedDirs = [
    "/etc/",
    "/usr/",
    "/bin/",
    "/lib/",
    "/lib64/",
    "/sbin/",
    "/boot/",
]

# List of subdirectories which are disallowed for atomic updates
# despite being within otherwise allowed directories
AtomicDisallowedSubdirs = [
    "/usr/local/",
    "/boot/efi/",
]

# Standard OS groups
StandardGroups = [
    "root",
    "bin",
    "daemon",
    "adm",
    "lp",
    "sync",
    "shutdown",
    "halt",
    "mail",
    "news",
    "uucp",
    "man",
    "nobody",
]
# Standard OS users
StandardUsers = [
    "root",
    "bin",
    "daemon",
    "adm",
    "lp",
    "sync",
    "shutdown",
    "halt",
    "mail",
    "news",
    "uucp",
    "operator",
    "man",
    "nobody",
]
# List of directories considered to be system default library search paths.
SystemLibPaths = [
    "/lib",
    "/usr/lib",
    "/usr/X11R6/lib",
    "/lib64",
    "/usr/lib64",
    "/usr/X11R6/lib64",
]
# List of regexp strings with executables that must be compiled as position independent
PieExecutables = []
# Architecture dependent paths in which packages are allowed to install files
# even if they are all non-binary
UsrLibBinaryException = '^/usr/lib(64)?/(perl|python|ruby|menu|pkgconfig|ocaml|lib[^/]+\.(so|l?a)$|bonobo/servers/|\.build-id|firmware|systemd|sysusers\.d)'
# List of compilation flags that are mandatory
MandatoryOptflags = []
# List of forbidden compilation flags
ForbiddenOptflags = []
# Interpreters whose scriptlets are allowed to be empty
ValidEmptyShells = [
    "/sbin/ldconfig",
]
# Package scriptlet interpreters
ValidShells = [
    "<lua>",
    "/bin/sh",
    "/bin/bash",
    "/sbin/sash",
    "/usr/bin/perl",
    "/sbin/ldconfig",
]
# Values for the Group tag, if not specified pulled from RPM
ValidGroups = []
# Permissions for files in source packages
ValidSrcPerms = [
    "0o644",
    "0o755",
]
# Valid values for the License tag
ValidLicenses = []

# Default valid license exceptions
ValidLicenseExceptions = []

# Default list of authorized PAM modules
PAMAuthorizedModules = []

# Minimum size of files to check duplicates, in bytes
DuplicatesMinSize = 2

# Additional warnings on specific function calls

# systemd unit directory (the reference expands %{_unitdir} at import time;
# rpmcrab has no macro expansion, so it is a config key).
SystemdUnitDir = "/usr/lib/systemd/system"

[WarnOnFunction]
#[WarnOnFunction.testname]
#f_name = ""
#good_param = ""
#description = ""
# Set badness tweaking for various options
[Scoring]
#function=0

# Paths in which non-XDG legacy icons should be installed
[IconPath]
[IconPath."/usr/share/icons/"]
path = "/usr/share/icons/"
type = "normal"
[IconPath."/usr/share/icons/mini"]
path = "/usr/share/icons/mini"
type = "mini"
[IconPath."/usr/share/icons/large"]
path = "/usr/share/icons/large"
type = "large"

# Default known application launchers for desktop entries
[MenuLaunchers]
[MenuLaunchers.kdesu]
regexp = '(?:/usr/bin/)?kdesu'
binaries = ['/usr/bin/kdesu', 'kdesu']
[MenuLaunchers.x11_clanapp]
regexp = '(?:/usr/bin/)?launch_x11_clanapp'
binaries = ['/usr/bin/launch_x11_clanapp', 'clanlib', 'libclanlib0']
[MenuLaunchers.soundwrapper]
regexp = '(?:/usr/bin/)?soundwrapper'
binaries = false

# Exception list for dangling symlink checks.  The first in each pair ("path")
# is a regexp, and the second ("name") the package in which the target of the
# dangling symlink is shipped
[DanglingSymlinkExceptions]

# A table with key/value pairs representing new descriptions for rpmlint errors
[Descriptions]
# rpmlint-error-name = """
# A new description for this rpmlint error
# """"

# systemd-tmpfiles restrictions (reference configs/openSUSE/security.toml).
[SystemdTmpfiles]
DropinDirs = [
    # nothing should ever be installed here, but lets stay on the safe side
    "/etc/tmpfiles.d",
    "/usr/lib/tmpfiles.d",
]
# base system packages that would create too much noise to include them in the
# whitelistings
IgnorePackages = [
    "filesystem",
    "udev",
    "udev-mini",
    "systemd",
    "systemd-mini",
]


# Whitelisted tmpfiles.d entries (reference configs/openSUSE/systemd-tmpfiles.toml).
[[SystemdTmpfilesWhitelist]]
package = "rpmlint-integration-test"
bug = "bsc#1150905"
note = "valid test whitelisting entry for the OBS integration test package"
path = "/usr/lib/tmpfiles.d/rpmlint-test.conf"
entries = [
	"d /tmp/.rpmlint-stuff 0777 root root -"
]

[[SystemdTmpfilesWhitelist]]
package = "tmux"
bug = "bsc#1150905"
note = "tmux creates per-session directories there"
path = "/usr/lib/tmpfiles.d/tmux.conf"
entries = [
	"d /run/tmux 1777 root root -"
]

[[SystemdTmpfilesWhitelist]]
package = "libtss2-fapi-common"
bug = "bsc#1150905"
note = "shared setgid tss directories for the feature API framework"
path = "/usr/lib/tmpfiles.d/tpm2-tss-fapi.conf"
entries = [
	"d  /var/lib/tpm2-tss/system/keystore 2775 tss tss - -",
	"d  /run/tpm2-tss/eventlog            2775 tss tss - -",
	"a+ /var/lib/tpm2-tss/system/keystore - - - - default:group:tss:rwx",
	"a+ /run/tpm2-tss/eventlog            - - - - default:group:tss:rwx"
]

[[SystemdTmpfilesWhitelist]]
package = "brltty"
bug = "bsc#1150905"
note = "directories for UNIX domain sockets"
path = "/usr/lib/tmpfiles.d/brltty.conf"
entries = [
	"d /var/lib/brltty 2770 brltty brltty",
	"d /var/lib/BrlAPI 3777 brltty brltty"
]

[[SystemdTmpfilesWhitelist]]
package = "rubygem-passenger"
bug = "bsc#1150905"
note = "alternative /tmp directory introduced through SUSE specific patch"
path = "/usr/lib/tmpfiles.d/passenger.conf"
entries = [
	"D /run/passenger 1777 root root -"
]

[[SystemdTmpfilesWhitelist]]
package = "openQA"
bug = "bsc#1150905"
note = "directory for downloading assets"
path = "/usr/lib/tmpfiles.d/openqa-webui.conf"
entries = [
	"d /var/lib/openqa/share/factory/tmp 1777 root root 6h"
]

[[SystemdTmpfilesWhitelist]]
package = "parallel-printer-support"
bug = "bsc#1150905"
note = "device nodes for parallel printers that udev no longer creates"
path = "/usr/lib/tmpfiles.d/parallel-printer.conf"
entries = [
	"c /dev/lp0 0660 root lp - 6:0",
	"c /dev/lp1 0660 root lp - 6:1",
	"c /dev/lp2 0660 root lp - 6:2",
	"c /dev/lp3 0660 root lp - 6:3"
]

[[SystemdTmpfilesWhitelist]]
package = "screen"
bug = "bsc#1150905"
note = "shared session dir for non-root users"
path = "/usr/lib/tmpfiles.d/screen.conf"
entries = [
	"d /run/uscreens 1777 root root -"
]

[[SystemdTmpfilesWhitelist]]
package = "dkms"
bug = "bsc#1150905"
note = "private tmp directory for this package"
path = "/usr/lib/tmpfiles.d/dkms.conf"
entries = [
	"d /var/tmp/dkms 0700 root root -"
]

[[SystemdTmpfilesWhitelist]]
package = "gromox"
bug = "bsc#1200165"
note = "gromox creates these two temporary directories"
path = "/usr/lib/tmpfiles.d/tmpfiles-gromox.conf"
entries = [
	"d /run/gromox 0775 gromox gromox",
	"d /var/tmp/gromox-fpm 0770 gromox gromox 1d"
]

[[SystemdTmpfilesWhitelist]]
package = "nix"
bugs = ["bsc#1243206", "bsc#1246162"]
note = "The Nix package manager maintains a UNIX domain socket and directory structure in this non-standard location"
path = "/usr/lib/tmpfiles.d/nix-daemon.conf"
entries = [
    "d /nix/var/nix/daemon-socket 0755 root root - -",
    "d /nix/var/nix/builds        0755 root root 7d -"
]

[[SystemdTmpfilesWhitelist]]
package = "samba-client"
bugs = ["bsc#1251267"]
note = "Used as Samba printer spool. A non-default location to help dealing with SELinux."
path = "/usr/lib/tmpfiles.d/samba.conf"
entries = [
    "d /var/samba/spool 1777 root root"
]

[[SystemdTmpfilesWhitelist]]
package = "aaa_base-extras"
