family = "hardening"
gate = "none"
provenance = [
    "Without IBT/SHSTK recorded in .note.gnu.property, indirect branches face no hardware control-flow check at runtime.",
]

[[member]]
tag = "executable-stack"
class = "defect-pattern"
family = "hardening"
gate = "none"
provenance = [
