# The defect-pattern registry (issue #959).
#
# One [[member]] record per finding tag in the defect-pattern class.
# Class membership is a property of the tag, recorded here once; the
# output renderers, the rpmlintrc `class:<name>` filter matching
# and the `-v` descriptions all read this file, so every consumer
# sees the same membership.
#
# Fields per member:
#   tag        the finding tag, exactly as emitted.
#   class      the class the tag belongs to.
#   family     "pattern" (a dangerous-API / call pattern) or
#              "hardening" (a mitigation-absence pattern).
#   gate       the context gate the finder's severity hangs on:
#              "privilege-or-exposure", "no-safe-use", "self", "none".
#   provenance the recorded defect samples that put the finder on
#              the on-ramp: CVE/advisory root causes in the pattern's
#              class, or a verified in-distro instance. Every member
#              carries at least one.

[[member]]
tag = "binary-or-shlib-calls-gethostbyname"
class = "defect-pattern"
family = "pattern"
gate = "privilege-or-exposure"
provenance = [
    "RsyncProject/rsync#563: in the rsync daemon's hosts allow/deny matching, hostname tokens resolved with gethostbyname() never match an IPv6 peer, so a hosts deny rule silently fails open (verified in the openSUSE rsync 3.5.1 audit; fix proposed upstream in RsyncProject/rsync#1140).",
    "CVE-2026-43617 and CVE-2026-70452: fail-open defects in the same hostname-ACL path, hardened upstream.",
]

[[member]]
tag = "binary-or-shlib-calls-md5"
class = "defect-pattern"
family = "pattern"
gate = "none"
provenance = [
    "Class-level provenance (rpmcrab#972): MD5 collision resistance is broken (chosen-prefix collisions are practical), so the low-level MD5 entry points (MD5, MD5_Init, MD5_Update, MD5_Final, MD5_Transform) must not carry integrity, authenticity or credential decisions. No per-file CVE is claimed: in the survey window, weak-crypto fixes were library-internal or config/policy changes, and the distribution already carries the config half as the crypto-policy-non-compliance checks.",
    "Factory corpus on-ramp measurement (rpmcrab#972, full snapshot): 98 files in 52 binary packages hold an undefined reference to the set, every one classified by hand. The population is protocol-mandated compatibility (HTTP Digest, IPMI, CRAM-MD5, STUN), content and format checksums (dpkg md5sums, AFF image hashes, build-system identifiers), password-cracking workloads and library/binding surface; security-context uses exist (znc, tvheadend in daemon packages) but no package-fact shape separates them, so the level is Warning.",
]

[[member]]
tag = "binary-or-shlib-calls-des"
class = "defect-pattern"
family = "pattern"
gate = "none"
provenance = [
    "Class-level provenance (rpmcrab#972): single DES has a 56-bit key, brute-forced routinely since the EFF's Deep Crack (1998), and triple-DES is disallowed for new protection under NIST SP 800-131A; the low-level DES_* entry points survive legitimately only as protocol and format compatibility. No per-file CVE is claimed, for the same reason as the MD5 member.",
    "Factory corpus on-ramp measurement (rpmcrab#972, full snapshot): 42 files in 31 binary packages hold an undefined reference to a DES_* entry point, every one classified by hand. The population is NTLM/DIGEST-MD5 SASL and GSS compatibility, MIFARE and TPM-spec surfaces, MariaDB's legacy DES_ENCRYPT functions, the OpenSSL legacy provider, and one verified security-context use -- grisbi encrypts the user's account file with single DES -- which no package fact separates from the compatibility mass, so the level is Warning.",
]

[[member]]
tag = "binary-or-shlib-calls-rc4"
class = "defect-pattern"
family = "pattern"
gate = "none"
provenance = [
    "Class-level provenance (rpmcrab#972): RC4's keystream biases are exploitable in practice and RC4 is prohibited in TLS by RFC 7465; the entry points (RC4, RC4_set_key, RC4_options) survive legitimately only as protocol compatibility. No per-file CVE is claimed, for the same reason as the MD5 member.",
    "Factory corpus on-ramp measurement (rpmcrab#972, full snapshot): 7 files in 6 binary packages hold an undefined reference to the set, every one classified by hand -- NTLM session-key compatibility (gssntlmssp), BitTorrent and DC++ protocol encryption, a Python binding surface (M2Crypto) and VirtualBox's runtime. No security-context application use and no isolable shape, so the level is Warning.",
]

[[member]]
tag = "call-to-mktemp"
class = "defect-pattern"
family = "pattern"
gate = "no-safe-use"
provenance = [
    "mktemp(3) returns a predictable name, so an attacker pre-plants a symlink at that name and the caller's subsequent open follows it (CWE-377); the manpage directs callers to mkstemp() instead.",
    "Factory corpus measurement in rpmcrab#852: 74 errors in 41 source packages with every firing file classified.",
]

[[member]]
tag = "call-to-gets"
class = "defect-pattern"
family = "pattern"
gate = "no-safe-use"
provenance = [
    "gets(3) reads a line into a caller buffer with no bound -- the defining call of CWE-242 (use of an inherently dangerous function); it was removed from C11 and from POSIX.1-2024, and glibc keeps the symbol only for binary compatibility with old programs.",
    "Factory corpus measurement for this finder (rpmcrab#972): zero undefined references in 51,586 binary RPMs \u2014 no in-distro caller exists today, so the finder stands as a tripwire for the class; glibc's own libc, which defines gets as a compatibility symbol, stays silent because a definition is not a reference.",
]

[[member]]
tag = "missing-call-to-setgroups-before-setuid"
class = "defect-pattern"
family = "pattern"
gate = "self"
provenance = [
    "A process that calls setuid()/setgid() without setgroups()/initgroups() keeps its supplementary group memberships across the privilege drop, so the dropped-to identity retains group access it must not have.",
]

[[member]]
tag = "missing-fortify"
class = "defect-pattern"
family = "hardening"
gate = "none"
provenance = [
    "With _FORTIFY_SOURCE absent, libc calls whose argument sizes are known at compile time run unchecked, so a buffer overflow the __*_chk variants abort on proceeds silently.",
]

[[member]]
tag = "missing-stack-protector"
class = "defect-pattern"
family = "hardening"
gate = "none"
provenance = [
    "Without a stack canary, a stack buffer overflow overwrites the saved return address with no runtime detection.",
]

[[member]]
tag = "missing-relro"
class = "defect-pattern"
family = "hardening"
gate = "none"
provenance = [
    "Without a GNU_RELRO segment the GOT stays writable for the whole process lifetime, so an arbitrary-write primitive can redirect a library call through it.",
]

[[member]]
tag = "partial-relro"
class = "defect-pattern"
family = "hardening"
gate = "none"
provenance = [
    "RELRO without BIND_NOW resolves relocations lazily, so the GOT stays writable until first use instead of being sealed at startup.",
]

[[member]]
tag = "missing-cf-protection"
class = "defect-pattern"
family = "hardening"
gate = "none"
provenance = [
    "Without IBT/SHSTK recorded in .note.gnu.property, indirect branches face no hardware control-flow check at runtime.",
]

[[member]]
tag = "executable-stack"
class = "defect-pattern"
family = "hardening"
gate = "none"
provenance = [
    "An executable stack turns a stack buffer overflow directly into code execution, with no need for a ROP chain.",
]

[[member]]
tag = "non-position-independent-executable"
class = "defect-pattern"
family = "hardening"
gate = "none"
provenance = [
    "A non-PIE executable loads at a fixed address, so its code and gadgets sit at known addresses and ASLR gives its main image no layout secrecy.",
]
