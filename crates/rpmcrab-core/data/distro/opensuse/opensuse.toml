]

# Packages allowed to ship systemd preset files (not from upstream;
# see SYSTEMD_PRESET_PACKAGES in scripts/generate-distro-configs.py).
SystemdPresetPackages = [
    "systemd",
    "systemd-mini",
    "systemd-presets-branding-Aeon",
    "systemd-presets-branding-Kalpa",
    "systemd-presets-branding-MicroOS",
    "systemd-presets-branding-openSUSE",
    "systemd-presets-branding-transactional-server",
    "systemd-presets-common-SUSE",
    "systemd-presets-branding-SLE",
    "systemd-presets-branding-SLE_immutable",
    "systemd-presets-branding-Elemental",
    "systemd-presets-branding-SLE-SAP",
    "systemd-presets-branding-SLE-SAP_immutable",
]
[DanglingSymlinkExceptions."/usr/share/doc/licenses/"]
path = "/usr/share/doc/licenses/"
name = "licenses"
[DanglingSymlinkExceptions."consolehelper$"]
path = "consolehelper$"
name = "usermode-consoleonly"

# package/path combinations that are allowed to ship %ghost files in locations
# restricted by FileDigestCheck
[[GhostFilesExceptions]]
package = "polkit-default-privs"
paths = [
    "/etc/polkit-1/rules.d/90-default-privs.rules",
]

# package/path combinations that are allowed to ship symlinks in locations
# restricted by FileDigestCheck (where otherwise symlinks are rejected)
#
# files matching this condition will be ignored and not be verified at all
[[SymlinkExceptions]]
packages = ["systemd", "systemd-mini"]
paths = [
    # compatibility symlink towards /etc/sysctl.conf for systemd-sysctl
    "/usr/lib/sysctl.d/99-sysctl.conf"
]

# Per-file grants for FilesCheck findings (not from upstream;
# see FILE_GRANTS in scripts/generate-distro-configs.py). Each
# grant names the package, the findings that stay quiet for its
# files, and the reason the grant exists.
[[FileGrants]]
package = "rpm"
paths = [
    "/usr/lib64/librpm.so.10.2.1",
    "/usr/lib64/librpmio.so.10.2.1",
    "/usr/lib64/librpmsign.so.10.2.1",
]
findings = [
    "postin-without-ldconfig",
    "library-without-ldconfig-postun",
]
reason = "the package ships no ldconfig scriptlets by design; openSUSE has no ldconfig file triggers (#569), so no platform mechanism maintains the cache in their place"

[[FileGrants]]
package = "systemd"
paths = [
    "/usr/lib64/libnss_myhostname.so.2",
    "/usr/lib64/libnss_systemd.so.2",
]
findings = [
    "postun-without-ldconfig",
]
reason = "%post runs ldconfig, under the spec's comment 'Run ldconfig for nss-systemd and nss-myhostname NSS modules'; the %postun omission is the package's evidenced design"

[[FileGrants]]
package = "smartmontools"
paths = [
    "/etc/smartd_warning.sh",
]
findings = [
    "executable-marked-as-config-file",
]
reason = "smartd's warning hook: it must be executable to run and is marked %config because admins edit it"

[[FileGrants]]
package = "tuned"
paths = [
    "/etc/grub.d/00_tuned",
]
findings = [
    "executable-marked-as-config-file",
]
reason = "grub.d scripts are executables by construction (grub-mkconfig runs them); the %config marking is deliberate"

[FileDigestLocation]

[FileDigestGroup]

[DeviceFilesWhitelist]

[WorldWritableWhitelist]

[SystemdTmpfilesWhitelist]

[Descriptions]
non-standard-uid = '''A file in this package is owned by an unregistered user
id.  To register the user, please make a pull request to the rpmlint config
file configs/openSUSE/users-groups.toml in the opensuse branch of the rpmlint
repository.
'''
non-standard-gid = '''A file in this package is owned by an unregistered group
id.  To register the group, please make a pull request to the rpmlint config
file configs/openSUSE/users-groups.toml in the opensuse branch of the rpmlint
repository.
'''
no-changelogname-tag = '''There is no changelog. Please insert a '%changelog' section heading in your
spec file and prepare your changes file using e.g. the 'osc vc' command.'''
