description = "Hand-built probe RPM (rpmbuild, x86_64) for explicit-lib-dependency. The package ships a binary linking libfoo.so.1, so its header carries the generated dependency libfoo.so.1()(64bit), and four explicit requirements: appstream-glib, libfoo, libfoo1 and zlib. The reference fires explicit-lib-dependency on all four names; the port's behaviour on these names is ledgered in divergences.toml."

