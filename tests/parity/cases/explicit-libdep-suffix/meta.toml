[source]
description = "Hand-built probe RPM (rpmbuild, x86_64) for explicit-lib-dependency. The package ships a binary linking libfoo.so.1, so its header carries the generated dependency libfoo.so.1()(64bit), and four explicit requirements. libfoo1 is the conventional package name of that generated soname dependency, and it is the one name rpmcrab fires on. appstream-glib is a suffix-only name and zlib a genuine library without the lib* prefix: the reference fires on both, rpmcrab stays silent — neither duplicates a generated dependency, and the anchored lib-package regex (#365) matches neither. libfoo is the bare lib<stem> form: it names a different package than the library package libfoo1 (the libnbd tools package vs libnbd0), so it duplicates nothing and stays silent (#851). Redundancy is not the sole condition: the requirement must also be unversioned and unqualified, a plain package name rather than a capability, and pass the anchored regex with no .so capture. expected/ is a hand-written synthetic snapshot of rpmcrab's own output on this input — not a reference capture — regenerated for the binary-carrying probe; the run exits 64, the one error failing the run (#699)."

[tools]
present = ["rpmbuild", "gcc"]       # external tools used to build the input

