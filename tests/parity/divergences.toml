check = "session-header"
kind = "behaviour"
reason = "The vendored distro-config layer lists every vendored file under 'configuration:' as <distro:opensuse>/... (one line per file), while the reference under the same overlay lists only the disk paths it read. A parity runner diffing full reports would flag the header even when every finding matches; normalize the <distro:...> lines out (or compare findings only) before diffing."
since = "0.1.0"

[[divergence]]
case = "global"
check = "session-header"
kind = "behaviour"
reason = "The session banner identifies rpmcrab itself ('rpmcrab: X.Y.Z', the crate's own version) instead of emulating the reference's banner ('rpmlint: 2.10.0'). The banner is not grepped by build tooling, so the reference emulation was dropped (see `docs/DESIGN.md` §4.5); the abort banner, footer, sort order and exit codes are untouched."
since = "0.1.0"

[[divergence]]
case = "global"
check = "time-report"
kind = "behaviour"
reason = "With -t, a duration map whose entries all sum to zero prints cleanly; the reference divides by the total unguarded and raises ZeroDivisionError (lint.py:158), so `rpmcrab -i rpm -t` succeeds where `rpmlint -i rpm -t` dies."
since = "0.1.0"

[[divergence]]
case = "global"
check = "time-report"
kind = "behaviour"
reason = "With -t, BinariesCheck's “Checked files” column shows the run-lifetime total instead of blank: the check no longer resets per package (the per-worker check set is reset between packages, but the count accumulates for the merged report). The reference sets checked_files to None on every reset (AbstractCheck.py:65) and resets after each package (lint.py:271), so its column is blank."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/pull/1595"

[[divergence]]
case = "global"
check = "unused-rpmlintrc-filter"
kind = "severity"
reason = "Deliberate severity divergence (plusky/rpmcrab#816): the port reports W; the reference reports E (filter.py validate_filters). The audit judges the rpmlintrc, not the package, and the reference gives the finding no build effect of its own: it is in no scoring table (the default badness 1 applies, scoring-strict included), and cli.py enforces --permissive on every invocation without -s/--strict (rpmlint#1592), so a reference run whose only error is this audit exits 0 — OBS fails a build on any nonzero linter exit (obs-build recipe_run_rpmlint), and Factory packages carrying the finding build. In the severity-only exit model (§4.6) the E failed builds on its own: home:scarabeus_iv apparmor branch builds under rpmcrab 0.3.0 failed on the libapparmor flavour whose only error was this finding, while the reference reports the identical finding on both apparmor flavour sets and the same packages build in Factory. Detection, matching and accounting are unchanged — a per-run audit on the last package reporting the reference's pattern set (#353) — and -s/--strict promotes the warning to E together with every other finding. Measured on the 2026-10-18 Factory sweep (run-20261018-175318e8): 1,599 findings in 635 source packages."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/816"

[[divergence]]
case = "global"
check = "worker/report"
kind = "behaviour"
reason = "Upstream rpmlint#255 (rpmcrab#286): a multi-package run logs one `checking <pkg> (n of m)` info line per package on stderr as its work starts, so a stuck run shows where it stopped. stderr-only: the findings and the footer on stdout are byte-identical, and single-package runs stay silent behind the `total > 1` guard, so single-input parity cases are unaffected. Multi-input cases (`dbus-parity`, `parity`) gain progress lines on stderr while their stdout stays clean. `RUST_LOG` overrides the default filter; an invalid `RUST_LOG` warns on stderr and falls back to the default."
since = "0.1.0"
upstream = "https://github.com/rpm-software-management/rpmlint/issues/255"
