kind = "behaviour"
reason = "Fix-and-diverge (issues #813, #845): a non-executable file whose interpreter line marks content the owning program consumes by reading, importing, sourcing or rendering does not emit non-executable-script. The shapes are decidable from the path and the interpreter alone, and two guards bound them: a file installed directly in a script directory (/bin, /sbin, /usr/bin, /usr/sbin, /usr/local/bin, /usr/local/sbin) never counts as data, and the remaining directory-component shapes count only inside the data and library trees (/usr/src/, /usr/share/, /usr/lib/, /usr/lib64/, /usr/etc/, /etc/) -- the library trees count wherever they are rooted -- so the same components in an entry-point tree such as /usr/libexec/ keep firing. The shapes: library trees (a site-packages, dist-packages, node_modules or gems component; files under the Ruby library roots /usr/lib/ruby/ and /usr/lib64/ruby/ and the Perl library roots /usr/lib/perl5/ and /usr/lib64/perl5/), language directories (a python or python3[.x] component; a lib component past the first two path components holding a script-language file - .py, .rb, .pl, .lua, .php, .sh or .bash; a bash component holding a .sh or .bash file; a .py file in an extensions, plugins or auto-load component), source trees (a src component), test and example material (a test, tests, selftests, example, examples, sample or samples component), sourced fragments (files under /usr/share/bash-completion/; an exact profile or rc basename or a bashrc name segment (delimited by '.', '_' or '-') in a sourced location under /etc/, /usr/etc/, /usr/lib/, /usr/lib64/ or /usr/share/; an interpreter whose basename is exactly false) and templates (a final .in, .sample, .tmpl, .tpl, .template, .skel or .j2 suffix). The exempt files are modules, fragments, templates and source material the owning program reads, renders or streams elsewhere, so an interpreter line there does not mark a file executed in place and the missing exec bit is not a defect; in the