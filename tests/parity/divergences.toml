reason = "find_perm_in_tmpfiles normalizes the ghost path lexically (clean_path); the reference calls os.path.realpath, which additionally resolves symlinks against the build host's filesystem, so the match sets can differ when a tmpfiles.d path traverses a build-host symlink. Package paths from the RPM header are already canonical, and resolving them against the build host is meaningless for target-system paths. Separately, on a tmpfiles.d line with fewer than 5 whitespace-separated fields the reference's unpack raises ValueError (its except catches only IndexError), aborting the whole run via lint.py:293 (sys.exit(3)); the port skips the malformed line and continues with defaults."
