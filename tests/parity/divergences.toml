[[divergence]]
case = "global"
check = "symlink-contains-up-and-down-segments"
kind = "behaviour"
reason = "Fix-and-diverge: the finding does not fire when the link target consists only of .. segments. The reference scan consumes leading ../ prefixes, so the final .. of a pure-up target (which carries no trailing slash) survives as the remainder and is counted as an interior up-and-down segment, although the link contains no down segment at all and is already in its shortest relative form. The motivating instance is ntp's chroot mirror link /var/lib/ntp/var/lib/ntp -> ../.., which resolves to the jail root /var/lib/ntp and whose shortest relative form is the shipped target itself; both distro configs already carry a path filter for the same mirror shape in bind (/var/lib/named). Measured on the current TW snapshot (header census over all 52,984 packages, 439,915 symlinks, exact predicate port): 1 E corpus-wide before, 0 after; the scoped delta over the firing package plus 17 dotdot-carrying controls is 6,098 to 6,097 findings, the removed set exactly that one finding and no other movement. Targets with a named segment before an interior .. (../foo/../bar) still fire. Pinned by symlink_up_and_down_segments in files.rs."
since = "0.4.1"

[[divergence]]
case = "global"
check = "missing-dependency-to-crontabs"
kind = "behaviour"
reason = "Only non-directory entries inside a /etc/cron.* directory are charged, and a dependency on `cron` or `cronie` satisfies the check. The reference charges every '/etc/cron.' path, including the cron.* directory entries themselves (the #552 base-dir false positive, replicated until now) and daemon files sitting directly in /etc -- /etc/cron.deny is cronie's own access-control file, not a cron script. Measured on the Factory corpus, 11 of the check's 14 findings are those two shapes (cron x5 directory entries, systemd-generator-cron2timer x5, cronie /etc/cron.deny). The 3 remaining findings are real cron scripts (cronie-anacron, matomo, nextcloud) whose packages depend on the cron stack under its current names: the provider the reference demands, `crontabs`, was renamed and exists nowhere in the corpus (no package named, providing, requiring, recommending or suggesting it), so crediting `cron` and `cronie` by exact name match is the only satisfiable reading; lookalike names (cronie-anacron, systemd-cron, cron-utils) keep firing. The reference fires all 14 (verified against rpmlint 2.10.0, openSUSE config); with both parts of this divergence the check fires none of them. A package that is itself one of the providers (crontabs, cron, cronie) needs no dependency. Pinned by the missing_dependency_to_crontabs_* tests in files.rs."
since = "0.4.1"

[[divergence]]
case = "global"
check = "no-manual-page-for-binary"
kind = "behaviour"
reason = "Deliberate: the port credits a bindir name whose man page it lacks when the name is the same binary as a documented one in the same package: a symlink whose resolved in-package target carries a man page under the target's name (OpenIPMI's ipmicmd -> openipmicmd, shntool's mode links), or a hardlink (same rdev+inode) to a file whose name carries one (gzip's uncompress == gunzip). The reference (FilesCheck.py:559-564) consults only its man_basenames set and fires on every such alias (verified against rpmlint 2.10.0 on the Factory corpus representatives). Resolution stops at the package boundary: a link whose target the package does not ship, and a target without a page, keep firing. Scope, recorded (issue #1075): the symlink credit is basename-only -- the resolved target need not be a regular executable; its basename carrying a man page is the whole predicate. The credit is per bindir name: any one registration of the name qualifying silences the name (duplicate-executable is judged separately). The hardlink arm consults the (rdev, inode) group of every regular file in the package, not only bindir executables, so a hardlink to a documented name anywhere in the package credits; the same inode number on a different rdev is a different file, and inode 0 (unknown) registers on neither side. The hardlink arm is not transitive through symlinks: the group is consulted for the executable's own paths only. Symlink chains are followed for up to 40 hops with a visited set; a loop or a longer chain earns no credit and the name keeps firing (pinned by alias_symlink_loop_keeps_firing and alias_symlink_chain_length_limit in files.rs; root-level intermediate joins are pinned by alias_symlink_root_level_intermediate_resolves). Intermediate links need no man page and no executability -- only the final target's basename is judged, and every intermediate must be shipped. Measured on the public Tumbleweed snapshot (repodata revision 1792894150): the credit removes exactly 281 findings (244 symlink + 37 hardlink) over the 1,735-package scoped set, 0 added."
since = "0.4.1"

[[divergence]]
