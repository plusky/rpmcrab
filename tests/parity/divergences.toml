[[divergence]]
case = "global"
check = "tmpfile-not-in-filelist"
kind = "behaviour"
reason = "The reference (TmpFilesCheck._check_tmpfile_in_filelist) emits one finding per matching tmpfiles.d line; the port deduplicates by path and emits one finding per missing path. Duplicate lines for the same path produce one finding instead of several."
since = "0.1.0"

[[divergence]]
case = "global"
check = "LibraryDependencyCheck"
kind = "behaviour"
reason = "The per-package maps (requires, so-symlinks, arch) are keyed on `pkg.name` alone, mirroring the reference's dicts (`LibraryDependencyCheck.py:37-39`); linting two arches of the same devel package together, the second overwrites the first - one finding survives, for the last arch seen. Re-assigning an existing dict key does not move its position, so `foo-devel.x86_64` then `foo-devel.aarch64` yields exactly one finding carrying the last arch and the last requires/symlink list; the x86_64 package is never checked at all. Inherited upstream quirk, kept for parity rather than fixed; the fix-vs-parity question is tracked in plusky/rpmcrab#74. No upstream issue covers this."
since = "0.1.0"

[[divergence]]
case = "global"
check = "after_checks"
kind = "behaviour"
reason = "after_checks sees the merged state of ALL packages in the batch (export/import). The pinned reference reset checks after each package, so after_checks only ever saw the last package's state."
upstream = "https://github.com/rpm-software-management/rpmlint/pull/1595"
since = "0.1.0"
