# The divergence ledger. An empty ledger means rpmcrab is byte-identical to
# reference rpmlint 2.10.0 on every parity case. Every non-empty entry is a
# reviewed, deliberate departure — see tests/parity/README.md for the schema.

# The ledger also records deliberate *behavioural* departures that no corpus
# case pins (kind = "behaviour"), so they are reviewed rather than accidental.

# Checks the reference has but the port does not are recorded one entry per
# check (kind = "missing", check = the exact Python module name). The set is
# derived, not hand-maintained: scripts/gen-reference-checks.py regenerates
# the reference list, and the divergences_missing test fails if the entries
# drift from reference-minus-registry.

[[divergence]]
case = "global"
check = "pkg-layer"
kind = "behaviour"
reason = "Pkg::readlink bounds the symlink chain by the file count and returns None on a cycle; the reference (pkg.py:716-724) loops forever on a malformed package. A linter must not hang."
since = "0.1.0"

[[divergence]]
case = "global"
check = "pkg-layer"
kind = "behaviour"
reason = "Pkg::grep returns None when the regex engine errors on the data; the reference lets the exception propagate."
since = "0.1.0"

[[divergence]]
case = "global"
check = "pkg-layer"
kind = "behaviour"
reason = "Pkg::open returns ExtractError::BadDir when the extract directory is not a directory; the reference warns and continues with an unextracted package (pkg.py:608-613)."
since = "0.1.0"

[[divergence]]
case = "global"
check = "pkg-layer"
kind = "behaviour"
reason = "Pkg::readlink starts from the package's own copy of the file (returning None for a foreign PkgFile); the reference starts from the passed PkgFile object."
since = "0.1.0"

[[divergence]]
case = "global"
check = "installed-pkg-layer"
kind = "behaviour"
reason = "An rpmdb librpm cannot open reads as an empty database, so the requested names are reported as not installed; the reference raises on a failed rpmtsOpenDB (rpmts-py.c:675-683) and exits 1. librpm 0.6 exposes neither the db open result nor the dbpath, and Db::verify is not a substitute: it returns Ok on a missing database and rebuilds the indexes, which a read-only lint must not do. Where librpm does surface a failure, rpmcrab prints '(none): E: fatal error reading the rpmdb: ...' and exits 1 where the reference dies with a Python traceback."
since = "0.1.0"

[[divergence]]
case = "global"
check = "session-header"
kind = "behaviour"
reason = "The header's 'configuration:' block names the bundled defaults as <builtin>; the reference names the installed file it read (site-packages/rpmlint/configdefaults.toml). rpmcrab embeds its defaults at build time with include_str!, so there is no installed file to name, and reproducing an installation path would be false provenance."
since = "0.1.0"

[[divergence]]
case = "global"
check = "argument-globbing"
kind = "behaviour"
reason = "A positional argument containing * or ? is taken literally, so it is reported as a missing path and exits 2; the reference expands it as a working-directory-relative glob (cli.py:103-120). Repeated arguments are deduplicated as the reference's set does. Path::glob is nightly-only, and glob semantics (**, character classes, escaping) are a parsing surface that needs its own change with golden tests."
since = "0.1.0"

[[divergence]]
case = "global"
check = "time-report"
kind = "behaviour"
reason = "With -t, a duration map whose entries all sum to zero prints cleanly; the reference divides by the total unguarded and raises ZeroDivisionError (lint.py:158), so `rpmcrab -i rpm -t` succeeds where `rpmlint -i rpm -t` dies."
since = "0.1.0"

[[divergence]]
case = "global"
check = "interrupt-handling"
kind = "behaviour"
reason = "On SIGINT the run ends with the shell's default status 130 but without printing the time report first; the reference catches KeyboardInterrupt, prints it, then re-raises (lint.py:122-127). Printing it needs a signal handler, which is a dependency decision not taken yet."
since = "0.1.0"

[[divergence]]
case = "global"
check = "check-error-handling"
kind = "behaviour"
reason = "A check that panics is contained per package: the package becomes a fatal result, the run continues, and the exit code is 3. The reference propagates the exception with a traceback and exits 1. Swallowing the panic entirely would report incomplete coverage as a clean run, so the fatal line and the exit code keep the bug visible; aborting the whole batch on one package's bug would forfeit the rest."
upstream = "https://github.com/rpm-software-management/rpmlint/pull/1595"
since = "0.1.0"

[[divergence]]
case = "global"
check = "self-obsoletion"
kind = "behaviour"
reason = "The reference emits self-obsoletion for the documented package-merge pattern (Provides: X = EVR with Obsoletes: X <= EVR); rpmcrab exempts it. Upstream's behaviour is the bug (rpmlint#1599, fixes rpmlint#438): a merge-pattern Obsoletes is not a self-obsoletion."
since = "0.1.0"

[[divergence]]
case = "global"
check = "postin-without-ldconfig"
kind = "behaviour"
reason = "The reference only searches the scriptlet body for ldconfig, ignoring the -p interpreter. rpmcrab honors -p ldconfig: %post -p /sbin/ldconfig satisfies the check. See rpmlint#1602 which fixes rpmlint#550."
since = "0.1.0"

[[divergence]]
case = "global"
check = "inaccessible-filename"
kind = "missing"
reason = "Intentional: Python os.access can raise UnicodeError on undecodable paths; Rust paths do not have this failure mode."
since = "0.1.0"

[[divergence]]
case = "global"
check = "lengthy-symlink"
kind = "missing"
reason = "Intentional: reference emission is commented out in FilesCheck.py and unreachable."
since = "0.1.0"

[[divergence]]
case = "global"
check = "header-decoding"
kind = "behaviour"
reason = "A header field that is not valid UTF-8 makes rpmcrab report a fatal read and exit 3, where the reference decodes it leniently and lints the package. librpm 0.6's decoders panic on such data (string_array and FileEntry::path both expect UTF-8), the safe API exposes no lossy or bytes accessor, and reading the raw bytes would need librpm-sys, which unsafe_code=forbid rules out, so the panic is contained and the cause reported. The reference's filename-not-utf8 finding is therefore not produced. Fixture: tests/fixtures/nonutf8-basename/."
since = "0.1.0"

[[divergence]]
case = "global"
check = "spelling-error"
kind = "behaviour"
reason = "Backend is the pure-Rust spellbook crate, not pyenchant; findings may differ from the reference on the same input even with a dictionary present."
since = "0.1.0"

[[divergence]]
case = "global"
check = "buildarch-instead-of-exclusivearch-tag"
kind = "behaviour"
reason = "Fixed behaviour per rpmlint#1600 (fixes rpmlint#698): a trailing line-continuation backslash is stripped before comparing, so 'BuildArch: noarch \\' inside a multi-line macro is not reported as a real architecture. The frozen 2.10.0 reference reports it."
upstream = "https://github.com/rpm-software-management/rpmlint/pull/1600"
since = "0.1.0"

[[divergence]]
case = "global"
check = "macro-in-comment"
kind = "behaviour"
reason = "Fixed behaviour per rpmlint#1601 (fixes rpmlint#183): '#' inside shell-quoted strings does not start a comment (quote-aware comment_start_pos, tracking single/double-quote state and backslash escapes). The frozen 2.10.0 reference treats such '#' as a comment start and warns."
upstream = "https://github.com/rpm-software-management/rpmlint/pull/1601"
since = "0.1.0"

[[divergence]]
case = "global"
check = "specfile-error"
kind = "detail"
reason = "When the spec parser fails in _check_invalid_url, rpmcrab reports 'specfile-error' with only the spec path as detail. The reference also includes librpm's error text, which librpm 0.6's Spec::parse does not surface (it returns Option)."
since = "0.1.0"

[[divergence]]
case = "global"
check = "obsolete-suse-version-check"
kind = "behaviour"
reason = "Fixed behaviour: the suse_version regex also matches the braced %{suse_version} form, which the frozen 2.10.0 reference's `%({\\?)?suse_version}?` misses (it only matches %suse_version and %{?suse_version})."
since = "0.1.0"

[[divergence]]
case = "global"
check = "invalid-suse-version-check"
kind = "behaviour"
reason = "Fixed behaviour: the suse_version regex also matches the braced %{suse_version} form, which the frozen 2.10.0 reference's `%({\\?)?suse_version}?` misses (it only matches %suse_version and %{?suse_version})."
since = "0.1.0"

[[divergence]]
case = "global"
check = "hardlink-across-partition"
kind = "behaviour"
reason = "Adopted ahead of upstream (proposed in unmerged rpmlint#1603, fixes rpmlint#349): hardlink findings are reported per (rdev, inode) group inside each md5 group. The frozen 2.10.0 reference uses global per-md5 bookkeeping and misattributes hardlinks in mixed hardlink/duplicate groups, reporting the wrong file pair."
upstream = "https://github.com/rpm-software-management/rpmlint/pull/1603"
since = "0.1.0"

[[divergence]]
case = "global"
check = "hardlink-across-config-files"
kind = "behaviour"
reason = "Adopted ahead of upstream (proposed in unmerged rpmlint#1603, fixes rpmlint#349): hardlink findings are reported per (rdev, inode) group inside each md5 group. The frozen 2.10.0 reference uses global per-md5 bookkeeping and misattributes hardlinks in mixed hardlink/duplicate groups, reporting the wrong file pair."
upstream = "https://github.com/rpm-software-management/rpmlint/pull/1603"
since = "0.1.0"

[[divergence]]
case = "global"
check = "unable-to-read-zip"
kind = "severity"
reason = "The reference reports E on BadZipFile and W on RuntimeError (a password-protected archive). The pure-Rust zip crate surfaces a single error type, so rpmcrab reports E for every archive that fails to open; only password-protected entries (zip::ZipError::PASSWORD_REQUIRED, the reference's RuntimeError case) stay W and abort the file instead of naming an entry."
since = "0.1.0"

[[divergence]]
case = "global"
check = "unused-direct-shlib-dependency"
kind = "missing"
reason = "The reference uses ldd -u for linker-based unused dependency analysis. goblin cannot replicate this; the finding is not emitted."
since = "0.1.0"

[[divergence]]
case = "global"
check = "missing-mandatory-optflags"
kind = "behaviour"
reason = "DWARF producer extraction via gimli is not yet implemented; the mandatory/forbidden optflags check degrades gracefully (no findings) until DWARF parsing lands."
since = "0.1.0"

[[divergence]]
case = "global"
check = "device-files-whitelist-validation"
kind = "behaviour"
reason = "Malformed whitelist entries (missing \"package\"/\"packages\", wrong types, missing required keys, unknown attribute keys) are logged and skipped; the reference raises KeyError in verify_whitelists or AttributeError in getattr at check time and crashes the whole run. Applies to DeviceFilesCheck and WorldWritableCheck."
upstream = "https://github.com/rpm-software-management/rpmlint/issues/439"
since = "0.1.0"

[[divergence]]
case = "global"
check = "missing-call-to-setgroups-before-setuid"
kind = "behaviour"
reason = "Upstream rpmlint#1462: the reference reports this at Warning for setuid binaries and Error otherwise, which is backwards. rpmcrab reports Error when the binary is installed setuid and Warning otherwise."
since = "0.1.0"

[[divergence]]
case = "global"
check = "executable-stack"
kind = "behaviour"
reason = "Fixed behaviour: the executable-stack arch list also matches aarch64. The reference's `arm.*` does not match the string 'aarch64', so the reference skips the check on ARM64; rpmcrab includes it."
since = "0.1.0"

[[divergence]]
case = "global"
check = "binaries-dependency-scope"
kind = "behaviour"
reason = "The reference runs its ldd-based dependency analysis only for installed packages; rpmcrab runs the DT_NEEDED-based analysis for extracted files too. This is also what makes unused-direct-shlib-dependency impossible to replicate (no ldd -u on extracted files)."
since = "0.1.0"

[[divergence]]
case = "global"
check = "python-bytecode-inconsistent-mtime"
kind = "behaviour"
reason = "python-bytecode-inconsistent-mtime only fires when the .pyc embedded timestamp is older than the .py mtime (stale bytecode). The reference (FilesCheck.py:1274) fires on any mismatch, but rpmlint#1331 (open, unmerged) proposes this fix: a newer .pyc is a local-build artifact, not an error. The port implements the proposed behaviour ahead of upstream."
since = "0.1.0"

[[divergence]]
case = "global"
check = "PostCheck"
kind = "behaviour"
reason = "When the scriptlet interpreter is absent the reference (PostCheck.check_syntax_script) lets subprocess.run raise FileNotFoundError and the whole run dies; the port's syntax_ok returns None and the sh -n / perl -wc probe is skipped. A missing optional interpreter must not abort the lint. No upstream issue covers this: the reference merely carries a TODO ('test that prog is available/executable', PostCheck.py:60), so the crash is unhandled rather than specified behavior."
since = "0.1.0"

[[divergence]]
case = "global"
check = "bashisms"
kind = "behaviour"
reason = "When checkbashisms is absent the reference (BashismsCheck._detect_early_fail_option) runs `checkbashisms --help` via subprocess.check_output at init, which raises and kills the whole run; the port's detect_tools() degrades to a no-op (no findings) instead. A missing optional tool must not abort the lint."
since = "0.1.0"

[[divergence]]
case = "global"
check = "AtomicUpdateCheck"
kind = "behaviour"
reason = "A present-but-wrong-type AtomicCheckGhosts (e.g. the string \"false\") panics at construction; the reference treats any truthy value as enabled and runs. The port deliberately fails fast on a misconfigured type instead of reproducing the reference's permissiveness."
since = "0.1.0"

[[divergence]]
case = "global"
check = "systemd-tmpfile-parse-error"
kind = "detail"
reason = "The reference (TmpfilesParser.warn) formats parse warnings as 'source:line: msg'; the port formats 'source: msg' and passes the line as a separate finding detail. Only the warning string differs ('source: msg' vs 'source:line: msg'); the detail placement is argument-for-argument identical."
since = "0.1.0"

[[divergence]]
case = "global"
check = "logrotate-log-dir-not-packaged"
kind = "behaviour"
reason = "Deliberate improvement over the reference (open rpmlint#551): /var/log itself is never reported by logrotate-log-dir-not-packaged. It is owned by the filesystem package, not by the package shipping the logrotate config, so flagging it is a false positive."
upstream = "https://github.com/rpm-software-management/rpmlint/issues/551"
since = "0.1.0"

[[divergence]]
case = "global"
check = "systemd-tmpfile-entry-unauthorized"
kind = "behaviour"
reason = "On a non-octal mode field the reference (TmpfilesParser.get_octal_mode) raises via int(mode, 8); the port's octal_mode() returns None, which is_sensitive_entry treats as sensitive and emits the finding. The port lints where the reference crashes."
since = "0.1.0"

[[divergence]]
case = "global"
check = "AtomicUpdateCheck"
kind = "behaviour"
reason = "A present-but-wrong-type AtomicAllowedDirs (e.g. the string \"/etc/\") panics at construction; the reference iterates tuple('/etc/') as character prefixes and runs. The port deliberately fails fast on a misconfigured type instead of reproducing the reference's permissiveness."
since = "0.1.0"

[[divergence]]
case = "global"
check = "systemd-tmpfile-device"
kind = "behaviour"
reason = "Deliberate fix of a reference bug (SystemdTmpfilesCheck.py:186): `tf_entry.get_target_path.startswith('/dev')` is missing its call parentheses, so the bound method is always truthy and the 'device not in /dev' sensitivity branch never fires. The port calls the equivalent and treats a device entry outside /dev as sensitive."
since = "0.1.0"

[[divergence]]
case = "global"
check = "tmpfile-not-in-filelist"
kind = "behaviour"
reason = "The reference emits one tmpfile-not-in-filelist finding per config line, in file order, including duplicates; the port sorts and dedups the missing paths so the output is deterministic."
since = "0.1.0"

[[divergence]]
case = "global"
check = "menu-icon-path-order"
kind = "behaviour"
reason = "The reference walks IconPath/MenuLaunchers in config-file order (Python dict order); the port sorts both tables explicitly so emission order is deterministic regardless of config serialization."
since = "0.1.0"

[[divergence]]
case = "global"
check = "beam-was-not-recompiled"
kind = "behaviour"
reason = "The reference expands the %_builddir macro at check time; rpmcrab has no macro expansion, so the expected build dir comes from the ErlangBuildDir config key (default /home/abuild/rpmbuild/BUILD, the OBS value). A local ~/rpmbuild/BUILD build reports beam-was-not-recompiled unless the key is set."
since = "0.1.0"

[[divergence]]
case = "global"
check = "polkit-xml-exception"
kind = "detail"
reason = "The reference formats the caught expat error via str(expat.ExpatError); the port formats quick-xml's Display for the parse error. The finding name and severity match; the detail text differs."
since = "0.1.0"

[[divergence]]
case = "global"
check = "AtomicUpdateCheck"
kind = "behaviour"
reason = "A non-string element in AtomicAllowedDirs/AtomicDisallowedSubdirs (e.g. AtomicDisallowedSubdirs = [42]) panics at construction; the reference raises TypeError later, at check time. The port deliberately fails fast on a misconfigured type instead of reproducing the reference's deferred failure."
since = "0.1.0"

[[divergence]]
case = "global"
check = "pkg-layer"
kind = "behaviour"
reason = "librpm panics decoding a non-UTF-8 string header tag (str::from_utf8 in td.rs); the reference (helpers.byte_to_string) decodes with errors='replace' and keeps linting. A malformed header aborts the port where the reference degrades."
since = "0.1.0"

[[divergence]]
case = "global"
check = "world-writable-mismatched-attrs"
kind = "behaviour"
reason = "The reference test test_world_writable.py::test_device_files_simple asserts has: drwxr-xr-t for a file created with mode 0o41777, but stat.filemode(0o41777) is drwxrwxrwt, so the reference code itself reports has: drwxrwxrwt and its own test cannot pass. The port follows the code."
upstream = "https://github.com/rpm-software-management/rpmlint/issues/600"
since = "0.1.0"

[[divergence]]
case = "global"
check = "time-report"
kind = "behaviour"
reason = "With -t, BinariesCheck's \u201cChecked files\u201d column shows the run-lifetime total instead of blank: the check no longer resets per package (the per-worker check set is reset between packages, but the count accumulates for the merged report). The reference sets checked_files to None on every reset (AbstractCheck.py:65) and resets after each package (lint.py:271), so its column is blank."
upstream = "https://github.com/rpm-software-management/rpmlint/pull/1595"
since = "0.1.0"

[[divergence]]
case = "global"
check = "cli"
kind = "behaviour"
reason = "A package that fails to open is a fatal result: one '(none): E: fatal error while reading ...' line on stderr, the run continues with the remaining packages, and the exit code is 3. The pinned reference exits 3 immediately on the first unreadable file; the -v re-raise (exit 1 with a cause chain) is gone."
upstream = "https://github.com/rpm-software-management/rpmlint/pull/1595"
since = "0.1.0"

[[divergence]]
case = "global"
check = "SourceCheck"
kind = "detail"
reason = "parse_octal mirrors the reference's int(value, 8) (sign, 0o prefix, PEP 515 underscores, Unicode decimal digits), but magnitudes beyond u128 saturate at u128::MAX where the reference keeps arbitrary precision. The value only feeds equality against file mode bits, which neither a saturated nor an arbitrary-precision huge value can equal, so the saturation is unobservable."
since = "0.1.0"

