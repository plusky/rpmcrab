reason = "PolkitCheck.py:70 does `action.getElementsByTagName('defaults')[0]`, a descendant search, so an outer `<action>` with no `<defaults>` of its own inherits the first `<defaults>` of a nested descendant action: on `<action id='aaa.outer.nodefaults'><action id='bbb.inner.withdefaults'><defaults><allow_any>yes</allow_any>...` the reference emits `E: polkit-user-privilege ... aaa.outer.nodefaults (yes:no:no)` while the port scopes each action to its own `<defaults>` and emits `E: polkit-untracked-privilege ... aaa.outer.nodefaults (no:no:no)` -- name and detail diverge on the outer action, on package-controlled XML; the order divergence is entailed by the name divergence, not a second bug: `__diag_sortkey` is `(name, level)` in both (`filter.py:236` vs `filter.rs:237`), so with equal names the reference keeps document order and only the differing finding names reorder the port's lines. Nested actions are rejected by real polkit, so this is pathological input and the inheritance is a minidom artifact; the port's per-action scoping is the deliberate, saner behavior. The IndexError entry above covers the no-`<defaults>`-anywhere case, this entry covers the nested-descendant case, so nothing is double-counted."
since = "0.1.0"

[[divergence]]
case = "global"
check = "polkit-untracked-privilege"
kind = "behaviour"
reason = "The untracked verdict requires privs data (issue #795): the port emits polkit-untracked-privilege only when at least one configured file was successfully read from the configured PolkitPrivsFiles. A read-but-empty file establishes an empty tracking set — a file that reads as empty or holds only comments and unusable lines still counts as read, so an action the data does not list draws the verdict. With no configured file successfully read — no configured file exists or is readable on the lint host — whether an action is tracked is a fact about the host's installed data rather than the package, so the port stays silent where the reference reports every action as untracked. The reference documents that it expects the polkit-default-privs package to be installed to work, and Factory's lint environment carries that data; OBS build roots and other hosts do not — the apparmor-utils actions (net.apparmor.pkexec.aa-notify.*) are tracked in the Factory profile yet fired in an OBS build root and on a bare macOS host. The polkit-user-privilege verdict is unaffected: it is decidable from the action's own defaults alone and fires with or without loaded data."
since = "0.3.0"
upstream = "https://github.com/plusky/rpmcrab/issues/795"

