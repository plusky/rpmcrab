kind = "severity"
reason = "Deliberate severity recalibration: the port reports W where the reference reports E when the charged user is declared by a sysusers.d snippet the same package ships. A snippet here is a `.conf` file sitting directly under a directory named `sysusers.d`. Only a `u` line credits the user: it declares the user and the like-named primary group it creates, while a `g` line declares a group only, and `m` membership lines and `r` id-range lines declare no account name, as does a `-` or purely numeric name field, which declares by id. The snippet is the service's runtime identity -- the package creates the very account its daemon drops to -- so the %ghost's recorded ownership is the deliberate design, not a stray %attr. Only the package's own snippets credit: a user declared under a different name in the package's own snippet, declared only by a sibling package's snippet, or carried only by a `user()` Requires or a Provides keeps E -- unlike the non-standard-uid sibling route, neither a Requires nor a Provides credits here. The split is orthogonal to %ghost: a charged file that is not a %ghost still draws `non-ghost-file` at E separately. Live instances: fapolicyd, whose daemon writes /var/log/fapolicyd-access.log as fapolicyd (declared by its own /usr/lib/sysusers.d/fapolicyd.conf), and openQA, whose web UI runs as geekotest (declared by its own /usr/lib/sysusers.d/geekotest.conf, whose `m` membership line declares no account and credits nothing). The premise is softened, not repealed -- the description keeps prescribing a service-owned subdir of /var/log. Measured over the complete gate universe (the 24 packages shipping a regular file directly under /var/log): 2 E become 2 W, no finding removed (the group tag moves only 1 of them: openQA's charged group is root, which draws no group finding); the reference fires both at E (rpmlint 2.10.0, verified on the identical set)."
