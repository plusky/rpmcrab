s them. (3) A rootfs component anywhere (not data-tree-guarded): filesystem-image payload (warewulf node overlays, 15), whose mode is set when the image is assembled. (4) The template suffix list gains .ex, the Debian example suffix (dh-make's maintainer-script templates, 6); an Elixir interpreter line takes a .ex file out of the arm, .ex being Elixir's own script extension. The reference fires on all of these shapes. Measured on the Factory corpus (the audit's 250 firing packages re-run before and after with isolated HOME/XDG, the before side reproducing the audit's 1,399 findings exactly): non-executable-script falls 1,399 to 973, no finding added, no other check changes on the firing set, and a 300-package non-firing control sample is finding-identical (1,243 findings across all checks in the sample). Against the testsuite gate (460 silenced) and the sourced-fragment gate (6) this change is disjoint but for one lynis file; the residue after all three is 508 findings (1,399 - 460 - 6 - 426 + 1 for the shared lynis file) — module trees without a package marker, framework-sourced scripts (dracut modules, rear, inn filters), application plugin scripts and vendored development tools, none separable from real entry points by a decidable per-package predicate. Pinned by non_executable_script_silent_in_python_package_dirs and non_executable_script_silent_for_fragment_doc_and_image_trees in files.rs."
