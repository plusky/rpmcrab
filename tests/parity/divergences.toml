reason = "Fix-and-diverge (issue #932): a libalternatives `binary=` entry is credited when its path resolves through the package's own symlinks to a shipped regular file. The reference credits an entry only by its bin/ suffix rule -- the literal-path credit is rpmcrab's own divergence, ledgered under issue #811 -- so an entry whose path resolves through a symlink shipped by the same package -- the JDK layout, /usr/lib64/jvm/java-11-openjdk -> java-11-openjdk-11 -- draws both `binary-entry-value-not-found` and `wrong-or-missed-binary-entry` on every conf even though the package ships the target. rpmcrab resolves the entry path through the package's own file set, following symlinks at every component, directory and file alike, component-wise with the kernel's hop bound, and credits it when the walk lands on a shipped regular file; a walk that exhausts the hop bound is a cycle (the kernel's ELOOP) and earns no credit; the walk canonicalises the value the way the kernel resolves it, so a doubled leading slash (binary=//usr/bin/..., emitted by the SUSE python packaging macros) names the shipped file too. Resolutions leaving the package's file set (sibling-package or genuinely absent targets) and symlink cycles keep firing. Pinned by binary_entry_through_shipped_dir_symlink_is_credited, binary_entry_through_absolute_dir_symlink_is_credited, binary_entry_through_symlink_chain_is_credited, binary_entry_through_dir_symlink_to_unshipped_file_still_fires, binary_entry_through_symlink_loop_still_fires, binary_entry_resolving_to_directory_still_fires, binary_entry_through_cycle_landing_on_shipped_name_still_fires and binary_entry_with_doubled_leading_slash_is_credited in alternatives.rs."
