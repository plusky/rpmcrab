kind = "behaviour"
reason = "When the scriptlet interpreter is absent the reference (PostCheck.check_syntax_script) lets subprocess.run raise FileNotFoundError and the whole run dies; the port's syntax_ok returns None and the sh -n / perl -wc probe is skipped. A missing optional interpreter must not abort the lint. No upstream issue covers this: the reference merely carries a TODO ('test that prog is available/executable', PostCheck.py:60), so the crash is unhandled rather than specified behavior."
since = "0.1.0"

[[divergence]]
case = "global"
check = "bashisms"
kind = "behaviour"
reason = "When checkbashisms is absent the reference (BashismsCheck._detect_early_fail_option) runs `checkbashisms --help` via subprocess.check_output at init, which raises and kills the whole run; the port's detect_tools() degrades to a no-op (no findings) instead. A missing optional tool must not abort the lint."
since = "0.1.0"

[[divergence]]
case = "global"
check = "polkit-untracked-privilege"
kind = "behaviour"
reason = "Deliberate fix of a reference bug, and a bigger one than the check: PolkitCheck.py:70 does `action.getElementsByTagName('defaults')[0]`, which raises IndexError -- not the KeyError caught at :77 -- when <defaults> is absent, and the call at :57 sits outside the try at :52. The exception escapes check() and is caught only by lint.py:293, which prints `fatal error while reading <pkg>` and calls sys.exit(3): the reference emits NO finding, and abandons every remaining package with exit 3. The port treats the missing settings as `no` per the polkit default and reports polkit-untracked-privilege. Note the reference author evidently meant the opposite finding -- had the except caught IndexError, PolkitCheck.py:78 sets found_unauthorized = True and emits polkit-user-privilege. Exit-code divergence is captured by the parity harness (scripts/capture-parity.sh records expected/exit)."
since = "0.1.0"

[[divergence]]
case = "global"
check = "PolkitCheck"
kind = "behaviour"
reason = "A privs profile line with a single token makes the reference (PolkitCheck.py:36-38, `value = line[1]`) raise IndexError, which escapes check() and is caught only by lint.py:293: the whole run dies with exit 3 and no finding is emitted for any package. The port skips one-token lines instead -- refusing to abandon every package over one malformed line in a system config file is the deliberate, saner behavior."
since = "0.1.0"

[[divergence]]
case = "global"
check = "PolkitCheck"
kind = "behaviour"
reason = "The reference strips comments with `line.split('#')[0].rstrip()` (PolkitCheck.py:34) while the port trims both ends. On an indented line such as `  org.foo bar`, the reference's `re.split(r'\\s+', ...)` yields `['', 'org.foo', 'bar']`, so it whitelists the empty action id with the real id as its value -- a wart, since no real profile indents entries and no action has an empty id. The port registers the entry as `org.foo -> bar`. Deliberate fix of an obvious reference wart rather than a replicated bug."
since = "0.1.0"

