reason = "Symlink chains inside the devel package are resolved to the real file before the dependency check (any intermediate link, not just `.so` ones; targets are joined but not path-normalised, so a `..` in a link target silently stops resolution); the reference records the one-hop target, which misfires no-library-dependency-for on intermediate links the devel ships itself (Imath: libImath.so -> libImath-3_2.so -> libImath-3_2.so.30). Separately, the reference driver resets cross-package state after every package, so the check is effectively silent in multi-RPM runs; rpmcrab keeps the intended accumulate-then-verify semantics."
since = "0.1.0"

