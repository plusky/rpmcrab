kind = "behaviour"
reason = "Thin ar archives (`!<thin>\n` magic) fall through to the ELF parser instead of being enumerated member-wise; host readelf exits 0 on them, so no finding is emitted either way. Only the parse path differs, not the outcome."
since = "0.1.0"

[[divergence]]
case = "global"
check = "devel-dependency"
kind = "behaviour"
reason = "Biarch/flavored devel packages (`-devel-32bit`, `-devel-doc`, `-debug-libs`, ...) are recognized as devel packages: the devel keyword may be a hyphen-delimited component, not just a name suffix. The reference only matches the suffix form and misfires devel-dependency on 242 such packages in Tumbleweed (measured 2026-10-08 against the TW oss primary.xml). This is the requirer-side class; the dependency-side class from plusky/rpmcrab#283 (DevelNumberExceptions list / word-boundary regex for required names, e.g. `python310-sortinghat` requiring `python310-django-cors-headers`) remains open."
since = "0.1.0"

[[divergence]]
case = "global"
check = "explicit-lib-dependency"
kind = "behaviour"
reason = "Same requirer-side class as the devel-dependency entry: biarch/flavored devel packages (`-devel-32bit`, `-devel-doc`, `-debug-libs`, ...) are recognized as devel packages, so their lib requirements do not trip explicit-lib-dependency. The reference only matches the devel-name suffix form and treats these requirers as runtime packages."
since = "0.1.0"

[[divergence]]
case = "global"
check = "BinariesCheck"
kind = "behaviour"
reason = "rpmcrab#17: checksec-style binary-level hardening verification via ELF inspection, which the frozen reference lacks. Four new Warning findings: `missing-fortify` (no `__*_chk` symbols), `missing-stack-protector` (no `__stack_chk_fail`), `missing-relro` (no GNU_RELRO segment) and `partial-relro` (GNU_RELRO without BIND_NOW). They verify the effective artifact state instead of the compile flags, so silent downgrades (e.g. `-fstack-protector` appended after `%{optflags}` downgrading strong to basic SSP) are caught. The SSP check is presence-only: basic and strong SSP both emit `__stack_chk_fail`, and telling them apart needs per-function canary-coverage analysis. PIE needs no new finding: `non-position-independent-executable` / `position-independent-executable-suggested` already cover it for executables. Deliberate emission-direction divergence on captured cases (the reference emits none of these): `liblto21` gains exactly one port-only line `W: missing-fortify /usr/lib64/libLTO.so.21.1` (warnings 0->1) and `llvm21-gold` gains exactly one port-only line `W: missing-fortify /usr/lib64/LLVMgold.so` (warnings 1->2); both lines are pinned by `hardening_captured_cases_pin_new_lines`. Gate scope: the check skips ar archives and Go binaries (the Go toolchain emits none of these C-hardening artifacts, so every finding would be noise), and only runs on ET_EXEC/ET_DYN ELFs. Provenance: `crates/rpmcrab-core/data/descriptions/BinariesCheck.toml`."
since = "0.1.0"
upstream = "https://github.com/plusky/rpmcrab/issues/17"

[[divergence]]
case = "global"
check = "hidden-file-or-dir"
kind = "behaviour"
reason = "Upstream emits hidden-file-or-dir twice for a hidden directory: once from the per-file _check_file_hidden_file_or_dir and again from _check_file_dir (which carries only the /.build-id exception). rpmcrab emits it once per path; the duplicate line is upstream redundancy with no consumer value. Measured 2026-10-09 on the openSUSE:Factory bazel-skylib rpmlint.log: /usr/src/bazel-skylib/.bcr, .bazelci and .github each carry two identical W lines, while hidden files (.bazelignore, .bazelversion, .gitignore) carry one."
since = "0.1.0"
