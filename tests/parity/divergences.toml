EL -- and they define grub_main, which no module defines, so they keep firing; so do the ET_EXEC core images, the section-less intermediate objects (efiemu32.o, efiemu64.o) and an ordinary host .o, and an archive is classified by the archive rules alone. Measured on the Factory corpus (51,589 RPMs; the 2026-10-27 audit universe of 26 firing packages restated exactly on current main): the tag goes 5,172 -> 2,490 with this change, the removed set is exactly the 2,682 module files, zero added, and no other BinariesCheck output moves on the universe. The residue is 28 files: the 21 grub2 files -- 10 kernel images (kernel.img and kernel.exec for each of i386-efi, i386-pc, i386-xen, x86_64-efi and x86_64-xen), 9 boot and core images (boot.image, boot_hybrid.image, cdboot.image, diskboot.image, lnxboot.image, lzma_decompress.image, pxeboot.image and the two grub.xen) and the 2 section-less efiemu intermediate objects (efiemu32.o, efiemu64.o, in grub2-i386-pc, which alone carries 11 of the 21) -- plus the 7 residue singles of the #848 entry (qemu-ovmf-x86_64's Xen image among them); the avr-libc and raspberrypi-firmware payloads are credited by the foreign-target arms, not residue. The finding's detail is the file path alone (e.g. 'grub2-i386-pc.noarch: E: arch-independent-package-contains-binary-or-object /usr/share/grub2/i386-pc/kernel.img'). The reference fires on all 5,172 on every architecture: it has no foreign-target or GRUB concept and charges binary-class payload in a noarch package whatever the payload's machine. Pinned by noarch_grub_module_is_quiet, noarch_grub_debug_module_is_quiet, noarch_grub_kernel_image_still_fires, noarch_grub_sectioned_exec_still_fires, noarch_grub_sectioned_exec_without_entry_still_fires, noarch_grub_module_in_archive_still_fires, noarch_foreign_grub_shaped_payload_boundaries, noarch_grub_stripped_image_still_fires, noarch_grub_aggregator_without_symtab_is_quiet, noarch_grub_license_section_must_be_progbits_with_content, noarch_grub_dynsym_or_versioned_main_still_fires, noarch_grub_undefined_main_import_is_quiet and noarch_grub_module_library_without_init_fini_is_quiet."
