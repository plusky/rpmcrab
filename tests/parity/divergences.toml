nds) keeps its level. Measured pristine vs patched, SUIDPermissionsCheck only, over the full Factory corpus (51,589 RPMs) with the corpus's own permissions package build 1699_20260917 installed at the host paths: 22 findings before and after, the only movement permissions-incorrect from 5 E to 2 E + 3 W — the demoted three are in the binary packages physlock and policycoreutils-newrole (matching easy) and selinux-sandbox (matching paranoid); the binary packages 389-ds and cockpit-ws match no profile and stay E — and no other finding of the check family moves. Pinned by the secure_exact_match_stays_silent, easy_exact_match_demotes_both_tags_to_warning, paranoid_exact_match_demotes_both_tags_to_warning, mode_only_demotion_when_owner_matches_secure, owner_only_demotion_when_mode_matches_secure, easy_wins_when_both_other_profiles_match, no_profile_match_stays_error, near_miss_mode_match_only_stays_error, near_miss_owner_match_only_stays_error, other_profile_match_honours_package_scoping and malformed_non_secure_profiles_are_skipped tests in suid_permissions.rs (mutation-verified: match disabled fails the demotion tests; match relaxed to mode-only or owner-only fails the corresponding near-miss test)."
