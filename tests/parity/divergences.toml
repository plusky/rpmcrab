reason = "Fix-and-diverge: the %postun phase runs only when the %post phase collected at least one --install. The reference calls its postun check unconditionally for every package passing the presence gate and reports the bare package-level finding whenever %postun carries no update-alternatives line, even when %post installed nothing — there is then no --remove the package could owe. The vacuous arm covers packages whose %post only cleans up legacy registrations (the JDK and Node.js families' existence-guarded cleanup lines, kept after their move to libalternatives) and packages present only through shipped /etc/alternatives files. Measured over a 1,961-package Tumbleweed candidate universe (every /etc/alternatives or libalternatives shipper plus the name families): this gate alone takes the tag from 57 findings to 9 (the token-end --remove credit in the companion entry takes it from 9 to 5, the five remaining being genuine un-removed installs: fakeroot, makewhat, python3-openqa_review, python313-mutagen, python314-mutagen), and every other AlternativesCheck tag is unchanged on the same scan (update-alternatives-requirement-missing 81, update-alternatives-post-call-missing 50). Pinned by postun_phase_silent_when_post_installed_nothing and postun_phase_reports_when_install_is_never_removed in alternatives.rs."
since = "0.4.1"

