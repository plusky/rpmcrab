reason = "New port-only Warning, no reference counterpart: FilesCheck flags a package that uses fillup in any form, once per binary package -- it ships a fillup template (a regular, non-%ghost file below a fillup-templates directory), or a scriptlet invokes fillup at command position (the expanded shape the %fillup_only / %fillup_and_insserv macros produce, or the literal macro). The mechanism's own packages are exempt (a binary named sysconfig or fillup, or one whose source package is sysconfig or fillup), the same boundary as sysconfig-fillup-usage. Yield rule against the defect tag: when the package's only fillup involvement is template(s) that fillup-template-without-fillup-call already reports, this tag stays silent for the package; any further use (a template the defect check does not report, or any fillup call) fires it once. A unit consuming the generated file through EnvironmentFile earns no exemption: the two-layer EnvironmentFile pattern is the prescribed migration there too. The staged description prescribes the migration (vendor defaults under /usr/etc or the application's native default location under /usr, /etc reserved for administrator overrides and drop-in snippets, tmpfiles.d and sysusers.d instead of install-time generation, the application's native configuration with built-in defaults) as guidance; it does not claim a formal distribution deprecation, and none exists. Overlap: on built packages every firing also draws sysconfig-fillup-usage, whose categories cover templates and calls as part of the wider sysconfig scheme; this tag is the fillup-specific signal with the migration prescription. Measured on the 2026-10-27 Tumbleweed snapshot metadata (x86_64 and noarch, 52,984 packages; candidate-bounded rather than a full pass: all 212 template-shipping packages plus every package whose Requires names fillup or /bin/fillup -- 252 candidates, each downloaded and scanned; two packages measured at their current build after their snapshot hrefs rolled): the tag fires on 214 packages -- 203 shipping a template (199 of them also calling fillup, plus the four ungated no-call shippers fluidsynth, lighttpd, man and system-user-msr) and 11 calling fillup without shipping a template; 211 candidates invoke fillup from a scriptlet; the yield rule suppresses the tag on all 8 packages the defect tag reports (cri-o, lsyncd, openscap-utils, shorewall, shorewall-lite, shorewall6, shorewall6-lite, xsp), and the mechanism exemption silences sysconfig itself. The call-only count is a lower bound: a caller that neither ships a template nor Requires fillup sits outside the candidate set."
since = "0.4.1"
upstream = "https://github.com/plusky/rpmcrab/issues/1147"

