# typos allowlist policy for rpmcrab.
#
# Allowlist ONLY: every entry is a deliberate, load-bearing spelling or a
# generated/captured artifact — never a masked real typo. The parity corpus
# captures verbatim rpmlint output and must stay byte-exact, including any
# upstream misspellings that are part of the frozen wire contract.

[files]
extend-exclude = [
  # Generated assets (regenerated by `make gen`).
  "crates/rpmcrab/man/**",
  "crates/rpmcrab/completions/**",
  # Generated severity inventory snapshot (regenerated with
  # UPDATE_SEVERITY_INVENTORY=1; see severity_inventory.rs): its
  # [unresolved-sites] snippets are machine-truncated call windows,
  # not prose.
  "crates/rpmcrab-core/tests/data/severity-inventory.txt",
  # Bundled upstream data (rpmlint's configdefaults.toml), verbatim — never
  # "fixed" for wording.
  "crates/rpmcrab-core/data/**",
  # Generated ISO 639/3166 code tables (from rpmlint's __isocodes__.py):
  # three-letter codes read as typos, but every entry is normative data.
  "crates/rpmcrab-core/src/checks/i18n_codes.rs",
  # Captured rpmlint output is normative data; it is never "fixed" for wording.
  # Only the captured case bytes are excluded — the authored schema doc and
  # manifests under tests/parity/ stay in scope.
  "tests/parity/cases/**",
  # The signature fixtures' public keys are generated key material:
  # the ASCII armour is base64 data, not prose.
  "tests/parity/pkg/inputs/signature-testkey*.asc",
]

[default.extend-words]
# Load-bearing upstream spellings captured verbatim in the frozen output
# contract. Add a one-line reason per entry; retire an entry only when its last
# real occurrence is gone.
# self-obsoletion is the rpmlint check name (rpmlint#438), not a misspelling.
obsoletion = "obsoletion" 
# non-owner-writeable-only-crontab-file is the upstream check name.
writeable = "writeable"
# gir is a GObject introspection file extension, not a typo for git.
gir = "gir"
# Tham is the Tai Tham script name (Unicode block Tai_Tham), not a typo for Than.
tham = "tham"
# Vai is the Vai script name (Unicode block Vai), not a typo for Via/Vie.
vai = "vai"
# sourcen is the RPM %{SOURCEN} macro (Source#: references), not a typo for source.
sourcen = "sourcen"
# packag is a deliberate misspelling in the tags-emission-pins spelling-error
# fixture and its expected finding detail. Scoped to those files so the
# allow-list does not silence a real "packag" typo repo-wide.
[type.packag-fixture]
extend-glob = ["**/tags-emission-pins.spec", "**/tags.rs", "**/binary_cli.rs"]
extend-words = { packag = "packag" }

# recieve is a deliberate misspelling in the spelling negative
# fixture in filter.rs: it proves no filter in the vendored openSUSE
# config suppresses a genuine spelling typo. patern is a deliberate
# misspelling in the unknown-class tests in the same file: a plausible
# user typo of the real defect-pattern class is exactly what the
# unknown-class error exists to catch. Scoped to that file so the
# allow-list does not silence real "recieve"/"patern" typos repo-wide.
[type.recieve-fixture]
extend-glob = ["**/filter.rs"]
extend-words = { recieve = "recieve", patern = "patern" }

# SPDX ID table tokens: "iMatix" tokenizes as i + Matix, ND is "No
# Derivatives" in CC IDs, CAPEC-TOU is a genuine ID. Scoped to the table
# so the allow-list does not silence these tokens repo-wide.
[type.spdx]
extend-glob = ["**/spdx.rs"]
extend-words = { matix = "matix", nd = "nd", tou = "tou" }

# informations and libary are deliberate misspellings in the spelling
# tests in spellcheck.rs: they prove the supplementary wordlist does
# not accept genuine misspellings. Scoped to that file so the
# allow-list does not silence real typos repo-wide.
[type.spelling-fixture]
extend-glob = ["**/spellcheck.rs"]
extend-words = { informations = "informations", libary = "libary" }

# patern is a deliberate misspelling in the unknown-class tests in
# defect_pattern.rs: a plausible user typo of the real defect-pattern
# class is exactly what the unknown-class error exists to catch. (The
# filter.rs occurrence rides in the filter.rs-scoped section above: a
# file takes the first matching type.) Scoped to this file so the
# allow-list does not silence a real "patern" typo repo-wide.
[type.patern-fixture]
extend-glob = ["**/defect_pattern.rs"]
extend-words = { patern = "patern" }

