# typos allowlist policy for rpmcrab.
#
# Allowlist ONLY: every entry is a deliberate, load-bearing spelling or a
# generated/captured artifact — never a masked real typo. The parity corpus
# captures verbatim rpmlint output and must stay byte-exact, including any
# upstream misspellings that are part of the frozen wire contract.

[files]
extend-exclude = [
  # Generated assets (regenerated by `make gen`).
  "crates/rpmcrab/man/**",
  "crates/rpmcrab/completions/**",
  # Captured rpmlint output is normative data; it is never "fixed" for wording.
  # Only the captured case bytes are excluded — the authored schema doc and
  # manifests under tests/parity/ stay in scope.
  "tests/parity/cases/**",
]

[default.extend-words]
# Load-bearing upstream spellings captured verbatim in the frozen output
# contract. Add a one-line reason per entry; retire an entry only when its last
# real occurrence is gone.
