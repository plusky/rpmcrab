version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    # dtolnay/rust-toolchain is pinned to a commit on its master branch (see
    # ci.yml); commits on the toolchain branches are garbage-collected upstream,
    # so dependabot must not "helpfully" move it.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
