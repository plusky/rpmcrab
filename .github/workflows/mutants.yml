---
name: mutants
on:
  schedule:
    # Weekly in its own slot: bugwarden's mutants run holds Sat 04:19, so
    # Sunday here. Off the hour since the top of one is GitHub's most
    # contended and most-dropped minute. A run is hours and would otherwise
    # spend the account's concurrency while a PR waits on CI.
    - cron: '19 4 * * 0'
  workflow_dispatch:
    inputs:
      only_shard:
        description: 'Run a single shard only (0-63); empty runs all 64. For re-running capped shards without spending another full-matrix run.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  # No PR event to supersede, and a run is hours: let a hand-fired run finish
  # rather than have the next cron cancel it.
  cancel-in-progress: false

jobs:
  validate-shard:
    # A typo'd only_shard must fail the run, not silently skip all 64 legs
    # into a green no-op with zero coverage and no failed-run alert.
    # Unset (schedule events) and empty both mean the full matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate only_shard range
        env:
          ONLY_SHARD: ${{ inputs.only_shard }}
        run: |
          set -euo pipefail
          if [ -z "${ONLY_SHARD:-}" ]; then exit 0; fi
          if ! [[ "$ONLY_SHARD" =~ ^(0|[1-9][0-9]?)$ ]] || [ "$ONLY_SHARD" -gt 63 ]; then
            echo "::error::only_shard must be empty or 0-63, got '$ONLY_SHARD'"
            exit 1
          fi
  setup:
    needs: validate-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - name: Compute shard list
        id: shards
        env:
          ONLY_SHARD: ${{ inputs.only_shard }}
        run: |
          set -euo pipefail
          # Single value or the whole 0-63 range, as a JSON array for the
          # dynamic matrix below. Unset (schedule) means the full matrix.
          if [ -n "${ONLY_SHARD:-}" ]; then
            echo "shards=[$ONLY_SHARD]" >> "$GITHUB_OUTPUT"
          else
              echo "shards=$(seq 0 63 | jq -R 'tonumber' | jq -cs .)" >> "$GITHUB_OUTPUT"
          fi
  mutants:
    # cargo-mutants over the whole workspace, weekly and NON-GATING. It does
    # not replace the hand-run discipline (neuter a finding emission and see
    # if the suite goes green), it catches lapses in it.
    #
    # NEVER a required status check; do not add it to branch protection. A run
    # is hours and its timeouts need a human who knows what the suite is meant
    # to pin, so requiring it would either block merges on infrastructure noise
    # or get its scope pared back until it means nothing. Surfacing is GitHub's
    # failed-run email to the repo owner, nothing pages, and crons stop after
    # 60 days of repository inactivity, so silence is not proof. Being
    # scheduled it is also inert until it reaches the default branch -- the PR
    # adding it cannot exercise it, only a workflow_dispatch afterwards can.
    #
    # Not an --in-diff job: the cost is unbounded on a diff into a big check
    # file (minutes of build and test per mutant on a contributor's PR, for a
    # verdict only a curator can read). The weekly full-workspace run is the
    # whole picture instead.
    runs-on: ubuntu-latest
    needs: setup
    # Sizing (measured 2026-10-12, not guessed): full `cargo test --workspace`
    # is 1288 passed in ~15s of tests under a ~90s incremental rebuild on a
    # many-core box; call it ~150s per mutant on a 4-vCPU runner. 5252 mutants
    # x 150s = ~219h total, so 64 shards hold each near 3.4h worst-case,
    # inside this cap with margin for a timeout-floor mutant or two. A shard
    # that outruns the cap has itself become the finding. Re-measure if the
    # suite's build or test time moves materially; the per-file `--list`
    # counts in the summary below are the drift signal.
    timeout-minutes: 360
    strategy:
      # A survivor in one shard must not cancel the rest: the run's value is
      # the whole picture, and shards share no state.
      fail-fast: false
      matrix:
        # 0-based, per cargo-mutants' k/n. The full list lives in setup's
        # shard computation; only_shard selects one leg of it. The denominator
        # is fixed at 64 (not strategy.job-total, which would read 1 on a
        # single-shard run): shard membership is by index, so a surgical
        # re-run covers exactly the same mutants as the full run did.
        # 64 shards for ~5252 mutants (~82 each); see timeout-minutes.
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f  # master
        with:
          # Exact pin, not floating stable: a roll mid-run across shards
          # would poison the comparison. Bump deliberately; release.yml
          # pins the same toolchain for the same reason.
          toolchain: "1.99.0"
      - name: Install system dependencies
        # The full workspace suite needs the same tooling as ci.yml's rust
        # legs (binary_cli shells out to rpm/file/dash/devscripts tooling):
        # with headers alone the unmutated baseline fails and every shard
        # exits 4 reporting "nothing was tested". Plain apt-get, no cache
        # action: seconds against a hours-long job, and another cache entry
        # is exactly what the no-rust-cache note below avoids.
        run: sudo apt-get update && sudo apt-get install -y librpm-dev rpm file devscripts dash desktop-file-utils appstream-util
      - name: Install cargo-mutants
        # Exact version and --locked. A crates.io version is immutable and
        # --locked pins its dependency tree, so this binds the binary as
        # tightly as a tarball digest without a per-platform sha256 to
        # hand-maintain. Dependabot cannot see this pin; bump it by hand.
        # cargo-mutants' MSRV is 1.78, under the pin.
        run: cargo install cargo-mutants --locked --version 25.3.1
      # No Swatinem/rust-cache: its key is per-job, so this would write a
      # multi-hundred-MB entry per shard that evicts ci.yml's by LRU once
      # the repo is over quota, to save minutes on a job that runs for hours.
      - name: Mutate
        # test_workspace comes from .cargo/mutants.toml so a hand-run of the
        # same scope behaves identically; only the shard is CI's business.
        # Shard membership is fixed by index before any shuffle; --no-shuffle
        # (it shuffles by default) only keeps the order within a shard, so
        # the artifact is diffable week to week.
        #
        # Keep cargo-mutants' exit code rather than collapsing it: 2 (a mutant
        # survived), 3 (one timed out, verdict unknown), 4 (the tests were
        # already failing, so nothing was tested) and the rest (cargo-mutants
        # broke) are four different things and only the first is a gap in the
        # suite. The summary reads the counts instead of that code, because
        # the code reports a timeout ahead of a survivor and would otherwise
        # bury one behind the other: a timeout is not a survivor, and neither
        # is allowed to hide the other. It opens with the total `--list`
        # count so the shard math above stays checkable.
        shell: bash
        env:
          MUTANTS_SHARD: ${{ matrix.shard }}
          # Fixed denominator, not strategy.job-total: on a single-shard
          # re-run job-total reads 1 and `--shard 11/1` is invalid.
          MUTANTS_SHARDS: "64"
        run: |
          set -euo pipefail
          {
            # GNU wc pads the count; $((n)) strips it.
            total=$(cargo mutants --list | wc -l)
            echo "total mutants: $((total))"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          cargo mutants --no-shuffle \
            --shard "${MUTANTS_SHARD}/${MUTANTS_SHARDS}" || rc=$?
          count() {
            if [ -f "mutants.out/$1.txt" ]; then wc -l < "mutants.out/$1.txt"; else echo 0; fi
          }
          missed=$(count missed)
          timedout=$(count timeout)
          {
            echo "## workspace shard ${MUTANTS_SHARD}/${MUTANTS_SHARDS} (exit ${rc})"
            echo
            if [ "$rc" -eq 4 ]; then
              echo '- The unmutated tests failed, so nothing was mutated and this run says nothing about coverage.'
            elif [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ] && [ "$rc" -ne 3 ]; then
              echo '- cargo-mutants itself failed; this run says nothing about coverage.'
            fi
            if [ "$missed" -gt 0 ]; then
              echo "- ${missed} survived: behaviour pinned by no test."
            fi
            if [ "$timedout" -gt 0 ]; then
              echo "- ${timedout} timed out: neither caught nor survivors. Each one hung, or outran the auto-derived cap; the verdict stays unknown until somebody reproduces it by hand."
            fi
            if [ "$rc" -eq 0 ] && [ "$missed" -eq 0 ] && [ "$timedout" -eq 0 ]; then
              echo '- Every mutant in this shard was caught.'
            fi
            echo
            echo '| caught | missed | timeout | unviable |'
            echo '| --- | --- | --- | --- |'
            echo "| $(count caught) | ${missed} | ${timedout} | $(count unviable) |"
            for class in missed timeout unviable; do
              if [ -s "mutants.out/${class}.txt" ]; then
                echo
                echo "### ${class}"
                echo '```'
                cat "mutants.out/${class}.txt"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Archive mutants.out
        # always(): the failing runs are the interesting ones, and
        # mutants.out/log holds the per-mutant cargo output the summary above
        # only counts. 30 days outlasts a holiday without accumulating forever.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          retention-days: 30
