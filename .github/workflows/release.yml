---
# Release: build binaries, create the GitHub release, publish to crates.io.
# Triggered by a bare X.Y.Z tag that must equal [workspace.package] version.
# Modelled on bugwarden's release process; OBS packaging is separate (M4).
name: release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+*'   # admit a pre-release suffix

permissions:
  contents: read

jobs:
  # Refuse a tag that disagrees with the manifest version.
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must equal [workspace.package] version
        run: |
          # Scope to the [workspace.package] table and anchor at the closing
          # quote, so a `version =` in any earlier table cannot win and a
          # trailing comment cannot leak into the value.
          manifest=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test -n "$manifest" || { echo "no [workspace.package] version found" >&2; exit 1; }
          if [ "$GITHUB_REF_NAME" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME != manifest version $manifest" >&2
            exit 1
          fi

  build:
    needs: check-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      # Releases are built hermetically — no cargo cache, so restored build
      # state can never influence published artifacts.
      - name: Build
        run: cargo build --release --locked -p rpmcrab --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          stage="dist-$target"
          mkdir -p "$stage"
          cp "target/$target/release/rpmcrab" "$stage/"
          cp LICENSE README.md "$stage/"
          out="rpmcrab-${GITHUB_REF_NAME}-${target}.tar.gz"
          tar -czf "$out" -C "$stage" rpmcrab LICENSE README.md
          shasum -a 256 "$out" > "$out.sha256"
          echo "asset=$out" >> "$GITHUB_OUTPUT"
        id: package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A non-bare-X.Y.Z tag is a pre-release and never becomes Latest.
          pre=""
          if ! [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            pre="--prerelease --latest=false"
          fi
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $pre dist/*

  publish:
    # crates.io last: a version can be yanked but never replaced, so it only
    # goes out once every platform built and the GitHub release exists.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Trusted Publishing exchanges this OIDC token for a short-lived
      # crates.io token, so no registry credential is stored in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          # rpmcrab-core first: the binary crate resolves its dependency from
          # the index and cannot even be packaged before core is there.
          for crate in rpmcrab-core rpmcrab; do
            # Re-running a release must not fail on a version already up.
            if curl -sSf -H 'User-Agent: rpmcrab-release' \
                 "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1; then
              echo "::notice::${crate} ${version} is already published, skipping"
              continue
            fi
            cargo publish --locked -p "$crate"
          done
