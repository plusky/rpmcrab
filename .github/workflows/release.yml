---
# Release: build binaries, sign them, create the GitHub release.
#
# Triggered by a `v`-prefixed tag (v0.9.0). The version is the tag minus the
# `v` and must equal [workspace.package] version in Cargo.toml, or the run
# fails before building anything. A manual workflow_dispatch run only builds
# (dry-run): artifacts land on the run, no release is created.
#
# Signing: when the `GPG_PRIVATE_KEY` secret holds the dedicated signing
# SUBKEY (ASCII-armored; never the primary key), every tarball and the
# checksums file get a detached `.asc` signature. Without the secret the
# release still goes out, unsigned, with a loud warning.
#
# Deliberately not here: crates.io publish (registry versions burn the
# version number; re-add once the release cadence is settled) and OBS
# submission (separate packaging track, M4).
name: release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.9.0). Dry-run only: no release is created.'
        required: true

permissions:
  contents: read

jobs:
  # Derive the release version and refuse anything that disagrees with the
  # manifest, so a mistyped tag can never ship the wrong version string.
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive and check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            # Strip the leading `v`: v0.9.0 -> 0.9.0.
            version="${GITHUB_REF_NAME#v}"
          fi
          # Scope to the [workspace.package] table and anchor at the closing
          # quote, so a `version =` in any earlier table cannot win and a
          # trailing comment cannot leak into the value.
          manifest=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test -n "$manifest" || { echo "no [workspace.package] version found" >&2; exit 1; }
          if [ "$version" != "$manifest" ]; then
            echo "version $version != manifest version $manifest" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # librpm is Linux-only; there is no macOS build.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # Native arm64 runner: no cross toolchain to maintain.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          # Pinned, not floating stable: release artifacts must be
          # reproducible; bump deliberately.
          toolchain: 1.99.0
      # Releases are built hermetically — no cargo cache, so restored build
      # state can never influence published artifacts.
      - name: Install RPM development headers
        run: sudo apt-get update && sudo apt-get install -y librpm-dev
      - name: Build
        run: cargo build --release --locked -p rpmcrab --target ${{ matrix.target }}
      - name: Package
        id: package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          version="$PACKAGE_VERSION"
          target="${{ matrix.target }}"
          stage="dist-$target"
          mkdir -p "$stage"
          cp "target/$target/release/rpmcrab" "$stage/"
          cp LICENSE README.md "$stage/"
          out="rpmcrab-${version}-${target}.tar.gz"
          tar -czf "$out" -C "$stage" rpmcrab LICENSE README.md
          shasum -a 256 "$out" > "$out.sha256"
          echo "asset=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  # A/B regression gate on the pinned release corpus: the candidate
  # (this run's build) is timed against the previous release's binary on
  # this same runner, interleaved per package, with an A/A calibration
  # pass (the baseline against itself) measuring the noise floor. The
  # verdict fails this job on a significant regression, and the release
  # job depends on this one, so a failed gate blocks publication.
  # Method and thresholds: benchmarks/release-corpus/README.md.
  benchmark:
    needs: [check-version, build]
    # Pinned runner image: the A/B comparison happens on one runner by
    # design, and a fixed OS image keeps the environment comparable
    # across runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist
          if-no-files-found: error
      # Before the smoke test: rpmcrab shells out to `file` and to
      # `rpm -Kv` (SignatureCheck), and a fresh ubuntu-24.04 image has
      # no rpm, so install both up front.
      - name: Install runtime deps
        run: sudo apt-get update && sudo apt-get install -y file rpm
      - name: Extract release binary (the candidate)
        run: |
          set -euo pipefail
          mkdir -p /tmp/candidate
          tar -xzf dist/rpmcrab-*.tar.gz -C /tmp/candidate
          /tmp/candidate/rpmcrab --version
      # The baseline is the previous published release's binary, fetched
      # from its release assets: the newest release whose tag is not this
      # run's tag. Resolution and download failures fail the job; the
      # gate reports "no-baseline" only when no previous release exists.
      - name: Resolve and fetch the baseline (previous release)
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: v${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases?per_page=30" > /tmp/releases.json
          tag="$(jq -r --arg cur "$CANDIDATE_TAG" \
            '[.[] | select(.draft | not) | .tag_name | select(. != $cur)] | first // empty' \
            /tmp/releases.json)"
          if [ -z "$tag" ]; then
            echo "no previous release found; the gate will report no-baseline"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "baseline release: $tag"
          mkdir -p /tmp/baseline-dist /tmp/baseline
          gh release download "$tag" \
            --pattern 'rpmcrab-*-x86_64-unknown-linux-gnu.tar.gz' \
            --dir /tmp/baseline-dist
          tar -xzf /tmp/baseline-dist/rpmcrab-*.tar.gz -C /tmp/baseline
          /tmp/baseline/rpmcrab --version
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run A/B benchmark gate
        env:
          RPMCRAB_BIN: /tmp/candidate/rpmcrab
          BASELINE_TAG: ${{ steps.baseline.outputs.tag }}
          RESULTS_DIR: ${{ github.workspace }}/bench-results
        run: |
          set -euo pipefail
          # With no previous release there is no baseline binary to
          # point at; the unset variable is bench.sh's no-baseline
          # signal.
          if [ -n "$BASELINE_TAG" ]; then
            export BASELINE_BIN=/tmp/baseline/rpmcrab
          fi
          mkdir -p "$RESULTS_DIR"
          ./benchmarks/release-corpus/bench.sh ab \
            | tee "$RESULTS_DIR/benchmark-${{ needs.check-version.outputs.version }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: benchmark-${{ needs.check-version.outputs.version }}
          path: ${{ github.workspace }}/bench-results/
          if-no-files-found: error

  release:
    # Tag pushes only: a dispatch run is a dry-run and stops after build.
    if: github.event_name == 'push'
    needs: [check-version, build, benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Attestation mints the OIDC token for build provenance.
      id-token: write
      attestations: write
    steps:
      # gh release create/upload resolve the repo from git remotes, so the job
      # needs a checkout even though it builds nothing itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
          if-no-files-found: error
      # The gate's verdict JSON rides the same release-create call as
      # the tarballs, so it lands on the release as an asset.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-${{ needs.check-version.outputs.version }}
          path: dist
          if-no-files-found: error

      - name: Write combined checksums
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Sign artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Signing is optional: without the secret the release still goes
          # out, unsigned, with a loud warning. The secret must hold only the
          # dedicated signing SUBKEY (ASCII-armored), never the primary key.
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY is not set; publishing unsigned artifacts"
            exit 0
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "signing with key: $(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          sign_args=(--batch --yes --pinentry-mode loopback --detach-sign --armor)
          passphrase_input=/dev/null
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            sign_args+=(--passphrase-fd 0)
            passphrase_input=<(printf '%s' "$GPG_PASSPHRASE")
          fi
          cd dist
          for f in rpmcrab-*.tar.gz SHA256SUMS; do
            gpg "${sign_args[@]}" -o "$f.asc" "$f" <"$passphrase_input"
          done

      # Attest the tarballs' build provenance between download and release, so
      # a provenance failure costs the tag and leaves nothing published.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            !dist/*.sha256
            !dist/*.asc
            !dist/*.json

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # A non-bare-X.Y.Z tag is a pre-release and never becomes Latest.
          pre=""
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            pre="--prerelease --latest=false"
          fi
          # The release stays untitled (version tag only, no name): the
          # notes body is generated first — a read-only API call that
          # creates nothing — and handed to the create calls below as a
          # file. Neither --title nor --generate-notes may reach them:
          # either flag alone titles the release after the tag.
          gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$tag" --jq .body > notes.md
          # Assets ride the create call, not a later upload: gh creates as a
          # draft, uploads, then publishes, which is the only sequence an
          # immutable release accepts (a published release freezes its
          # assets, so create-then-upload 422s). Recovery by leftover kind:
          # a published release with assets is left alone; a draft (with or
          # without assets) is deleted and recreated; a published mutable
          # asset-less leftover is deleted and recreated; a published
          # immutable asset-less release fails loudly — deleting it would
          # retire the tag name without any release to recreate, so the way
          # out is a new version, not a re-run.
          # shellcheck disable=SC2086
          if ! info="$(gh release view "$tag" --json isDraft,isImmutable,assets 2>/dev/null)"; then
            gh release create "$tag" --notes-file notes.md $pre dist/*
          elif [ "$(jq -r .isDraft <<<"$info")" = "false" ] \
            && [ -n "$(jq -r '.assets[].name' <<<"$info")" ]; then
            echo "release $tag already published with assets; leaving it alone"
          elif [ "$(jq -r .isDraft <<<"$info")" = "true" ]; then
            gh release delete "$tag" --yes
            gh release create "$tag" --notes-file notes.md $pre dist/*
          elif [ "$(jq -r .isImmutable <<<"$info")" = "true" ]; then
            echo "::error::release $tag is published, immutable, and has no assets; the tag name is retired and cannot back another release — bump the version and tag again"
            exit 1
          else
            gh release delete "$tag" --yes
            gh release create "$tag" --notes-file notes.md $pre dist/*
          fi
