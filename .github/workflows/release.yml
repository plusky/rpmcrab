---
# Release: build binaries, sign them, create the GitHub release.
#
# Triggered by a `v`-prefixed tag (v0.9.0). The version is the tag minus the
# `v` and must equal [workspace.package] version in Cargo.toml, or the run
# fails before building anything. A manual workflow_dispatch run only builds
# (dry-run): artifacts land on the run, no release is created.
#
# Signing: when the `GPG_PRIVATE_KEY` secret holds the dedicated signing
# SUBKEY (ASCII-armored; never the primary key), every tarball and the
# checksums file get a detached `.asc` signature. Without the secret the
# release still goes out, unsigned, with a loud warning.
#
# Deliberately not here: crates.io publish (registry versions burn the
# version number; re-add once the release cadence is settled) and OBS
# submission (separate packaging track, M4).
name: release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.9.0). Dry-run only: no release is created.'
        required: true

permissions:
  contents: read

jobs:
  # Derive the release version and refuse anything that disagrees with the
  # manifest, so a mistyped tag can never ship the wrong version string.
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive and check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            # Strip the leading `v`: v0.9.0 -> 0.9.0.
            version="${GITHUB_REF_NAME#v}"
          fi
          # Scope to the [workspace.package] table and anchor at the closing
          # quote, so a `version =` in any earlier table cannot win and a
          # trailing comment cannot leak into the value.
          manifest=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test -n "$manifest" || { echo "no [workspace.package] version found" >&2; exit 1; }
          if [ "$version" != "$manifest" ]; then
            echo "version $version != manifest version $manifest" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # librpm is Linux-only; there is no macOS build.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # Native arm64 runner: no cross toolchain to maintain.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          # Pinned, not floating stable: release artifacts must be
          # reproducible; bump deliberately.
          toolchain: 1.99.0
      # Releases are built hermetically — no cargo cache, so restored build
      # state can never influence published artifacts.
      - name: Install RPM development headers
        run: sudo apt-get update && sudo apt-get install -y librpm-dev
      - name: Build
        run: cargo build --release --locked -p rpmcrab --target ${{ matrix.target }}
      - name: Package
        id: package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          version="$PACKAGE_VERSION"
          target="${{ matrix.target }}"
          stage="dist-$target"
          mkdir -p "$stage"
          cp "target/$target/release/rpmcrab" "$stage/"
          cp LICENSE README.md "$stage/"
          out="rpmcrab-${version}-${target}.tar.gz"
          tar -czf "$out" -C "$stage" rpmcrab LICENSE README.md
          shasum -a 256 "$out" > "$out.sha256"
          echo "asset=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  # End-to-end benchmark on the pinned release corpus. Informational only:
  # continue-on-error means a benchmark failure never blocks the release.
  # The summary JSON is uploaded as an artifact for trend tracking.
  benchmark:
    needs: [check-version, build]
    # Pinned runner image: wall-clock is noisy on shared runners, so at
    # least the OS image is fixed; compare medians across releases as a
    # trend, never gate on single-run deltas.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist
          if-no-files-found: error
      # Before the smoke test: rpmcrab shells out to `file` and to
      # `rpm -Kv` (SignatureCheck), and a fresh ubuntu-24.04 image has
      # no rpm, so install both up front.
      - name: Install runtime deps
        run: sudo apt-get update && sudo apt-get install -y file rpm
      - name: Extract release binary
        run: |
          set -euo pipefail
          tar -xzf dist/rpmcrab-*.tar.gz -C /tmp
          /tmp/rpmcrab --version
      - name: Run corpus benchmark
        env:
          RPMCRAB_BIN: /tmp/rpmcrab
          RESULTS_DIR: ${{ github.workspace }}/bench-results
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR"
          ./benchmarks/release-corpus/bench.sh all \
            | tee "$RESULTS_DIR/benchmark-${{ needs.check-version.outputs.version }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ needs.check-version.outputs.version }}
          path: ${{ github.workspace }}/bench-results/
          if-no-files-found: error

  release:
    # Tag pushes only: a dispatch run is a dry-run and stops after build.
    if: github.event_name == 'push'
    needs: [check-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Attestation mints the OIDC token for build provenance.
      id-token: write
      attestations: write
    steps:
      # gh release create/upload resolve the repo from git remotes, so the job
      # needs a checkout even though it builds nothing itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
          if-no-files-found: error

      - name: Write combined checksums
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Sign artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Signing is optional: without the secret the release still goes
          # out, unsigned, with a loud warning. The secret must hold only the
          # dedicated signing SUBKEY (ASCII-armored), never the primary key.
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY is not set; publishing unsigned artifacts"
            exit 0
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "signing with key: $(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          sign_args=(--batch --yes --pinentry-mode loopback --detach-sign --armor)
          passphrase_input=/dev/null
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            sign_args+=(--passphrase-fd 0)
            passphrase_input=<(printf '%s' "$GPG_PASSPHRASE")
          fi
          cd dist
          for f in rpmcrab-*.tar.gz SHA256SUMS; do
            gpg "${sign_args[@]}" -o "$f.asc" "$f" <"$passphrase_input"
          done

      # Attest the tarballs' build provenance between download and release, so
      # a provenance failure costs the tag and leaves nothing published.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            !dist/*.sha256
            !dist/*.asc

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # A non-bare-X.Y.Z tag is a pre-release and never becomes Latest.
          pre=""
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            pre="--prerelease --latest=false"
          fi
          # Assets ride the create call, not a later upload: gh creates as a
          # draft, uploads, then publishes, which is the only sequence an
          # immutable release accepts (a published release freezes its
          # assets, so create-then-upload 422s). Recovery by leftover kind:
          # a published release with assets is left alone; a draft (with or
          # without assets) is deleted and recreated; a published mutable
          # asset-less leftover is deleted and recreated; a published
          # immutable asset-less release fails loudly — deleting it would
          # retire the tag name without any release to recreate, so the way
          # out is a new version, not a re-run.
          # shellcheck disable=SC2086
          if ! info="$(gh release view "$tag" --json isDraft,isImmutable,assets 2>/dev/null)"; then
            gh release create "$tag" --title "$tag" --generate-notes $pre dist/*
          elif [ "$(jq -r .isDraft <<<"$info")" = "false" ] \
            && [ -n "$(jq -r '.assets[].name' <<<"$info")" ]; then
            echo "release $tag already published with assets; leaving it alone"
          elif [ "$(jq -r .isDraft <<<"$info")" = "true" ]; then
            gh release delete "$tag" --yes
            gh release create "$tag" --title "$tag" --generate-notes $pre dist/*
          elif [ "$(jq -r .isImmutable <<<"$info")" = "true" ]; then
            echo "::error::release $tag is published, immutable, and has no assets; the tag name is retired and cannot back another release — bump the version and tag again"
            exit 1
          else
            gh release delete "$tag" --yes
            gh release create "$tag" --title "$tag" --generate-notes $pre dist/*
          fi
