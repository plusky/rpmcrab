---
name: dependency-review
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # comment-summary-in-pr posts the review summary as a PR comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # The project is GPL-2.0-or-later; deny licences that cannot be linked
          # into it. The allow-list in deny.toml is the compile-time floor; this
          # guards the PR-time graph.
          deny-licenses: GPL-3.0-only, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-3.0-only, SSPL-1.0, CC-BY-NC-4.0, CC-BY-NC-SA-4.0
          # Path dep shares this repo's license; its bump trips the or-later match on the GPL-3.0-only entry.
          allow-dependencies-licenses: 'pkg:cargo/rpmcrab-core'
