# Monthly staleness check for the vendored systemd preset data.
#
# The preset data stays live only while it matches the current pool
# git mirrors. This job runs the generator in --check mode and FAILS
# with the diff when the vendored data goes stale. Failure is the
# reminder: data edits stay human-reviewed, so this job never opens
# a PR and never edits anything itself.
#
# Schedule: 1st of month 04:00 UTC, same as the stem-table check.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 1 * *' # 1st of month 04:00 UTC

permissions:
  contents: read

concurrency:
  group: systemd-presets-staleness
  cancel-in-progress: false

jobs:
  staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check preset data staleness
        run: |
          python3 scripts/generate-systemd-presets.py --check
