---
name: ci
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: . -> target
      - run: cargo fmt --all -- --check
      # The second clippy line is not optional: --all-targets skips the
      # feature-gated rpmcrab-gen bin unless gen is enabled.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --features gen --locked -- -D warnings
      - run: bash scripts/check-rust-layering.sh
      - run: cargo test --workspace --all-targets --locked

  # Platform spread: formatting is platform-independent, so macOS runs only
  # clippy + test to catch platform-specific compilation issues.
  rust-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: . -> target
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --features gen --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  # Devel (beta) compiler, non-failing: an early-warning leg for upcoming
  # toolchain breaks. rust-toolchain.toml outranks the dtolnay default, so the
  # beta toolchain is selected via RUSTUP_TOOLCHAIN at job level and asserted.
  rust-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: beta
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: . -> target
          # This leg is expected to fail sometimes; with main the only cache
          # writer, a beta break would otherwise freeze the cache.
          cache-on-failure: true
      - name: Assert beta toolchain
        run: |
          rustc --version
          rustc --version | grep -q beta
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  rust-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$msrv" || { echo "rust-version not found in Cargo.toml" >&2; exit 1; }
          echo "value=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.msrv.outputs.value }}
      # dtolnay/rust-toolchain sets the rustup default, which rust-toolchain.toml
      # outranks; export RUSTUP_TOOLCHAIN so the MSRV is actually used, and assert.
      - name: Assert MSRV toolchain
        run: |
          export RUSTUP_TOOLCHAIN="${{ steps.msrv.outputs.value }}"
          rustc --version
          rustc --version | grep -q "${{ steps.msrv.outputs.value }}"
      # cargo check, not build, over --all-targets: an MSRV break in test code
      # or a dev-dependency otherwise passes here and only bites a contributor.
      - name: cargo check at MSRV
        run: |
          export RUSTUP_TOOLCHAIN="${{ steps.msrv.outputs.value }}"
          cargo check --workspace --all-targets --locked

  rust-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: Cargo.toml
          command: check
          # Do not force --all-features on an empty graph.
          arguments: ""
