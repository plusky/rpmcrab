---
name: ci
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: . -> target
      # librpm-sys generates bindings with bindgen, so the build needs the RPM
      # development headers (pkg-config `rpm.pc`); the tests also need the
      # `rpm` CLI (signature check) and `file` (libmagic). Extraction is
      # native now: no rpm2archive/rpm2cpio or cpio needed.
      # The cache-apt-pkgs-action key is md5(packages + version + repos [+arch
      # iff non-x86_64]) - no distro dimension. Fold the runner OS release into
      # `version` so a floating `ubuntu-latest` image (24.04 -> 26.04) never
      # restores stale .debs onto a new distro, and rotate on the ISO week so a
      # cache hit never tests against weeks-old packages.
      - name: Compute apt cache version
        id: apt-cache-version
        run: |
          . /etc/os-release
          echo "version=1.0-${VERSION_ID}-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Install RPM toolchain (headers + tools)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librpm-dev rpm file devscripts dash desktop-file-utils appstream-util
          version: ${{ steps.apt-cache-version.outputs.version }}
          execute_install_scripts: true
      # Spellcheck tests need real hunspell dictionaries; grab the LibreOffice
      # en_US pair (the same source openSUSE packages from).
      - name: Install hunspell dictionaries
        run: sudo bash scripts/install-hunspell-dicts.sh /usr/share/hunspell
      - run: cargo fmt --all -- --check
      # The second clippy line is not optional: --all-targets skips the
      # feature-gated rpmcrab-gen bin unless gen is enabled.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --features gen --locked -- -D warnings
      - run: bash scripts/check-rust-layering.sh
      - run: bash scripts/check-version-consistency.sh
      - run: cargo test --workspace --all-targets --locked

  # Platform spread: Homebrew ships librpm, so the crate builds natively on
  # macOS too. Formatting is platform-independent, so macOS runs only clippy +
  # test to catch platform-specific compilation or behavior issues.
  rust-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: . -> target
      # Homebrew's rpm formula provides librpm and the headers.
      # librpm-sys links bare -lrpm/-lrpmio and bindgen needs the headers, so
      # export the locations for the cargo steps below.
      - name: Install RPM via Homebrew
        run: |
          brew install rpm popt dash desktop-file-utils appstream-glib
          # checkbashisms has no Homebrew formula (Debian devscripts only),
          # so on macOS BashismsCheck degrades through have_tools()
          # (bashisms.rs:68-70: dash.is_present() && checkbashisms.is_present()):
          # check_binary returns early, so the findings are simply absent.
          # `[tools].present` in tests/parity/cases/*/meta.toml is recorded
          # at capture time (scripts/capture-parity.sh) for provenance;
          # nothing reads it yet and no parity runner gates on it.
          echo "LIBRARY_PATH=$(brew --prefix rpm)/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(brew --prefix rpm)/include -I$(brew --prefix popt)/include" >> "$GITHUB_ENV"
      # Spellcheck tests need real hunspell dictionaries; the spellchecker
      # looks in /opt/homebrew/share/hunspell on Apple Silicon Macs.
      - name: Install hunspell dictionaries
        run: sudo bash scripts/install-hunspell-dicts.sh /opt/homebrew/share/hunspell
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --features gen --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  # Devel (beta) compiler, non-failing: an early-warning leg for upcoming
  # toolchain breaks. rust-toolchain.toml outranks the dtolnay default, so the
  # beta toolchain is selected via RUSTUP_TOOLCHAIN at job level and asserted.
  rust-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: beta
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: . -> target
          # This leg is expected to fail sometimes; with main the only cache
          # writer, a beta break would otherwise freeze the cache.
          cache-on-failure: true
      # The cache-apt-pkgs-action key is md5(packages + version + repos [+arch
      # iff non-x86_64]) - no distro dimension. Fold the runner OS release into
      # `version` so a floating `ubuntu-latest` image (24.04 -> 26.04) never
      # restores stale .debs onto a new distro, and rotate on the ISO week so a
      # cache hit never tests against weeks-old packages.
      - name: Compute apt cache version
        id: apt-cache-version
        run: |
          . /etc/os-release
          echo "version=1.0-${VERSION_ID}-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Install RPM toolchain (headers + tools)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librpm-dev rpm file devscripts dash desktop-file-utils appstream-util
          version: ${{ steps.apt-cache-version.outputs.version }}
          execute_install_scripts: true
      # Spellcheck tests need real hunspell dictionaries; grab the LibreOffice
      # en_US pair (the same source openSUSE packages from).
      - name: Install hunspell dictionaries
        run: sudo bash scripts/install-hunspell-dicts.sh /usr/share/hunspell
      - name: Assert beta toolchain
        run: |
          rustc --version
          rustc --version | grep -q beta
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --features gen --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  rust-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The cache-apt-pkgs-action key is md5(packages + version + repos [+arch
      # iff non-x86_64]) - no distro dimension. Fold the runner OS release into
      # `version` so a floating `ubuntu-latest` image (24.04 -> 26.04) never
      # restores stale .debs onto a new distro, and rotate on the ISO week so a
      # cache hit never tests against weeks-old packages.
      - name: Compute apt cache version
        id: apt-cache-version
        run: |
          . /etc/os-release
          echo "version=1.0-${VERSION_ID}-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Install RPM toolchain (headers + tools)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librpm-dev rpm file devscripts dash desktop-file-utils appstream-util
          version: ${{ steps.apt-cache-version.outputs.version }}
          execute_install_scripts: true
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$msrv" || { echo "rust-version not found in Cargo.toml" >&2; exit 1; }
          echo "value=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.msrv.outputs.value }}
      # dtolnay/rust-toolchain sets the rustup default, which rust-toolchain.toml
      # outranks; export RUSTUP_TOOLCHAIN so the MSRV is actually used, and assert.
      - name: Assert MSRV toolchain
        run: |
          export RUSTUP_TOOLCHAIN="${{ steps.msrv.outputs.value }}"
          rustc --version
          rustc --version | grep -q "${{ steps.msrv.outputs.value }}"
      # cargo check, not build, over --all-targets: an MSRV break in test code
      # or a dev-dependency otherwise passes here and only bites a contributor.
      # --features gen so the feature-gated rpmcrab-gen bin is checked too.
      - name: cargo check at MSRV
        run: |
          export RUSTUP_TOOLCHAIN="${{ steps.msrv.outputs.value }}"
          cargo check --workspace --all-targets --features gen --locked

  rust-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The EmbarkStudios/cargo-deny-action Docker image pulls
      # rust:1.85.0-alpine3.20 from Docker Hub at build time, which fails on
      # GitHub-hosted runners with 429 rate limits. Install the upstream
      # prebuilt cargo-deny binary directly instead.
      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: 0.20.2
          # Pinned sha256 of cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz
          # (upstream release artifact); the checksum no longer comes over the wire.
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSLf --retry 3 -o /tmp/cargo-deny.tar.gz "$url"
          echo "${CARGO_DENY_SHA256}  /tmp/cargo-deny.tar.gz" | sha256sum -c -
          mkdir -p /tmp/cargo-deny
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp/cargo-deny
          sudo install -m 755 "/tmp/cargo-deny/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/cargo-deny
          cargo-deny --version
      - name: cargo deny check
        # Do not force --all-features on an empty graph (see deny.toml).
        run: cargo-deny --manifest-path Cargo.toml check

  # The man page and shell completions are checked in under
  # crates/rpmcrab/{man,completions}; regenerate them from the clap Command
  # and fail if the committed assets drifted.
  assets-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      # Building rpmcrab-gen links the rpmcrab lib, so this needs the same RPM
      # development headers as the main build.
      # The cache-apt-pkgs-action key is md5(packages + version + repos [+arch
      # iff non-x86_64]) - no distro dimension. Fold the runner OS release into
      # `version` so a floating `ubuntu-latest` image (24.04 -> 26.04) never
      # restores stale .debs onto a new distro, and rotate on the ISO week so a
      # cache hit never tests against weeks-old packages.
      - name: Compute apt cache version
        id: apt-cache-version
        run: |
          . /etc/os-release
          echo "version=1.0-${VERSION_ID}-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Install RPM toolchain (headers + tools)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librpm-dev rpm file pkg-config devscripts dash desktop-file-utils appstream-util
          version: ${{ steps.apt-cache-version.outputs.version }}
          execute_install_scripts: true
      - run: cargo run -p rpmcrab --features gen --locked --bin rpmcrab-gen -- /tmp/rpmcrab-gen-assets
      - run: diff -r /tmp/rpmcrab-gen-assets/man crates/rpmcrab/man
      - run: diff -r /tmp/rpmcrab-gen-assets/completions crates/rpmcrab/completions
      # The release workflow's post-release bump runs this script; it needs
      # the same toolchain and headers as the asset generation above.
      - run: python3 scripts/test_bump_version.py


  distro-config-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The generator streams repo filelists through curl | zstd; declare
      # them instead of relying on the runner image shipping both.
      # The cache-apt-pkgs-action key is md5(packages + version + repos [+arch
      # iff non-x86_64]) - no distro dimension. Fold the runner OS release into
      # `version` so a floating `ubuntu-latest` image (24.04 -> 26.04) never
      # restores stale .debs onto a new distro, and rotate on the ISO week so a
      # cache hit never tests against weeks-old packages.
      - name: Compute apt cache version
        id: apt-cache-version
        run: |
          . /etc/os-release
          echo "version=1.0-${VERSION_ID}-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Install filelist pipeline deps
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: curl zstd
          version: ${{ steps.apt-cache-version.outputs.version }}
          execute_install_scripts: true
      # The vendored distro configs are upstream-owned until rpmlint is fully
      # superseded; this fails when they diverge from what the generator
      # produces at the pinned SHAs. See scripts/generate-distro-configs.py.
      # Fail-closed unit tests for the generator's filelist verification.
      # Hermetic: runs before the network-dependent --check so a network
      # flake cannot hide a unit-test failure.
      - run: python3 scripts/test_generate_distro_configs.py
      - run: python3 scripts/test_sync_upstream_whitelists.py
      - run: python3 scripts/test_watch_upstream_configs.py
      - run: python3 scripts/test_leap16_name_scan.py
      # Exit 3 is the generator's fetch-exhausted code (EXIT_FETCH_EXHAUSTED
      # in scripts/generate-distro-configs.py): a live upstream fetch died
      # beyond retries, so this run verified nothing. Map it to a warning
      # so the job stays green - an upstream outage must not mail failure
      # noise - while drift (exit 1) and every other failure keep failing.
      # The neutral mapping requires the generator's fetch-exhausted:
      # marker line in the log: exit 3 without it fails closed, so only a
      # genuine fetch exhaustion goes neutral.
      - name: Check vendored distro configs against the pins
        run: |
          rc=0
          python3 scripts/generate-distro-configs.py --check > /tmp/drift-check.log 2>&1 || rc=$?
          cat /tmp/drift-check.log
          if [ "$rc" -eq 3 ]; then
            marker=$(grep '^fetch-exhausted:' /tmp/drift-check.log | head -n 1 || true)
            if [ -z "$marker" ]; then
              echo "::error title=Distro config drift check::exit 3 without the fetch-exhausted marker; failing closed"
              exit 3
            fi
            # The marker embeds upstream error text; escape it for the
            # workflow command (% first, then CR and LF).
            escaped=${marker//\%/%25}
            escaped=${escaped//$'\r'/%0D}
            escaped=${escaped//$'\n'/%0A}
            echo "::warning title=Distro config drift not verified::$escaped"
            echo "Distro config drift check neutral: $marker" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"

  reference-coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned reference
        run: |
          REF_SHA=$(grep '^REF_SHA=' scripts/setup-rpmlint-ref.sh | cut -d'"' -f2)
          git clone --depth 1 https://github.com/rpm-software-management/rpmlint.git /tmp/rpmlint-ref
          git -C /tmp/rpmlint-ref fetch --depth 1 origin "$REF_SHA"
          git -C /tmp/rpmlint-ref checkout "$REF_SHA"
      - name: Test the auditor
        run: python3 scripts/test_audit_reference_coverage.py
      - name: Run reference coverage audit
        run: python3 scripts/audit-reference-coverage.py /tmp/rpmlint-ref

  # The parity corpus is the frozen DESIGN §4 surface: the runner executes
  # every case against the pinned reference rpmlint and the built rpmcrab,
  # and a difference passes only when a divergences.toml entry accounts
  # for it (scripts/parity-runner.py).
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: . -> target
      # The cache-apt-pkgs-action key is md5(packages + version + repos [+arch
      # iff non-x86_64]) - no distro dimension. Fold the runner OS release into
      # `version` so a floating `ubuntu-latest` image (24.04 -> 26.04) never
      # restores stale .debs onto a new distro, and rotate on the ISO week so a
      # cache hit never tests against weeks-old packages.
      - name: Compute apt cache version
        id: apt-cache-version
        run: |
          . /etc/os-release
          echo "version=1.0-${VERSION_ID}-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # librpm-dev/rpm/file are the build's own needs; devscripts carries
      # checkbashisms, appstream-util carries appstreamcli, and python3-rpm
      # gives the reference venv the librpm binding it is created against
      # (scripts/setup-rpmlint-ref.sh). git is declared for the same reason
      # as in the drift job: the setup script clones the pinned reference.
      # binutils carries readelf/objdump for the reference and the port.
      - name: Install RPM toolchain and reference tools
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librpm-dev rpm file devscripts dash desktop-file-utils appstream-util python3-rpm git binutils
          version: ${{ steps.apt-cache-version.outputs.version }}
          execute_install_scripts: true
      # setup-rpmlint-ref.sh builds the reference venv with uv; both the
      # action and the uv version it installs are pinned.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      # Spellcheck findings need real hunspell dictionaries; grab the
      # LibreOffice en_US pair (the same source openSUSE packages from).
      - name: Install hunspell dictionaries
        run: sudo bash scripts/install-hunspell-dicts.sh /usr/share/hunspell
      # Hermetic differ tests first, so a network flake in the reference
      # setup cannot hide a differ failure.
      - run: python3 scripts/test_parity_runner.py
      - run: cargo build --release -p rpmcrab --locked
      - run: bash scripts/setup-rpmlint-ref.sh
      - run: python3 scripts/parity-runner.py

  # Every registered check must have an --explain description: a staged
  # <Check>.toml (or, for FHSCheck/PostCheck, details registered in code,
  # mirroring the reference which ships no TOML for those either). Runs the
  # coverage tests standalone so the check is visible by name and cannot be
  # skipped by test-selection.
  description-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      # The lib links librpm, so compiling its tests needs the RPM headers.
      # The cache-apt-pkgs-action key is md5(packages + version + repos [+arch
      # iff non-x86_64]) - no distro dimension. Fold the runner OS release into
      # `version` so a floating `ubuntu-latest` image (24.04 -> 26.04) never
      # restores stale .debs onto a new distro, and rotate on the ISO week so a
      # cache hit never tests against weeks-old packages.
      - name: Compute apt cache version
        id: apt-cache-version
        run: |
          . /etc/os-release
          echo "version=1.0-${VERSION_ID}-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Install RPM toolchain (headers + tools)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librpm-dev rpm file pkg-config
          version: ${{ steps.apt-cache-version.outputs.version }}
          execute_install_scripts: true
      - run: cargo test -p rpmcrab-core --lib --locked description_coverage
