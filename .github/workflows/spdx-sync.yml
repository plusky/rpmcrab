---
name: spdx-sync
# Keep the vendored SPDX ID list in crates/rpmcrab-core/src/checks/spdx.rs
# from drifting behind spdx/license-list-data.
# - Manual trigger: refresh on demand (workflow_dispatch)
# - Monthly schedule: the list ships a few releases a year; monthly is plenty
# On drift the job opens a refresh PR; when the data is current it is a
# green no-op. The generated file stamps only the SPDX release version (no
# fetch date), so a plain git diff is the drift signal: the version is read
# from the same JSON as the IDs, therefore a diff means the data changed
# and no diff means nothing did -- no no-op PRs.
#
# The checked-in file stays the build's source of truth; the generator never
# runs at build time.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *' # 1st of month 03:00 UTC

permissions:
  contents: read

concurrency:
  group: spdx-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate SPDX ID list
        run: python3 scripts/generate-spdx-list.py
      - name: Check for drift
        id: diff
        run: |
          if git diff --quiet -- crates/rpmcrab-core/src/checks/spdx.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # librpm-sys generates bindings with bindgen, so the compile check
      # below needs the RPM development headers (pkg-config `rpm.pc`)
      # installed first -- the same apt block as ci.yml. The
      # cache-apt-pkgs-action key is md5(packages + version + repos
      # [+arch iff non-x86_64]) - no distro dimension. Fold the runner OS
      # release into `version` so a floating `ubuntu-latest` image
      # (24.04 -> 26.04) never restores stale .debs onto a new distro, and
      # rotate on the ISO week so a cache hit never tests against
      # weeks-old packages.
      - name: Compute apt cache version
        id: apt-cache-version
        if: steps.diff.outputs.changed == 'true'
        run: |
          . /etc/os-release
          echo "version=1.0-${VERSION_ID}-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Install RPM toolchain (headers + tools)
        if: steps.diff.outputs.changed == 'true'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librpm-dev rpm file devscripts dash desktop-file-utils appstream-util
          version: ${{ steps.apt-cache-version.outputs.version }}
          execute_install_scripts: true
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: steps.diff.outputs.changed == 'true'
        with:
          toolchain: stable
      - name: Check the regenerated list compiles
        if: steps.diff.outputs.changed == 'true'
        run: cargo check -p rpmcrab-core --locked
      - name: Open refresh PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          new_ver=$(sed -n 's|^/// SPDX license list version: ||p' crates/rpmcrab-core/src/checks/spdx.rs)
          branch="spdx-sync-${new_ver}-$(date -u +%F)"
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            checkout -B "$branch"
          git add crates/rpmcrab-core/src/checks/spdx.rs
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "Refresh SPDX license IDs to ${new_ver}"
          # Same-day reruns reset this date-named branch: force-with-lease
          # updates the existing PR instead of failing non-fast-forward
          # (and still refuses if someone else pushed meanwhile). Fetch
          # first so the lease has a baseline on a fresh clone.
          git fetch origin "$branch" || true
          git push --force-with-lease -u origin "$branch"
          added=$(git show --format= --unified=0 HEAD -- crates/rpmcrab-core/src/checks/spdx.rs \
            | grep -c '^\+    "[^"]*", *$' || true)
          removed=$(git show --format= --unified=0 HEAD -- crates/rpmcrab-core/src/checks/spdx.rs \
            | grep -c '^\-    "[^"]*", *$' || true)
          body="SPDX license-list-data released ${new_ver}: ${added} IDs added, ${removed} removed from the spellcheck suggestion pool. Produced by the monthly spdx-sync job."
          existing=$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$branch" \
              --title "Refresh SPDX license IDs to ${new_ver}" \
              --body "$body"
          else
            # Same-day rerun: refresh the existing PR body, or it keeps
            # describing the first run's counts.
            gh pr edit "$existing" --body "$body"
          fi
