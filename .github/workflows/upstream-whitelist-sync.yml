---
# Daily sync of whitelist/config stanzas from upstream rpmlint branches.
#
# The SUSE security team commits whitelist updates to the `opensuse` branch
# of rpm-software-management/rpmlint (and related branches). This job merges
# genuinely new stanzas into rpmcrab's vendored TOML copies.
#
# This is a SMART merge, not a blind copy (see scripts/sync-upstream-whitelists.py):
# - New stanzas not present locally are added in upstream order.
# - Changed stanzas (upstream hash/content updates) are updated in place.
# - Stanzas upstream deleted are removed.
# - Stanzas naming blocklisted packages (.github/whitelist-blocklist.txt)
#   are never (re)introduced.
# - Flavor-specific prunes (e.g. packages absent from Leap 16.0) are respected.
#
# No-op days produce no PR.

name: upstream-whitelist-sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC

permissions:
  contents: read

concurrency:
  group: upstream-whitelist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Sync whitelists from upstream branches
        id: sync
        run: |
          # Fail-closed by design: the script raises on network/blocklist
          # errors, and set -euo pipefail aborts the step before any PR.
          # A partial run therefore reds the job instead of opening a PR
          # from half-written files.
          set -euo pipefail
          python3 scripts/sync-upstream-whitelists.py 2>&1 | tee /tmp/sync.log
          # Capture the summary and sections for the PR body
          grep "^sync-summary: " /tmp/sync.log > /tmp/summary.txt || true
          grep -E "^(opensuse|slfo): .* @ [0-9a-f]+ " /tmp/sync.log > /tmp/shas.txt || true
          grep "^  + " /tmp/sync.log > /tmp/added.txt || true
          grep "^  ~ " /tmp/sync.log > /tmp/updated.txt || true
          grep "^  x " /tmp/sync.log > /tmp/removed.txt || true
          grep "^  - " /tmp/sync.log > /tmp/skipped.txt || true

      - name: Open sync PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          date=$(date -u +%F)
          # Skip when a previous sync PR is still open: every run uses a
          # unique branch, so without this guard overlapping runs pile up
          # duplicate PRs touching the same files. The state qualifier lives
          # inside the query; --state alone is not honored as a search filter.
          # Assigned before the test so a gh/API failure aborts fail-closed
          # instead of silently proceeding to push a duplicate.
          open_sync_prs=$(gh pr list --search 'Sync upstream whitelist stanzas in:title state:open' --state open --json number --jq '.[].number') || exit 1
          if [ -n "$open_sync_prs" ]; then
            echo "A sync PR is already open; skipping to avoid pile-up."
            exit 0
          fi
          # Include run ID + attempt in branch name: run_id alone is stable
          # across reruns of the same run, which would hit non-fast-forward
          # rejections when pushing the rerun's commit.
          branch="upstream-whitelist-sync-${date}-${{ github.run_id }}-${{ github.run_attempt }}"
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            checkout -b "$branch"
          # The sync regenerates the Rust manifest when it flips slfo dedup.
          git add crates/rpmcrab-core/data/distro crates/rpmcrab-core/src/distro_files_generated.rs
          # Guard against committing an empty tree if the script ever signals
          # change without staging anything.
          if git diff --cached --quiet; then
            echo "changed=true but nothing staged; skipping commit."
            exit 0
          fi
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "Sync upstream whitelist stanzas (${date})"
          git push -u origin "$branch"
          existing_pr=$(gh pr list --head "$branch" --json number --jq '.[].number') || exit 1
          if [ -z "$existing_pr" ]; then
            summary=$(cat /tmp/summary.txt)
            shas=$(cat /tmp/shas.txt)
            added=$(cat /tmp/added.txt)
            updated=$(cat /tmp/updated.txt)
            removed=$(cat /tmp/removed.txt)
            skipped=$(cat /tmp/skipped.txt)
            body="New whitelist stanzas from upstream rpmlint branches.

          ${summary:-no summary}

          Changed files:
          ${added:-none}

          Updated in place (same stanza, new content):
          ${updated:-none}

          Removed upstream (stanzas gone from upstream branches):
          ${removed:-none}

          Skipped (blocklisted):
          ${skipped:-none}

          Sources:
          ${shas:-opensuse branch (security team updates), opensuse-slfo-main}
          Blocklist: .github/whitelist-blocklist.txt

          Produced by the daily upstream-whitelist-sync job. This is a smart
          merge: new stanzas are added in upstream order, changed stanzas
          are updated in place, and deleted upstream stanzas are removed;
          blocklisted packages are never (re)introduced."
            gh pr create --base main --head "$branch" \
              --title "Sync upstream whitelist stanzas (${date})" \
              --body "$body"
          fi
