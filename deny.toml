# Cargo-deny policy for rpmcrab (GPL-2.0-or-later project).

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
# RUSTSEC-2023-0071 (Marvin attack) is a timing leak in RSA private-key
# operations in the rsa crate. rpmcrab performs public-key signature
# verification only, in a local CLI: it never performs RSA private-key
# operations and exposes no remote timing oracle, and the advisory
# itself deems local use on a non-compromised computer fine. No fixed
# rsa release exists (0.9.10 and 0.10.0-rc are both affected, with
# patched = [] upstream). This is the first advisory ignore in this
# file: a deliberate exception, to be dropped once a fixed rsa ships.
ignore = [
  "RUSTSEC-2023-0071",
]

[licenses]
version = 2
confidence-threshold = 0.8
# The project itself is GPL-2.0-or-later, so its own crates and any GPL-2.0+
# dependency must be allowed; GPL-3.0-only would force the combined work to 3.0
# and stays denied. Weak-copyleft (MPL, LGPL-2.0, LGPL-2.1) is linkable.
allow = [
  "GPL-2.0-or-later",
  "LGPL-2.0-or-later",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Record single-backend / single-implementation decisions here as deny entries,
# with a comment naming the decision, so the policy encodes the architecture.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
